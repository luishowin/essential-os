<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essential OS · Desktop</title>
<style>
:root{
  --bar-h:28px;
  --font:"Inter","SF Pro Text","Cantarell",system-ui,-apple-system,"Segoe UI",sans-serif;
  --accent:#2f8cff;
  --red:#ff3b30;
  --ink:#1c1c1e;
  --ink-2:#8e8e93;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#06202f;color:#fff;font-family:var(--font);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
input,textarea{font:inherit}

#desktop{position:fixed;inset:0;overflow:hidden}
#wallpaper,#wallpaper-img{position:absolute;inset:0;width:100%;height:100%}
#wallpaper-img{background-size:cover;background-position:center;opacity:0;transition:opacity .5s}
#wallpaper-img.on{opacity:1}
.blink{animation:blink 2.4s ease-in-out infinite}
.blink.b2{animation-delay:.8s}.blink.b3{animation-delay:1.5s}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* ───────── Menu bar ───────── */
#menubar{position:absolute;top:0;left:0;right:0;height:var(--bar-h);display:flex;align-items:center;justify-content:space-between;padding:0 10px;
  background:rgba(7,24,42,.84);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);
  font-size:13px;font-weight:500;letter-spacing:.005em;z-index:900;box-shadow:0 1px 0 rgba(255,255,255,.05)}
.mb-left,.mb-right{display:flex;align-items:center;gap:2px}
.mb-item,.tray{padding:3px 10px;border-radius:6px;display:flex;align-items:center;height:22px}
.mb-item:hover,.mb-item.open,.tray:hover,.tray.open{background:rgba(255,255,255,.14)}
.tray{padding:3px 8px}
.tray svg{display:block}
#pill{display:flex;align-items:center;gap:5px;margin:0 8px 0 6px;padding:2px 10px 2px 7px;border:1px solid rgba(255,255,255,.55);border-radius:999px;font-size:11px;font-weight:500;height:20px}
#pill:hover,#pill.open{background:rgba(255,255,255,.14)}
#pill svg{animation:pulse 2.2s ease-in-out infinite}
#pill.done svg,#pill.paused svg{animation:none}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.6}}
#t-clock{gap:9px;margin-left:6px;padding:3px 9px}#time{font-variant-numeric:tabular-nums}
.nbadge{display:none;width:7px;height:7px;border-radius:50%;background:#ff6a5c}
#t-clock.unread .nbadge{display:block}

/* ───────── Popovers ───────── */
.pop{position:absolute;z-index:950;border-radius:12px;background:rgba(26,31,38,.86);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);
  box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 .5px rgba(255,255,255,.14);font-size:13px;animation:popin .12s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.menu{min-width:210px;padding:5px}
.mi{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px}
.mi:hover{background:var(--accent)}
.mi.dis{opacity:.4;pointer-events:none}
.mchk{width:12px;font-size:11px}
.mlab{flex:1}.mk{opacity:.55;font-size:12px;margin-left:18px}
.mi:hover .mk{opacity:.8}
.msep{height:1px;background:rgba(255,255,255,.12);margin:5px 8px}
.panel{display:none;right:10px;top:34px;width:290px;padding:12px}
.panel.show{display:block}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cc-tile{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(255,255,255,.08);text-align:left}
.cc-tile i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);flex:none}
.cc-tile.on i{background:var(--accent)}
.cc-tile span{font-weight:600;font-size:12.5px;line-height:1.25}
.cc-tile small{display:block;font-weight:400;opacity:.6;font-size:11px}
.cc-sl{display:block;margin:10px 2px 0}
.cc-sl b{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;border-radius:11px;background:rgba(255,255,255,.14);outline:none;overflow:hidden}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:-300px 0 0 296px rgba(255,255,255,.55)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:-300px 0 0 296px rgba(255,255,255,.55)}
.idx-t{font-weight:600;margin-bottom:2px}
.idx-s{opacity:.6;font-size:12px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .6s linear}
.btn{padding:5px 14px;border-radius:7px;background:rgba(255,255,255,.14);font-size:12.5px;font-weight:500}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.pri{background:var(--accent);color:#fff}

/* ───────── Widgets ───────── */
#widgets{position:absolute;left:24px;top:50px;display:grid;grid-template-columns:repeat(3,160px);gap:22px 18px;z-index:50;transition:opacity .25s,transform .25s}
body.no-widgets #widgets{opacity:0;pointer-events:none;transform:scale(.98)}
.w{height:160px;border-radius:22px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.w.cal{background:rgba(246,246,248,.97);color:var(--ink);padding:12px 14px 8px}
.cal-m{color:var(--red);font-size:11.5px;font-weight:600;letter-spacing:.02em;height:16px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:16px;margin-top:5px;font-size:11px;text-align:center}
.cal-g span{display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cal-g .dow,.cal-g .we{color:#98989d;font-weight:500}
.cal-g .wd{font-weight:600}
.cal-g .today{background:var(--red);color:#fff;font-weight:600;border-radius:50%;width:16px;justify-self:center}
.w.wx{background:linear-gradient(180deg,#27548f 0%,#4b83c3 100%);padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.wx-city{font-size:15px;font-weight:600}
.wx-t{font-size:54px;font-weight:300;line-height:.95;margin-top:2px;letter-spacing:-.02em}
.wx-t small{font-size:17px;font-weight:400;letter-spacing:0;margin-left:2px;vertical-align:top;position:relative;top:7px}
.wx-b{font-size:13px;font-weight:500;line-height:1.35}
#wx-i{height:18px;margin-bottom:5px}#wx-i svg{display:block}
.wx-r{opacity:.9;font-variant-numeric:tabular-nums}
.w.st{background:#fff;color:var(--ink);padding:14px}
.st svg{display:block}
.st-l{position:absolute;left:15px;top:98px;font-size:11px;color:#9a9aa0;font-variant-numeric:tabular-nums}
.st-v{position:absolute;left:14px;top:108px;font-size:31px;font-weight:400;letter-spacing:-.01em}
.w.ph{grid-column:span 2;background:#5d8a34;cursor:pointer;padding:0}
.w.ph .img{position:absolute;inset:0;background-size:cover;background-position:center}
.w.ph svg.ph-art{position:absolute;inset:0;width:100%;height:100%}
.w.ph .hint{position:absolute;right:10px;bottom:10px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);font-size:11px;opacity:0;transition:opacity .2s}
.w.ph:hover .hint{opacity:1}

/* ───────── Dock ───────── */
#dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);height:60px;display:flex;align-items:flex-end;gap:10px;padding:10px 12px;border-radius:22px;
  background:rgba(8,12,18,.8);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);
  box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 0 .5px rgba(255,255,255,.14);z-index:800;transition:transform .3s cubic-bezier(.3,.8,.3,1)}
body.dock-hidden #dock{transform:translate(-50%,150%)}
body.dock-hidden.dock-peek #dock{transform:translate(-50%,0)}
#dock-hit{position:absolute;left:25%;right:25%;bottom:0;height:8px;z-index:790;display:none}
body.dock-hidden #dock-hit{display:block}
.di{--s:1;position:relative;flex:none;width:calc(var(--s)*40px);height:calc(var(--s)*40px);transition:width .1s,height .1s;cursor:default}
.di .ico{width:100%;height:100%}
.di.bounce{animation:bounce .8s ease-out}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px)}55%{transform:translateY(0)}72%{transform:translateY(-9px)}}
.di::after{content:"";position:absolute;left:50%;bottom:-7px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:0;transform:translateX(-50%)}
.di.run::after{opacity:.85}
.dsep{width:1px;height:40px;align-self:center;background:rgba(255,255,255,.2);flex:none}
.ico{border-radius:22%;display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22),0 2px 6px rgba(0,0,0,.35)}
.ico svg{width:60%;height:60%}
.ico.bare{background:none;box-shadow:none;border-radius:0}.ico.bare svg{width:100%;height:100%}
.t-files{background:linear-gradient(160deg,#6cc4ff,#1f78ff)}
.t-store{background:linear-gradient(160deg,#4fdcff,#2a63ee)}
.t-browser{background:linear-gradient(160deg,#fff,#d9e2ee)}
.t-notes{background:linear-gradient(160deg,#fbfaf4,#e9e7dc)}.t-notes svg{width:64%;height:64%}
.t-viewer{background:linear-gradient(160deg,#34363b,#131417)}
.t-term{background:linear-gradient(160deg,#202226,#050506);box-shadow:inset 0 0 0 1.5px #55585f,0 2px 6px rgba(0,0,0,.35)}
#tip{position:absolute;z-index:850;padding:4px 11px;border-radius:7px;background:rgba(20,24,30,.9);backdrop-filter:blur(14px);font-size:12px;font-weight:500;pointer-events:none;opacity:0;transform:translate(-50%,0);transition:opacity .12s;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14)}
#tip.show{opacity:1}

/* ───────── Windows ───────── */
#windows{position:absolute;inset:0;z-index:100;pointer-events:none}
.window{position:absolute;display:flex;flex-direction:column;pointer-events:auto;border-radius:14px;overflow:hidden;background:var(--wbg);color:var(--wfg);--wbg:#fff;--wfg:#1c1c1e;--wtitle:#2a2c30;--wicon:#8e8e93;--whover:rgba(0,0,0,.06);
  box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.25);animation:winin .2s ease-out;transition:opacity .2s,transform .2s}
@keyframes winin{from{opacity:0;transform:scale(.96)}}
.window[data-app="notes"]{--wbg:#fffdf5}
.window[data-app="terminal"]{--wbg:#14171c;--wfg:#d7dde6;--wtitle:#d7dde6;--wicon:#8b93a0;--whover:rgba(255,255,255,.1)}
.window[data-app="viewer"]{--wbg:#1a1c20;--wfg:#e6e8ec;--wtitle:#e6e8ec;--wicon:#9a9ea6;--whover:rgba(255,255,255,.1)}
.window.min{opacity:0;transform:translateY(80px) scale(.7);pointer-events:none}
.window.closing{opacity:0;transform:scale(.95)}
.window.max{border-radius:0;left:0!important;top:var(--bar-h)!important;width:100%!important;height:calc(100% - var(--bar-h) - 86px)!important}
body.dock-hidden .window.max{height:calc(100% - var(--bar-h))!important}
.titlebar{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 8px 0 20px;background:transparent;cursor:default}
.wtitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600;color:var(--wtitle);pointer-events:none}
.tb-right{display:flex;align-items:center;flex:none}
.tb-menus{display:flex;gap:2px;margin-right:10px}
.tb-menu{padding:4px 9px;border-radius:6px;font-size:13.5px;font-weight:400;color:var(--wfg);line-height:1.2}
.tb-menu:hover,.tb-menu.open{background:var(--whover)}
.tb-ctl{display:flex;align-items:center}
.lt{width:32px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--wicon)}
.lt svg{display:block}
.lt:hover{color:var(--wfg);background:var(--whover)}
.lt.c:hover{color:#fff;background:#ff3b30}
.window:not(.focused) .wtitle,.window:not(.focused) .tb-right{opacity:.5}
.wbody{flex:1;overflow:auto;background:transparent;position:relative;min-height:0;user-select:text;-webkit-user-select:text}
.grip{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize}
.window.max .grip{display:none}

/* Files */
.files{display:flex;height:100%}
.files aside{width:150px;flex:none;background:#f1f2f5;border-right:1px solid rgba(0,0,0,.08);padding:12px 8px;font-size:13px}
.files aside h6{font-size:11px;font-weight:600;color:#9a9aa0;margin:0 8px 4px;text-transform:uppercase;letter-spacing:.04em}
.files aside h6:not(:first-child){margin-top:16px}
.sb{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:6px;color:#2a2c30}
.sb:hover{background:rgba(0,0,0,.05)}
.sb.on{background:rgba(47,140,255,.16);color:#0a5fd6;font-weight:500}
.files section{flex:1;display:flex;flex-direction:column;min-width:0}
.fbar{display:flex;align-items:center;gap:6px;padding:4px 12px 8px}
.nb{width:26px;height:24px;border-radius:6px;font-size:18px;line-height:20px;color:#5a5c62}
.nb:hover:not(:disabled){background:rgba(0,0,0,.07)}.nb:disabled{opacity:.3}
.crumb{font-size:13px;font-weight:600;margin-left:6px}
.fgrid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,92px);grid-auto-rows:min-content;gap:8px 6px;align-content:start}
.fi{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:8px;font-size:12px;text-align:center;word-break:break-word}
.fi.sel{background:rgba(47,140,255,.18)}
.fi svg{width:46px;height:46px}
.fempty{grid-column:1/-1;margin-top:60px;text-align:center;color:#9a9aa0;font-size:13px}
.fstat{padding:6px 14px;font-size:11.5px;color:#8e8e93;border-top:1px solid rgba(0,0,0,.07)}

/* Terminal */
.wbody.term{color:#d7dde6;font:12.5px/1.5 "JetBrains Mono","Fira Code","Cascadia Code",ui-monospace,monospace;padding:10px 12px}
.tout div{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.tin{display:flex;gap:8px}.tin span{color:#6fd3a3;white-space:nowrap}
.tin input{flex:1;background:none;border:0;outline:0;color:inherit;font:inherit;min-width:0}
.tc{color:#6fd3a3}.te{color:#ff8a80}

/* Store */
.store{padding:18px 20px}
.store h2{font-size:20px;font-weight:700;margin-bottom:4px}
.store p.sub{font-size:13px;color:#8e8e93;margin-bottom:16px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sc{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#f4f5f7}
.sc .ai{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;flex:none}
.sc b{display:block;font-size:13.5px}.sc small{color:#8e8e93;font-size:12px}
.sc .get{margin-left:auto;padding:4px 14px;border-radius:999px;background:#e1e4ea;color:#0a5fd6;font-weight:600;font-size:12px}
.sc .get.ok{background:none;color:#8e8e93}

/* Browser */
.br{display:flex;flex-direction:column;height:100%}
.br-bar{display:flex;gap:8px;padding:4px 12px 8px}
.br-bar input{flex:1;height:28px;border-radius:8px;border:0;background:#e3e5ea;padding:0 12px;font-size:13px;text-align:center;outline:0;color:#2a2c30}
.br-page{flex:1;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#eef3f9);text-align:center;padding:20px}
.br-page h1{font-size:30px;font-weight:300;letter-spacing:-.01em;margin-bottom:16px}
.br-page form{display:flex;justify-content:center}
.br-page input{width:min(440px,80vw);height:40px;border-radius:20px;border:1px solid #d5d9e0;padding:0 18px;font-size:14px;outline:0;background:#fff}
.br-page input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,140,255,.2)}
.br-page small{display:block;margin-top:14px;color:#8e8e93;font-size:12px}

/* Notes */
.notes{width:100%;height:100%;border:0;outline:0;resize:none;padding:18px 22px;font-size:14.5px;line-height:1.6;background:transparent;color:#2a2c30}

/* Viewer */
.viewer{height:100%;display:grid;place-items:center;color:#9a9ea6;font-size:13px;text-align:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer.drag{outline:2px dashed var(--accent);outline-offset:-10px}

/* ───────── Launcher / overlays ───────── */
#launcher{position:absolute;inset:0;z-index:700;background:rgba(4,20,32,.62);backdrop-filter:blur(36px) saturate(1.3);-webkit-backdrop-filter:blur(36px) saturate(1.3);display:none;flex-direction:column;align-items:center;padding-top:90px}
#launcher.show{display:flex;animation:lin .18s ease-out}
@keyframes lin{from{opacity:0;transform:scale(1.04)}}
#l-search{width:240px;height:32px;border-radius:9px;border:0;outline:0;background:rgba(255,255,255,.14);color:#fff;padding:0 12px;text-align:center;font-size:14px}
#l-search::placeholder{color:rgba(255,255,255,.55)}
#l-grid{display:grid;grid-template-columns:repeat(auto-fill,110px);gap:34px 28px;margin-top:56px;width:min(760px,90vw);justify-content:center}
.la{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:13px}
.la .ico{width:72px;height:72px}
.la:hover .ico{transform:scale(1.06)}
.la .ico{transition:transform .12s}
#toast{position:absolute;right:12px;top:38px;z-index:960;width:300px;padding:12px 14px;border-radius:14px;background:rgba(26,31,38,.9);backdrop-filter:blur(26px);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 0 0 .5px rgba(255,255,255,.14);font-size:12.5px;line-height:1.45;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:none}
#toast b{display:block;font-size:13px;margin-bottom:2px}
#toast span{opacity:.75}
#dim,#night{position:absolute;inset:0;pointer-events:none;z-index:1200}
#dim{background:#000;opacity:0}
#night{background:rgba(255,140,40,.13);mix-blend-mode:multiply;opacity:0;transition:opacity .4s;z-index:1190}
body.night #night{opacity:1}


/* ───────── Date & time panel ───────── */
#dc{width:640px;max-width:calc(100vw - 20px);padding:0;border-radius:20px;background:rgba(36,38,44,.93);max-height:calc(100vh - 46px);overflow:hidden}
#dc.show{display:flex}
.dc-l{width:280px;flex:none;padding:14px;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.08)}
.dc-nl{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:140px}
.dc-none{margin:auto;color:#7c808a;font-size:15px;font-weight:600}
.nc{background:rgba(255,255,255,.11);border-radius:14px;padding:10px 12px;flex:none}
.nc-h{display:flex;align-items:center;gap:7px;font-size:12px;color:#a9acb4;margin-bottom:9px}
.nc-h b{font-weight:600;white-space:nowrap}.nc-time{opacity:.8;white-space:nowrap}.nc-h .sp{flex:1;min-width:0}
.nc-h .ico{width:14px;height:14px;box-shadow:none;border-radius:4px}
.nc-btn{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#e4e6ea}
.nc-btn:hover{background:rgba(255,255,255,.22)}
.nc-b{display:flex;gap:12px;align-items:center}
.nc-b .ico{width:44px;height:44px;flex:none}
.nc-t{min-width:0}
.nc-t b{display:block;font-size:13.5px;margin-bottom:1px}
.nc-t span{display:block;font-size:13px;color:#d4d6dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc.exp .nc-t span{white-space:normal}
.nc.exp .nc-e svg{transform:rotate(180deg)}
.t-sys{background:linear-gradient(160deg,#4b6a92,#25344b)}
.dc-clear{align-self:flex-start;margin-top:12px;padding:7px 24px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:700;font-size:13px}
.dc-clear:hover{background:rgba(255,255,255,.18)}
.dc-r{flex:1;min-width:0;padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dc-dw{font-size:14px;font-weight:500;color:#b4b7bf}
.dc-dd{font-size:22px;font-weight:700;color:#a9adb7;margin-top:-1px;letter-spacing:-.01em}
.dc-cal-h{display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px}
.dc-ar{width:32px;height:28px;display:grid;place-items:center;border-radius:8px;color:#d7d9df}
.dc-ar:hover,.dc-mt:hover{background:rgba(255,255,255,.1)}
.dc-mt{font-weight:700;font-size:14.5px;padding:3px 12px;border-radius:8px}
.dc-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}
.dc-grid .dow{height:26px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#8b8f99}
.dc-d{width:32px;height:32px;justify-self:center;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.dc-d.we{color:#8b8f99}
.dc-d.out{color:#5d616b;font-weight:500}
.dc-d:hover{background:rgba(255,255,255,.1)}
.dc-d.sel{box-shadow:inset 0 0 0 1.5px #6f87a0}
.dc-d.today{background:#6f87a0;color:#fff;box-shadow:none}
.dc-card{background:rgba(255,255,255,.1);border-radius:14px;padding:12px 13px}
.dc-card h5{font-size:13.5px;font-weight:700;color:#b4b7bf;margin-bottom:3px}
.dc-card i{font-size:13px;color:#b9bcc4}
.dc-add{width:100%;text-align:left;font-weight:700;font-size:13.5px}
#dc-wcl:not(:empty){margin-bottom:6px;padding-bottom:2px;border-bottom:1px solid rgba(255,255,255,.08)}
.dc-wc{display:grid;grid-template-columns:1fr auto 22px;align-items:center;gap:6px;padding:5px 0 8px;font-size:13px;font-variant-numeric:tabular-nums}
.dc-wc small{display:block;color:#9a9ea8;font-size:11px}
.dc-wc .x{opacity:0;width:22px;height:22px;border-radius:50%;color:#c9ccd2;font-size:15px;line-height:1}
.dc-wc:hover .x{opacity:1}.dc-wc .x:hover{background:rgba(255,255,255,.14)}
.dc-pick{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:9px}
.dc-pick[hidden]{display:none}
.dc-pick button{padding:6px 9px;border-radius:8px;background:rgba(255,255,255,.08);text-align:left;font-size:12.5px}
.dc-pick button:hover{background:var(--accent)}
.dc-wx-h{display:flex;justify-content:space-between;align-items:baseline}
.dc-wx-h span{font-size:13px;color:#a9acb4}
.dc-wx{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;margin-top:10px;font-size:13px}
.dc-wx div{display:flex;flex-direction:column;align-items:center;gap:7px}
.dc-wx svg{width:34px;height:26px;color:#e6e7ea}
.dc-wx b{font-weight:700}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:860px){#widgets{grid-template-columns:repeat(2,160px)}}
</style>
</head>
<body>
<div id="desktop">
  <svg id="wallpaper" aria-hidden="true"></svg>
  <div id="wallpaper-img"></div>

  <header id="menubar">
    <nav class="mb-left">
      <button class="mb-item" data-menu="app" id="mb-app">Files</button>
      <button class="mb-item" data-menu="settings">Settings</button>
      <button class="mb-item" data-menu="edit">Edit</button>
      <button class="mb-item" data-menu="view">View</button>
      <button class="mb-item" data-menu="help">Help</button>
    </nav>
    <div class="mb-right">
      <span class="tray" title="Battery">
        <svg width="26" height="14" viewBox="0 0 26 14"><rect x=".75" y=".75" width="21.5" height="12.5" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".7"/><rect x="2.6" y="2.6" width="14" height="8.8" rx="2" fill="currentColor"/><path d="M24.2 4.6v4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".7"/></svg>
      </span>
      <button class="tray" id="t-vol" title="Volume"></button>
      <button class="tray" id="t-wifi" title="Wi-Fi"></button>
      <button class="tray" id="t-cc" title="Control Centre">
        <svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x=".75" y="1" width="16.5" height="5.5" rx="2.75"/><circle cx="5" cy="3.75" r="1.7" fill="currentColor" stroke="none"/><rect x=".75" y="9.5" width="16.5" height="5.5" rx="2.75"/><circle cx="13" cy="12.25" r="1.7" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="pill" title="Search index">
        <svg width="13" height="13" viewBox="0 0 14 14"><path d="M7 1l1.5 4.2L12.7 6.7 8.5 8.2 7 12.5 5.5 8.2 1.3 6.7l4.2-1.5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <span id="pill-t">Indexing</span>
      </button>
      <button class="tray" id="t-clock" title="Date &amp; time"><span id="date"></span><span id="time"></span><i class="nbadge"></i></button>
    </div>
  </header>

  <div id="widgets">
    <div class="w cal"><div class="cal-m" id="cal-m"></div><div class="cal-g" id="cal-g"></div></div>

    <div class="w wx" id="wx">
      <div><div class="wx-city" id="wx-city">Nairobi</div><div class="wx-t"><span id="wx-t">24</span><small>°C</small></div></div>
      <div class="wx-b">
        <div id="wx-i"></div>
        <div id="wx-d">Mostly sunny</div>
        <div class="wx-r">↓<span id="wx-lo">13</span>°C ↑<span id="wx-hi">26</span>°C</div>
      </div>
    </div>

    <div class="w st">
      <svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#cfcfd4" stroke-width="4.5"/><circle id="st-arc" cx="22" cy="22" r="19" fill="none" stroke="#1a8cff" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="89.5" transform="rotate(-90 22 22)"/><rect x="14.5" y="17.5" width="15" height="9" rx="4" fill="#8e8e93"/><path d="M17.5 22h9" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div class="st-l"><span id="st-u">223</span>/ <span id="st-t">1024</span>GB</div>
      <div class="st-v" id="st-p">25%</div>
    </div>

    <div class="w ph" id="photo" title="Click to choose a photo">
      <svg class="ph-art" viewBox="0 0 334 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7aa447"/><stop offset="1" stop-color="#46702a"/></linearGradient>
        <radialGradient id="wl" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#e4ddcf"/></radialGradient></defs>
        <rect width="334" height="160" fill="url(#gr)"/>
        <ellipse cx="300" cy="150" rx="70" ry="36" fill="#d7ccb4" opacity=".7"/>
        <ellipse cx="40" cy="30" rx="48" ry="40" fill="#cdbfa3" opacity=".55"/>
        <g><circle cx="108" cy="104" r="34" fill="url(#wl)"/><circle cx="88" cy="118" r="26" fill="url(#wl)"/><circle cx="130" cy="124" r="26" fill="url(#wl)"/>
        <ellipse cx="116" cy="88" rx="17" ry="20" fill="#f7f3ea"/><path d="M99 80q-14 4-16 16 12 0 18-9z" fill="#efe9dc"/>
        <path d="M104 94q8 5 16 0" stroke="#3a3a3a" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="110" cy="100" rx="5" ry="3" fill="#e3b5ac" opacity=".7"/></g>
        <g><circle cx="222" cy="90" r="30" fill="url(#wl)"/><circle cx="246" cy="108" r="26" fill="url(#wl)"/><circle cx="208" cy="112" r="24" fill="url(#wl)"/>
        <ellipse cx="196" cy="74" rx="18" ry="21" fill="#f7f3ea"/><path d="M180 66q-14 3-17 15 12 1 19-8z" fill="#efe9dc"/>
        <circle cx="190" cy="72" r="2.6" fill="#2b2b2b"/><ellipse cx="195" cy="84" rx="5" ry="3.2" fill="#e3b5ac"/></g>
      </svg>
      <div class="img" id="photo-img"></div>
      <div class="hint">Change photo</div>
    </div>
  </div>

  <div id="windows"></div>
  <div id="dock-hit"></div>
  <nav id="dock" aria-label="Dock"></nav>
  <div id="tip"></div>

  <div id="launcher"><input id="l-search" placeholder="Search apps" autocomplete="off" spellcheck="false"><div id="l-grid"></div></div>

  <div id="cc" class="pop panel">
    <div class="cc-grid">
      <button class="cc-tile on" data-k="wifi"><i><svg width="16" height="12" viewBox="0 0 20 15"><path d="M1.5 5a12 12 0 0 1 17 0M4.3 8a8 8 0 0 1 11.4 0M7 11a4 4 0 0 1 6 0" stroke="currentColor" fill="none" stroke-width="1.9" stroke-linecap="round"/><circle cx="10" cy="13.2" r="1.4" fill="currentColor"/></svg></i><span>Wi-Fi<small id="s-wifi">Connected</small></span></button>
      <button class="cc-tile on" data-k="bt"><i><svg width="12" height="16" viewBox="0 0 12 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5l10 8-5 4.5v-17L11 5 1 13"/></svg></i><span>Bluetooth<small id="s-bt">On</small></span></button>
      <button class="cc-tile" data-k="focus"><i><svg width="14" height="14" viewBox="0 0 20 20"><path d="M15.5 12A7 7 0 0 1 8 4.5a7 7 0 1 0 7.5 7.5z" fill="currentColor"/></svg></i><span>Focus<small id="s-focus">Off</small></span></button>
      <button class="cc-tile" data-k="night"><i><svg width="14" height="14" viewBox="0 0 20 20"><circle cx="10" cy="10" r="4" fill="currentColor"/><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 1.5v2.2M10 16.3v2.2M1.5 10h2.2M16.3 10h2.2M4 4l1.5 1.5M14.5 14.5L16 16M16 4l-1.5 1.5M5.5 14.5L4 16"/></g></svg></i><span>Night Light<small id="s-night">Off</small></span></button>
    </div>
    <label class="cc-sl"><b>Display</b><input type="range" id="r-bright" min="20" max="100" value="100"></label>
    <label class="cc-sl"><b>Sound</b><input type="range" id="r-vol" min="0" max="100" value="60"></label>
  </div>

  <div id="idx" class="pop panel">
    <div class="idx-t" id="idx-t">Indexing files</div>
    <div class="idx-s" id="idx-s"></div>
    <div class="bar"><i id="idx-bar"></i></div>
    <button class="btn" id="idx-btn">Pause</button>
  </div>

  <div id="dc" class="pop panel">
    <section class="dc-l"><div class="dc-nl" id="dc-nl"></div><button class="dc-clear" id="dc-clear">Clear</button></section>
    <section class="dc-r">
      <div><div class="dc-dw" id="dc-dw"></div><div class="dc-dd" id="dc-dd"></div></div>
      <div>
        <div class="dc-cal-h"><button class="dc-ar" id="dc-prev" aria-label="Previous month"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M7 1L2 5l5 4z" fill="currentColor"/></svg></button><button class="dc-mt" id="dc-mt"></button><button class="dc-ar" id="dc-next" aria-label="Next month"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M3 1l5 4-5 4z" fill="currentColor"/></svg></button></div>
        <div class="dc-grid" id="dc-grid"></div>
      </div>
      <div class="dc-card"><h5 id="dc-evt">Today</h5><i>No Events</i></div>
      <div class="dc-card"><div id="dc-wcl"></div><button class="dc-add" id="dc-addwc">Add World Clocks…</button><div class="dc-pick" id="dc-pick" hidden></div></div>
      <div class="dc-card"><div class="dc-wx-h"><h5>Weather</h5><span>Nairobi</span></div><div class="dc-wx" id="dc-wx"></div></div>
    </section>
  </div>

  <div id="toast"><b></b><span></span></div>
  <div id="night"></div>
  <div id="dim"></div>
</div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const store={
  get(k,d){try{const v=localStorage.getItem('eos:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('eos:'+k,JSON.stringify(v));return true}catch(e){return false}}
};
const S={magnify:store.get('magnify',true),widgets:store.get('widgets',true),dock:store.get('dock',true),wifi:true,bt:true,focus:false,night:false,bright:100,vol:60};
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ───────── Wallpaper (procedural night city) ───────── */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildWallpaper(){
  const rnd=mulberry32(11);
  const P={far:'1428,335 1600,312 1600,900 1428,900',left:'0,612 118,592 224,628 224,900 0,900',
    mid:'460,497 875,411 940,426 940,900 460,900',tF:'944,199 1310,106 1310,900 944,900',tR:'1310,106 1428,121 1428,900 1310,900'};
  let s=`<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d5775"/><stop offset=".55" stop-color="#0a4560"/><stop offset="1" stop-color="#06304a"/></linearGradient>
    <linearGradient id="gF" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d6584"/><stop offset="1" stop-color="#0b5572"/></linearGradient>
    <linearGradient id="gR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a4c68"/><stop offset="1" stop-color="#083a52"/></linearGradient>
    <linearGradient id="gM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a4660"/><stop offset="1" stop-color="#07354c"/></linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04202f" stop-opacity="0"/><stop offset="1" stop-color="#04202f" stop-opacity=".55"/></linearGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></radialGradient>
    <pattern id="glass" width="26" height="15" patternUnits="userSpaceOnUse"><path d="M0 .5H26" stroke="#9fe0f0" stroke-opacity=".16"/><path d="M.5 0V15" stroke="#9fe0f0" stroke-opacity=".08"/></pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs><rect width="1600" height="900" fill="url(#sky)"/>`;
  s+=`<polygon points="${P.far}" fill="#07364d"/><polygon points="${P.left}" fill="#072b41"/><polygon points="${P.mid}" fill="url(#gM)"/><polygon points="${P.mid}" fill="url(#glass)"/>`;
  s+=`<polygon points="${P.tF}" fill="url(#gF)"/><polygon points="${P.tF}" fill="url(#glass)"/><polygon points="${P.tR}" fill="url(#gR)"/><polygon points="${P.tR}" fill="url(#glass)"/>`;
  s+=`<rect x="940" y="620" width="6" height="280" fill="#05283b" opacity=".6"/>`;
  function lights(x0,x1,topFn,y1,p,bandY0,bandY1,bandP){
    let o='';
    for(let x=x0+6;x<x1-12;x+=26){for(let y=topFn(x)+14;y<y1;y+=15){
      const inBand=bandY0!==undefined&&y>bandY0&&y<bandY1;
      if(rnd()<(inBand?bandP:p)){const warm=rnd()<.72;
        o+=`<rect x="${x}" y="${y+4}" width="${warm?10:8}" height="5" rx="1" fill="${warm?'#ffd699':'#d7f1ff'}" opacity="${(.55+rnd()*.45).toFixed(2)}"/>`;}
    }}
    return o;
  }
  s+=lights(460,940,x=>497-(x-460)*86/415,900,.035,700,810,.3);
  s+=lights(944,1310,x=>199-(x-944)*93/366,900,.006,260,330,.06);
  s+=lights(1310,1428,x=>112,900,.004);
  s+=lights(0,224,x=>610,900,.03);
  s+=`<rect y="560" width="1600" height="340" fill="url(#haze)"/><rect width="1600" height="900" fill="url(#vig)"/>`;
  [[950,201,''],[1309,108,'b2'],[1421,181,'b3'],[1312,246,''],[1312,452,'b2'],[1421,500,''],[463,497,'b3'],[31,630,''],[73,626,'b2']].forEach(([x,y,c])=>{
    s+=`<g class="blink ${c}"><circle cx="${x}" cy="${y}" r="7" fill="#ff2d55" opacity=".55" filter="url(#glow)"/><circle cx="${x}" cy="${y}" r="2.4" fill="#ff5a73"/></g>`;});
  const el=$('#wallpaper');el.setAttribute('viewBox','0 0 1600 900');el.setAttribute('preserveAspectRatio','xMidYMid slice');el.innerHTML=s;
}
let memWall=store.get('wall',null);
function applyWall(){const el=$('#wallpaper-img');if(memWall){el.style.backgroundImage=`url("${memWall}")`;el.classList.add('on')}else el.classList.remove('on')}
function pickImage(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};i.click()}
function changeWall(){pickImage(u=>{memWall=u;if(!store.set('wall',u))toast('Wallpaper set','Too large to remember after a reload — it will reset next visit.');applyWall()})}
function resetWall(){memWall=null;store.set('wall',null);applyWall()}

/* ───────── Toast ───────── */
let toastT;
function toast(t,m){const e=$('#toast');$('b',e).textContent=t;$('span',e).textContent=m||'';e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),3600)}

/* ───────── Clock, calendar, widgets ───────── */
function tick(){
  const d=new Date();let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;
  $('#date').textContent=`${DAYS[d.getDay()]} ${MONTHS[d.getMonth()]} ${d.getDate()}`;
  $('#time').textContent=`${String(h).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} ${ap}`;
}
let calKey='';
function renderCal(){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth(),key=y+'-'+m+'-'+d.getDate();if(key===calKey)return;calKey=key;
  $('#cal-m').textContent=FULL[m].toUpperCase();
  const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let h='';
  'SMTWTFS'.split('').forEach(c=>h+=`<span class="dow">${c}</span>`);
  for(let i=0;i<first;i++)h+='<span></span>';
  for(let day=1;day<=n;day++){const dow=(first+day-1)%7;
    h+=`<span class="${day===d.getDate()?'today':(dow===0||dow===6?'we':'wd')}">${day}</span>`}
  $('#cal-g').innerHTML=h;
}
function initPhoto(){
  const img=$('#photo-img'),saved=store.get('photo',null);
  if(saved)img.style.backgroundImage=`url("${saved}")`;
  $('#photo').addEventListener('click',()=>pickImage(u=>{img.style.backgroundImage=`url("${u}")`;if(!store.set('photo',u))toast('Photo set','Too large to remember after a reload.')}));
}

/* ───────── Icons ───────── */
const G={
  files:'<svg viewBox="0 0 24 24"><path d="M3 7.5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#fff"/></svg>',
  store:'<svg viewBox="0 0 24 24"><path d="M5.5 8h13l-1.2 11.2a1.5 1.5 0 0 1-1.5 1.3H8.2a1.5 1.5 0 0 1-1.5-1.3z" fill="#fff"/><path d="M9 8V7a3 3 0 0 1 6 0v1" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>',
  browser:'<svg viewBox="0 0 24 24" fill="none" stroke="#2b6cd9" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M4.4 7.5h15.2M4.4 16.5h15.2"/></svg>',
  notes:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5" fill="#fff" stroke="#d8d5c6" stroke-width=".6"/><path d="M4 8h16V5.5A2.5 2.5 0 0 0 17.5 3h-11A2.5 2.5 0 0 0 4 5.5z" fill="#ffc94a"/><path d="M7.5 12h9M7.5 15h9M7.5 18h5" stroke="#b8bcc4" stroke-width="1.4" stroke-linecap="round"/></svg>',
  viewer:'<svg viewBox="0 0 24 24"><rect x="5.5" y="3.5" width="13" height="17" rx="2.2" fill="#f2f2f2"/><rect x="8" y="6" width="8" height="12" rx="1.2" fill="#111"/></svg>',
  terminal:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8l4 4-4 4"/><path d="M12.5 16.5H18"/></svg>',
  dots:'<svg viewBox="0 0 40 40"><g fill="#fff">'+[8,20,32].map(y=>[8,20,32].map(x=>`<circle cx="${x}" cy="${y}" r="3.2"/>`).join('')).join('')+'</g></svg>'
};
let trashN=0;
function trashSvg(){const id='tg'+(++trashN);

const FOLDER='<svg viewBox="0 0 48 48"><path d="M5 12a3 3 0 0 1 3-3h10l4 4h18a3 3 0 0 1 3 3v21a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="#4aa3ff"/><path d="M5 19h38v18a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="#6cbcff"/></svg>';

function buildFiles(w,opts){
  opts=opts||{};let path=opts.path||'Home',hist=[path],idx=0;
  const side=['Recents','Home','Documents','Downloads','Pictures','Music'];
  w.body.innerHTML=`<div class="files"><aside><h6>Favourites</h6>${side.map(s=>`<button class="sb" data-p="${s}">${s}</button>`).join('')}<h6>Locations</h6><button class="sb" data-p="Trash">Trash</button></aside>
  <section><div class="fbar"><button class="nb back" disabled>‹</button><button class="nb fwd" disabled>›</button><div class="crumb"></div></div><div class="fgrid"></div><div class="fstat"></div></section></div>`;
  const grid=$('.fgrid',w.body),back=$('.back',w.body),fwd=$('.fwd',w.body);
  function render(){
    const items=FS[path]||[];
    $('.crumb',w.body).textContent=path;w.title.textContent=path==='Trash'?'Trash':'Files — '+path;
    $$('.sb',w.body).forEach(b=>b.classList.toggle('on',b.dataset.p===path));
    grid.innerHTML=items.length?items.map((it,i)=>`<div class="fi" data-i="${i}" tabindex="0">${it[0]==='folder'?FOLDER:FILE}<span></span></div>`).join(''):`<div class="fempty">${path==='Trash'?'Trash is empty':'Nothing here yet'}</div>`;
    $$('.fi',grid).forEach((n,i)=>$('span',n).textContent=items[i][1]);
    $('.fstat',w.body).textContent=items.length+(items.length===1?' item':' items');
    back.disabled=idx===0;fwd.disabled=idx>=hist.length-1;
  }
  function go(p,push){if(push!==false){hist=hist.slice(0,idx+1);hist.push(p);idx++}path=p;render()}
  w.body.addEventListener('click',e=>{
    const sb=e.target.closest('.sb');if(sb)return go(sb.dataset.p);
    const fi=e.target.closest('.fi');$$('.fi',grid).forEach(n=>n.classList.toggle('sel',n===fi));
  });
  w.body.addEventListener('dblclick',e=>{const fi=e.target.closest('.fi');if(!fi)return;const it=FS[path][+fi.dataset.i];
    if(it[0]==='folder'&&FS[it[1]])go(it[1]);else toast(it[1],'Preview isn’t wired up in this mockup.')});
  back.onclick=()=>{if(idx>0){idx--;path=hist[idx];render()}};
  fwd.onclick=()=>{if(idx<hist.length-1){idx++;path=hist[idx];render()}};
  render();
}

/* Terminal */
function buildTerm(w){
  const b=w.body;b.classList.add('term');
  b.innerHTML=`<div class="tout"></div><label class="tin"><span>user@essential:~$</span><input spellcheck="false" autocomplete="off" autocapitalize="off"></label>`;
  const out=$('.tout',b),inp=$('input',b),hist=[];let hi=0;
  const say=(t,c)=>{const d=document.createElement('div');if(c)d.className=c;d.textContent=t;out.append(d)};
  say('Essential OS terminal (simulated). Type "help".','tc');
  const C={
    help:()=>say('help  ls  pwd  whoami  date  uname  neofetch  echo  clear  sudo'),
    ls:()=>say('Documents  Downloads  Music  Pictures  Projects  todo.txt'),
    pwd:()=>say('/home/user'),whoami:()=>say('user'),
    date:()=>say(new Date().toString()),
    uname:()=>say('Linux essential x86_64 (simulated)'),
    neofetch:()=>say(['user@essential','--------------','OS:      Essential OS (Fedora base)','Shell:   essential-shell','Theme:   Night / Teal','Widgets: 4','Status:  mostly a web page'].join('\n')),
    echo:a=>say(a.join(' ')),
    clear:()=>{out.innerHTML=''},
    sudo:()=>say('user is not in the sudoers file. This incident will be reported.','te')
  };
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const v=inp.value.trim();say('user@essential:~$ '+v,'tc');if(v){hist.push(v);hi=hist.length;
      const [c,...a]=v.split(/\s+/);if(/^rm\s+-rf\s+\/?\s*$/.test(v))say('Nice try.','te');else if(C[c])C[c](a);else say(c+': command not found','te')}
      inp.value='';b.scrollTop=b.scrollHeight}
    else if(e.key==='ArrowUp'){if(hi>0){hi--;inp.value=hist[hi];e.preventDefault()}}
    else if(e.key==='ArrowDown'){if(hi<hist.length-1){hi++;inp.value=hist[hi]}else{hi=hist.length;inp.value=''}}
  });
  b.addEventListener('mouseup',()=>{if(!String(getSelection()))inp.focus()});
  setTimeout(()=>inp.focus(),50);
}

/* Viewer */
function buildViewer(w){
  w.body.innerHTML=`<div class="viewer"><div class="vempty"><p style="margin-bottom:12px">Drop an image here</p><button class="btn">Open image…</button></div><img hidden alt=""></div>`;
  const v=$('.viewer',w.body),img=$('img',v),em=$('.vempty',v);
  const show=f=>{if(!f||!f.type.startsWith('image/'))return;img.src=URL.createObjectURL(f);img.hidden=false;em.hidden=true;w.title.textContent='Viewer — '+f.name};
  $('.btn',v).onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>show(i.files[0]);i.click()};
  v.addEventListener('dragover',e=>{e.preventDefault();v.classList.add('drag')});
  v.addEventListener('dragleave',()=>v.classList.remove('drag'));
  v.addEventListener('drop',e=>{e.preventDefault();v.classList.remove('drag');show(e.dataTransfer.files[0])});
}

/* ───────── Window manager ───────── */
let zTop=10,uid=0,wins=[],focusedApp=null;
function setRunning(id,on){const it=$(`.di[data-app="${id}"]`);if(it)it.classList.toggle('run',on)}
function updateAppLabel(){$('#mb-app').textContent=focusedApp?APPS[focusedApp].name:'Files'}
function focusWin(w){
  wins.forEach(x=>x.el.classList.toggle('focused',x===w));
  if(w){w.el.style.zIndex=++zTop;focusedApp=w.app}else focusedApp=null;
  updateAppLabel();
}
function openApp(id,opts){
  opts=opts||{};
  if(id==='launcher'){toggleLauncher();return}
  closeLauncher();
  let w=!opts.fresh&&wins.find(x=>x.app===id);
  if(w){w.el.classList.remove('min');focusWin(w);return}
  createWindow(id,opts);
}
function createWindow(id,opts){
  const app=APPS[id],el=document.createElement('div');el.className='window';
  el.innerHTML=`<div class="titlebar"><div class="wtitle"></div><div class="tb-right"><nav class="tb-menus"><button class="tb-menu" data-m="file">File</button><button class="tb-menu" data-m="edit">Edit</button><button class="tb-menu" data-m="view">View</button><button class="tb-menu" data-m="settings">Settings</button></nav><div class="tb-ctl"><button class="lt m" aria-label="Minimise"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5l5 5 5-5"/></svg></button><button class="lt x" aria-label="Maximise"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5l5-5 5 5"/></svg></button><button class="lt c" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M2.5 2.5l9 9M11.5 2.5l-9 9"/></svg></button></div></div></div><div class="wbody"></div><div class="grip"></div>`;
  const W=Math.min(app.w,innerWidth-40),H=Math.min(app.h,innerHeight-150),n=wins.length%6;
  el.style.width=W+'px';el.style.height=H+'px';
  el.style.left=Math.max(10,Math.round((innerWidth-W)/2)+(n-2)*30)+'px';
  el.style.top=Math.max(40,Math.round((innerHeight-H)/2)-30+(n-2)*26)+'px';
  el.dataset.app=id;const w={id:++uid,app:id,el,body:$('.wbody',el),title:$('.wtitle',el)};
  w.title.textContent=app.name;wins.push(w);$('#windows').append(el);app.build(w,opts);
  setRunning(id,true);focusWin(w);

  el.addEventListener('pointerdown',()=>{if(!el.classList.contains('focused'))focusWin(w)},true);
  const tb=$('.titlebar',el);
  tb.addEventListener('pointerdown',e=>{
    if(e.target.closest('.lt,.tb-menu')||el.classList.contains('max')||e.button!==0)return;
    const sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;tb.setPointerCapture(e.pointerId);
    const mv=ev=>{el.style.left=(ox+ev.clientX-sx)+'px';el.style.top=Math.max(28,oy+ev.clientY-sy)+'px'};
    const up=()=>{tb.removeEventListener('pointermove',mv);tb.removeEventListener('pointerup',up)};
    tb.addEventListener('pointermove',mv);tb.addEventListener('pointerup',up);
  });
  tb.addEventListener('dblclick',e=>{if(!e.target.closest('.lt,.tb-menu'))el.classList.toggle('max')});
  const gr=$('.grip',el);
  gr.addEventListener('pointerdown',e=>{
    e.preventDefault();const sx=e.clientX,sy=e.clientY,ow=el.offsetWidth,oh=el.offsetHeight;gr.setPointerCapture(e.pointerId);
    const mv=ev=>{el.style.width=Math.max(380,ow+ev.clientX-sx)+'px';el.style.height=Math.max(220,oh+ev.clientY-sy)+'px'};
    const up=()=>{gr.removeEventListener('pointermove',mv);gr.removeEventListener('pointerup',up)};
    gr.addEventListener('pointermove',mv);gr.addEventListener('pointerup',up);
  });
  $('.lt.c',el).onclick=()=>closeWin(w);
  $('.lt.m',el).onclick=()=>{el.classList.add('min');const next=wins.filter(x=>x!==w&&!x.el.classList.contains('min')).sort((a,b)=>b.el.style.zIndex-a.el.style.zIndex)[0];focusWin(next||null)};
  $('.lt.x',el).onclick=()=>el.classList.toggle('max');
  $$('.tb-menu',el).forEach(b=>{
    b.addEventListener('click',()=>{if(b.classList.contains('open'))closePops();else showWinMenu(b,w)});
    b.addEventListener('pointerenter',()=>{if($('.tb-menu.open',el)&&!b.classList.contains('open'))showWinMenu(b,w)});
  });
  return w;
}
function closeWin(w){
  w.el.classList.add('closing');
  setTimeout(()=>{
    w.el.remove();wins=wins.filter(x=>x!==w);
    if(!wins.some(x=>x.app===w.app))setRunning(w.app,false);
    const next=wins.filter(x=>!x.el.classList.contains('min')).sort((a,b)=>b.el.style.zIndex-a.el.style.zIndex)[0];
    focusWin(next||null);
  },160);
}
function winMenus(w){
  const md=menuDefs();
  return{
    file:[{label:'New Window',fn:()=>openApp(w.app,{fresh:true})},{sep:true},{label:'Close Window',fn:()=>closeWin(w)}],
    edit:md.edit,
    view:[{label:w.el.classList.contains('max')?'Restore Size':'Maximise',fn:()=>w.el.classList.toggle('max')},{label:'Minimise',fn:()=>$('.lt.m',w.el).click()},{sep:true}].concat(md.view),
    settings:md.settings
  };
}
function showWinMenu(b,w){
  const r=b.getBoundingClientRect();
  popup(winMenus(w)[b.dataset.m],r.left,r.bottom+4);b.classList.add('open');
}
function closeFocused(){const w=wins.find(x=>x.el.classList.contains('focused'));if(w)closeWin(w)}

/* ───────── Dock ───────── */
function buildDock(){
  const dock=$('#dock');
  DOCK.forEach(id=>{
    if(id==='|'){const s=document.createElement('div');s.className='dsep';dock.append(s);return}
    const d=document.createElement('button');d.className='di'+(RUNNING.has(id)?' run':'');d.dataset.app=id;
    d.dataset.name=id==='launcher'?'Launcher':APPS[id].name;
    d.innerHTML=id==='launcher'?`<div class="ico bare">${G.dots}</div>`:iconHTML(id);
    dock.append(d);
  });
  const kids=Array.from(dock.children),tip=$('#tip');
  const base=24+kids.reduce((a,k)=>a+(k.classList.contains('dsep')?1:40),0)+10*(kids.length-1);
  const reset=()=>kids.forEach(k=>k.style.setProperty('--s',1));
  dock.addEventListener('pointermove',e=>{
    if(!S.magnify||e.pointerType==='touch')return;
    let x=innerWidth/2-base/2+12;
    kids.forEach(k=>{const sep=k.classList.contains('dsep'),wd=sep?1:40,c=x+wd/2;x+=wd+10;
      if(!sep){const kk=Math.max(0,1-Math.abs(e.clientX-c)/120);k.style.setProperty('--s',(1+.55*Math.sin(kk*Math.PI/2)).toFixed(3))}});
  });
  dock.addEventListener('pointerleave',()=>{reset();tip.classList.remove('show');document.body.classList.remove('dock-peek')});
  dock.addEventListener('pointerover',e=>{const d=e.target.closest('.di');if(!d){tip.classList.remove('show');return}
    const r=d.getBoundingClientRect(),dr=dock.getBoundingClientRect();tip.textContent=d.dataset.name;
    tip.style.left=(r.left+r.width/2)+'px';tip.style.top=(dr.top-34)+'px';tip.classList.add('show')});
  dock.addEventListener('click',e=>{const d=e.target.closest('.di');if(!d)return;
    const id=d.dataset.app,had=wins.some(w=>w.app===id);
    if(!had&&id!=='launcher'){d.classList.add('bounce');setTimeout(()=>d.classList.remove('bounce'),850)}
    openApp(id);tip.classList.remove('show');
  });
  $('#dock-hit').addEventListener('pointerenter',()=>document.body.classList.add('dock-peek'));
}

/* ───────── Launcher ───────── */
function buildLauncher(){
  const g=$('#l-grid');
  g.innerHTML=Object.keys(APPS).map(id=>`<button class="la" data-app="${id}">${iconHTML(id)}<span>${APPS[id].name}</span></button>`).join('');
  g.addEventListener('click',e=>{const a=e.target.closest('.la');if(a)openApp(a.dataset.app)});
  $('#l-search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();$$('.la',g).forEach(a=>a.style.display=APPS[a.dataset.app].name.toLowerCase().includes(q)?'':'none')});
  $('#launcher').addEventListener('pointerdown',e=>{if(e.target.id==='launcher')closeLauncher()});
}
function toggleLauncher(){const l=$('#launcher');if(l.classList.contains('show'))closeLauncher();else{closePops();l.classList.add('show');const s=$('#l-search');s.value='';s.dispatchEvent(new Event('input'));s.focus()}}
function closeLauncher(){$('#launcher').classList.remove('show')}

function menuDefs(){

  const tog=(k,fn)=>()=>{S[k]=!S[k];store.set(k,S[k]);fn&&fn()};
  return{
    app:[
      {label:'New Window',fn:()=>openApp('files',{fresh:true})},
      {label:'Open Launcher',kbd:'Ctrl+Space',fn:toggleLauncher},
      {sep:true},
      {label:'Close Window',disabled:!wins.length,fn:closeFocused}
    ],
    settings:[
      {label:'Change Wallpaper…',fn:changeWall},
      {label:'Reset Wallpaper',disabled:!memWall,fn:resetWall},
      {sep:true},
      {label:'Dock Magnification',check:()=>S.magnify,fn:tog('magnify')},

    ],

      {label:'Cut',fn:exec('cut')},{label:'Copy',fn:exec('copy')},{label:'Paste',fn:()=>toast('Paste','Use Ctrl+V — browsers block menu paste.')},
      {sep:true},{label:'Select All',fn:exec('selectAll')}
    ],

      {label:'Show Widgets',check:()=>S.widgets,fn:tog('widgets',applyShell)},
      {label:'Hide Dock',check:()=>!S.dock,fn:tog('dock',applyShell)},
      {sep:true},
      {label:'Enter Full Screen',fn:()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}}
    ],
    help:[
      {label:'Keyboard Shortcuts',fn:()=>toast('Shortcuts','Ctrl+Space — launcher · Esc — dismiss · double-click a title bar — maximise')},
      {label:'About Essential OS',fn:()=>toast('Essential OS · desktop exploration','A web page pretending very hard to be a desktop environment.')}
    ]
  };
}
function closePops(){
  $$('.pop.menu').forEach(p=>p.remove());
  $('#cc').classList.remove('show');$('#idx').classList.remove('show');$('#dc').classList.remove('show');
  $$('.mb-item.open,.tray.open,#pill.open,.tb-menu.open').forEach(e=>e.classList.remove('open'));
}
function popup(items,x,y){
  closePops();
  const p=document.createElement('div');p.className='pop menu';const hasCheck=items.some(i=>i.check);
  items.forEach(it=>{
    if(it.sep){const s=document.createElement('div');s.className='msep';p.append(s);return}
    const d=document.createElement('div');d.className='mi'+(it.disabled?' dis':'');
    d.innerHTML=(hasCheck?`<span class="mchk">${it.check&&it.check()?'✓':''}</span>`:'')+'<span class="mlab"></span><span class="mk">'+(it.kbd||'')+'</span>';
    $('.mlab',d).textContent=it.label;
    d.addEventListener('click',()=>{closePops();it.fn&&it.fn()});p.append(d);
  });
  p.addEventListener('mousedown',e=>e.preventDefault());
  $('#desktop').append(p);
  const r=p.getBoundingClientRect();
  p.style.left=Math.max(6,Math.min(x,innerWidth-r.width-6))+'px';p.style.top=Math.max(6,Math.min(y,innerHeight-r.height-6))+'px';
  return p;
}
function showMenu(btn){
  const key=btn.dataset.menu;const r=btn.getBoundingClientRect();
  popup(menuDefs()[key],r.left,r.bottom+2);btn.classList.add('open');
}
function initMenus(){
  $$('.mb-item').forEach(b=>{
    b.addEventListener('click',()=>{if(b.classList.contains('open'))closePops();else showMenu(b)});
    b.addEventListener('pointerenter',()=>{if($('.mb-item.open')&&!b.classList.contains('open'))showMenu(b)});
  });
  document.addEventListener('pointerdown',e=>{
    if(!e.target.closest('.pop,.mb-item,.tray,#pill,.tb-menu'))closePops();
    if(!e.target.closest('.window,.pop,#dock,#menubar,#launcher,#toast'))focusWin(null);
  });
  $('#desktop').addEventListener('contextmenu',e=>{
    if(e.target.closest('.window,#dock,#menubar,.pop,#launcher'))return;e.preventDefault();
    popup([{label:'Open Files',fn:()=>openApp('files')},{label:'Open Terminal',fn:()=>openApp('terminal')},{sep:true},
      {label:'Change Wallpaper…',fn:changeWall},{label:'Reset Wallpaper',disabled:!memWall,fn:resetWall},{sep:true},
      {label:'Show Widgets',check:()=>S.widgets,fn:()=>{S.widgets=!S.widgets;store.set('widgets',S.widgets);applyShell()}}],e.clientX,e.clientY);
  });
}
function applyShell(){
  document.body.classList.toggle('no-widgets',!S.widgets);
  document.body.classList.toggle('dock-hidden',!S.dock);
}

/* ───────── Tray: volume, wifi, control centre, indexing ───────── */
const VOL=lvl=>`<svg width="18" height="16" viewBox="0 0 18 16"><path d="M2 5.8h3L9.3 2v12L5 10.2H2z" fill="currentColor"/>${lvl===0?'<path d="M12 5.5l4.5 5M16.5 5.5l-4.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>':'<path d="M12 5.4a3.6 3.6 0 0 1 0 5.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>'+(lvl>50?'<path d="M14.3 3.2a6.8 6.8 0 0 1 0 9.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>':'')}</svg>`;
const WIFI=on=>`<svg width="20" height="15" viewBox="0 0 20 15" style="opacity:${on?1:.45}"><path d="M1.5 5a12 12 0 0 1 17 0M4.3 8a8 8 0 0 1 11.4 0M7 11a4 4 0 0 1 6 0" stroke="currentColor" fill="none" stroke-width="1.9" stroke-linecap="round"/><circle cx="10" cy="13.2" r="1.4" fill="currentColor"/>${on?'':'<path d="M2 1.5l16 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'}</svg>`;
function setToggle(k){
  S[k]=!S[k];
  const tile=$(`.cc-tile[data-k="${k}"]`);tile.classList.toggle('on',S[k]);
  $('#s-wifi').textContent=S.wifi?'Connected':'Off';$('#s-bt').textContent=S.bt?'On':'Off';
  $('#s-focus').textContent=S.focus?'On':'Off';$('#s-night').textContent=S.night?'On':'Off';
  $('#t-wifi').innerHTML=WIFI(S.wifi);document.body.classList.toggle('night',S.night);
}
function initTray(){
  $('#t-vol').innerHTML=VOL(S.vol);$('#t-wifi').innerHTML=WIFI(true);
  const open=(btn,panel)=>{const was=panel.classList.contains('show');closePops();if(!was){panel.classList.add('show');btn.classList.add('open')}};
  $('#t-cc').addEventListener('click',()=>open($('#t-cc'),$('#cc')));
  $('#t-vol').addEventListener('click',()=>open($('#t-cc'),$('#cc')));
  $('#t-wifi').addEventListener('click',()=>open($('#t-cc'),$('#cc')));
  $('#pill').addEventListener('click',()=>open($('#pill'),$('#idx')));
  $('#t-clock').addEventListener('click',()=>{open($('#t-clock'),$('#dc'));if($('#dc').classList.contains('show'))dcOpen()});
  $$('.cc-tile').forEach(t=>t.addEventListener('click',()=>setToggle(t.dataset.k)));
  $('#r-bright').addEventListener('input',e=>{S.bright=+e.target.value;$('#dim').style.opacity=((100-S.bright)/100*.75).toFixed(3)});
  $('#r-vol').addEventListener('input',e=>{S.vol=+e.target.value;$('#t-vol').innerHTML=VOL(S.vol)});
}
const IDX={p:.37,total:24860,paused:false};
function renderIdx(){
  const done=IDX.p>=1,pill=$('#pill');
  pill.classList.toggle('done',done);pill.classList.toggle('paused',IDX.paused&&!done);
  $('#pill-t').textContent=done?'Indexed':IDX.paused?'Paused':'Indexing';
  $('#idx-t').textContent=done?'Up to date':IDX.paused?'Indexing paused':'Indexing files';
  $('#idx-s').textContent=`${Math.round(Math.min(1,IDX.p)*IDX.total).toLocaleString('en-US')} of ${IDX.total.toLocaleString('en-US')} items`;
  $('#idx-bar').style.width=(Math.min(1,IDX.p)*100)+'%';
  $('#idx-btn').textContent=done?'Reindex':IDX.paused?'Resume':'Pause';
}
function initIndex(){
  $('#idx-btn').addEventListener('click',()=>{if(IDX.p>=1){IDX.p=0;IDX.paused=false}else IDX.paused=!IDX.paused;renderIdx()});
  setInterval(()=>{if(!IDX.paused&&IDX.p<1){IDX.p=Math.min(1,IDX.p+.004);renderIdx();if(IDX.p>=1)notify('system','Indexing finished',IDX.total.toLocaleString('en-US')+' items are now searchable.')}},800);renderIdx();
}

/* ───────── Date & time panel: notifications, calendar, world clocks, weather ───────── */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const FULLDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const CITIES=[['London','Europe/London'],['New York','America/New_York'],['Los Angeles','America/Los_Angeles'],['São Paulo','America/Sao_Paulo'],['Lagos','Africa/Lagos'],['Berlin','Europe/Berlin'],['Dubai','Asia/Dubai'],['Mumbai','Asia/Kolkata'],['Tokyo','Asia/Tokyo'],['Sydney','Australia/Sydney']];
const DC={y:0,m:0,sel:''};
let clocks=store.get('clocks',[]);
const NOTES=[];let noteId=0;
const SPARK='<svg viewBox="0 0 14 14"><path d="M7 1l1.5 4.2L12.7 6.7 8.5 8.2 7 12.5 5.5 8.2 1.3 6.7l4.2-1.5z" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>';
const CHEV='<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5l5 5 5-5"/></svg>';
const XICO='<svg width="11" height="11" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2.5 2.5l9 9M11.5 2.5l-9 9"/></svg>';

/* Weather: a modelled daily curve (not live data), anchored to the mockup's 13°–26° range */
const WX_PTS=[[0,16],[5,13],[7,17],[9,22],[10,24],[13,26],[16,25],[18,22],[21,18],[24,16]];
function wxTemp(h){h=((h%24)+24)%24;for(let i=1;i<WX_PTS.length;i++){const a=WX_PTS[i-1],b=WX_PTS[i];if(h<=b[0])return a[1]+(b[1]-a[1])*(h-a[0])/(b[0]-a[0])}return 16}
const RAYS='<path d="M18 3v3M18 22v3M7 14H4M32 14h-3M10.2 6.2l2 2M25.8 6.2l-2 2M10.2 21.8l2-2M25.8 21.8l-2-2"/>';
const CLOUD='<path d="M12 24a5.5 5.5 0 0 1-.6-10.96A8 8 0 0 1 26.6 12.2 6 6 0 0 1 26 24z"/>';
const MOON='<path d="M24 17.5A9 9 0 1 1 15.5 4.2 7.2 7.2 0 0 0 24 17.5z"/>';
const WX_ICON={
  sun:`<svg viewBox="0 0 36 28"><circle cx="18" cy="14" r="5.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none">${RAYS}</g></svg>`,
  suncloud:`<svg viewBox="0 0 36 28"><g transform="translate(-3 -2) scale(.8)"><circle cx="18" cy="14" r="5.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none">${RAYS}</g></g><g transform="translate(5 3) scale(.85)" fill="currentColor" stroke="#32343a" stroke-width="2.6" paint-order="stroke">${CLOUD}</g></svg>`,
  moon:`<svg viewBox="0 0 36 28"><g fill="currentColor" transform="translate(5 3)">${MOON}</g></svg>`,
  mooncloud:`<svg viewBox="0 0 36 28"><g fill="currentColor" transform="translate(-2 -1) scale(.9)">${MOON}</g><g transform="translate(5 3) scale(.85)" fill="currentColor" stroke="#32343a" stroke-width="2.6" paint-order="stroke">${CLOUD}</g></svg>`
};
function wxKind(hr){return (hr<6||hr>=19)?(hr%3===0?'mooncloud':'moon'):(hr>=10&&hr<16?'sun':'suncloud')}
function renderWx(){
  const d=new Date(),h=d.getHours()+d.getMinutes()/60,day=h>=6&&h<19;
  $('#wx-t').textContent=Math.round(wxTemp(h));
  $('#wx-i').innerHTML=day?'<svg width="18" height="18" viewBox="0 0 20 20"><circle cx="10" cy="10" r="4" fill="#ffd60a"/><g stroke="#ffd60a" stroke-width="1.6" stroke-linecap="round"><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6L16 16M16 4l-1.4 1.4M5.4 14.6L4 16"/></g></svg>':'<svg width="18" height="18" viewBox="0 0 20 20"><path d="M16 12.5A7 7 0 0 1 7.5 4a7 7 0 1 0 8.5 8.5z" fill="#e8ecff"/></svg>';
  $('#wx-d').textContent=!day?'Clear night':(h>=8&&h<17?'Mostly sunny':'Partly cloudy');
}
function renderWxStrip(){
  const n=new Date();let h='';
  for(let i=1;i<=5;i++){const hr=(n.getHours()+i)%24;h+=`<div><span>${hr%12||12}:00</span>${WX_ICON[wxKind(hr)]}<b>${Math.round(wxTemp(hr))}°</b></div>`}
  $('#dc-wx').innerHTML=h;
}

/* Notifications */
function relTime(ts){const m=Math.floor((Date.now()-ts)/60000);if(m<1)return'Just now';if(m<60)return m+' min ago';const h=Math.floor(m/60);if(h<24)return h+(h===1?' hour ago':' hours ago');return Math.floor(h/24)+' d ago'}
function notify(app,title,body){
  NOTES.unshift({id:++noteId,app,title,body,ts:Date.now()});
  if($('#dc').classList.contains('show')){renderNotes();return}
  $('#t-clock').classList.add('unread');toast(title,body);
}
function renderNotes(){
  const box=$('#dc-nl');
  box.innerHTML=NOTES.length?NOTES.map(n=>{
    const a=APPS[n.app],name=a?a.name:'Essential OS',ico=a?iconHTML(n.app):`<div class="ico t-sys">${SPARK}</div>`;
    return `<div class="nc" data-id="${n.id}"><div class="nc-h">${ico}<b>${esc(name)}</b><span class="nc-time">${relTime(n.ts)}</span><span class="sp"></span><button class="nc-btn nc-e" aria-label="Expand">${CHEV}</button><button class="nc-btn nc-x" aria-label="Dismiss">${XICO}</button></div><div class="nc-b">${ico}<div class="nc-t"><b>${esc(n.title)}</b><span>${esc(n.body)}</span></div></div></div>`;
  }).join(''):'<div class="dc-none">No Notifications</div>';
  $('#dc-clear').hidden=!NOTES.length;
}

/* World clocks */
function renderClocks(){
  const now=new Date(),here=ymd(now);
  $('#dc-wcl').innerHTML=clocks.map((tz,i)=>{
    const c=CITIES.find(x=>x[1]===tz);if(!c)return'';
    const t=now.toLocaleTimeString('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit'});
    const ds=now.toLocaleDateString('en-CA',{timeZone:tz});
    return `<div class="dc-wc"><div><b>${esc(c[0])}</b><small>${ds===here?'Today':(ds>here?'Tomorrow':'Yesterday')}</small></div><span>${t}</span><button class="x" data-i="${i}" aria-label="Remove">×</button></div>`;
  }).join('');
  $('#dc-pick').innerHTML=CITIES.filter(c=>!clocks.includes(c[1])).map(c=>`<button data-tz="${c[1]}">${esc(c[0])}</button>`).join('');
}

/* Calendar */
function renderDc(){
  const t=new Date(),today=ymd(t);
  $('#dc-dw').textContent=FULLDAYS[t.getDay()];
  $('#dc-dd').textContent=`${t.getDate()} ${FULL[t.getMonth()]} ${t.getFullYear()}`;
  $('#dc-mt').textContent=FULL[DC.m]+(DC.y!==t.getFullYear()?' '+DC.y:'');
  const first=new Date(DC.y,DC.m,1),start=new Date(DC.y,DC.m,1-(first.getDay()||7));
  let h='';'SMTWTFS'.split('').forEach(c=>h+=`<span class="dow">${c}</span>`);
  for(let i=0;i<42;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),key=ymd(d),dow=d.getDay();
    const cls=['dc-d',d.getMonth()!==DC.m?'out':(dow===0||dow===6?'we':''),key===today?'today':'',key===DC.sel?'sel':''].filter(Boolean).join(' ');
    h+=`<button class="${cls}" data-d="${key}">${pad2(d.getDate())}</button>`;
  }
  $('#dc-grid').innerHTML=h;
  const [sy,sm,sd]=DC.sel.split('-').map(Number),sdate=new Date(sy,sm-1,sd);
  $('#dc-evt').textContent=DC.sel===today?'Today':`${DAYS[sdate.getDay()]}, ${sd} ${MONTHS[sm-1]}`;
  renderClocks();renderWxStrip();renderNotes();
}
function dcOpen(){$('#toast').classList.remove('show');const t=new Date();DC.y=t.getFullYear();DC.m=t.getMonth();DC.sel=ymd(t);$('#t-clock').classList.remove('unread');renderDc()}
function dcTick(){if($('#dc').classList.contains('show')){renderClocks();renderWxStrip();renderNotes()}}
function initDc(){
  NOTES.push({id:++noteId,app:'system',title:'Welcome to Essential OS',body:'Right-click the desktop to change the wallpaper.',ts:Date.now()-60*60*1000});
  $('#dc-prev').onclick=()=>{DC.m--;if(DC.m<0){DC.m=11;DC.y--}renderDc()};
  $('#dc-next').onclick=()=>{DC.m++;if(DC.m>11){DC.m=0;DC.y++}renderDc()};
  $('#dc-mt').onclick=dcOpen;
  $('#dc-grid').addEventListener('click',e=>{const b=e.target.closest('.dc-d');if(!b)return;DC.sel=b.dataset.d;const p=DC.sel.split('-').map(Number);DC.y=p[0];DC.m=p[1]-1;renderDc()});
  $('#dc-nl').addEventListener('click',e=>{
    const c=e.target.closest('.nc');if(!c)return;
    if(e.target.closest('.nc-x')){const i=NOTES.findIndex(n=>String(n.id)===c.dataset.id);if(i>-1)NOTES.splice(i,1);renderNotes()}
    else if(e.target.closest('.nc-e'))c.classList.toggle('exp');
  });
  $('#dc-clear').onclick=()=>{NOTES.length=0;renderNotes()};
  $('#dc-addwc').onclick=()=>{const p=$('#dc-pick');p.hidden=!p.hidden};
  $('#dc-pick').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;clocks.push(b.dataset.tz);store.set('clocks',clocks);$('#dc-pick').hidden=true;renderClocks()});
  $('#dc-wcl').addEventListener('click',e=>{const x=e.target.closest('.x');if(!x)return;clocks.splice(+x.dataset.i,1);store.set('clocks',clocks);renderClocks()});
}

/* ───────── Boot ───────── */
buildWallpaper();applyWall();applyShell();
buildDock();buildLauncher();initMenus();initTray();initIndex();initPhoto();initDc();
tick();renderCal();renderWx();setInterval(()=>{tick();renderCal();renderWx();dcTick()},10000);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePops();closeLauncher()}
  if(e.code==='Space'&&(e.ctrlKey||e.metaKey)){e.preventDefault();toggleLauncher()}
});
})();
</script>
</body>
</html>
