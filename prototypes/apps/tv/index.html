<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Essential TV</title><style>

<script>(() => {'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const ls={get(k,d){try{const v=localStorage.getItem('tv.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('tv.'+k,JSON.stringify(v))}catch(e){}}};
const GEN=[{n:2,name:'Toon Time',g:'Cartoons',h:330,k:/cartoon|toon|anim/i},{n:3,name:'Wild Planet',g:'Wildlife',h:140,k:/wild|nature|animal/i},{n:4,name:'Sports Desk',g:'Sports',h:210,k:/sport|football|soccer|match/i},{n:5,name:'Time Machine',g:'History',h:35,k:/histor|doc|war|ancient/i},{n:6,name:'Silver Screen',g:'Film',h:270,k:/film|movie|cinema/i},{n:7,name:'Laugh Track',g:'Comedy',h:55,k:/comed|funny|sitcom|stand.?up/i}];
let CH=ls.get('chans',null)||GEN.map(({n,name,g,h})=>({n,name,g,h,kids:n<4}));
const saveCh=()=>ls.set('chans',CH),kidsOk=x=>x.r==='G'||x.r==='PG',VC=()=>S.kids?CH.filter(c=>c.kids):CH;
const rate=(s,g)=>/horror|adult|18\+|uncut|r-rated/i.test(s)?'R':({Cartoons:'G',Wildlife:'G',Sports:'PG',History:'PG',Film:'PG-13',Comedy:'PG-13'}[g]||'PG-13');
const SL=18e5,OFF=new Date().getTimezoneOffset()*6e4;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const tt=s=>{try{s=decodeURIComponent(s)}catch(e){}return s.replace(/\.\w{2,4}$/,'').replace(/_+/g,' ')};
const S={theme:'system',crt:true,vol:.8,mute:false,ch:2,v:'gal',fit:'contain',cc:false,res:0,prof:'default',...ls.get('set',{})};
const sv=()=>ls.set('set',S);
let lib=ls.get('net',[]);lib.forEach(x=>{if(!x.g)x.g=(GEN.find(c=>c.n===x.ch)||GEN[4]).g;if(!x.r)x.r=rate(x.title,x.g);x.p=x.p||x.title});
const saveNet=()=>ls.set('net',lib.filter(x=>x.net).map(({id,g,r,p,yr,se,title,src,dur,net})=>({id,g,r,p,yr,se,title,src,dur,net})));
const v=$('#v'),ov=$('#ov'),W=$('#win'),D=$('.desktop');
let tmr,ck='',asleep=false,gk='',guk='',gs=-1,slT,ot;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>e.classList.remove('on'),2600)}

/* ---------- library ---------- */
function probe(x){const p=document.createElement('video');p.preload='metadata';const done=()=>{p.removeAttribute('src');p.load();saveNet();renderAll()};p.onloadedmetadata=()=>{x.dur=isFinite(p.duration)?p.duration:0;done()};p.onerror=()=>{x.bad=true;toast("Can't play: "+x.title);done()};p.src=x.src}
function add(L,ch){const c=ch&&CH.find(c=>c.n===ch);L.forEach(o=>{const g0=(GEN.find(k=>k.k.test(o.path))||GEN[4]).g,g=c&&!c.t?c.g:g0,m=o.title.match(/^(.*?)[\s._-]*s\d{1,2}e\d{1,3}/i),y=(o.path.match(/\b(19\d\d|20[0-3]\d)\b/)||[])[1];
 const x={id:Math.random().toString(36).slice(2,9),g,r:rate(o.path,g),p:o.path,yr:y?+y:0,se:m?m[1]:'',title:o.title,src:o.src,net:!!o.net,dur:0};lib.push(x);if(c&&c.t&&!c.t.includes(x.title))c.t.push(x.title);probe(x)});saveCh();saveNet();renderAll();toast(L.length?`Added ${L.length} to the library`:'No playable video found')}
function addTo(c,x){if(!c.t)c.t=members(c).map(i=>i.title);if(!c.t.includes(x.title))c.t.push(x.title);saveCh();renderAll()}
const fi=$('#fi'),fd=$('#fd');let pend=null;
const pick=(f,ch)=>{pend=ch||null;(f?fd:fi).click()};
const addFiles=(F,ch)=>add(F.filter(f=>/^video\//.test(f.type)||/\.(mp4|m4v|webm|mkv|mov|ogv|avi)$/i.test(f.name)).map(f=>({path:f.rel||f.webkitRelativePath||f.name,title:tt(f.name),src:URL.createObjectURL(f)})),ch);
[fi,fd].forEach(i=>i.onchange=()=>{addFiles([...i.files],pend);i.value=''});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{e.preventDefault();const out=[],its=[...e.dataTransfer.items].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
 const walk=async en=>{if(en.isFile){const f=await new Promise(r=>en.file(r));f.rel=en.fullPath;out.push(f)}else{const rd=en.createReader();let b;do{b=await new Promise(r=>rd.readEntries(r));for(const c of b)await walk(c)}while(b.length)}};
 for(const en of its)await walk(en);if(!its.length)out.push(...e.dataTransfer.files);addFiles(out)});
async function addNet(ch){const u=prompt('Video URL or .m3u playlist on your network:','http://');if(!u||u==='http://')return;let L=[{src:u,title:tt(u.split('/').pop())||u}];
 if(/\.m3u8?$/i.test(u)){try{const t=await (await fetch(u)).text();L=[];let ti='';t.split(/\r?\n/).forEach(l=>{l=l.trim();if(l.startsWith('#EXTINF'))ti=l.split(',').slice(1).join(',');else if(l&&l[0]!=='#'){L.push({src:new URL(l,u).href,title:ti||tt(l.split('/').pop())});ti=''}})}catch(e){return toast('Could not read playlist (CORS or offline)')}}
 add(L.map(o=>({...o,path:o.title,net:true})),typeof ch==='number'?ch:null)}
function clearLib(){lib.forEach(x=>!x.net&&URL.revokeObjectURL(x.src));lib=[];saveNet();renderAll();toast('Library cleared')}

/* ---------- scheduler: every channel loops its playlist on a 30-minute grid ---------- */

$('#gal').addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a)return a.dataset.a==='f'?pick(0):a.dataset.a==='d'?pick(1):addNet();const t=e.target.closest('[data-ch]');if(t)return tune(+t.dataset.ch);const c=e.target.closest('[data-id]');if(c)playOD(c.dataset.id)});
$('#gal').addEventListener('contextmenu',e=>{const c=e.target.closest('.card[data-id]');if(!c||S.kids)return;e.preventDefault();const x=lib.find(i=>i.id===c.dataset.id);
 openMenu({x:e.clientX,y:e.clientY},[{label:'Add to channel',header:1},...CH.map(k=>({label:`${k.n} · ${k.name}`,checked:members(k).includes(x),run:()=>{addTo(k,x);toast('Added to '+k.name)}})),'-',{label:'Remove from library',run:()=>{lib=lib.filter(i=>i!==x);saveNet();renderAll()}}])});
$('#q').oninput=e=>{S.q=e.target.value;renderGal()};
$('#guide').onclick=e=>{const d=e.target.closest('[data-n]');if(d)tune(+d.dataset.n)};
$('#live').onclick=()=>{if(v.paused&&!asleep&&ck!=='-'&&v.getAttribute('src'))v.play().catch(()=>{})};
$('#odx').onclick=closeOD;$('#cu').onclick=()=>step(1);$('#cd').onclick=()=>step(-1);$('#gd').onclick=guide;$('#mt').onclick=mute;
$('#vol').oninput=e=>{S.vol=+e.target.value;S.mute=false;vol();sv()};$('#vol').onchange=e=>e.target.blur();
$$('.seg button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
addEventListener('keydown',e=>{if(e.target.closest('input[type=text],input[type=search]'))return;
 if(e.key==='Escape'){if(menus.length)closeMenu();else if(stu.classList.contains('on'))closeStudio();else if($('#od').classList.contains('on'))closeOD();else if(fs)fsT(false);return}
 if(e.key==='F11'){e.preventDefault();fsT();return}
 if(menus.length&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const bs=$$('.mbs [data-m]'),i=bs.findIndex(b=>b.getAttribute('aria-expanded')==='true');if(i>=0)show(bs[(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length]);return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
 if(S.v==='live'&&(k==='arrowup'||k==='pageup'))step(1);else if(S.v==='live'&&(k==='arrowdown'||k==='pagedown'))step(-1);
 else if(/^[2-7]$/.test(k))tune(+k);else if(k==='l')setView('live');else if(k==='b')setView('gal');else if(k==='g')guide();else if(k==='m')mute();else if(k==='c')crt();else if(k==='f')fsT();
 else if(k===' '&&$('#od').classList.contains('on')){e.preventDefault();ov.paused?ov.play():ov.pause()}});

S.q='';theme();vol();look();v.style.objectFit=S.fit;document.body.classList.toggle('crton',S.crt);
lib.forEach(x=>{if(!x.dur)probe(x)});
wApply();setView(S.v);renderAll();setInterval(tick,1000);
})();</script></body></html>
