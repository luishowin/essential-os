<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse – Essential OS</title>
<style>
:root{--fg:#1d1d1f;--mut:#6e6e73;--card:rgba(255,255,255,.62);--glass:rgba(255,255,255,.72);--line:rgba(0,0,0,.09);--acc:#1d1d1f;--on:#fff;--grid:rgba(0,0,0,.05);--wall:#eceef2;--r1:#7FB9FF;--r2:#7982FF;--r3:#BD79FF;--win:radial-gradient(110% 80% at 100% 100%,rgba(70,161,255,.32),transparent 62%),linear-gradient(160deg,#fff 45%,#e6f2ff);color-scheme:light}
:root[data-theme="dark"]{--fg:#f5f5f7;--mut:#98989d;--card:rgba(255,255,255,.08);--glass:rgba(30,30,32,.7);--line:rgba(255,255,255,.12);--acc:#fff;--on:#111;--grid:rgba(255,255,255,.05);--wall:#0e0f13;--win:radial-gradient(110% 80% at 100% 100%,rgba(70,161,255,.45),transparent 62%),#000;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--wall);overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:96px}
.desktop{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(44px + env(safe-area-inset-bottom,0px));background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;overflow:hidden}
body.fs .desktop{bottom:0}body.fs .task{display:none}
.window{position:absolute;border-radius:12px;overflow:hidden;background:var(--win);box-shadow:0 20px 60px rgba(0,0,0,.28),0 0 0 1px var(--line)}
.window.max{border-radius:0}.window.max .rz{display:none}.window.hid{display:none}
.app{position:absolute;inset:0;container:app/inline-size;overflow:hidden}
.rz{position:absolute;z-index:9;touch-action:none}
.rz.n,.rz.s{left:12px;right:12px;height:5px;cursor:ns-resize}.rz.n{top:0}.rz.s{bottom:0}
.rz.e,.rz.w{top:12px;bottom:12px;width:5px;cursor:ew-resize}.rz.e{right:0}.rz.w{left:0}
.rz.ne,.rz.nw,.rz.se,.rz.sw{width:14px;height:14px}.rz.ne{top:0;right:0;cursor:nesw-resize}.rz.nw{top:0;left:0;cursor:nwse-resize}.rz.se{bottom:0;right:0;cursor:nwse-resize}.rz.sw{bottom:0;left:0;cursor:nesw-resize}
.top{position:absolute;top:0;left:0;right:0;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;z-index:5;user-select:none;touch-action:none}.top::before,.top::after{content:"";position:absolute;left:0;right:0;top:0;pointer-events:none;z-index:-1}.top::before{height:72px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);-webkit-mask-image:linear-gradient(#000 20%,transparent);mask-image:linear-gradient(#000 20%,transparent)}.top::after{height:48px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(#000 25%,transparent);mask-image:linear-gradient(#000 25%,transparent)}.app::before,.app::after{content:"";position:absolute;left:0;right:0;bottom:0;pointer-events:none;z-index:4}.app::before{height:140px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);-webkit-mask-image:linear-gradient(to top,#000 20%,transparent);mask-image:linear-gradient(to top,#000 20%,transparent)}.app::after{height:96px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(to top,#000 25%,transparent);mask-image:linear-gradient(to top,#000 25%,transparent)}
.menus{display:flex;gap:2px}.mb{padding:5px 10px;border-radius:7px;font-size:13px}.mb:hover,.mb[aria-expanded="true"]{background:var(--card)}.ham{display:none}
.ctl{display:flex;gap:10px;padding-right:6px}.ctl button{width:36px;height:32px;display:grid;place-items:center;color:#a1a1a8}.ctl button:hover{color:var(--fg)}.ctl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scroll{position:absolute;inset:0;overflow:auto;--pad:22px;padding:52px var(--pad) 96px}
.scroll::-webkit-scrollbar{width:12px}.scroll::-webkit-scrollbar-track{background:transparent;margin:50px 0}.scroll::-webkit-scrollbar-thumb{background:var(--mut);border-radius:6px;border:3px solid transparent;background-clip:padding-box}
@supports not selector(::-webkit-scrollbar){.scroll{scrollbar-width:thin}}
h1{font-size:28px;margin:0 0 2px;letter-spacing:-.02em}.sub{color:var(--mut);margin:0 0 18px}.mut{color:var(--mut)}.big{font-size:26px;font-weight:700}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.scroll>div{max-width:720px;margin:0 auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.w2{grid-column:span 2}
.card{position:relative;background:var(--card);border-radius:16px;padding:16px;box-shadow:0 0 0 1px var(--line)}.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}.card h3 svg{width:14px;height:14px;vertical-align:-2px;margin-right:6px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.clk{cursor:pointer}
.edit .card{outline:1.5px dashed var(--mut)}.ec{position:absolute;top:8px;right:8px;display:flex;gap:4px}.ec button{padding:2px 8px;border-radius:8px;background:var(--glass);font-size:12px;box-shadow:0 0 0 1px var(--line)}
.rings{display:flex;align-items:center;gap:18px}.rings svg{width:150px;height:150px;flex:none}.leg div{margin-bottom:8px}.leg b{font-size:19px;display:block;line-height:1.1}.leg small{color:var(--mut)}
.bar{height:8px;border-radius:4px;background:var(--line);margin:10px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .ic{width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none}
.row .t{flex:1;min-width:0}.row .t b{display:block}.row .t small{color:var(--mut)}.row .v{text-align:right;color:var(--mut);font-size:13px}.row .v b{display:block;color:var(--fg);font-size:14px}.row .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gi{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}.btns{display:flex;gap:8px;flex-wrap:wrap}
.pill{position:absolute;bottom:14px;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100% - 28px);height:52px;border-radius:26px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);box-shadow:0 8px 30px rgba(0,0,0,.16),0 0 0 1px var(--line);z-index:6}
.seg{display:flex;justify-content:center;gap:2px}.seg button{padding:7px 14px;border-radius:16px;font-weight:500}.seg button.on{background:var(--acc);color:var(--on)}
.pb{padding:8px 14px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-weight:500;white-space:nowrap}.pb.go{background:var(--acc);color:var(--on)}
.pf{width:38px;height:38px;border-radius:50%;padding:0;display:grid;place-items:center}.pf svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}.pf.on{background:var(--acc);color:var(--on)}
.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%) translateY(10px);background:var(--fg);color:var(--wall);padding:8px 14px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:7;white-space:nowrap;font-size:13px}.toast.on{opacity:1;transform:translateX(-50%)}
.task{position:fixed;left:0;right:0;bottom:0;height:calc(44px + env(safe-area-inset-bottom,0px));padding:0 10px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.chip{padding:6px 12px;border-radius:8px;background:var(--card);font-weight:500;display:flex;align-items:center;gap:6px}.chip i{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.hud{margin-left:auto;color:var(--mut);font:12px ui-monospace,Menlo,monospace}.task .pr{display:flex;gap:2px}.task .pr button{padding:5px 9px;border-radius:7px;font-size:12px;color:var(--mut)}.task .pr button:hover{background:var(--card);color:var(--fg)}
.menu{position:fixed;z-index:100;min-width:210px;padding:6px;border-radius:12px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 0 1px var(--line);overflow:auto;color:var(--fg)}
.menu .mi{display:flex;width:100%;justify-content:space-between;gap:20px;padding:6px 10px;border-radius:7px;text-align:left}.menu .mi:hover{background:var(--acc);color:var(--on)}
.menu .mh{padding:6px 10px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
@container app (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}.w2{grid-column:1/-1}}
@container app (max-width:560px){.menus{display:none}.ham{display:block}.scroll{--pad:14px}.pb.go span{display:none}.seg button{padding:7px 10px}}
@container app (max-width:420px){.rings{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="desktop" id="desk"><div class="window" id="win"><div class="app">
<div class="top" id="top"><div class="menus"><button class="mb" aria-haspopup="true" aria-expanded="false" data-m="file">File</button><button class="mb" aria-haspopup="true" aria-expanded="false" data-m="view">View</button></div><button class="mb ham" aria-haspopup="true" aria-expanded="false" data-m="all" aria-label="Menu">&#9776;</button><div class="ctl"><button id="bMin" aria-label="Minimize"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><button id="bMax" aria-label="Maximize"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><button id="bX" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
<div class="scroll" id="sc"></div>
<div class="pill"><div class="seg" id="seg"></div><button class="pb pf" id="bP" aria-label="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button></div>
<div class="toast" id="toast"></div></div></div></div>
<div class="task"><button class="chip" id="chip"><i></i>Pulse</button><div class="pr" id="pr"></div><span class="hud" id="hud"></span></div>
<script>(()=>{'use strict';
const $=s=>document.querySelector(s),win=$('#win'),desk=$('#desk');
const ld=(k,d)=>{try{const v=localStorage.getItem('pulse2.'+k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem('pulse2.'+k,JSON.stringify(v))}catch(e){}};
const fmt=n=>Math.round(n).toLocaleString('en-US');
/* data */
const SP={Running:{r:10,d:1,t:90,plan:['Easy run: 5 km at a conversational pace','Intervals: 6 × 400 m with 90 s rests','Long run: build to 10 km, slow and steady']},
Swimming:{r:9,d:1,t:60,plan:['Technique: 8 × 50 m drills','Endurance: 20 minutes continuous freestyle','Intervals: 10 × 100 m on 2 min']},
Weights:{r:6,t:120,plan:['Push: bench press, overhead press, dips','Pull: rows, pull-ups, curls','Legs: squats, Romanian deadlifts, lunges']},
Cycling:{r:8,d:1,t:120,plan:['Recovery spin: 45 min easy','Tempo: 3 × 10 min at a hard-but-steady effort','Long ride: 2 h at an easy pace']},
Yoga:{r:3,t:60,plan:['Morning flow: 20 min','Mobility: hips and hamstrings, 30 min','Wind-down: 15 min stretch']}};
const DEF={name:'You',theme:'system',view:'today',goals:{mv:600,ex:45,st:10000,wt:2500,fd:2200,wg:70},cards:['act','wat','fod','wgt','hrt','slp','wrk'],hide:[],water:750,weight:72.4,bonus:0,meals:[{n:'Breakfast',k:520},{n:'Lunch',k:690}],wk:[{id:1,n:'Running',m:32,k:320,km:5.2,d:'Today'},{id:2,n:'Weights',m:45,k:270,km:0,d:'Yesterday'},{id:3,n:'Cycling',m:60,k:480,km:24,d:'Saturday'}]};
let S=Object.assign({},DEF,ld('s',{}));S.goals=Object.assign({},DEF.goals,S.goals);S.det=null;S.edit=false;
const save=()=>{const r=Object.assign({},S);delete r.det;delete r.edit;sv('s',r)};
const NOUN={Running:'Run',Swimming:'Swim',Weights:'Lift',Cycling:'Ride',Yoga:'Flow'};
const part=h=>h<12?'Morning':h<17?'Afternoon':h<21?'Evening':'Night';
const uniq=(n,p)=>{let t=p+' '+NOUN[n],c=1;while(S.wk.some(w=>w.t===t)){c++;t=p+' '+NOUN[n]+' '+c}return t};
const mk=(n,m,k,km)=>{const d=new Date(),h=d.getHours();return{id:Date.now(),n,m,k,km,d:'Today',t:uniq(n,part(h)),at:String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}};
S.wk.forEach(w=>{if(!w.t){w.at=w.at||({1:'07:15',2:'18:30',3:'09:00'})[w.id]||'12:00';w.t=uniq(w.n,part(+w.at.slice(0,2)))}});
const H={st:[7420,9150,6380,10420,8860,12040],wt:[2100,1800,2650,2400,1500,2300],fd:[2150,2480,1960,2300,2050,2620],wg:[72.9,72.8,72.8,72.6,72.5,72.5],hr:[59,58,60,58,57,58],sl:[7.1,6.4,7.8,7.4,6.9,7.6]};
const M={st:{t:'Steps',u:'steps',g:'st',f:fmt},wt:{t:'Water',u:'ml',g:'wt',f:fmt},fd:{t:'Food',u:'kcal',g:'fd',f:fmt},wg:{t:'Weight',u:'kg',g:'wg',f:n=>n.toFixed(1),lo:1},hr:{t:'Resting heart rate',u:'bpm',f:fmt},sl:{t:'Sleep',u:'h',f:n=>n.toFixed(1)}};
const GL={mv:['Move','kcal'],ex:['Exercise','min'],st:['Steps',''],wt:['Water','ml'],fd:['Food','kcal'],wg:['Target weight','kg']};
const calc=()=>{const t=S.wk.filter(w=>w.d==='Today'),m=t.reduce((a,w)=>a+w.m,0);return{mv:140+t.reduce((a,w)=>a+w.k,0),ex:m,st:3200+m*85+S.bonus,t}};
const eat=()=>S.meals.reduce((a,m)=>a+m.k,0);
const ser=k=>[...H[k],{st:calc().st,wt:S.water,fd:eat(),wg:S.weight,hr:58,sl:7.4}[k]];
const DL=()=>[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d.toLocaleDateString('en-GB',{weekday:'short'})});
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
/* components */
function bars(v,goal,lo,h,lab){const W=560,bw=48,g=(W-bw*7)/6,mx=Math.max(...v,goal||0)*1.08,y=n=>h-Math.max(2,(n-lo)/(mx-lo)*h),L=DL();
let s=`<svg viewBox="0 -16 ${W} ${h+40}" style="width:100%" role="img">`;
if(goal)s+=`<line x1="0" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--mut)" stroke-dasharray="4 4"/>`;
v.forEach((n,i)=>{const x=i*(bw+g);s+=`<rect x="${x}" y="${y(n)}" width="${bw}" height="${h-y(n)}" rx="8" fill="var(--acc)" opacity="${i===6?1:.5}"/><text x="${x+bw/2}" y="${h+18}" text-anchor="middle" font-size="12" fill="var(--mut)">${L[i]}</text>`;if(lab)s+=`<text x="${x+bw/2}" y="${y(n)-5}" text-anchor="middle" font-size="11" fill="var(--fg)">${lab(n)}</text>`});return s+'</svg>'}
const ring=(r,p,c)=>{const C=2*Math.PI*r;p=Math.min(p,1);return `<circle cx="80" cy="80" r="${r}" fill="none" stroke="${c}" stroke-opacity=".2" stroke-width="12"/><circle cx="80" cy="80" r="${r}" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 80 80)"/>`};
const bar=p=>`<div class="bar"><i style="width:${Math.min(100,p*100)}%"></i></div>`;
const goalIn=k=>`<label class="gi">${GL[k][0]} goal <input type="number" data-g="${k}" value="${S.goals[k]}" min="1" step="${k==='wg'?.5:k==='st'?500:k==='wt'?250:10}"> ${GL[k][1]}</label>`;
const wrow=w=>`<div class="row clk" data-d="w:${w.id}"><div class="ic">${SI[w.n]||w.n[0]}</div><div class="t"><b>${w.t||w.n}</b><small>${w.d}${w.at?' · '+w.at:''}</small></div><div class="v"><b>${w.km?w.km+' km':w.k+' kcal'}</b>${w.m} min</div></div>`;
const back='<button class="pb" data-a="back">← Back</button>';
const pace=w=>!w.km?null:w.n==='Running'?['Pace',(w.m/w.km).toFixed(1)+' min/km']:w.n==='Cycling'?['Speed',(w.km/w.m*60).toFixed(1)+' km/h']:w.n==='Swimming'?['Pace',(w.m/(w.km*10)).toFixed(1)+' min/100 m']:null;
const ic=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I={wt:ic('<path d="M12 3c3.5 4.5 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.5-6.5 6-11z"/>'),fd:ic('<circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="2"/><path d="M3 3v5a1.5 1.5 0 0 0 3 0V3M4.5 3v18M21 21V3c-2 1.5-3 4-3 7v4h3"/>'),wg:ic('<circle cx="12" cy="5.5" r="2.5"/><path d="M8 8h8l3 12H5z"/>'),hr:ic('<path d="M2 12h5l2.5-6 4 12 2.5-6H22"/>'),sl:ic('<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>')};
Object.assign(I,{run:ic('<circle cx="14.5" cy="4.5" r="1.7"/><path d="M13 8l-2 5M13 8l3.5 2.5M13 8l-3.5 1.5M11 13l3 3-1 4M11 13l-3 2.5-2 3.5"/>'),swim:ic('<circle cx="16" cy="6.5" r="1.7"/><path d="M5 13l5-3.5 3.5 2.5 2.5-3M3 17c1.5-1 3-1 4.5 0s3 1 4.5 0 3-1 4.5 0 3 1 4.5 0"/>'),wts:ic('<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>'),bike:ic('<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l3.5-7h5.5l3 7M9.5 9L12 16M15 9l-1.5-2H16"/>'),yoga:ic('<circle cx="12" cy="5" r="1.8"/><path d="M12 8v5M7 10l5 1.5 5-1.5M6 19c2-4 4-6 6-6s4 2 6 6z"/>'),list:ic('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>')});
const SI={Running:I.run,Swimming:I.swim,Weights:I.wts,Cycling:I.bike,Yoga:I.yoga};
/* today cards */
const CR={act:{k:'act',n:'Activity',w:1,h:()=>{const c=calc(),g=S.goals;return `<h3>Activity</h3><div class="rings"><svg viewBox="0 0 160 160" role="img" aria-label="Activity rings">${ring(66,c.mv/g.mv,'var(--r1)')}${ring(50,c.ex/g.ex,'var(--r2)')}${ring(34,c.st/g.st,'var(--r3)')}</svg><div class="leg"><div><b style="color:var(--r1)">${c.mv}/${g.mv} kcal</b><small>Move</small></div><div><b style="color:var(--r2)">${c.ex}/${g.ex} min</b><small>Exercise</small></div><div><b style="color:var(--r3)">${fmt(c.st)}</b><small>Steps · goal ${fmt(g.st)}</small></div></div></div>`}},
wat:{k:'wt',n:'Water',h:()=>`<h3>${I.wt}Water</h3><span class="big">${(S.water/1000).toFixed(2)} L</span> <small class="mut">of ${(S.goals.wt/1000).toFixed(2)} L</small>${bar(S.water/S.goals.wt)}`},
fod:{k:'fd',n:'Food',h:()=>`<h3>${I.fd}Food</h3><span class="big">${fmt(eat())}</span> <small class="mut">of ${fmt(S.goals.fd)} kcal</small>${bar(eat()/S.goals.fd)}`},
wgt:{k:'wg',n:'Weight',h:()=>`<h3>${I.wg}Weight</h3><span class="big">${S.weight.toFixed(1)} kg</span> <small class="mut">target ${S.goals.wg}</small>`},
hrt:{k:'hr',n:'Heart rate',h:()=>`<h3>${I.hr}Resting heart rate</h3><span class="big">58 bpm</span><br><small class="mut">preview data</small>`},
slp:{k:'sl',n:'Sleep',h:()=>`<h3>${I.sl}Sleep</h3><span class="big">7 h 24 m</span><br><small class="mut">preview data</small>`},
wrk:{k:'wrk',n:'Workouts',w:1,h:()=>`<h3>Latest workouts</h3>${S.wk.slice(0,3).map(wrow).join('')||'<small class="mut">Nothing yet.</small>'}`}};
/* views */
function vToday(){const c=calc(),d=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const cards=S.cards.filter(i=>!S.hide.includes(i)).map(i=>{const r=CR[i];return `<div class="card clk${r.w?' w2':''}" data-d="${r.k}">${S.edit?`<div class="ec"><button data-a="up" data-v="${i}">↑</button><button data-a="dn" data-v="${i}">↓</button><button data-a="hide" data-v="${i}">Hide</button></div>`:''}${r.h()}</div>`}).join('');
const hid=S.edit&&S.hide.length?`<p class="sub" style="margin-top:16px">Hidden: ${S.hide.map(i=>`<button class="pb" data-a="show" data-v="${i}">+ ${CR[i].n}</button>`).join(' ')}</p>`:'';
return `<div class="hd"><div><h1>Today</h1><p class="sub">${d} · ${Math.round(c.mv/S.goals.mv*100)}% of your move goal</p></div><button class="pb" data-a="edit">${S.edit?'Done':'Customise'}</button></div><div class="grid">${cards}</div>${hid}`}
function vTrain(){return `<h1>Training</h1><p class="sub">Pick a discipline to log sessions and see suggestions</p><p style="text-align:center;margin:0 0 18px"><button class="pb go" data-a="logmenu" aria-haspopup="true">+ Log workout</button></p><div class="grid">${Object.entries(SP).map(([n,sp])=>{const m=S.wk.filter(w=>w.n===n).reduce((a,w)=>a+w.m,0);return `<div class="card clk" data-d="sp:${n}"><h3>${SI[n]}${n}</h3><span class="big">${m} min</span> <small class="mut">/ ${sp.t} this week</small>${bar(m/sp.t)}</div>`}).join('')}<div class="card w2"><h3>${I.list}All sessions</h3>${S.wk.map(wrow).join('')||'<small class="mut">Nothing logged yet.</small>'}</div></div>`}
function vTrend(){return `<h1>Trends</h1><p class="sub">Last 7 days · tap a chart for details</p><div class="grid">${['wg','st','fd','wt'].map(k=>{const m=M[k],s=ser(k),g=S.goals[m.g];return `<div class="card clk" data-d="${k}"><h3>${I[k]||''}${m.t}</h3><span class="big">${m.f(s[6])}</span> <small class="mut">${m.u} today · avg ${m.f(avg(s))}</small>${bars(s,g,k==='wg'?Math.min(...s,g)-1:0,90)}</div>`}).join('')}</div>`}
function vProf(){return `<h1>Profile</h1><p class="sub">Your name and daily goals</p><div class="grid"><div class="card"><h3>You</h3><label class="gi">Name <input data-n="name" value="${S.name}" style="width:160px"></label></div><div class="card"><h3>Daily goals</h3>${Object.keys(GL).map(goalIn).join('')}</div></div>`}
function dAct(){const c=calc(),g=S.goals;return `${back}<h1>Activity</h1><p class="sub">Today’s rings and goals</p><div class="grid"><div class="card"><h3>Move</h3><span class="big">${c.mv}</span> kcal${bar(c.mv/g.mv)}${goalIn('mv')}</div><div class="card"><h3>Exercise</h3><span class="big">${c.ex}</span> min${bar(c.ex/g.ex)}${goalIn('ex')}</div><div class="card"><h3>Steps</h3><span class="big">${fmt(c.st)}</span>${bar(c.st/g.st)}${goalIn('st')}</div><div class="card w2"><h3>Today’s workouts</h3>${c.t.map(wrow).join('')||'<small class="mut">No workouts yet.</small>'}</div></div>`}
function dMet(k){const m=M[k],s=ser(k),cur=s[6],gl=m.g?S.goals[m.g]:null,lo=m.lo?Math.min(...s,gl)-1:0;let log;
if(k==='wt')log=`<h3>Log water</h3><div class="btns">${[150,250,500,-250].map(n=>`<button class="pb" data-a="water" data-v="${n}">${n>0?'+':'−'}${Math.abs(n)} ml</button>`).join('')}</div>`;
else if(k==='fd')log=`<h3>Log a meal</h3><div class="btns">${[['Breakfast',450],['Lunch',650],['Snack',200],['Dinner',700]].map(([n,v])=>`<button class="pb" data-a="qm" data-n="${n}" data-v="${v}">${n} ${v}</button>`).join('')}</div><div class="gi"><input id="mn" placeholder="Meal" style="width:140px"><input id="mk" type="number" placeholder="kcal"><button class="pb go" data-a="meal">Add</button></div>${S.meals.map((x,i)=>`<div class="row"><div class="t"><b>${x.n}</b></div><div class="v">${x.k} kcal</div><button class="pb" data-a="rm" data-v="${i}">✕</button></div>`).join('')}`;
else if(k==='wg')log=`<h3>Log weight</h3><div class="gi"><input id="wv" type="number" step="0.1" value="${S.weight}"> kg <button class="pb go" data-a="wgt">Save</button></div>`;
else if(k==='st')log=`<h3>Steps</h3><p class="sub" style="margin:0 0 10px">Estimated from your workouts (preview). Add a walk to adjust.</p><button class="pb go" data-a="walk">Add a walk (+1,000)</button>`;
else log=`<p class="sub" style="margin:0">Preview data. Connect a watch to see real readings.</p>`;
const extra=k==='wg'?`<small class="mut">${Math.abs(cur-gl).toFixed(1)} kg ${cur>gl?'above':'below'} target</small>`:'';
return `${back}<h1>${m.t}</h1><p class="sub">${m.f(cur)} ${m.u} today</p><div class="grid"><div class="card"><h3>Today</h3><span class="big">${m.f(cur)}</span> <small class="mut">${m.u}</small>${gl&&k!=='wg'?bar(cur/gl):''}${extra}${m.g?goalIn(m.g):''}</div><div class="card"><h3>7 days</h3><div class="row"><div class="t">Average</div><div class="v">${m.f(avg(s))}</div></div><div class="row"><div class="t">Highest</div><div class="v">${m.f(Math.max(...s))}</div></div><div class="row"><div class="t">Lowest</div><div class="v">${m.f(Math.min(...s))}</div></div></div><div class="card w2">${bars(s,gl,lo,150,m.f)}</div><div class="card w2">${log}</div></div>`}
function dSp(n){const sp=SP[n],ws=S.wk.filter(w=>w.n===n),m=ws.reduce((a,w)=>a+w.m,0);
return `${back}<h1>${n}</h1><p class="sub">${ws.length} session${ws.length===1?'':'s'} · ${m} of ${sp.t} min this week</p><div class="grid"><div class="card"><h3>This week</h3><span class="big">${m} min</span>${bar(m/sp.t)}<small class="mut">Weekly target ${sp.t} min</small></div><div class="card"><h3>Log a session</h3><label class="gi"><input id="lm" type="number" value="30" min="1"> min</label>${sp.d?'<label class="gi"><input id="lk" type="number" step="0.1" placeholder="0"> km</label>':''}<button class="pb go" data-a="logsp" data-v="${n}">Log session</button></div><div class="card w2"><h3>Suggested sessions</h3>${sp.plan.map(p=>`<div class="row"><div class="t">${p}</div></div>`).join('')}</div><div class="card w2"><h3>Sessions</h3>${ws.map(wrow).join('')||'<small class="mut">None yet.</small>'}</div></div>`}
function dW(id){const w=S.wk.find(x=>x.id===id);if(!w)return back+'<p class="sub">Session not found.</p>';const p=pace(w);
return `${back}<h1>${w.t||w.n}</h1><p class="sub">${w.d}${w.at?' · '+w.at:''} · ${w.n}</p><div class="grid"><div class="card"><h3>Duration</h3><span class="big">${w.m} min</span></div><div class="card"><h3>Energy</h3><span class="big">${w.k} kcal</span></div>${w.km?`<div class="card"><h3>Distance</h3><span class="big">${w.km} km</span></div>`:''}${p?`<div class="card"><h3>${p[0]}</h3><span class="big">${p[1]}</span></div>`:''}</div><p style="margin-top:16px"><button class="pb" data-a="rw" data-v="${w.id}">Delete session</button></p>`}
const vDet=d=>d==='act'?dAct():d.startsWith('sp:')?dSp(d.slice(3)):d.startsWith('w:')?dW(+d.slice(2)):dMet(d);
const TABS=[['today','Today'],['train','Training'],['trend','Trends']];
function render(){const sc=$('#sc'),t=sc.scrollTop;sc.innerHTML=`<div class="${S.edit&&!S.det?'edit':''}">${S.det?vDet(S.det):({today:vToday,train:vTrain,trend:vTrend,prof:vProf})[S.view]()}</div>`;sc.scrollTop=t;
$('#seg').innerHTML=TABS.map(([k,l])=>`<button data-v="${k}" class="${k===S.view?'on':''}">${l}</button>`).join('');$('#bP').classList.toggle('on',S.view==='prof')}
/* actions */
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)};
const nav=v=>{S.view=v;S.det=null;S.edit=false;save();render();$('#sc').scrollTop=0};
const logW=t=>{S.wk.unshift(mk(t,30,SP[t].r*30,0));save();render();toast(t+' · 30 min logged')};
function act(a,v,el){const c=S.cards;
if(a==='logmenu'){openMenu(el,sports(),{center:true});return}
if(a==='back'){if(S.det.startsWith('w:')){const w=S.wk.find(x=>x.id===+S.det.slice(2));S.det=w?'sp:'+w.n:null}else S.det=null;render();$('#sc').scrollTop=0;return}
if(a==='edit')S.edit=!S.edit;
else if(a==='hide')S.hide.push(v);else if(a==='show')S.hide=S.hide.filter(i=>i!==v);
else if(a==='up'||a==='dn'){const d=a==='up'?-1:1;let i=c.indexOf(v),j=i+d;while(c[j]&&S.hide.includes(c[j]))j+=d;if(c[j]){c[i]=c[j];c[j]=v}}
else if(a==='water')S.water=Math.max(0,S.water+(+v));
else if(a==='qm')S.meals.push({n:el.dataset.n,k:+v});
else if(a==='meal'){const k=+$('#mk').value;if(k>0)S.meals.push({n:$('#mn').value.trim()||'Meal',k});else{toast('Enter calories');return}}
else if(a==='rm')S.meals.splice(+v,1);
else if(a==='wgt'){const x=+$('#wv').value;if(x>20&&x<400){S.weight=x;toast('Weight saved')}else{toast('Enter a valid weight');return}}
else if(a==='walk')S.bonus+=1000;
else if(a==='logsp'){const m=+$('#lm').value,km=$('#lk')?+$('#lk').value||0:0;if(m>0){S.wk.unshift(mk(v,m,Math.round(SP[v].r*m),km));toast('Session logged')}else{toast('Enter minutes');return}}
else if(a==='rw'){const w=S.wk.find(x=>x.id===+v);S.wk=S.wk.filter(x=>x.id!==+v);S.det=w?'sp:'+w.n:null}
save();render()}
$('#sc').addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a){e.stopPropagation();act(a.dataset.a,a.dataset.v,a);return}
const d=e.target.closest('[data-d]');if(d&&!S.edit){const k=d.dataset.d;if(k==='wrk')nav('train');else{S.det=k;render();$('#sc').scrollTop=0}}});
$('#sc').addEventListener('change',e=>{const g=e.target.dataset.g;if(g){S.goals[g]=Math.max(1,+e.target.value||S.goals[g]);save();render()}else if(e.target.dataset.n==='name'){S.name=e.target.value.trim()||'You';save()}});
$('#seg').onclick=e=>{const v=e.target.dataset.v;if(v)nav(v)};
$('#bP').onclick=()=>nav('prof');
/* theme */
const mq=matchMedia('(prefers-color-scheme: dark)');
const applyTheme=()=>document.documentElement.setAttribute('data-theme',S.theme==='system'?(mq.matches?'dark':'light'):S.theme);
if(mq.addEventListener)mq.addEventListener('change',applyTheme);
const theme=t=>{S.theme=t;save();applyTheme()};
/* window manager */
const dsz=()=>[desk.clientWidth,desk.clientHeight];
let R=ld('rect',null);
const defRect=()=>{const[w,h]=dsz(),ww=Math.min(1100,w-48),hh=Math.min(700,h-48);return{x:(w-ww)/2,y:(h-hh)/2,w:ww,h:hh,max:false}};
function place(p){const[dw,dh]=dsz();let x=0,y=0,w=dw,h=dh;
if(!R.max){R.w=Math.max(Math.min(360,dw),Math.min(R.w,dw));R.h=Math.max(Math.min(300,dh),Math.min(R.h,dh));R.x=Math.max(0,Math.min(R.x,dw-R.w));R.y=Math.max(0,Math.min(R.y,dh-R.h));x=R.x;y=R.y;w=R.w;h=R.h}
Object.assign(win.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});win.classList.toggle('max',!!R.max);$('#hud').textContent=`${Math.round(w)}×${Math.round(h)}, ${Math.round(x)}, ${Math.round(y)}`;if(p!==false)sv('rect',R)}
const rectOf=()=>({x:R.x,y:R.y,w:R.w,h:R.h});
const toggleMax=()=>{if(!R.max){R.pr=rectOf();R.max=true}else R.max=false;place()};
const setR=o=>{R=Object.assign({},R,o,{max:false});place()};
const pre={Min:()=>setR({w:360,h:300}),Compact:()=>setR({w:640,h:440}),Default:()=>{R=defRect();place()},Fill:()=>{if(!R.max)R.pr=rectOf();R.max=true;place()}};
$('#pr').innerHTML=Object.keys(pre).map(k=>`<button data-p="${k}">${k}</button>`).join('');
$('#pr').onclick=e=>{const p=e.target.dataset.p;if(p){win.classList.remove('hid');pre[p]()}};
$('#chip').onclick=()=>win.classList.toggle('hid');
$('#bMin').onclick=$('#bX').onclick=()=>win.classList.add('hid');
$('#bMax').onclick=toggleMax;
let dr=null;const top=$('#top');
top.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dr={x:e.clientX,y:e.clientY,r:rectOf(),on:false};top.setPointerCapture(e.pointerId)});
top.addEventListener('pointermove',e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;if(!dr.on&&Math.hypot(dx,dy)<4)return;
if(!dr.on){dr.on=true;if(R.max){const pr=R.pr||defRect(),fx=e.clientX/dsz()[0];R=Object.assign({},R,{x:e.clientX-pr.w*fx,y:0,w:pr.w,h:pr.h,max:false});dr.r=rectOf();dr.x=e.clientX;dr.y=e.clientY;place(false);return}}
R=Object.assign({},R,{x:dr.r.x+e.clientX-dr.x,y:dr.r.y+e.clientY-dr.y});place(false)});
top.addEventListener('pointerup',()=>{if(dr&&dr.on)sv('rect',R);dr=null});
top.addEventListener('dblclick',e=>{if(!e.target.closest('button'))toggleMax()});
['n','s','e','w','ne','nw','se','sw'].forEach(d=>{const el=document.createElement('div');el.className='rz '+d;win.appendChild(el);let rs=null;
el.addEventListener('pointerdown',e=>{rs={x:e.clientX,y:e.clientY,r:rectOf()};el.setPointerCapture(e.pointerId);e.preventDefault()});
el.addEventListener('pointermove',e=>{if(!rs)return;const dx=e.clientX-rs.x,dy=e.clientY-rs.y,[dw,dh]=dsz(),mw=Math.min(360,dw),mh=Math.min(300,dh),o=rs.r;let x=o.x,y=o.y,w=o.w,h=o.h;
if(d.includes('e'))w=Math.min(Math.max(mw,o.w+dx),dw-o.x);
if(d.includes('s'))h=Math.min(Math.max(mh,o.h+dy),dh-o.y);
if(d.includes('w')){w=Math.min(Math.max(mw,o.w-dx),o.x+o.w);x=o.x+o.w-w}
if(d.includes('n')){h=Math.min(Math.max(mh,o.h-dy),o.y+o.h);y=o.y+o.h-h}
Object.assign(R,{x,y,w,h,max:false});place(false)});
const end=()=>{if(rs){rs=null;sv('rect',R)}};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)});
let wasMax=false;const fs=on=>{if(on){wasMax=R.max;document.body.classList.add('fs');R.max=true}else{document.body.classList.remove('fs');R.max=wasMax}place()};
addEventListener('resize',()=>place());
/* menus */
let menus=[];const closeMenu=()=>{menus.forEach(m=>m.remove());menus=[];document.querySelectorAll('[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'))};
function openMenu(anchor,items,o={}){closeMenu();const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');
items.forEach(it=>{if(it==='-'){m.appendChild(document.createElement('hr'));return}
if(it.header){const h=document.createElement('div');h.className='mh';h.textContent=it.header;m.appendChild(h);return}
const b=document.createElement('button');b.className='mi';b.setAttribute('role','menuitem');b.innerHTML=`<span>${it.checked?'✓ ':''}${it.label}</span><span>${it.kbd||''}</span>`;b.onclick=()=>{closeMenu();it.run()};m.appendChild(b)});
document.body.appendChild(m);const r=anchor.getBoundingClientRect(),vw=innerWidth,vh=innerHeight;m.style.maxHeight=(vh-16)+'px';const mw=m.offsetWidth,mh=m.offsetHeight;
let x=o.center?r.left+r.width/2-mw/2:r.left,y=o.up?r.top-mh-14:r.bottom+4;x=Math.max(8,Math.min(x,vw-mw-8));y=Math.max(8,Math.min(y,vh-mh-8));m.style.left=x+'px';m.style.top=y+'px';menus.push(m);anchor.setAttribute('aria-expanded','true')}
const sports=()=>Object.keys(SP).map(t=>({label:t,kbd:'30 min',run:()=>logW(t)}));
const fileItems=()=>[{header:'Log workout'},...sports(),'-',{label:'Customise Today',run:()=>{nav('today');S.edit=true;render()}}];
const viewItems=()=>[...[...TABS,['prof','Profile']].map(([k,l])=>({label:l,checked:S.view===k,run:()=>nav(k)})),'-',{header:'Appearance'},...['light','dark','system'].map(t=>({label:t[0].toUpperCase()+t.slice(1),checked:S.theme===t,run:()=>theme(t)})),'-',{label:'Full screen',kbd:'F11',run:()=>fs(true)}];
const MM={file:fileItems,view:viewItems,all:()=>[...fileItems(),'-',...viewItems()]};
document.querySelectorAll('.mb').forEach(b=>{b.onclick=e=>{e.stopPropagation();if(b.getAttribute('aria-expanded')==='true')closeMenu();else openMenu(b,MM[b.dataset.m]())};
b.onmouseenter=()=>{if(menus.length&&b.dataset.m&&b.getAttribute('aria-expanded')!=='true')openMenu(b,MM[b.dataset.m]())}});
document.addEventListener('mousedown',e=>{if(menus.length&&!e.target.closest('.menu,[aria-haspopup]'))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(menus.length)closeMenu();else if(document.body.classList.contains('fs'))fs(false)}
if(e.key==='F11'){e.preventDefault();fs(!document.body.classList.contains('fs'))}
if(menus.length&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const bs=[...document.querySelectorAll('.menus .mb')],i=bs.findIndex(b=>b.getAttribute('aria-expanded')==='true');if(i>-1){const n=bs[(i+(e.key==='ArrowRight'?1:bs.length-1))%bs.length];openMenu(n,MM[n.dataset.m]())}}});

top.addEventListener('wheel',e=>{$('#sc').scrollTop+=e.deltaY},{passive:true});
/* init */
applyTheme();render();R=R||defRect();place();
})();</script></body></html>
