<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian · Maps for Essential OS</title>
<style>
:root{--accent:#fa2d48;--bg:#f5f5f7;--panel:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--line:rgba(0,0,0,.1);--glass:rgba(255,255,255,.74);--hover:rgba(0,0,0,.06);--shadow:0 8px 30px rgba(0,0,0,.18);--mapbg:#dfe3e6;--font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--bar:40px;--pill-h:50px;--tb:44px}
html[data-theme=dark]{--bg:#1c1c1e;--panel:#2a2a2d;--ink:#f5f5f7;--ink2:#a1a1a6;--line:rgba(255,255,255,.13);--glass:rgba(38,38,42,.74);--hover:rgba(255,255,255,.1);--shadow:0 8px 30px rgba(0,0,0,.55);--mapbg:#1b1d21}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#cfd3d9;font-family:var(--font);font-size:13px;color:var(--ink);-webkit-font-smoothing:antialiased}
html[data-theme=dark] body{background:#0e0f12}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.desktop{position:fixed;inset:0 0 var(--tb) 0;overflow:hidden;background-color:#b9bfc9;background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);background-size:32px 32px}
html[data-theme=dark] .desktop{background-color:#16181d;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px)}
body.fs .desktop{bottom:0}body.fs .taskbar{display:none}
.window{position:absolute;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35),0 0 0 1px var(--line);background:var(--bg)}
.window.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;box-shadow:none}
.window.hid{display:none}
.rz{position:absolute;z-index:60}
.rz.n,.rz.s{left:10px;right:10px;height:6px;cursor:ns-resize}.rz.n{top:-2px}.rz.s{bottom:-2px}
.rz.e,.rz.w{top:10px;bottom:10px;width:6px;cursor:ew-resize}.rz.e{right:-2px}.rz.w{left:-2px}
.rz.ne,.rz.nw,.rz.se,.rz.sw{width:14px;height:14px}
.rz.ne{top:-2px;right:-2px;cursor:nesw-resize}.rz.nw{top:-2px;left:-2px;cursor:nwse-resize}.rz.se{bottom:-2px;right:-2px;cursor:nwse-resize}.rz.sw{bottom:-2px;left:-2px;cursor:nesw-resize}
.window.max .rz{display:none}
.taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);border-top:1px solid var(--line);z-index:900;overflow-x:auto}
.tchip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:var(--hover);white-space:nowrap}
.tchip.on{box-shadow:inset 0 -2px 0 var(--accent)}
.tchip .ic{color:var(--accent)}
.thud{margin-left:auto;font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--ink2);white-space:nowrap}
.tpre{display:flex;gap:4px}
.tpre button{padding:5px 10px;border-radius:7px;background:var(--hover);font-size:12px}
.tpre button:hover{background:var(--accent);color:#fff}
.app{position:absolute;inset:0;container:app/inline-size;background:var(--bg);color:var(--ink);overflow:hidden}
.map{position:absolute;inset:0;background:var(--mapbg);touch-action:none;cursor:grab;user-select:none}
.map.drag{cursor:grabbing}.map.tool{cursor:crosshair}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.topfade{position:absolute;top:0;left:0;right:0;height:64px;background:linear-gradient(var(--bg),transparent);opacity:.88;pointer-events:none;z-index:10}
.top{position:absolute;top:0;left:0;right:0;height:var(--bar);display:flex;align-items:center;padding:0 8px;z-index:20;gap:2px}
.top .grow{flex:1;align-self:stretch;cursor:default}
.mb{display:flex;gap:2px}
.mbtn,.ham{padding:5px 10px;border-radius:6px;font-size:13px}
.mbtn:hover,.mbtn.open,.ham:hover,.ham.open{background:var(--hover)}
.ham{display:none;place-items:center;padding:6px 8px}
.wc{display:flex;gap:10px;padding:0 8px 0 0}
.wc button{width:26px;height:28px;display:grid;place-items:center;color:var(--ink2);border-radius:6px;transition:color .12s}
.wc button .ic{width:17px;height:17px;stroke-width:1.5}
.wc button:hover{color:var(--ink)}.wc button.x:hover{color:var(--accent)}
.wc button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pill{position:absolute;bottom:14px;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100% - 28px);height:var(--pill-h);display:grid;grid-template-columns:auto auto auto;align-items:center;gap:8px;padding:0 8px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);z-index:30}
.pg{display:flex;align-items:center;gap:2px}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.ib:hover{background:var(--hover)}.ib.on{background:var(--accent);color:#fff}
.ib:disabled{opacity:.4;cursor:default}
.pill .sbox{width:clamp(130px,30cqw,300px);min-width:0}
.pill .sbox input{width:100%;height:34px;border-radius:17px;border:1px solid var(--line);background:var(--hover);padding:0 14px 0 34px;outline:0;min-width:0}
.pill .sbox input:focus{border-color:var(--accent);background:var(--panel)}
.pill .sbox .ic{position:absolute;left:11px;top:8px;width:17px;height:17px;color:var(--ink2);pointer-events:none}
.sres{position:absolute;bottom:calc(100% + 14px);left:50%;width:max(100%,min(360px,100cqw - 28px));max-height:min(280px,50vh);overflow:auto;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:5px;display:none;animation:upc .14s ease-out;transform:translateX(-50%)}
.sres.on{display:block}
.sres button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;line-height:1.3}
.sres button:hover,.sres button.sel{background:var(--accent);color:#fff}
.sres small{display:block;color:var(--ink2);font-size:11px}.sres button:hover small{color:#ffe}
.sres .none{padding:10px;color:var(--ink2)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes upc{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.menu{position:fixed;min-width:210px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:var(--shadow);z-index:1000;overflow:auto;animation:up .12s ease-out}
.mi{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:6px;cursor:default;white-space:nowrap}
.mi .ck{width:16px;display:grid;place-items:center}.mi .ck .ic{width:14px;height:14px}
.mi .lb{flex:1}.mi .kb{color:var(--ink2);font-size:11.5px;margin-left:18px}.mi .ar .ic{width:13px;height:13px}
.mi:hover,.mi.hl{background:var(--accent);color:#fff}.mi:hover .kb,.mi.hl .kb{color:#ffe}
.mi.dis{opacity:.4;pointer-events:none}
.msep{height:1px;background:var(--line);margin:5px 4px}
.mhead{padding:5px 10px;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.toast{position:absolute;left:50%;bottom:calc(var(--pill-h) + 30px);transform:translate(-50%,8px);background:rgba(30,30,32,.92);color:#fff;padding:8px 14px;border-radius:18px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100% - 28px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<style>
.chips{position:absolute;left:14px;bottom:calc(var(--pill-h) + 28px);display:flex;flex-direction:column;gap:6px;align-items:flex-start;z-index:12;pointer-events:none}
.chip{background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-size:11.5px;font-variant-numeric:tabular-nums;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.sbar{display:flex;align-items:flex-end;gap:7px}
.sbar i{display:block;height:7px;border:2px solid var(--ink);border-top:0;min-width:8px}
.attr{position:absolute;right:8px;bottom:2px;max-width:70%;font-size:10px;line-height:12px;color:var(--ink2);text-align:right;z-index:12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.hint{position:absolute;left:50%;top:48px;transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:6px;max-width:calc(100% - 20px);background:var(--glass);backdrop-filter:blur(24px) saturate(1.7);border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 14px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.hint[hidden]{display:none}
.hint b{font-size:14px}.hint span{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hint button{padding:5px 10px;border-radius:14px;background:var(--hover);font-size:12px;white-space:nowrap}
.hint button:hover{background:var(--accent);color:#fff}
.sheet{position:absolute;right:14px;top:52px;bottom:calc(var(--pill-h) + 28px);width:min(360px,100% - 28px);background:var(--glass);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:40;display:none;flex-direction:column;overflow:hidden;animation:up .16s ease-out}
.sheet.open{display:flex}
.sh-head{display:flex;align-items:center;gap:6px;padding:10px 8px 6px 16px}
.sh-head h2{flex:1;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-body{flex:1;overflow:auto;padding:4px 16px 16px;--pad:16px}
.sec h3,.sh-body h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:16px 0 6px;font-weight:600}
.sh-body p.sm,.sm{font-size:11.5px;color:var(--ink2);line-height:1.45}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .v{color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.row.pick{cursor:pointer;padding:7px 8px;margin:0 -8px;border-radius:8px;border-bottom:0}.row.pick:hover{background:var(--hover)}
.rad{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink2);flex:none}
.row.pick.on .rad{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.tg{width:34px;height:20px;border-radius:10px;background:var(--hover);border:1px solid var(--line);position:relative;flex:none;transition:.15s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:.15s}
.tg.on{background:var(--accent);border-color:var(--accent)}.tg.on::after{left:16px}
.seg{display:flex;background:var(--hover);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;padding:5px 8px;border-radius:7px;font-size:12px;white-space:nowrap}
.seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.btn{padding:7px 12px;border-radius:9px;background:var(--hover);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--line)}.btn.pri{background:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fld{width:100%;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 10px;outline:0}
.fld:focus{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.big{font-size:34px;font-weight:300;line-height:1}
.h1{font-size:17px;font-weight:650;line-height:1.25;padding-top:6px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--hover);color:var(--ink2);margin-top:4px}
.wx{display:flex;align-items:center;gap:14px;margin-top:6px}
.fc{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px;text-align:center;font-size:11.5px}
.fc div{background:var(--hover);border-radius:8px;padding:6px 2px}
.fc b{display:block;font-size:15px}
.wiki{font-size:12.5px;line-height:1.5;margin-top:4px}
.sk{height:12px;border-radius:6px;background:var(--hover);margin:8px 0;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.4}}
.bar{height:8px;border-radius:4px;background:var(--hover);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--accent);width:0}
.reg{padding:10px 0;border-bottom:1px solid var(--line)}.reg b{font-size:13px}
.warn{color:#c2410c;font-size:12px;margin-top:6px}html[data-theme=dark] .warn{color:#fb923c}
.ok{color:#15803d}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#printout{display:none}
@media print{body>*:not(#printout){display:none!important}#printout{display:block}#printout img{display:block}}
@container app (max-width:980px){.sheet{width:min(340px,100% - 28px)}.attr{max-width:55%}}
@container app (max-width:700px){.sec{display:none}}
@container app (max-width:560px){.mb{display:none}.ham{display:grid}.sheet{left:14px;right:14px;width:auto}}
@container app (max-width:520px){.top{padding:0 4px}#coordChip{display:none}.pill{gap:4px;padding:0 6px}.pill .sbox{width:clamp(110px,34cqw,220px)}.sh-body{--pad:12px}.attr{max-width:48%}}
@container app (max-width:420px){.pill{grid-template-columns:auto auto}.zoomb,.pgr{display:none}.hint span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>

<symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></symbol>

<symbol id="i-area" viewBox="0 0 24 24"><path d="M5 6l13-2 2 11-9 5-6-4z"/></symbol>

<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
</defs></svg>
<div class="desktop">
 <div class="window" id="win">
  <div class="app" id="app">
   <div class="map" id="map"><canvas id="cv"></canvas></div>
   <div class="topfade"></div>
   <div class="top" id="top">
    <button class="ham" id="ham" aria-haspopup="true" aria-expanded="false" title="Menu"><svg class="ic"><use href="#i-menu"/></svg></button>
    <nav class="mb" id="mb">
     <button class="mbtn" data-m="file" aria-haspopup="true" aria-expanded="false">File</button>
     <button class="mbtn" data-m="map" aria-haspopup="true" aria-expanded="false">Map</button>
     <button class="mbtn" data-m="tools" aria-haspopup="true" aria-expanded="false">Tools</button>
     <button class="mbtn" data-m="view" aria-haspopup="true" aria-expanded="false">View</button>
     <button class="mbtn" data-m="data" aria-haspopup="true" aria-expanded="false">Data</button>
    </nav>
    <div class="grow"></div>
    <div class="wc">
     <button id="wMin" title="Minimise" aria-label="Minimise"><svg class="ic"><use href="#i-chd"/></svg></button>
     <button id="wMax" title="Maximise" aria-label="Maximise"><svg class="ic"><use href="#i-chu"/></svg></button>
     <button id="wX" class="x" title="Close to taskbar" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
   </div>
   <div class="hint" id="hint" hidden></div>
   <div class="chips"><div class="chip" id="scaleChip"><div class="sbar"><i id="sbi"></i><span id="sbt"></span></div></div><div class="chip" id="coordChip"></div></div>
   <div class="attr" id="attr"></div>
   <aside class="sheet" id="sheet" aria-label="Panel"><div class="sh-head"><h2 id="shTitle"></h2><button class="ib" id="shX" title="Close"><svg class="ic"><use href="#i-x"/></svg></button></div><div class="sh-body" id="shBody"></div></aside>
   <div class="pill" id="pill">
    <div class="pg">
     <button class="ib" id="bLayers" title="Layers"><svg class="ic"><use href="#i-layers"/></svg></button>
     <button class="ib" id="bMeasure" title="Measure (M)"><svg class="ic"><use href="#i-ruler"/></svg></button>
     <button class="ib" id="bDl" title="Download for offline"><svg class="ic"><use href="#i-download"/></svg></button>
    </div>
    <div class="sbox"><svg class="ic"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search a place or type lat, lng — press Enter" autocomplete="off" spellcheck="false"><div class="sres" id="sres"></div></div>
    <div class="pg pgr">
     <button class="ib sec" id="bPrint" title="Print map"><svg class="ic"><use href="#i-print"/></svg></button>
     <button class="ib sec" id="bLoc" title="My location"><svg class="ic"><use href="#i-locate"/></svg></button>
     <button class="ib zoomb" id="bZo" title="Zoom out"><svg class="ic"><use href="#i-minus"/></svg></button>
     <button class="ib zoomb" id="bZi" title="Zoom in"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>
   </div>
   <div class="toast" id="toast" role="status"></div>
  </div>
  <i class="rz n" data-d="n"></i><i class="rz s" data-d="s"></i><i class="rz e" data-d="e"></i><i class="rz w" data-d="w"></i>
  <i class="rz ne" data-d="ne"></i><i class="rz nw" data-d="nw"></i><i class="rz se" data-d="se"></i><i class="rz sw" data-d="sw"></i>
 </div>
</div>

function gcInterp(a,b,n){
  const p1=rad(a[1]),l1=rad(a[0]),p2=rad(b[1]),l2=rad(b[0]);
  const d=2*Math.asin(Math.min(1,Math.sqrt(Math.sin((p2-p1)/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin((l2-l1)/2)**2)));
  if(d<1e-9||n<2)return [a,b];
  const out=[];
  for(let i=0;i<=n;i++){const f=i/n,A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d);
    const x=A*Math.cos(p1)*Math.cos(l1)+B*Math.cos(p2)*Math.cos(l2),y=A*Math.cos(p1)*Math.sin(l1)+B*Math.cos(p2)*Math.sin(l2),z=A*Math.sin(p1)+B*Math.sin(p2);
    out.push([deg(Math.atan2(y,x)),deg(Math.atan2(z,Math.hypot(x,y)))])}
  return out;
}

const CFG=Object.assign({base:'osm',ov:[],opacity:.85,grid:false,scale:true,unit:'km',theme:'system',ttl:7,offline:false,auto:true,custom:''},store.get('cfg',{}));
const saveCfg=()=>store.set('cfg',CFG);
const V=Object.assign({lng:36.82,lat:-1.29,z:11},store.get('view',{}));
V.W=800;V.H=600;V.dpr=Math.max(1,window.devicePixelRatio||1);
let PINS=store.get('pins',[]);
const M={mode:'dist',pts:[],on:false,done:false};
const F={lng:0,lat:0,on:false};          // selected place for quick facts
let lastPlace=null;                      // last searched/identified place bbox for "download this place"
function bases(){const a=BASES.slice();if(CFG.custom)a.push({id:'custom',name:'Custom source',note:'your tile server',url:CFG.custom,max:19,attr:'Custom tile source',kb:20,bulk:true});return a}
const srcById=id=>bases().concat(OVERLAYS).find(s=>s.id===id);
const curBase=()=>srcById(CFG.base)||BASES[0];
const activeOv=()=>CFG.ov.map(srcById).filter(s=>s&&(s.id!=='radar'||s.url));

/* ===== projection (Web Mercator, 256 px tiles) ===== */
function worldPx(lng,lat,z){const s=TS*2**z,sin=Math.sin(rad(clamp(lat,-85.0511,85.0511)));return [(lng+180)/360*s,(0.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*s]}
function unproj(x,y,z){const s=TS*2**z;return [x/s*360-180,deg(Math.atan(Math.sinh(Math.PI-2*Math.PI*y/s)))]}
function toScreen(v,lng,lat){const c=worldPx(v.lng,v.lat,v.z);const p=worldPx(v.lng+wrap180(lng-v.lng),lat,v.z);return [p[0]-c[0]+v.W/2,p[1]-c[1]+v.H/2]}
function toLL(v,x,y){const c=worldPx(v.lng,v.lat,v.z);const r=unproj(c[0]+x-v.W/2,c[1]+y-v.H/2,v.z);return [wrap180(r[0]),r[1]]}
const minZ=()=>Math.max(1,Math.log2(V.H/TS));
const mpp=(lat,z)=>40075016.686*Math.cos(rad(lat))/(TS*2**z);

/* ===== tile engine ===== */
const bmp=new Map(),BMAX=1500,inflight=new Map(),failed=new Map(),wanted=new Set(),reval=new Set();
const tkey=(s,z,x,y)=>s.id+(s.v?'@'+s.v:'')+'/'+z+'/'+x+'/'+y;
const tileUrl=(s,z,x,y)=>s.url.replace('{s}',s.sub?s.sub[(x+y)%s.sub.length]:'').replace('{z}',z).replace('{x}',x).replace('{y}',y);
function peek(s,z,x,y){const k=tkey(s,z,x,y),b=bmp.get(k);if(b){bmp.delete(k);bmp.set(k,b)}return b}
function remember(k,b){bmp.set(k,b);if(bmp.size>BMAX){bmp.delete(bmp.keys().next().value)}}
const Q={run:0,max:8,list:[]};
function enqueue(fn){return new Promise(res=>{Q.list.push({fn,res});pump()})}
function pump(){while(Q.run<Q.max&&Q.list.length){const t=Q.list.pop();Q.run++;Promise.resolve().then(t.fn).then(t.res,()=>t.res(null)).finally(()=>{Q.run--;pump()})}}
async function netFetch(s,z,x,y,fresh){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
  try{const r=await fetch(tileUrl(s,z,x,y),{mode:'cors',cache:fresh?'reload':'default',signal:ctl.signal});
    if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
    const b=await r.blob();if(!b.size)throw new Error('empty');return b}
  finally{clearTimeout(to)}
}
function imgFallback(url){return new Promise(res=>{const i=new Image();i.onload=()=>{i._tainted=true;res(i)};i.onerror=()=>res(null);i.src=url})}
async function revalidate(s,z,x,y,k){
  if(reval.has(k))return;reval.add(k);
  try{const blob=await netFetch(s,z,x,y,true);await idbPut('tiles',k,{blob,t:Date.now()});remember(k,await createImageBitmap(blob));scheduleDraw()}catch(e){}
  reval.delete(k);
}
function request(s,z,x,y,view){
  const k=tkey(s,z,x,y);
  if(inflight.has(k))return inflight.get(k);
  if(bmp.has(k))return null;
  const f=failed.get(k);if(f&&Date.now()-f<30000)return null;
  const p=enqueue(async()=>{
    if(view&&!wanted.has(k))return null;
    let b=null;
    const rec=s.nocache?null:await idbGet('tiles',k);
    if(rec&&rec.blob){
      try{b=await createImageBitmap(rec.blob)}catch(e){}
      if(b&&!CFG.offline&&CFG.ttl>0&&Date.now()-rec.t>CFG.ttl*864e5&&navigator.onLine!==false)revalidate(s,z,x,y,k);
    }
    if(!b&&!CFG.offline){
      try{const blob=await netFetch(s,z,x,y,false);if(!s.nocache)idbPut('tiles',k,{blob,t:Date.now()});b=await createImageBitmap(blob)}
      catch(e){b=await imgFallback(tileUrl(s,z,x,y))}
    }
    if(b)remember(k,b);else failed.set(k,Date.now());
    if(s.id===CFG.base&&view!==false)tileHealth(!!b);
    return b;
  }).then(b=>{inflight.delete(k);if(b)scheduleDraw();return b});
  inflight.set(k,p);return p;
}
function layerTiles(s,v){
  const tz=clamp(Math.floor(v.z+1e-6),0,s.max),sc=2**(v.z-tz),c=worldPx(v.lng,v.lat,tz),n=2**tz;
  const x0=c[0]-v.W/2/sc,y0=c[1]-v.H/2/sc,out=[];
  const ty0=Math.max(0,Math.floor(y0/TS)),ty1=Math.min(n-1,Math.floor((y0+v.H/sc)/TS)),tx0=Math.floor(x0/TS),tx1=Math.floor((x0+v.W/sc)/TS);
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++)out.push({z:tz,x:((tx%n)+n)%n,y:ty,sx:(tx*TS-x0)*sc,sy:(ty*TS-y0)*sc,s:TS*sc});
  return out;
}
function drawLayer(c,v,s,alpha,live){
  c.globalAlpha=alpha;
  for(const t of layerTiles(s,v)){
    const k=tkey(s,t.z,t.x,t.y);if(live)wanted.add(k);
    const b=peek(s,t.z,t.x,t.y);
    if(b){c.drawImage(b,t.sx,t.sy,t.s+.5,t.s+.5)}
    else{
      for(let q=1;q<=4&&t.z-q>=0;q++){const pb=peek(s,t.z-q,t.x>>q,t.y>>q);
        if(pb){const ps=TS>>q;c.drawImage(pb,(t.x-((t.x>>q)<<q))*ps,(t.y-((t.y>>q)<<q))*ps,ps,ps,t.sx,t.sy,t.s+.5,t.s+.5);break}}
      if(live)request(s,t.z,t.x,t.y,true);
    }
  }
  c.globalAlpha=1;
}
/* ===== built-in outline map + tile health ===== */
const HEALTH={ok:0,fail:0,bad:false,dismissed:false,auto:false};
function healthReset(){HEALTH.ok=0;HEALTH.fail=0;HEALTH.bad=false;HEALTH.dismissed=false;if(typeof updateHint==='function')updateHint()}
function tileHealth(good){
  if(good){HEALTH.ok++;if(HEALTH.bad){HEALTH.bad=false;updateHint();scheduleDraw()}return}
  if(CFG.offline)return;HEALTH.fail++;
  if(!HEALTH.ok&&HEALTH.fail>=6&&!HEALTH.bad){
    HEALTH.bad=true;
    if(CFG.base==='osm'&&!HEALTH.auto){ // OSM refuses requests without a Referer (file:// pages send none) -> fall back to CARTO Light
      HEALTH.auto=true;CFG.base='light';healthReset();scheduleDraw();if(panel)renderSheet();
      toast('OpenStreetMap tiles were refused for this page, so Meridian switched to Light. Serve the file over http(s) to use Standard.',5200);
    }else{updateHint();scheduleDraw()}
  }
}
function drawFallback(c,v,dark,live){
  if(v.z>9.5&&live)return;
  const sc=TS*2**v.z,ppd=sc/360,cy=worldPx(v.lng,v.lat,v.z)[1],H2=v.H/2,W2=v.W/2;
  const yOf=lat=>{const s=Math.sin(rad(clamp(lat,-85.0511,85.0511)));return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*sc-cy+H2};
  const sea=dark?'#15181d':'#cfe1ec',land=dark?'#2a2d34':'#ece8dc',edge=dark?'#3b3f48':'#b9b4a4';
  c.fillStyle=sea;c.fillRect(0,0,v.W,v.H);
  const lo=Math.floor((v.lng-W2/ppd+180)/360),hi=Math.floor((v.lng+W2/ppd+180)/360);
  c.save();c.lineJoin='round';c.lineWidth=1;c.strokeStyle=edge;
  const trace=(poly,k)=>{c.beginPath();for(let i=0;i<poly.length;i++){const x=W2+(poly[i][0]+k*360-v.lng)*ppd,y=yOf(poly[i][1]);i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath()};
  for(let k=lo;k<=hi;k++){
    c.fillStyle=land;for(const p of LAND){trace(p,k);c.fill();c.stroke()}
    c.fillStyle=sea;for(const p of INLAND_SEAS){trace(p,k);c.fill();c.stroke()}
  }
  c.restore();
}
function drawCities(c,v,dark){
  c.save();c.font='600 11px '+getComputedStyle(document.body).fontFamily;c.textBaseline='middle';
  const placed=[];
  for(const [n,lng,lat,mz] of CITIES){
    if(v.z<mz-1.4)continue;const p=toScreen(v,lng,lat);if(p[0]<-40||p[0]>v.W+40||p[1]<-10||p[1]>v.H+10)continue;
    const w=c.measureText(n).width;if(placed.some(r=>Math.abs(r[0]-p[0])<(w+r[2])/2+8&&Math.abs(r[1]-p[1])<14))continue;placed.push([p[0],p[1],w]);
    c.fillStyle=dark?'#e8e8ea':'#3a3a3c';c.beginPath();c.arc(p[0],p[1],2.6,0,7);c.fill();
    c.lineWidth=3;c.strokeStyle=dark?'rgba(21,24,29,.85)':'rgba(236,232,220,.9)';c.strokeText(n,p[0]+6,p[1]);c.fillStyle=dark?'#e8e8ea':'#2a2a2c';c.fillText(n,p[0]+6,p[1]);
  }
  c.restore();
}
function chip(c,text,x,y,o={}){
  c.save();c.font='600 12px '+getComputedStyle(document.body).fontFamily;const w=c.measureText(text).width+14,h=20;
  const px=x-w/2,py=y-h/2;c.fillStyle=o.bg||'rgba(255,255,255,.95)';c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=1;
  c.beginPath();c.roundRect(px,py,w,h,10);c.fill();c.stroke();c.fillStyle=o.fg||'#1d1d1f';c.textAlign='center';c.textBaseline='middle';c.fillText(text,x,y+.5);c.restore();
}
function drawGrid(c,v){
  const ppd=TS*2**v.z/360;let step=90;
  for(const st of [90,45,30,15,10,5,2,1,.5,.25,.1,.05,.02,.01,.005,.002,.001])if(st*ppd>=110)step=st;
  c.save();c.strokeStyle='rgba(20,20,20,.45)';c.fillStyle='#222';c.lineWidth=1;c.setLineDash([4,4]);c.font='10px '+getComputedStyle(document.body).fontFamily;
  const lw=v.lng-v.W/2/ppd,le=v.lng+v.W/2/ppd;
  for(let l=Math.ceil(lw/step)*step;l<=le;l+=step){const x=v.W/2+(l-v.lng)*ppd;c.beginPath();c.moveTo(x,0);c.lineTo(x,v.H);c.stroke();c.setLineDash([]);c.lineWidth=3;c.strokeStyle='rgba(255,255,255,.8)';const t=wrap180(l).toFixed(step<1?3:0)+'°';c.strokeText(t,x+3,v.H-6);c.fillText(t,x+3,v.H-6);c.lineWidth=1;c.strokeStyle='rgba(20,20,20,.45)';c.setLineDash([4,4])}
  const top=toLL(v,0,0)[1],bot=toLL(v,0,v.H)[1];
  for(let l=Math.ceil(bot/step)*step;l<=top;l+=step){const y=toScreen(v,v.lng,l)[1];c.beginPath();c.moveTo(0,y);c.lineTo(v.W,y);c.stroke();c.setLineDash([]);c.lineWidth=3;c.strokeStyle='rgba(255,255,255,.8)';const t=l.toFixed(step<1?3:0)+'°';c.strokeText(t,4,y-3);c.fillText(t,4,y-3);c.lineWidth=1;c.strokeStyle='rgba(20,20,20,.45)';c.setLineDash([4,4])}
  c.restore();
}
function drawScene(c,v,live){
  const b=curBase();c.fillStyle=b.bg||getComputedStyle(document.documentElement).getPropertyValue('--mapbg')||'#ddd';
  if(!live)c.fillStyle=b.bg||'#dfe3e6';
  c.fillRect(0,0,v.W,v.H);
  drawFallback(c,v,b.id==='dark',live);
  drawLayer(c,v,b,1,live);
  for(const s of activeOv())drawLayer(c,v,s,CFG.opacity,live);
  if(CFG.grid)drawGrid(c,v);
  if(live&&HEALTH.bad)drawCities(c,v,b.id==='dark');
}
function pinShape(c,x,y,col,r){c.save();c.fillStyle=col;c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(x,y-r*1.6,r,Math.PI*.8,Math.PI*.2,false);c.lineTo(x,y);c.closePath();c.fill();c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(x,y-r*1.6,r*.38,0,7);c.fill();c.restore()}
function measureTotals(){
  const p=M.pts;let d=0;for(let i=1;i<p.length;i++)d+=hav(p[i-1],p[i]);
  const closed=M.mode==='area'&&p.length>=3;let per=d;if(closed)per+=hav(p[p.length-1],p[0]);
  return {d,per,area:closed?polyArea(p):0};
}
function drawMeasure(c,v){
  const p=M.pts;if(!p.length)return;
  const path=()=>{c.beginPath();let first=true;
    const seg=(a,b)=>{const n=clamp(Math.ceil(hav(a,b)/150000),1,80),pts=gcInterp(a,b,n);for(const q of pts){const s=toScreen(v,q[0],q[1]);if(first){c.moveTo(s[0],s[1]);first=false}else c.lineTo(s[0],s[1])}};
    for(let i=1;i<p.length;i++)seg(p[i-1],p[i]);
    if(M.mode==='area'&&p.length>=3)seg(p[p.length-1],p[0])};
  c.save();c.lineJoin='round';c.lineCap='round';
  if(M.mode==='area'&&p.length>=3){path();c.fillStyle='rgba(250,45,72,.16)';c.fill()}
  path();c.lineWidth=6;c.strokeStyle='rgba(255,255,255,.9)';c.stroke();c.lineWidth=3;c.strokeStyle='#fa2d48';c.stroke();
  p.forEach((q,i)=>{const s=toScreen(v,q[0],q[1]);c.beginPath();c.arc(s[0],s[1],5,0,7);c.fillStyle=i===0?'#fff':'#fa2d48';c.strokeStyle=i===0?'#fa2d48':'#fff';c.lineWidth=2.5;c.fill();c.stroke()});
  c.restore();
  if(M.mode==='dist'){for(let i=1;i<p.length;i++){const a=toScreen(v,p[i-1][0],p[i-1][1]),b=toScreen(v,p[i][0],p[i][1]);if(Math.hypot(a[0]-b[0],a[1]-b[1])>70)chip(c,fmtDist(hav(p[i-1],p[i]),CFG.unit),(a[0]+b[0])/2,(a[1]+b[1])/2-14)}}
  const t=measureTotals(),l=toScreen(v,p[p.length-1][0],p[p.length-1][1]);
  if(p.length>1||M.mode==='area'&&p.length>=3)chip(c,M.mode==='area'&&p.length>=3?fmtArea(t.area,CFG.unit):'Σ '+fmtDist(t.d,CFG.unit),l[0],l[1]-26,{bg:'#fa2d48',fg:'#fff'});
}
function drawVectors(c,v,live){
  for(const p of PINS){const s=toScreen(v,p.lng,p.lat);if(s[0]>-20&&s[0]<v.W+20&&s[1]>-30&&s[1]<v.H+20)pinShape(c,s[0],s[1],'#fa2d48',9)}
  drawMeasure(c,v);
  if(live&&F.on){const s=toScreen(v,F.lng,F.lat);c.save();c.strokeStyle='#fff';c.lineWidth=5;c.beginPath();c.arc(s[0],s[1],9,0,7);c.stroke();c.strokeStyle='#007aff';c.lineWidth=2.5;c.stroke();c.fillStyle='#007aff';c.beginPath();c.arc(s[0],s[1],3,0,7);c.fill();c.restore()}
}

/* ===== main canvas ===== */
const cv=$('#cv'),cx=cv.getContext('2d');
let dirty=false;
function scheduleDraw(){if(dirty)return;dirty=true;requestAnimationFrame(draw)}
let overlayHook=null;                 // extra screen-space drawing (print frame, box select)
function draw(){
  dirty=false;
  cx.setTransform(V.dpr,0,0,V.dpr,0,0);wanted.clear();
  drawScene(cx,V,true);drawVectors(cx,V,true);
  if(overlayHook)overlayHook(cx);
  updateChips();
}
function resizeMap(){
  const m=$('#map'),w=m.clientWidth,h=m.clientHeight;if(!w||!h)return;
  V.W=w;V.H=h;V.dpr=Math.max(1,window.devicePixelRatio||1);cv.width=Math.round(w*V.dpr);cv.height=Math.round(h*V.dpr);
  V.z=Math.max(V.z,minZ());scheduleDraw();
}
function setView(lng,lat,z,save=true){
  V.z=clamp(z,minZ(),22);V.lng=wrap180(lng);V.lat=clamp(lat,-85,85);scheduleDraw();
  if(save){clearTimeout(setView.t);setView.t=setTimeout(()=>store.set('view',{lng:V.lng,lat:V.lat,z:V.z}),300)}
}
function zoomAt(sx,sy,nz){
  nz=clamp(nz,minZ(),22);const ll=toLL(V,sx,sy),pt=worldPx(ll[0],ll[1],nz);
  const c=unproj(pt[0]-(sx-V.W/2),pt[1]-(sy-V.H/2),nz);setView(c[0],c[1],nz);
}
let anim=0;
function flyTo(lng,lat,z,ms=600){
  cancelAnimationFrame(anim);z=clamp(z,minZ(),22);
  const a=worldPx(V.lng,V.lat,0),b=worldPx(lng,lat,0),z0=V.z,t0=performance.now();
  const step=t=>{const f=clamp((t-t0)/ms,0,1),e=f<.5?2*f*f:1-2*(1-f)**2;
    const p=unproj(a[0]+(b[0]-a[0])*e,a[1]+(b[1]-a[1])*e,0);setView(p[0],p[1],z0+(z-z0)*e);if(f<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
}
function fitBox(bb,pad=50,animate=true){ // bb=[w,s,e,n]
  const a=worldPx(bb[0],bb[3],0),b=worldPx(bb[2],bb[1],0);
  const dx=Math.max(1e-6,b[0]-a[0]),dy=Math.max(1e-6,b[1]-a[1]);
  const z=Math.min(Math.log2((V.W-2*pad)/dx),Math.log2((V.H-2*pad)/dy),19);
  const c=unproj((a[0]+b[0])/2,(a[1]+b[1])/2,0);
  animate?flyTo(c[0],c[1],z):setView(c[0],c[1],z);
}
function viewBox(){const a=toLL(V,0,0),b=toLL(V,V.W,V.H);const wide=V.W/(TS*2**V.z)>=1;return wide?[-180,b[1],180,a[1]]:[a[0],b[1],b[0],a[1]]}
function niceScale(meters,u){
  let unit=1000,name='km';
  if(u==='mi'){unit=1609.344;name='mi';if(meters<unit){unit=0.3048;name='ft'}}
  else if(u==='nm'){unit=1852;name='nm';if(meters<unit){unit=1;name='m'}}
  else if(meters<1000){unit=1;name='m'}
  const n=meters/unit,p=10**Math.floor(Math.log10(n)),f=n/p,m=f>=5?5:f>=2?2:1;
  return {m:m*p*unit,label:(m*p)+' '+name};
}
let cursorLL=null;
function updateChips(){
  const sc=$('#scaleChip');sc.style.display=CFG.scale?'':'none';
  if(CFG.scale){const s=niceScale(mpp(V.lat,V.z)*110,CFG.unit);$('#sbi').style.width=Math.max(8,s.m/mpp(V.lat,V.z))+'px';$('#sbt').textContent=s.label}
  const ll=cursorLL||[V.lng,V.lat];$('#coordChip').textContent=fmtLL(ll[0],ll[1],4)+' · z'+V.z.toFixed(1);
  const at=new Set([curBase().attr,...activeOv().map(s=>s.attr)]);$('#attr').textContent=[...at].join(' · ');
  $('#attr').title=$('#attr').textContent;
}

/* ===== sheet + panels: layers, settings, measure, quick facts ===== */
const sheet=$('#sheet');let panel=null;
const TITLES={facts:'Quick facts',layers:'Layers',measure:'Measure',download:'Offline maps',print:'Print map',settings:'Settings'};
function openSheet(p){panel=p;sheet.classList.add('open');$('#shTitle').textContent=TITLES[p];renderSheet();syncUI();if(p==='settings')refreshStats()}
function closeSheet(){panel=null;sheet.classList.remove('open');syncUI()}
function renderSheet(){if(!panel)return;const b=$('#shBody'),st=b.scrollTop;b.innerHTML=PANELS[panel]();b.scrollTop=st;if(panel==='print')scheduleDraw()}
function syncUI(){
  $('#bLayers').classList.toggle('on',panel==='layers');$('#bDl').classList.toggle('on',panel==='download');$('#bPrint').classList.toggle('on',panel==='print');
  $('#bMeasure').classList.toggle('on',M.on);
  document.body.dataset.panel=panel||'';scheduleDraw();
}
const seg=(act,cur,items)=>`<div class="seg">${items.map(([v,l])=>`<button data-act="${act}" data-v="${v}" class="${String(cur)===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
const tg=(act,on,label,sub,id)=>`<div class="row pick" data-act="${act}"${id?` data-id="${id}"`:''}><div class="grow">${label}${sub?`<div class="sm">${sub}</div>`:''}</div><i class="tg ${on?'on':''}"></i></div>`;

/* --- layers --- */
function pLayers(){
  return `<h3>Base map</h3>`+bases().map(b=>`<div class="row pick ${CFG.base===b.id?'on':''}" data-act="base" data-id="${b.id}"><i class="rad"></i><div class="grow">${esc(b.name)}<div class="sm">${esc(b.note)}</div></div></div>`).join('')
  +`<h3>Overlays</h3>`+OVERLAYS.map(o=>tg('ov',CFG.ov.includes(o.id),esc(o.name),esc(o.note),o.id)).join('')
  +`<div class="row"><div class="grow">Overlay opacity</div><div class="v">${Math.round(CFG.opacity*100)}%</div></div><input type="range" min="20" max="100" value="${Math.round(CFG.opacity*100)}" data-k="opacity" aria-label="Overlay opacity">`
  +`<h3>Display</h3>`+tg('grid',CFG.grid,'Graticule','Lat/lng lines with labels')+tg('scale',CFG.scale,'Scale bar')
  +`<h3>Custom tile source</h3><input class="fld" id="customUrl" placeholder="http://localhost:8080/{z}/{x}/{y}.png" value="${esc(CFG.custom)}" spellcheck="false">
   <div class="btns"><button class="btn pri" data-act="custom">Apply</button>${CFG.custom?'<button class="btn" data-act="customClear">Remove</button>':''}</div>
   <p class="sm" style="margin-top:8px">Raster XYZ template. A self-hosted server (tileserver-gl, Martin, nginx on static tiles) has no download cap in Offline maps, unlike the public servers.</p>`;
}
async function loadRadar(){
  try{
    const d=await jget('https://api.rainviewer.com/public/weather-maps.json');
    const f=(d.radar&&d.radar.past||[]).slice(-1)[0];if(!f)throw 0;
    RADAR.v=f.path.replace(/\W/g,'');RADAR.url=(d.host||'https://tilecache.rainviewer.com')+f.path+'/256/{z}/{x}/{y}/2/1_1.png';
    scheduleDraw();
  }catch(e){CFG.ov=CFG.ov.filter(i=>i!=='radar');saveCfg();toast('Rain radar is unavailable right now');renderSheet();scheduleDraw()}
}

/* --- settings --- */
let cacheStat=null;
function pSettings(){
  return `<h3>Appearance</h3>${seg('theme',CFG.theme,[['system','System'],['light','Light'],['dark','Dark']])}
  <h3>Distance units</h3>${seg('unit',CFG.unit,[['km','Metric'],['mi','Imperial'],['nm','Nautical']])}

async function refreshStats(){cacheStat=await idbStats();if(panel==='settings')renderSheet()}

/* --- measure --- */
function measureText(){
  const t=measureTotals(),p=M.pts;
  if(M.mode==='area')return p.length>=3?`<b>${fmtArea(t.area,CFG.unit)}</b>`:`<b>Area</b>`;
  return `<b>${fmtDist(t.d,CFG.unit)}</b>`;
}
function updateHint(){
  const h=$('#hint');
  const mode=boxMode?'box':M.on?'measure':(HEALTH.bad&&!HEALTH.dismissed&&!CFG.offline)?'net':null;
  if(!mode){h.hidden=true;return}
  h.hidden=false;
  if(mode==='net'){h.innerHTML=`<span style="color:var(--ink)">Map tiles aren’t loading — showing the built-in outline</span>${CFG.base!=='light'?'<button data-act="netfix">Try Light</button>':''}<button data-act="netinfo">Why?</button><button data-act="netx" aria-label="Dismiss">✕</button>`;return}
  if(mode==='box'){h.innerHTML=`<span>Drag a box over the area to download</span><button data-act="boxCancel">Cancel</button>`;return}
  const p=M.pts.length,t=measureTotals();
  const msg=p===0?'Click to place the first point':M.mode==='area'?(p<3?'Add at least 3 points':`${fmtDist(t.per,CFG.unit)} perimeter`):`${p} points`;
  h.innerHTML=`${measureText()}<span>${msg} · double-click to finish</span><button data-act="mundo">Undo</button><button data-act="mdone">Done</button><button data-act="mexit" aria-label="Exit">✕</button>`;
}
function pMeasure(){
  const t=measureTotals(),p=M.pts;
  let h=`<div style="margin-top:8px">${seg('mmode',M.mode,[['dist','Distance'],['area','Area']])}</div><h3>Result</h3>`;
  if(M.mode==='dist'){
    h+=`<div class="row"><div class="grow">Total distance</div><div class="v"><b>${fmtDist(t.d,CFG.unit)}</b></div></div>`;
    h+=`<div class="row"><div class="grow">Points</div><div class="v">${p.length}</div></div>`;
    if(p.length>1)h+=`<div class="row"><div class="grow">Initial bearing (last leg)</div><div class="v">${bearing(p[p.length-2],p[p.length-1]).toFixed(1)}°</div></div>`;
    if(p.length>1)h+=`<div class="row"><div class="grow">Straight line, first → last</div><div class="v">${fmtDist(hav(p[0],p[p.length-1]),CFG.unit)}</div></div>`;
  }else{
    h+=`<div class="row"><div class="grow">Area</div><div class="v"><b>${p.length>=3?fmtArea(t.area,CFG.unit):'—'}</b></div></div>`;
    h+=`<div class="row"><div class="grow">Perimeter</div><div class="v">${p.length>=3?fmtDist(t.per,CFG.unit):'—'}</div></div>`;
    h+=`<div class="row"><div class="grow">Vertices</div><div class="v">${p.length}</div></div>`;
  }
  if(p.length){h+=`<h3>Points</h3>`+p.map((q,i)=>`<div class="row"><div class="grow">${i+1}. <span class="sm">${fmtLL(q[0],q[1],4)}</span></div><div class="v">${i?fmtDist(hav(p[i-1],q),CFG.unit):'start'}</div></div>`).join('')}
  h+=`<div class="btns">${M.on?'<button class="btn pri" data-act="mdone">Finish</button>':'<button class="btn pri" data-act="mstart">'+(p.length?'Resume':'Start measuring')+'</button>'}<button class="btn" data-act="mundo">Undo</button><button class="btn" data-act="mclear">Clear</button><button class="btn" data-act="mcopy">${ic('copy')}Copy</button><button class="btn" data-act="mgeo">GeoJSON</button></div>`;
  h+=`<h3>Units</h3>${seg('unit',CFG.unit,[['km','Metric'],['mi','Imperial'],['nm','Nautical']])}<p class="sm" style="margin-top:10px">Great-circle distances on a sphere (R = 6371 km); accurate to about 0.3% — fine for planning, not for surveying.</p>`;
  return h;
}

/* --- quick facts --- */
const FACT={tok:0,rev:undefined,wx:undefined,wiki:undefined,near:undefined,off:false,hint:''};
async function jget(url,ms=10000){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms);try{const r=await fetch(url,{signal:ctl.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
const WX={0:['Clear sky','☀️'],1:['Mostly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Fog','🌫️'],48:['Rime fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌧️'],56:['Freezing drizzle','🌧️'],57:['Freezing drizzle','🌧️'],61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],66:['Freezing rain','🌧️'],67:['Freezing rain','🌧️'],71:['Light snow','🌨️'],73:['Snow','❄️'],75:['Heavy snow','❄️'],77:['Snow grains','❄️'],80:['Rain showers','🌦️'],81:['Rain showers','🌧️'],82:['Violent showers','⛈️'],85:['Snow showers','🌨️'],86:['Snow showers','🌨️'],95:['Thunderstorm','⛈️'],96:['Thunderstorm, hail','⛈️'],99:['Thunderstorm, hail','⛈️']};
const wxo=c=>WX[c]||['—','·'];
const compass=d=>['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8];
function showFacts(lng,lat){
  F.lng=lng;F.lat=lat;F.on=true;const tok=++FACT.tok;
  Object.assign(FACT,{rev:undefined,wx:undefined,wiki:undefined,near:undefined,off:false});
  openSheet('facts');
  if(CFG.offline){FACT.rev=FACT.wx=FACT.wiki=FACT.near=null;FACT.off=true;renderSheet();return}
  const ok=()=>FACT.tok===tok&&F.on;
  const upd=(k,v)=>{if(ok()){FACT[k]=v;if(panel==='facts')renderSheet()}};
  jget(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat.toFixed(6)}&lon=${lng.toFixed(6)}&zoom=18&addressdetails=1&extratags=1`)
    .then(d=>{upd('rev',d&&!d.error?d:null);const wp=d&&d.extratags&&d.extratags.wikipedia;if(wp)loadWiki(wp,tok)}).catch(()=>upd('rev',null));
  jget(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=5`)
    .then(d=>upd('wx',d&&d.current?d:null)).catch(()=>upd('wx',null));
  jget(`https://en.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${lat}%7C${lng}&gsradius=1500&gslimit=4&format=json&origin=*`)
    .then(d=>upd('near',(d.query&&d.query.geosearch)||[])).catch(()=>upd('near',null));
}
function loadWiki(tag,tok){
  const i=tag.indexOf(':'),lang=i>0?tag.slice(0,i):'en',title=i>0?tag.slice(i+1):tag;
  jget(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g,'_'))}`)
    .then(d=>{if(FACT.tok===tok){FACT.wiki=d&&d.extract?{t:d.title,x:d.extract,u:d.content_urls&&d.content_urls.desktop&&d.content_urls.desktop.page}:null;if(panel==='facts')renderSheet()}}).catch(()=>{});
}
function pFacts(){
  const r=FACT.rev,w=FACT.wx,a=(r&&r.address)||{},ex=(r&&r.extratags)||{};
  const title=r?(r.name||a.road||a.suburb||a.neighbourhood||a.village||a.town||a.city||a.county||a.state||a.country||'Selected point'):FACT.rev===undefined?'Looking up…':'Selected point';
  let h=`<div class="h1">${esc(title)}</div>`;
  if(r&&(r.addresstype||r.type))h+=`<span class="tag">${esc(String(r.addresstype||r.type).replace(/_/g,' '))}</span>`;
  if(r&&r.display_name)h+=`<p class="sm" style="margin-top:8px">${esc(r.display_name)}</p>`;
  else if(FACT.rev===undefined)h+='<div class="sk"></div><div class="sk" style="width:60%"></div>';
  h+=`<h3>Position</h3><div class="row"><div class="grow">${fmtLL(F.lng,F.lat)}</div><button class="ib" data-act="fcopy" title="Copy coordinates">${ic('copy')}</button></div>
  <div class="row"><div class="grow sm">${dms(F.lat,'N','S')}, ${dms(F.lng,'E','W')}</div></div>`;
  if(w)h+=`<div class="row"><div class="grow">Elevation</div><div class="v">${Math.round(w.elevation)} m</div></div>
  <div class="row"><div class="grow">Local time</div><div class="v">${new Date(Date.now()+(w.utc_offset_seconds||0)*1000).toISOString().slice(11,16)} · ${esc((w.timezone||'').replace(/_/g,' '))}</div></div>`;
  else if(ex.ele)h+=`<div class="row"><div class="grow">Elevation</div><div class="v">${esc(ex.ele)} m</div></div>`;
  if(ex.population)h+=`<div class="row"><div class="grow">Population</div><div class="v">${numFmt(+ex.population)||esc(ex.population)}</div></div>`;
  if(ex.opening_hours)h+=`<div class="row"><div class="grow">Hours</div><div class="v">${esc(ex.opening_hours)}</div></div>`;
  const web=ex.website||ex['contact:website'];if(web&&/^https?:\/\//.test(web))h+=`<div class="row"><div class="grow">Website</div><div class="v"><a href="${esc(web)}" target="_blank" rel="noopener" style="color:var(--accent)">open</a></div></div>`;
  h+='<h3>Weather now</h3>';
  if(FACT.off)h+='<p class="sm">Offline mode is on — facts need the network.</p>';
  else if(w===undefined)h+='<div class="sk"></div><div class="sk" style="width:70%"></div>';
  else if(!w)h+='<p class="sm">Weather is unavailable (offline, or the service is busy).</p>';
  else{
    const c=w.current,d=w.daily,[wt,wg]=wxo(c.weather_code);
    h+=`<div class="wx"><div class="big">${Math.round(c.temperature_2m)}°</div><div><div>${wg} ${wt}</div><div class="sm">Feels ${Math.round(c.apparent_temperature)}° · humidity ${c.relative_humidity_2m}%</div><div class="sm">Wind ${Math.round(c.wind_speed_10m)} km/h ${compass(c.wind_direction_10m)} · ${Math.round(c.surface_pressure)} hPa</div></div></div>`;
    h+=`<div class="fc">${d.time.map((t,i)=>`<div>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(t+'T12:00:00Z').getUTCDay()]}<b>${wxo(d.weather_code[i])[1]}</b>${Math.round(d.temperature_2m_max[i])}° <span class="sm">${Math.round(d.temperature_2m_min[i])}°</span></div>`).join('')}</div>`;
    h+=`<p class="sm" style="margin-top:8px">Sunrise ${String(d.sunrise[0]).slice(11,16)} · Sunset ${String(d.sunset[0]).slice(11,16)} · UV max ${d.uv_index_max[0]}</p>`;
  }
  if(FACT.wiki)h+=`<h3>From Wikipedia</h3><div class="wiki"><b>${esc(FACT.wiki.t)}</b><br>${esc(FACT.wiki.x)}${FACT.wiki.u?` <a href="${esc(FACT.wiki.u)}" target="_blank" rel="noopener" style="color:var(--accent)">Read more</a>`:''}</div>`;
  if(FACT.near&&FACT.near.length)h+=`<h3>Nearby on Wikipedia</h3>`+FACT.near.map(n=>`<div class="row"><div class="grow"><a href="https://en.wikipedia.org/wiki/${encodeURIComponent(String(n.title).replace(/ /g,'_'))}" target="_blank" rel="noopener" style="color:inherit">${esc(n.title)}</a></div><div class="v">${fmtDist(n.dist,CFG.unit)}</div></div>`).join('');
  h+=`<div class="btns"><button class="btn" data-act="fpin">${ic('pin')}Drop pin</button><button class="btn" data-act="fmeasure">${ic('ruler')}Measure from here</button><button class="btn" data-act="fdl">${ic('download')}Download area</button><button class="btn" data-act="fprint">${ic('print')}Print</button></div>`;
  return h;
}

/* ===== offline downloads: regions, estimate, job runner, scheduler ===== */
const CAP=2500;                       // tiles per job on public servers (OSM-style usage policy)
const D=Object.assign({scope:'view',box:null,inc:false,zmin:0,zmax:12,name:'',every:7,place:null},store.get('dl',{}));
let boxMode=false,BOXDRAG=null,JOB=null,REG=[];
const GLOBE=[-180,-85.0511,180,85.0511];
function dlBBox(){
  if(D.scope==='view')return viewBox();
  if(D.scope==='box')return D.box;
  if(D.scope==='place')return lastPlace?lastPlace.bbox:null;
  return GLOBE;
}
const tY=(lat,n)=>{const s=Math.sin(rad(clamp(lat,-85.0511,85.0511)));return Math.floor((0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n)};
function tileRange(bb,z){
  const n=2**z,x0=clamp(Math.floor((bb[0]+180)/360*n),0,n-1),x1=clamp(Math.ceil((bb[2]+180)/360*n)-1,x0,n-1),y0=clamp(tY(bb[3],n),0,n-1),y1=clamp(tY(bb[1],n),y0,n-1);
  return {x0,x1,y0,y1,n:(x1-x0+1)*(y1-y0+1)};
}
function dlSources(){return [curBase(),...(D.inc?activeOv().filter(s=>s.id!=='radar'):[])]}
function estimate(srcs,bb,zmin,zmax){
  let tiles=0,bytes=0;
  for(const s of srcs)for(let z=zmin;z<=Math.min(zmax,s.max);z++){const n=tileRange(bb,z).n;tiles+=n;bytes+=n*s.kb*1024}
  return {tiles,bytes,capped:srcs.some(s=>!s.bulk)&&tiles>CAP};
}
const zdesc=z=>z<=3?'continents':z<=6?'countries':z<=9?'regions & cities':z<=12?'towns & main roads':z<=15?'streets':z<=17?'buildings & paths':'finest detail';
function estText(){
  const bb=dlBBox();if(!bb)return {html:'Choose an area first.',bad:true};
  const e=estimate(dlSources(),bb,D.zmin,D.zmax);
  let t=`<b>${numFmt(e.tiles)}</b> tiles · about <b>${bytesFmt(e.bytes)}</b>`;
  if(e.capped)return {html:t+`<div class="warn">Over the ${numFmt(CAP)}-tile limit for public tile servers (their policy forbids bulk downloads). Reduce the area or max zoom, or use a custom source you host.</div>`,bad:true,e};
  return {html:t,bad:false,e};
}
const bbText=bb=>bb?`${bb[1].toFixed(3)}, ${bb[0].toFixed(3)} → ${bb[3].toFixed(3)}, ${bb[2].toFixed(3)}`:'';
function pDownload(){
  if(JOB)return pJob();
  const bb=dlBBox(),est=estText(),base=curBase();
  let h=`<p class="sm" style="margin-top:6px">Save map tiles on this device so the map works without a connection — from the whole globe down to a single town.</p>
  <h3>Area</h3>${seg('dscope',D.scope,[['view','This view'],['box','Draw box'],['place','Place'],['globe','Globe']])}`;
  h+=`<p class="sm" style="margin-top:8px">${D.scope==='view'?'The area currently on screen.':D.scope==='globe'?'The entire world (pair with a low max zoom).':D.scope==='place'?(lastPlace?`Bounds of “${esc(lastPlace.name)}”.`:'Search for a place first, then pick it here.'):(D.box?'Your box.':'Drag a box on the map.')}${bb?`<br>${bbText(bb)}`:''}</p>`;
  if(D.scope==='box')h+=`<div class="btns"><button class="btn" data-act="boxStart">${ic('box')}${D.box?'Redraw box':'Draw box'}</button></div>`;
  h+=`<h3>Detail</h3><div class="row"><div class="grow">Min zoom</div><div class="v" id="zminV">${D.zmin}</div></div><input type="range" min="0" max="19" value="${D.zmin}" data-k="zmin" aria-label="Minimum zoom">
  <div class="row"><div class="grow">Max zoom</div><div class="v" id="zmaxV">${D.zmax} · ${zdesc(D.zmax)}</div></div><input type="range" min="0" max="19" value="${D.zmax}" data-k="zmax" aria-label="Maximum zoom">
  <p class="sm" style="margin-top:6px">z5 ≈ countries · z10 ≈ towns · z14 ≈ streets · z17 ≈ buildings</p>
  <h3>Source</h3><div class="row"><div class="grow">${esc(base.name)}<div class="sm">${esc(base.note)} — change in Layers</div></div></div>`;
  if(activeOv().filter(s=>s.id!=='radar').length)h+=tg('dinc',D.inc,'Include active overlays');
  h+=`<h3>Keep fresh</h3><select class="fld" data-k="every">${[[0,'Never auto-update'],[1,'Daily'],[7,'Weekly'],[30,'Monthly']].map(([v,l])=>`<option value="${v}"${+D.every===v?' selected':''}>${l}</option>`).join('')}</select>
  <h3>Name</h3><input class="fld" data-k="name" placeholder="e.g. Nairobi city" value="${esc(D.name)}">
  <div class="row" style="margin-top:10px;border:0"><div class="grow" id="dlEst">${est.html}</div></div>
  <div class="btns"><button class="btn pri" data-act="dlStart" id="dlGo" ${est.bad||CFG.offline?'disabled':''}>${ic('download')}Download</button></div>${CFG.offline?'<p class="warn">Offline mode is on.</p>':''}`;
  h+=`<h3>Saved regions (${REG.length})</h3>`;
  h+=REG.length?REG.map(r=>`<div class="reg"><b>${esc(r.name)}</b><div class="sm">${esc(r.srcs.map(s=>s.name).join(' + '))} · z${r.zmin}–${r.zmax} · ${numFmt(r.tiles)} tiles · ${bytesFmt(r.bytes)}</div><div class="sm">Updated ${dateFmt(r.at)}${r.every?` · next ${dateFmt(r.next)}`:' · manual updates'}</div><div class="btns" style="margin-top:6px"><button class="btn" data-act="rgo" data-id="${r.id}">Go to</button><button class="btn" data-act="rupd" data-id="${r.id}">${ic('refresh')}Update</button><button class="btn" data-act="rdel" data-id="${r.id}">${ic('trash')}Delete</button></div></div>`).join(''):'<p class="sm">Nothing saved yet.</p>';
  return h;
}
function pJob(){
  const j=JOB;
  return `<h3>${j.upd?'Updating':'Downloading'} “${esc(j.r.name)}”</h3><div class="bar"><i id="jbar" style="width:${j.total?Math.round(j.done/j.total*100):0}%"></i></div><div class="sm" id="jtxt">${jobText(j)}</div>
  <div class="btns"><button class="btn" data-act="jpause">${j.paused?'Resume':'Pause'}</button><button class="btn" data-act="jcancel">Cancel</button></div>

function countTotal(r){let n=0;for(const s of r.srcs)for(let z=r.zmin;z<=Math.min(r.zmax,s.max);z++)n+=tileRange(r.bbox,z).n;return n}

}

const menus=[];let subT=0;
function closeMenu(depth=0){while(menus.length>depth){const m=menus.pop();m.el.remove();const a=m.anchor;if(a&&a.setAttribute&&a.getAttribute('aria-haspopup')){a.classList.remove('open');a.setAttribute('aria-expanded','false')}}}
function openMenu(anchor,items,o={},depth=0){
  closeMenu(depth);
  const el=document.createElement('div');el.className='menu';el.setAttribute('role','menu');
  items.forEach(it=>{
    if(it==='-'){const s=document.createElement('div');s.className='msep';el.appendChild(s);return}
    if(it.header){const h=document.createElement('div');h.className='mhead';h.textContent=it.header;el.appendChild(h);return}
    const b=document.createElement('div');b.className='mi'+(it.disabled?' dis':'');b.setAttribute('role','menuitem');
    b.innerHTML=`<span class="ck">${it.checked?ic('check'):''}</span><span class="lb">${esc(it.label)}</span>${it.kbd?`<span class="kb">${esc(it.kbd)}</span>`:''}${it.sub?`<span class="ar">${ic('chev')}</span>`:''}`;
    if(it.sub){
      const open=()=>openMenu(b,it.sub,{},depth+1);
      b.addEventListener('mouseenter',()=>{clearTimeout(subT);subT=setTimeout(open,80)});
      b.addEventListener('click',e=>{e.stopPropagation();clearTimeout(subT);open()});
    }else{
      b.addEventListener('mouseenter',()=>{clearTimeout(subT);closeMenu(depth+1)});
      b.addEventListener('click',e=>{e.stopPropagation();if(it.disabled)return;closeMenu(0);it.run&&it.run()});
    }
    el.appendChild(b);
  });
  document.body.appendChild(el);
  const vw=innerWidth,vh=innerHeight,gap=o.gap==null?4:o.gap;
  const r=anchor.getBoundingClientRect?anchor.getBoundingClientRect():{left:anchor.x,right:anchor.x,top:anchor.y,bottom:anchor.y,width:0,height:0};
  const sub=depth>0;
  el.style.maxHeight=Math.max(120,(o.up&&!sub?r.top-gap:vh-(sub?0:r.bottom)-gap)-8)+'px';
  const mw=el.offsetWidth,mh=el.offsetHeight;let x,y;
  if(sub){x=r.right+2;if(x+mw>vw-6)x=r.left-mw-2;y=r.top-5}
  else if(o.up){y=r.top-gap-mh;x=o.center?r.left+r.width/2-mw/2:o.right?r.right-mw:r.left}
  else{y=r.bottom+gap;x=o.right?r.right-mw:o.center?r.left+r.width/2-mw/2:r.left}
  x=clamp(x,6,Math.max(6,vw-mw-6));y=clamp(y,6,Math.max(6,vh-mh-6));
  el.style.left=x+'px';el.style.top=y+'px';
  menus.push({el,anchor,items});
  if(anchor.setAttribute&&anchor.getAttribute('aria-haspopup')){anchor.classList.add('open');anchor.setAttribute('aria-expanded','true')}
  return el;
}

function menuKey(e){
  const last=menus[menus.length-1],items=$$('.mi:not(.dis)',last.el),cur=items.findIndex(i=>i.classList.contains('hl'));
  const hl=i=>{items.forEach(x=>x.classList.remove('hl'));if(items[i]){items[i].classList.add('hl');items[i].scrollIntoView({block:'nearest'})}};
  const tops=$$('.mbtn').filter(b=>getComputedStyle(b).display!=='none'),ti=tops.indexOf(menus[0].anchor);

/* ===== search ===== */
let SR=[],srSel=-1;
const resEl=$('#sres');
const hideRes=()=>{resEl.classList.remove('on');srSel=-1};
const showRes=h=>{resEl.innerHTML=h;resEl.classList.add('on')};
async function search(q){
  q=q.trim();if(!q)return;
  const m=q.match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
  if(m){const lat=+m[1],lng=+m[2];if(Math.abs(lat)<=90&&Math.abs(lng)<=180){hideRes();flyTo(lng,lat,14);showFacts(lng,lat);return}}
  if(CFG.offline){toast('Offline mode is on — search needs the network');return}
  showRes('<div class="none">Searching…</div>');
  try{
    SR=await jget('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q='+encodeURIComponent(q));srSel=-1;
    showRes(SR.length?SR.map((r,i)=>`<button data-i="${i}">${esc(r.name||r.display_name.split(',')[0])}<small>${esc(r.display_name)}</small></button>`).join(''):'<div class="none">No places found.</div>');
  }catch(e){showRes('<div class="none">Search failed — check your connection.</div>')}
}
function pickResult(i){
  const r=SR[i];if(!r)return;const bb=(r.boundingbox||[]).map(Number);
  if(bb.length===4){lastPlace={name:r.name||r.display_name.split(',')[0],bbox:[bb[2],bb[0],bb[3],bb[1]]};D.place=lastPlace.name;fitBox(lastPlace.bbox,70)}
  else flyTo(+r.lon,+r.lat,13);
  hideRes();$('#q').value=r.name||r.display_name.split(',')[0];$('#q').blur();showFacts(+r.lon,+r.lat);
}
resEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b)pickResult(+b.dataset.i)});
$('#q').addEventListener('keydown',e=>{
  e.stopPropagation();
  const bs=$$('button',resEl);
  if(e.key==='Enter'){if(srSel>=0&&bs[srSel])pickResult(srSel);else search(e.target.value)}
  else if(e.key==='ArrowDown'&&bs.length){srSel=(srSel+1)%bs.length;bs.forEach((b,i)=>b.classList.toggle('sel',i===srSel));e.preventDefault()}
  else if(e.key==='ArrowUp'&&bs.length){srSel=(srSel-1+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('sel',i===srSel));e.preventDefault()}
  else if(e.key==='Escape'){hideRes();e.target.blur()}
});

/* ===== map interaction ===== */
const mapEl=$('#map'),ptrs=new Map();let g=null,clickT=0;
const pos=e=>{const r=mapEl.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
mapEl.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;closeMenu(0);cancelAnimationFrame(anim);
  mapEl.setPointerCapture(e.pointerId);const p=pos(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===1)g={sx:p[0],sy:p[1],lx:p[0],ly:p[1],moved:false,pinch:false};
  else if(g){g.pinch=true;g.moved=true}
  if(boxMode&&ptrs.size===1)BOXDRAG=[p,p];
});
mapEl.addEventListener('pointermove',e=>{
  const p=pos(e);cursorLL=toLL(V,p[0],p[1]);if(!ptrs.size)updateCoord();
  if(!ptrs.has(e.pointerId)||!g)return;
  const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,p);
  if(boxMode&&BOXDRAG){BOXDRAG[1]=p;scheduleDraw();return}
  if(ptrs.size>=2){
    const [a,b]=[...ptrs.values()];const pp=[...ptrs.entries()].find(([id])=>id!==e.pointerId)[1];
    const d1=Math.hypot(prev[0]-pp[0],prev[1]-pp[1]),d2=Math.hypot(p[0]-pp[0],p[1]-pp[1]);
    if(d1>0&&d2>0)zoomAt((p[0]+pp[0])/2,(p[1]+pp[1])/2,V.z+Math.log2(d2/d1));return;
  }
  if(!g.moved&&Math.hypot(p[0]-g.sx,p[1]-g.sy)<4)return;
  if(!g.moved){g.moved=true;mapEl.classList.add('drag')}
  const dx=p[0]-g.lx,dy=p[1]-g.ly;g.lx=p[0];g.ly=p[1];
  const c=worldPx(V.lng,V.lat,V.z),n=unproj(c[0]-dx,c[1]-dy,V.z);setView(n[0],n[1],V.z);
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;const p=pos(e);ptrs.delete(e.pointerId);mapEl.classList.remove('drag');
  if(boxMode&&BOXDRAG&&ptrs.size===0){
    const [a,b]=BOXDRAG;BOXDRAG=null;
    if(Math.abs(b[0]-a[0])>8&&Math.abs(b[1]-a[1])>8){
      const A=toLL(V,Math.min(a[0],b[0]),Math.min(a[1],b[1])),B=toLL(V,Math.max(a[0],b[0]),Math.max(a[1],b[1]));
      D.box=[Math.min(A[0],B[0]),Math.min(A[1],B[1]),Math.max(A[0],B[0]),Math.max(A[1],B[1])];D.scope='box';store.set('dl',D);setBoxMode(false);openSheet('download');
    }else scheduleDraw();
    g=null;return;
  }
  if(g&&!g.moved&&e.type==='pointerup'&&ptrs.size===0)onMapClick(p);
  if(!ptrs.size)g=null;
}

document.addEventListener('keydown',e=>{
  if(menus.length&&menuKey(e))return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Escape'){
    if(menus.length)closeMenu(0);
    else if(document.body.classList.contains('fs'))toggleFs();
    else if(boxMode)setBoxMode(false);
    else if(M.on)clearMeasure();
    else if(panel)closeSheet();
    else if(F.on){F.on=false;scheduleDraw()}
    return;
  }
  if(e.key==='F11'){e.preventDefault();toggleFs();return}
  if(tag==='input'||tag==='select'||tag==='textarea')return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();const q=$('#q');q.focus();q.select();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='p'){e.preventDefault();openSheet('print');return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k==='m'||k==='M'){M.on?finishMeasure():startMeasure('dist')}
  else if(k==='a'||k==='A')startMeasure('area');
  else if(k==='i'||k==='I')showFacts(V.lng,V.lat);
  else if(k==='+'||k==='=')zoomBy(1);else if(k==='-'||k==='_')zoomBy(-1);
  else if(k==='Enter'&&M.on)finishMeasure();
  else if(k==='Backspace'&&M.on){measureUndo();e.preventDefault()}
  else if(k.startsWith('Arrow')){
    const s=80,c=worldPx(V.lng,V.lat,V.z),dx=k==='ArrowLeft'?-s:k==='ArrowRight'?s:0,dy=k==='ArrowUp'?-s:k==='ArrowDown'?s:0,n=unproj(c[0]+dx,c[1]+dy,V.z);setView(n[0],n[1],V.z);e.preventDefault();
  }
});

/* ===== window manager + boot ===== */
const desk=$('.desktop'),win=$('#win');
let rect=store.get('win',null),maxed=!!store.get('max',false),prevMax=false;
const dsz=()=>[desk.clientWidth,desk.clientHeight];
const MINW=360,MINH=300;
function defRect(){const [dw,dh]=dsz(),w=Math.min(1100,dw-48),h=Math.min(700,dh-48);return {x:Math.round((dw-w)/2),y:Math.round((dh-h)/2),w,h}}
function fixRect(){const [dw,dh]=dsz();if(!rect||!(rect.w>0))rect=defRect();rect.w=clamp(rect.w,MINW,Math.max(MINW,dw));rect.h=clamp(rect.h,MINH,Math.max(MINH,dh));rect.x=clamp(rect.x,-rect.w+80,dw-80);rect.y=clamp(rect.y,0,dh-40)}
function applyWin(save){
  fixRect();win.style.left=rect.x+'px';win.style.top=rect.y+'px';win.style.width=rect.w+'px';win.style.height=rect.h+'px';
  win.classList.toggle('max',maxed);

  $('#hud').textContent=maxed?`${w} × ${h} · maximised`:`${w} × ${h} · x ${Math.round(rect.x)} · y ${Math.round(rect.y)}`;
  if(save!==false){store.set('win',rect);store.set('max',maxed)}
}
function toggleMax(){maxed=!maxed;applyWin()}
function winHide(){win.classList.add('hid');$('#tChip').classList.remove('on')}
function winShow(){win.classList.remove('hid');$('#tChip').classList.add('on');applyWin(false);resizeMap()}

    if(p==='default')rect=defRect();

/* drag by the empty bar */
let drag=null;
$('#top').addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('button,input,nav'))return;

$('#top').addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;

  if(!drag.moved){
    drag.moved=true;

      const [dw]=dsz(),f=e.clientX/dw;maxed=false;rect.x=Math.round(e.clientX-rect.w*f);rect.y=Math.max(0,Math.round(e.clientY-20));
      drag.sx=e.clientX;drag.sy=e.clientY;drag.x=rect.x;drag.y=rect.y;applyWin(false);return;
    }

  if(maxed)return;rect.x=drag.x+(e.clientX-drag.sx);rect.y=drag.y+(e.clientY-drag.sy);applyWin(false);
});
const endDrag=()=>{if(drag&&drag.moved){applyWin()}drag=null};
$('#top').addEventListener('pointerup',endDrag);$('#top').addEventListener('pointercancel',endDrag);

let rs=null;

  h.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();rs={d:h.dataset.d,sx:e.clientX,sy:e.clientY,r:{...rect}};h.setPointerCapture(e.pointerId)});
  h.addEventListener('pointermove',e=>{
    if(!rs)return;const dx=e.clientX-rs.sx,dy=e.clientY-rs.sy,d=rs.d,o=rs.r;let {x,y,w,h:hh}={x:o.x,y:o.y,w:o.w,h:o.h};
    if(d.includes('e'))w=Math.max(MINW,o.w+dx);
    if(d.includes('s'))hh=Math.max(MINH,o.h+dy);
    if(d.includes('w')){w=Math.max(MINW,o.w-dx);x=o.x+o.w-w}
    if(d.includes('n')){hh=Math.max(MINH,o.h-dy);y=Math.max(0,o.y+o.h-hh);hh=o.y+o.h-y}
    rect={x,y,w,h:hh};applyWin(false);
  });
  const end=()=>{if(rs){rs=null;applyWin()}};h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
});
