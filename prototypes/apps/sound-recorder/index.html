<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound Recorder · Essential OS</title>
<style>
:root{
  --bg:#fff;--bg2:#f4f4f6;--fg:#1d1d1f;--mut:#6e6e73;--line:rgba(0,0,0,.09);
  --glass:rgba(255,255,255,.72);--glass2:rgba(250,250,252,.88);--hover:rgba(0,0,0,.055);
  --accent:#fa2d48;--accent-soft:rgba(250,45,72,.12);
  --wall:#dde1e8;--grid:rgba(0,0,0,.05);--tb:rgba(245,245,247,.82);
  --shadow:0 8px 30px rgba(0,0,0,.14);--winshadow:0 24px 70px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.25);
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#1c1c1e;--bg2:#2a2a2d;--fg:#f5f5f7;--mut:#98989d;--line:rgba(255,255,255,.1);
  --glass:rgba(44,44,46,.72);--glass2:rgba(40,40,43,.9);--hover:rgba(255,255,255,.08);
  --accent-soft:rgba(250,45,72,.2);--wall:#0e0f12;--grid:rgba(255,255,255,.045);--tb:rgba(30,30,33,.85);
  --shadow:0 8px 30px rgba(0,0,0,.5);--winshadow:0 24px 70px rgba(0,0,0,.7),0 0 0 .5px rgba(255,255,255,.14);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  html:not([data-theme=light]){
    --bg:#1c1c1e;--bg2:#2a2a2d;--fg:#f5f5f7;--mut:#98989d;--line:rgba(255,255,255,.1);
    --glass:rgba(44,44,46,.72);--glass2:rgba(40,40,43,.9);--hover:rgba(255,255,255,.08);
    --accent-soft:rgba(250,45,72,.2);--wall:#0e0f12;--grid:rgba(255,255,255,.045);--tb:rgba(30,30,33,.85);
    --shadow:0 8px 30px rgba(0,0,0,.5);--winshadow:0 24px 70px rgba(0,0,0,.7),0 0 0 .5px rgba(255,255,255,.14);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font:13px/1.4 var(--font);color:var(--fg);background:var(--wall)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:11px var(--font);color:var(--mut)}

/* ---- desktop + window ---- */
.desktop{position:fixed;inset:0 0 44px 0;background-color:var(--wall);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;overflow:hidden}
body.fs .desktop{bottom:0}
.window{position:absolute;border-radius:12px;box-shadow:var(--winshadow);background:var(--bg)}
.window[hidden]{display:none!important}
.window.max{left:0!important;top:0!important;width:auto!important;height:auto!important;right:0;bottom:0;border-radius:0;box-shadow:none}
.window.max .app{border-radius:0}
.window.max .rz,.window.mini .rz{display:none}
.app{position:absolute;inset:0;container:app/inline-size;background:var(--bg);color:var(--fg);overflow:hidden;border-radius:12px}
.rz{position:absolute;z-index:30}
.rz.n{top:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}
.rz.s{bottom:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}
.rz.e{right:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}
.rz.w{left:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}
.rz.ne{top:-3px;right:-3px;width:14px;height:14px;cursor:nesw-resize}
.rz.nw{top:-3px;left:-3px;width:14px;height:14px;cursor:nwse-resize}
.rz.se{bottom:-3px;right:-3px;width:14px;height:14px;cursor:nwse-resize}
.rz.sw{bottom:-3px;left:-3px;width:14px;height:14px;cursor:nesw-resize}

/* ---- taskbar ---- */
.taskbar{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;
  background:var(--tb);backdrop-filter:blur(24px) saturate(1.6);border-top:.5px solid var(--line);z-index:900}
body.fs .taskbar{display:none}
.tb-chip{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;position:relative}
.tb-chip:hover{background:var(--hover)}
.tb-chip.on{background:var(--hover);box-shadow:inset 0 -2px 0 var(--accent)}
.tb-chip .rd{width:8px;height:8px;border-radius:50%;background:var(--accent);display:none;animation:pulse 1.2s infinite}
.tb-chip.rec .rd{display:block}
.tb-sp{flex:1}
.tb-hud{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);white-space:nowrap}
.tb-pre{display:flex;gap:2px;background:var(--hover);border-radius:8px;padding:2px}
.tb-pre button{height:26px;padding:0 10px;border-radius:6px;font-size:12px}
.tb-pre button:hover{background:var(--bg)}
@keyframes pulse{50%{opacity:.35}}

/* ---- chrome ---- */
.topfade{position:absolute;left:0;right:0;top:0;height:72px;z-index:3;pointer-events:none;background:linear-gradient(var(--bg) 35%,transparent)}
.botfade{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:3;pointer-events:none;background:linear-gradient(transparent,var(--bg) 75%)}
.top{position:absolute;left:0;right:0;top:0;height:40px;z-index:8;display:flex;align-items:center;gap:4px;padding:0 8px 0 10px;user-select:none}
.menubar{display:flex;gap:2px}
.mb,.burger,.wc button{height:28px;border-radius:7px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center}
.mb:hover,.mb[aria-expanded=true],.burger:hover,.burger[aria-expanded=true],.wc button:hover{background:var(--hover)}
.burger{display:none;width:32px;padding:0}
.top .sp{flex:1;align-self:stretch;min-width:12px}
.wc{display:flex;gap:10px;padding-right:4px}
.wc button{width:32px;padding:0;color:var(--mut);background:none!important}
.wc button:hover{color:var(--fg)}
.wc .cl:hover{color:var(--accent)}
.wc .ic{width:20px;height:20px;stroke-width:1.4}

/* ---- pill ---- */
.pill{position:absolute;bottom:14px;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100% - 28px);height:50px;border-radius:24px;z-index:8;
  display:grid;grid-template-columns:auto minmax(0,auto) auto;align-items:center;gap:16px;padding:0 10px 0 12px;
  background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);
  box-shadow:var(--shadow),0 0 0 .5px var(--line)}
.inp{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 8px;border-radius:18px;max-width:200px;min-width:0}
.inp:hover,.inp[aria-expanded=true]{background:var(--hover)}
.inp .ic{color:var(--mut)}
.inp .col{display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left}
.inp .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.meter{height:3px;width:96px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:2px}
.meter b{position:absolute;top:0;bottom:0;width:2px;left:0;background:var(--fg);opacity:.55}
.mid{display:flex;align-items:center;gap:12px;min-width:0}
.mid canvas{flex:0 1 220px;width:220px;min-width:40px;height:34px;display:block}
.timer{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.pill.rec .timer{color:var(--accent)}
.pill.paused .timer{animation:pulse 1s infinite}
.acts{display:flex;align-items:center;gap:6px}
.rb,.pb,.mk{border-radius:50%;display:grid;place-items:center}
.pb,.mk{width:34px;height:34px;background:var(--hover)}
.pb:hover,.mk:hover{background:var(--line)}
.rb{width:38px;height:38px;background:var(--accent);box-shadow:0 2px 8px rgba(250,45,72,.4);transition:transform .12s}
.rb:hover{transform:scale(1.06)}.rb:active{transform:scale(.95)}
.rb i{width:14px;height:14px;border-radius:50%;background:#fff;transition:border-radius .15s,width .15s,height .15s}
.pill.rec .rb i,.pill.cd .rb i{border-radius:4px;width:13px;height:13px}
.pb[hidden]{display:none}

/* ---- toast + countdown ---- */
.toast{position:absolute;left:50%;bottom:80px;transform:translate(-50%,8px);z-index:9;display:flex;align-items:center;gap:12px;
  max-width:calc(100% - 28px);padding:9px 14px;border-radius:12px;background:var(--glass2);backdrop-filter:blur(24px);
  box-shadow:var(--shadow),0 0 0 .5px var(--line);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;font-size:12.5px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:600}
.cdown{position:absolute;inset:0;z-index:7;display:none;place-items:center;pointer-events:none}
.cdown.on{display:grid}
.cdown span{font-size:120px;font-weight:700;color:var(--accent);animation:cdp 1s infinite;text-shadow:0 8px 40px var(--accent-soft)}
@keyframes cdp{from{transform:scale(1.25);opacity:0}25%{opacity:1}to{transform:scale(.9);opacity:.2}}

/* ---- menus (fixed, appended to body) ---- */
.menu{position:fixed;z-index:2000;min-width:230px;max-width:340px;overflow-y:auto;padding:5px;border-radius:12px;
  background:var(--glass2);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);
  box-shadow:0 14px 44px rgba(0,0,0,.28),0 0 0 .5px var(--line);font-size:13px;animation:mdown .12s ease-out;scrollbar-width:thin}
.menu.up{animation-name:mup}
@keyframes mdown{from{opacity:0;transform:translateY(-4px)}}
@keyframes mup{from{opacity:0;transform:translateY(6px)}}
.mi{display:flex;align-items:center;gap:8px;width:100%;min-height:28px;padding:4px 10px 4px 6px;border-radius:7px;text-align:left}
.mi:hover:not(:disabled),.mi:focus-visible{background:var(--accent);color:#fff;outline:0}
.mi:hover kbd,.mi:focus-visible kbd{color:rgba(255,255,255,.8)}
.mi .ck{width:14px;flex:none;font-size:12px;text-align:center}
.mi .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .ch{opacity:.6;font-size:11px}
.mh{padding:6px 10px 2px 26px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.msep{height:1px;margin:5px 8px;background:var(--line)}

/* ---- content ---- */
.scroll{--pad:30px;--top:40px;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;
  padding:calc(var(--top) + 14px) var(--pad) 150px}
.scroll h1{margin:0;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.scroll .sub{margin:4px 0 18px;color:var(--mut)}
.live{display:none;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px;border-radius:12px;background:var(--accent-soft)}
.live.on{display:flex}
.live .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.1s infinite}
.live.paused .dot{animation:none;opacity:.5}
.live .t{font-weight:600}
.live .m{margin-left:auto;color:var(--mut);font-size:12px}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) 120px 80px 64px 30px;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;cursor:default}
.row:hover{background:var(--hover)}
.row.sel{background:var(--hover)}
.row.pl .rname{color:var(--accent)}
.rplay{width:36px;height:36px;border-radius:50%;background:var(--bg2);display:grid;place-items:center}
.row.sel .rplay,.rplay:hover{background:var(--accent);color:#fff}
.rname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname input{width:100%;font-weight:600;padding:2px 6px;border-radius:6px;border:1px solid var(--accent);background:var(--bg);outline:0}
.rsub{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcol{color:var(--mut);font-size:12px;white-space:nowrap}
.rdur{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.rmore{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.rmore:hover{background:var(--line);color:var(--fg)}
.rexp{margin:0 0 6px;padding:6px 10px 14px 58px;border-radius:0 0 10px 10px;background:var(--hover)}
.row.sel{border-radius:10px 10px 0 0}
.row{scroll-margin:60px 0 150px}
.rexp canvas{width:100%;height:84px;display:block;cursor:pointer}
.tp{display:flex;align-items:center;gap:10px;margin-top:6px}
.tp .tc{font:12px ui-monospace,Menlo,monospace;color:var(--mut);min-width:56px}
.tp .tc:last-child{text-align:right}
.tp .tb{display:flex;align-items:center;gap:6px;margin:0 auto}
.tp .tb button{height:32px;min-width:32px;padding:0 8px;border-radius:16px;font-size:12px;color:var(--mut)}
.tp .tb button:hover{background:var(--line);color:var(--fg)}
.tp .tb .big{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;padding:0}
.tp .tb .big:hover{background:var(--accent);color:#fff;filter:brightness(1.08)}
.tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.tools button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;font-size:12px}
.tools button:hover{background:var(--line)}
.tools .del:hover{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 10px;border-radius:12px;background:var(--accent-soft);font-size:11.5px;font-variant-numeric:tabular-nums}
.chip button{width:18px;height:18px;border-radius:50%;color:var(--mut);line-height:1}
.chip button:hover{background:var(--line)}
.empty{display:grid;place-items:center;text-align:center;gap:6px;padding:70px 0;color:var(--mut)}
.empty .ic{width:56px;height:56px;stroke-width:1.2;opacity:.5}
.empty b{color:var(--fg);font-size:16px}

/* ---- window-width tiers (container queries only) ---- */
@container app (max-width:980px){
  .row{grid-template-columns:36px minmax(0,1fr) 64px 30px}
  .rcol{display:none}
}
@container app (max-width:700px){
  .mk,.inp .nm{display:none}
  .inp{padding:0 8px}
  .rexp{padding-left:10px}
}
@container app (max-width:560px){
  .menubar{display:none}
  .burger{display:inline-flex}
}
@container app (max-width:520px){
  .scroll{--pad:16px}
  .scroll h1{font-size:24px}
  .meter{display:none}
  .pill{gap:8px}
  .tools button span{display:none}
  .tools button{padding:0 9px}
  .timer{min-width:66px;font-size:14px}
}
@container app (max-width:420px){
  .inp{display:none}
  .pill{grid-template-columns:minmax(0,auto) auto}
  .tp .tb button.sk{display:none}
}

/* ---- mini mode ---- */
.window.mini .scroll,.window.mini .botfade,.window.mini .topfade,.window.mini .toast{display:none}
.window.mini .app{background:var(--bg2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="desktop" id="desktop">
 <div class="window" id="win">
  <div class="app" id="app">
   <div class="scroll" id="scroll">
    <h1>Recordings</h1>
    <p class="sub" id="sub"></p>

   </div>
   <div class="cdown" id="cdown"><span id="cdn">3</span></div>

     <button class="mb" data-menu="file" aria-haspopup="menu" aria-expanded="false">File</button>

     <button class="mb" data-menu="view" aria-haspopup="menu" aria-expanded="false">View</button>
    </nav>
    <button class="burger" id="burger" aria-haspopup="menu" aria-expanded="false" title="Menu"><svg class="ic"><use href="#i-burger"/></svg></button>
    <div class="sp"></div>

     <button id="wMin" title="Minimize"><svg class="ic"><use href="#i-min"/></svg></button>

    </div>
   </div>
   <div class="pill" id="pill">

     <svg class="ic"><use href="#i-mic"/></svg>
     <span class="col"><span class="nm" id="inpNm">Default microphone</span><span class="meter" id="meter"><i></i><b></b></span></span>
    </button>

     <button class="mk" id="mk" title="Add marker (M)"><svg class="ic"><use href="#i-flag"/></svg></button>
     <button class="pb" id="pb" title="Pause (P)" hidden><svg class="ic"><use href="#i-pause"/></svg></button>

 </div>

 <button class="tb-chip on" id="chip"><svg class="ic"><use href="#i-mic"/></svg><span>Sound Recorder</span><span class="rd"></span></button>
 <div class="tb-sp"></div>
 <span class="tb-hud" id="hud"></span>
 <div class="tb-pre" id="pre"><button data-p="min">Min</button><button data-p="compact">Compact</button><button data-p="default">Default</button><button data-p="fill">Fill</button></div>

<script>
(() => {'use strict';
/* ===== 4-a: helpers, storage, db, toast ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const NS = 'soundrecorder.';
const lsGet = (k, d) => { try { const v = localStorage.getItem(NS + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const icon = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;

function fmtT(s, tenth = true) {

  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  const t = Math.floor((s * 10) % 10);
  return m + ':' + String(sec).padStart(2, '0') + (tenth ? '.' + t : '');
}
function fmtTotal(s) {
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h} h ${m} min` : m ? `${m} min ${sec} s` : `${sec} s`;
}
function fmtBytes(b) { return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }

/* IndexedDB with in-memory fallback (works without storage) */
let dbp = null; const mem = [];
function db() {

  dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('soundrecorder', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('rec', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('blocked'));
    } catch (e) { rej(e); }
  }).catch(() => null);
  return dbp;
}
async function dbAll() {
  const d = await db(); if (!d) return mem.slice();
  return new Promise(res => {
    try { const q = d.transaction('rec').objectStore('rec').getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }
    catch (e) { res([]); }
  });
}
async function dbPut(r) {
  const i = mem.findIndex(x => x.id === r.id); i < 0 ? mem.push(r) : (mem[i] = r);
  const d = await db(); if (!d) return;
  return new Promise(res => {
    try { const t = d.transaction('rec', 'readwrite'); t.objectStore('rec').put(r); t.oncomplete = res; t.onerror = res; t.onabort = res; }
    catch (e) { res(); }
  });
}
async function dbDel(id) {
  const i = mem.findIndex(x => x.id === id); if (i >= 0) mem.splice(i, 1);
  const d = await db(); if (!d) return;
  return new Promise(res => {
    try { const t = d.transaction('rec', 'readwrite'); t.objectStore('rec').delete(id); t.oncomplete = res; t.onerror = res; t.onabort = res; }
    catch (e) { res(); }
  });
}

/* toast (optional action button) */

function toast(msg, action, ms) {
  const t = $('#toast'), a = $('#toastA');
  $('#toastT').textContent = msg;
  if (action) { a.hidden = false; a.textContent = action.label; a.onclick = () => { t.classList.remove('on'); action.run(); }; }
  else { a.hidden = true; a.onclick = null; }
  t.classList.add('on'); clearTimeout(toastTm);
  toastTm = setTimeout(() => t.classList.remove('on'), ms || (action ? 6000 : 3000));

/* ===== 5-b: settings + recording / playback engine ===== */
const FORMATS = [
  ['audio/webm;codecs=opus', 'Opus · WebM', 'webm'],
  ['audio/ogg;codecs=opus', 'Opus · Ogg', 'ogg'],
  ['audio/mp4', 'AAC · MP4', 'm4a'],
  ['audio/webm', 'WebM', 'webm']

const fmtSupported = () => FORMATS.filter(f => { try { return window.MediaRecorder && MediaRecorder.isTypeSupported(f[0]); } catch (e) { return false; } });

const S = Object.assign({
  deviceId: '', fmt: '', kbps: 128, ec: true, ns: true, agc: true, countdown: 0, limit: 0,
  sort: 'new', theme: 'match', monitor: false, mono: false, vad: false
}, lsGet('settings', {}));
const saveS = () => lsSet('settings', S);

let recs = [];            // all recordings (with blobs)
let selId = null;         // selected recording
let devices = [];         // audio inputs
const R = {               // recorder state
  st: 'idle',             // idle | countdown | rec | paused
  stream: null, mr: null, ctx: null, an: null, chunks: [], t0: 0, acc: 0, markers: [], raw: [], lastPk: 0,
  hist: [], level: 0, hold: 0, raf: 0, cdTm: 0, mime: ''

const elapsed = () => R.acc + (R.st === 'rec' ? (performance.now() - R.t0) / 1000 : 0);
const curFmt = () => {
  const sup = fmtSupported();
  return sup.find(f => f[0] === S.fmt) || sup[0] || null;
};

async function refreshDevices() {
  try {
    const all = await navigator.mediaDevices.enumerateDevices();
    devices = all.filter(d => d.kind === 'audioinput' && d.deviceId);
  } catch (e) { devices = []; }
  drawInput();
}
function inputLabel() {
  if (!S.deviceId) return 'Default microphone';
  const d = devices.find(x => x.deviceId === S.deviceId);
  return d ? (d.label || 'Microphone') : 'Default microphone';
}

async function startRec() {

  if (!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Recording is not supported in this browser'); return; }
  pausePlayback();
  if (S.countdown > 0) {
    R.st = 'countdown'; drawState();
    for (let n = S.countdown; n > 0; n--) {
      $('#cdn').textContent = n; $('#cdown').classList.add('on');
      const el = $('#cdn'); el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
      await new Promise(r => { R.cdTm = setTimeout(r, 1000); });
      if (R.st !== 'countdown') { $('#cdown').classList.remove('on'); return; }
    }
    $('#cdown').classList.remove('on');
  }
  R.st = 'countdown';

    const audio = { echoCancellation: S.ec, noiseSuppression: S.ns, autoGainControl: S.agc };
    if (S.deviceId) audio.deviceId = { exact: S.deviceId };
    R.stream = await navigator.mediaDevices.getUserMedia({ audio });
  } catch (e) {
    R.st = 'idle'; drawState();

    toast(n === 'NotAllowedError' ? 'Microphone access is blocked. Allow it in the site settings.' :
      n === 'NotFoundError' ? 'No microphone found' :
      n === 'OverconstrainedError' ? 'That input is unavailable. Using default next time.' : 'Could not open the microphone');
    if (n === 'OverconstrainedError') { S.deviceId = ''; saveS(); }

  }
  refreshDevices();

    const AC = window.AudioContext || window.webkitAudioContext;
    R.ctx = new AC(); if (R.ctx.state === 'suspended') R.ctx.resume();
    const src = R.ctx.createMediaStreamSource(R.stream);
    R.an = R.ctx.createAnalyser(); R.an.fftSize = 1024; src.connect(R.an);   // analysis only, never routed to speakers

function stopStream() {
  try { R.stream && R.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  try { R.ctx && R.ctx.close(); } catch (e) {}

function pauseRec() {

  else if (R.st === 'paused') { R.t0 = performance.now(); R.st = 'rec'; try { R.mr.resume(); } catch (e) {} }

}

  if (R.st === 'countdown') { clearTimeout(R.cdTm); R.st = 'idle'; $('#cdown').classList.remove('on'); drawState(); toast('Recording cancelled'); return; }
  if (R.st !== 'rec' && R.st !== 'paused') return;

  const blob = new Blob(R.chunks, { type: mime });

  const now = Date.now();
  const rec = { id: uid(), name: stampName(now), created: now, dur, mime, size: blob.size, blob, markers, peaks: resample(raw, 160), kbps: S.kbps };
  recs.push(rec); selId = rec.id; await dbPut(rec);

}
function addMarker() {
  if (R.st === 'rec' || R.st === 'paused') {
    R.markers.push(+elapsed().toFixed(2)); drawLive(); renderLive();
    toast('Marker added at ' + fmtT(elapsed()));
  } else {
    const r = sel(); if (!r) { toast('Select a recording or start recording to add markers'); return; }
    r.markers = (r.markers || []).concat([+(au.currentTime || 0).toFixed(2)]).sort((a, b) => a - b);
    dbPut(r); renderAll(); toast('Marker added at ' + fmtT(au.currentTime || 0));
  }
}
function toggleRec() { R.st === 'idle' ? startRec() : stopRec(); }

/* live loop: level, peaks, auto-stop */
function loop() {
  cancelAnimationFrame(R.raf);
  const buf = new Uint8Array(R.an ? R.an.fftSize : 0);
  const tick = () => {
    if (R.st !== 'rec' && R.st !== 'paused') return;

    if (R.an && R.st === 'rec') {
      R.an.getByteTimeDomainData(buf);
      for (let i = 0; i < buf.length; i++) { const v = Math.abs(buf[i] - 128) / 128; if (v > pk) pk = v; }
    }
    R.level = R.level * 0.7 + pk * 0.3;
    R.hold = Math.max(R.hold - 0.01, pk);

    if (R.st === 'rec' && now - R.lastPk > 40) { R.lastPk = now; R.hist.push(pk); R.raw.push(pk); if (R.hist.length > 400) R.hist.shift(); }
    $('#timer').textContent = fmtT(elapsed());
    $('#liveT').textContent = (R.st === 'paused' ? 'Paused ' : 'Recording ') + fmtT(elapsed());
    drawMeter(); drawLive();
    if (S.limit > 0 && elapsed() >= S.limit * 60) { toast('Auto-stop after ' + S.limit + ' min'); stopRec(); return; }
    R.raf = requestAnimationFrame(tick);
  };

}

async function importFiles(files) {
  let n = 0;
  for (const f of files) {
    if (!/^audio\//.test(f.type) && !/\.(mp3|wav|ogg|opus|m4a|flac|webm|aac)$/i.test(f.name)) continue;
    const info = await peaksFromBlob(f);
    if (!info) { toast('Could not decode ' + f.name); continue; }

  }

}

/* ---- playback ---- */
const au = new Audio(); au.preload = 'auto';
let loadedId = null, loadedUrl = '', speed = 1;
const sel = () => recs.find(r => r.id === selId) || null;
function loadRec(r) {
  if (loadedId === r.id) return;
  if (loadedUrl) URL.revokeObjectURL(loadedUrl);
  loadedUrl = URL.createObjectURL(r.blob); au.src = loadedUrl; loadedId = r.id; au.playbackRate = speed;
}
au.addEventListener('loadedmetadata', () => {   // MediaRecorder webm reports Infinity: force the real duration scan
  if (au.duration === Infinity) { au.currentTime = 1e101; au.addEventListener('timeupdate', function f() { au.removeEventListener('timeupdate', f); au.currentTime = 0; }); }
});
function togglePlay(r) {
  r = r || sel(); if (!r) return;
  if (R.st === 'rec' || R.st === 'paused') { toast('Stop recording before playing'); return; }
  if (selId !== r.id) select(r.id, true);
  loadRec(r);
  if (au.paused) { au.play().catch(() => toast('Playback failed')); } else au.pause();
}
function pausePlayback() { try { au.pause(); } catch (e) {} }
function seekTo(sec) {
  const r = sel(); if (!r) return; loadRec(r);
  au.currentTime = clamp(sec, 0, r.dur - 0.05); drawSel();
}
function posFrac() { const r = sel(); return r && loadedId === r.id && r.dur ? clamp(au.currentTime / r.dur, 0, 1) : 0; }

/* ===== 6-c: views ===== */
const C = {};
function refreshColors() {
  const cs = getComputedStyle(document.documentElement);
  ['--accent', '--mut', '--fg', '--line'].forEach(k => { C[k] = cs.getPropertyValue(k).trim() || '#888'; });
}
function fit(c) {
  const dpr = window.devicePixelRatio || 1, w = Math.max(1, Math.round(c.clientWidth * dpr)), h = Math.max(1, Math.round(c.clientHeight * dpr));
  if (c.width !== w) c.width = w; if (c.height !== h) c.height = h; return dpr;
}
const extFor = m => /mp4|aac/.test(m) ? 'm4a' : /ogg/.test(m) ? 'ogg' : /mpeg|mp3/.test(m) ? 'mp3' : /wav/.test(m) ? 'wav' : /flac/.test(m) ? 'flac' : 'webm';
const labelFor = r => {
  const m = r.mime || '';
  const base = /opus/.test(m) ? 'Opus' : /mp4|aac/.test(m) ? 'AAC' : /mpeg/.test(m) ? 'MP3' : /wav/.test(m) ? 'WAV' : /flac/.test(m) ? 'FLAC' : /webm/.test(m) ? 'WebM' : 'Audio';
  return r.kbps ? `${base} · ${r.kbps} kbps` : base + (r.imported ? ' · imported' : '');
};

function sorted() {
  const a = recs.slice();
  const f = { new: (x, y) => y.created - x.created, old: (x, y) => x.created - y.created, long: (x, y) => y.dur - x.dur, name: (x, y) => x.name.localeCompare(y.name) }[S.sort] || ((x, y) => y.created - x.created);
  return a.sort(f);
}
let renaming = null;

function renderAll() {
  const list = $('#list'), arr = sorted();
  const total = arr.reduce((s, r) => s + r.dur, 0);
  $('#sub').textContent = arr.length ? `${arr.length} recording${arr.length > 1 ? 's' : ''} · ${fmtTotal(total)}` : 'Nothing here yet';
  if (!arr.length) {
    list.innerHTML = `<div class="empty">${icon('wave')}<b>No recordings yet</b><span>Press the red button or hit <kbd>R</kbd> to start. Recordings stay on this device.</span></div>`;
    return;
  }
  const playing = id => loadedId === id && !au.paused;
  list.innerHTML = arr.map(r => {
    const on = r.id === selId, pl = playing(r.id);
    let h = `<div class="row${on ? ' sel' : ''}${pl ? ' pl' : ''}" data-id="${r.id}">
      <button class="rplay" data-a="play" title="${pl ? 'Pause' : 'Play'}" aria-label="${pl ? 'Pause' : 'Play'}">${icon(pl ? 'pause' : 'play')}</button>
      <div style="min-width:0"><div class="rname">${renaming === r.id ? `<input class="rn" value="${esc(r.name)}" spellcheck="false">` : esc(r.name)}</div><div class="rsub">${esc(fmtDate(r.created))}${(r.markers || []).length ? ' · ' + r.markers.length + ' marker' + (r.markers.length > 1 ? 's' : '') : ''}</div></div>
      <div class="rcol">${esc(labelFor(r))}</div><div class="rcol">${fmtBytes(r.size)}</div>
      <div class="rdur">${fmtT(r.dur, false)}</div>
      <button class="rmore" data-a="more" title="More" aria-label="More">${icon('more')}</button></div>`;
    if (on) {
      h += `<div class="rexp" data-id="${r.id}"><canvas class="wf" aria-label="Waveform, click to seek"></canvas>
        <div class="tp"><span class="tc tcur">${fmtT(loadedId === r.id ? au.currentTime : 0)}</span>
        <div class="tb"><button class="sk" data-a="back" title="Back 5 s (←)">−5 s</button>
        <button class="big" data-a="play" title="${pl ? 'Pause' : 'Play'} (Space)" aria-label="${pl ? 'Pause' : 'Play'}">${icon(pl ? 'pause' : 'play')}</button>
        <button class="sk" data-a="fwd" title="Forward 5 s (→)">+5 s</button>
        <button data-a="speed" title="Playback speed">${speed}×</button></div>
        <span class="tc">${fmtT(r.dur)}</span></div>
        <div class="tools"><button data-a="marker" title="Add marker at playhead (M)">${icon('flag')}<span>Marker</span></button>
        <button data-a="rename" title="Rename (F2)">${icon('edit')}<span>Rename</span></button>
        <button data-a="dl" title="Download">${icon('dl')}<span>Download</span></button>
        <button class="del" data-a="del" title="Delete (Del)">${icon('trash')}<span>Delete</span></button></div>
        ${(r.markers || []).length ? '<div class="chips">' + r.markers.map((m, i) => `<span class="chip"><a data-a="goto" data-t="${m}" style="cursor:pointer">${fmtT(m)}</a><button data-a="rmmark" data-i="${i}" title="Remove marker" aria-label="Remove marker">×</button></span>`).join('') + '</div>' : ''}
      </div>`;
    }
    return h;
  }).join('');
  drawSel();
  if (renaming) { const i = $('.rn'); if (i) { i.focus(); i.select(); } }
}

function drawSel() {
  const r = sel(), c = $('.rexp canvas'); if (!r || !c) return;
  const dpr = fit(c), g = c.getContext('2d'), w = c.width, h = c.height;
  g.clearRect(0, 0, w, h);
  const pk = r.peaks && r.peaks.length ? r.peaks : new Array(160).fill(0.05);
  const mx = Math.max(0.05, ...pk), bw = 3 * dpr, gap = 2 * dpr, n = Math.max(1, Math.floor(w / (bw + gap))), mid = h / 2, fr = posFrac();

    let v = 0; for (let j = a; j < b && j < pk.length; j++) v = Math.max(v, pk[j]);
    const hh = Math.max(3 * dpr, Math.pow(v / mx, 0.8) * h * 0.92);

    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 8 * dpr, 4 * dpr); g.lineTo(x, 8 * dpr); g.fill();

}
let playRaf = 0;
function playTick() { cancelAnimationFrame(playRaf); const f = () => { drawSel(); if (!au.paused) playRaf = requestAnimationFrame(f); }; f(); }

function drawLive() {
  const c = $('#live-wf'); if (!c) return;
  const dpr = fit(c), g = c.getContext('2d'), w = c.width, h = c.height;
  g.clearRect(0, 0, w, h);
  const bw = 3 * dpr, gap = 2 * dpr, n = Math.max(1, Math.floor(w / (bw + gap))), mid = h / 2;
  const active = R.st === 'rec' || R.st === 'paused';
  for (let i = 0; i < n; i++) {
    const idx = R.hist.length - n + i, has = active && idx >= 0;
    const hh = has ? Math.max(2 * dpr, Math.min(h, R.hist[idx] * 1.7 * h)) : 2 * dpr;
    g.fillStyle = has ? C['--accent'] : C['--line'];
    g.fillRect(i * (bw + gap), mid - hh / 2, bw, hh);
  }
}
function drawMeter() {
  const m = $('#meter'); if (!m) return;
  const active = R.st === 'rec';
  m.firstElementChild.style.width = (active ? clamp(R.level * 1.5, 0, 1) * 100 : 0) + '%';
  m.lastElementChild.style.left = (active ? clamp(R.hold * 1.5, 0, 1) * 100 : 0) + '%';
}
function drawInput() { const n = $('#inpNm'); if (n) n.textContent = inputLabel(); }
function renderLive() {

  drag = { sx: e.clientX, sy: e.clientY, ox: W.x, oy: W.y, moved: false, ratio: (e.clientX - b.left) / b.width };
});
$$('.rz').forEach(h => h.addEventListener('pointerdown', e => {
  if (e.button !== 0) return; e.preventDefault();
  drag = { rz: h.dataset.d, sx: e.clientX, sy: e.clientY, ox: W.x, oy: W.y, ow: W.w, oh: W.h, moved: true };
}));
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved) {
    if (Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    if (W.max) {                                    // un-maximize under the pointer
      if (document.body.classList.contains('fs')) toggleFS();
      W.max = false; win.classList.remove('max');
      W.x = Math.round(e.clientX - W.w * drag.ratio); W.y = 0; drag.ox = W.x; drag.oy = W.y; drag.sx = e.clientX; drag.sy = e.clientY;
      applyWin(); return;
    }
  }
  const a = area();
  if (!drag.rz) { W.x = drag.ox + dx; W.y = drag.oy + dy; }
  else {
    const d = drag.rz; let x = drag.ox, y = drag.oy, w = drag.ow, h = drag.oh;
    if (d.includes('e')) w = clamp(drag.ow + dx, MINW, a.w);
    if (d.includes('s')) h = clamp(drag.oh + dy, MINH, a.h);
    if (d.includes('w')) { w = clamp(drag.ow - dx, MINW, a.w); x = drag.ox + drag.ow - w; }
    if (d.includes('n')) { h = clamp(drag.oh - dy, MINH, a.h); y = drag.oy + drag.oh - h; }
    W.x = x; W.y = Math.max(0, y); W.w = w; W.h = h;
  }
  applyWin();
});
window.addEventListener('pointerup', () => { if (drag && drag.moved) saveWin(); drag = null; });
$('#top').addEventListener('dblclick', e => { if (e.target.closest('button,input')) return; if (win.classList.contains('mini')) return; if (document.body.classList.contains('fs')) return toggleFS(); setMax(!W.max); });
$('#wMax').addEventListener('click', () => { if (win.classList.contains('mini')) toggleMini(); else setMax(!W.max); });
$('#wMin').addEventListener('click', () => showWin(false));    // minimize keeps recording + playback alive
$('#wCl').addEventListener('click', closeWin);
$('#chip').addEventListener('click', () => showWin(win.hidden));
$$('#pre button').forEach(b => b.addEventListener('click', () => preset(b.dataset.p)));
window.addEventListener('resize', () => { closeMenu(0); applyWin(); });
if (window.ResizeObserver) new ResizeObserver(() => { hud(); drawLive(); drawSel(); }).observe(win);

/* boot */
(async function boot() {
  setTheme(S.theme);
  refreshColors();
  applyWin();
  const f = curFmt(); if (f && S.fmt !== f[0]) S.fmt = f[0];
  drawState(); drawInput();
  try { recs = await dbAll(); } catch (e) { recs = []; }
  recs.forEach(r => { if (!r.markers) r.markers = []; });
  renderAll();
  try { navigator.mediaDevices.addEventListener('devicechange', refreshDevices); } catch (e) {}
  refreshDevices();
  window.__sr = { R, S, get recs() { return recs; }, W };   // handy for tests
})();

})();
</script>
