<style>
:root{--bg:#fff;--bg2:#f4f4f6;--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#a1a1a6;--line:rgba(0,0,0,.09);--glass:rgba(255,255,255,.74);--side:rgba(244,244,247,.8);--hov:rgba(0,0,0,.06);--sel:rgba(0,0,0,.09);--acc:#fa2d48;--sh:0 8px 30px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.08);--w1:#cdd6e4;--w2:#e6dccf;--tb:rgba(255,255,255,.72);--grid:rgba(0,0,0,.05);--font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html[data-theme=dark]{--bg:#1c1c1e;--bg2:#000;--fg:#f5f5f7;--fg2:#a1a1a6;--fg3:#6e6e73;--line:rgba(255,255,255,.12);--glass:rgba(44,44,46,.74);--side:rgba(44,44,46,.74);--hov:rgba(255,255,255,.09);--sel:rgba(255,255,255,.15);--sh:0 8px 30px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.1);--w1:#161b27;--w2:#241c20;--tb:rgba(30,30,32,.72);--grid:rgba(255,255,255,.04)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--fg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.fill{fill:currentColor}
/* ---------- desktop + window ---------- */
.desktop{position:fixed;inset:0;background:linear-gradient(135deg,var(--w1),var(--w2));overflow:hidden}
.desktop::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
.window{position:absolute;border-radius:12px;overflow:hidden;background:var(--bg);box-shadow:0 24px 70px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.25)}
.window.max{border-radius:0}.window.hid{display:none}
.rz{position:absolute;z-index:60}
.rz[data-d=n]{top:0;left:10px;right:10px;height:5px;cursor:ns-resize}.rz[data-d=s]{bottom:0;left:10px;right:10px;height:5px;cursor:ns-resize}
.rz[data-d=e]{right:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}.rz[data-d=w]{left:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}
.rz[data-d=ne]{top:0;right:0;width:12px;height:12px;cursor:nesw-resize}.rz[data-d=nw]{top:0;left:0;width:12px;height:12px;cursor:nwse-resize}
.rz[data-d=se]{bottom:0;right:0;width:12px;height:12px;cursor:nwse-resize}.rz[data-d=sw]{bottom:0;left:0;width:12px;height:12px;cursor:nesw-resize}
.window.max .rz{display:none}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--tb);backdrop-filter:blur(24px) saturate(1.6);border-top:.5px solid var(--line);z-index:100;font-size:12px}
body.fs .taskbar{display:none}
.chip{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 8px;border-radius:9px;background:var(--hov);font-weight:600}
.chip.on{box-shadow:inset 0 -2px 0 var(--acc)}
.chip svg{width:18px;height:18px}
.hud{margin-left:auto;color:var(--fg2);font-variant-numeric:tabular-nums}
.pre{height:28px;padding:0 10px;border-radius:8px;color:var(--fg2)}.pre:hover{background:var(--hov);color:var(--fg)}
/* ---------- app ---------- */
.app{position:absolute;inset:0;container:app/inline-size;background:var(--bg);font-size:13px;line-height:1.35;user-select:none}
.main{position:absolute;inset:0;left:0;transition:left .22s cubic-bezier(.2,.8,.2,1)}
.app[data-side=on] .main{left:232px}
.scroll{position:absolute;inset:0;overflow:auto;--pad:20px;padding:52px var(--pad) 96px;scrollbar-width:thin}
.head h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.head p{font-size:12.5px;color:var(--fg2);margin:1px 0 14px}
.topfade{position:absolute;left:0;right:0;top:0;height:64px;background:linear-gradient(var(--bg) 35%,transparent);pointer-events:none;z-index:5}
.botfade{position:absolute;left:0;right:0;bottom:0;height:100px;background:linear-gradient(transparent,var(--bg) 85%);pointer-events:none;z-index:5}
.app[data-mode=detail] .botfade{height:0}
/* top bar */
.top{position:absolute;left:0;right:0;top:0;height:40px;z-index:30;display:flex;align-items:center;gap:2px;padding:0 8px}
.ib{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--fg2);flex:none}
.ib:hover{background:var(--hov);color:var(--fg)}.ib.on{background:var(--sel);color:var(--fg)}.ib:disabled{opacity:.35;pointer-events:none}
.ib.heart.on{color:var(--acc);background:none}
.menus{display:flex;gap:0}
.mb{height:28px;padding:0 9px;border-radius:8px;font-weight:500;color:var(--fg)}
.mb:hover,.mb[aria-expanded=true]{background:var(--sel)}
.ham{display:none}.back{display:none}
.app[data-mode=detail] .back{display:grid}
.ttl{flex:1;min-width:0;text-align:center;line-height:1.2;padding:0 8px}
.ttl b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{display:block;font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app[data-mode=grid] .ttl>*{display:none}
.tools{display:none;align-items:center;gap:0;padding:2px;border-radius:12px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);box-shadow:var(--sh)}
.app[data-mode=detail] .tools{display:flex}
.edbtn{height:28px;padding:0 12px;border-radius:9px;font-weight:600}.edbtn:hover,.edbtn.on{background:var(--sel)}
.search{display:flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:15px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);box-shadow:var(--sh);color:var(--fg2);cursor:text}
.search input{border:0;background:none;outline:0;width:130px;min-width:0;user-select:text}
.app[data-mode=detail] .search{display:none}
.wc{display:flex;margin-left:4px}.wc .ib{width:28px;height:28px}
.wc .x:hover{background:#ff453a;color:#fff}
/* sidebar */
.side{position:absolute;left:8px;top:44px;bottom:8px;width:216px;border-radius:14px;background:var(--side);backdrop-filter:blur(28px) saturate(1.8);box-shadow:var(--sh);overflow:auto;padding:8px 6px 12px;z-index:25;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .2s;scrollbar-width:none}
.app[data-side=off] .side{transform:translateX(-115%);opacity:0;pointer-events:none}
.sec{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 8px 4px;font-size:11px;font-weight:600;color:var(--fg2)}
.sec .i{width:12px;height:12px;transition:transform .15s;opacity:0}.sec:hover .i{opacity:1}.sec.c .i{transform:rotate(-90deg)}
.si{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border-radius:8px;text-align:left;white-space:nowrap}
.si:hover{background:var(--hov)}.si.on{background:var(--sel);font-weight:600}
.si .i{color:var(--acc)}.si .lk{margin-left:auto;color:var(--fg3);width:13px;height:13px}
.si .th{width:20px;height:20px;border-radius:4px;object-fit:cover;flex:none}
.si.sub{padding-left:26px}.si .dis{width:12px;height:12px;color:var(--fg3);transition:transform .15s;margin-left:-4px}.si .dis.o{transform:rotate(90deg)}
.si span{overflow:hidden;text-overflow:ellipsis}
.scrim{display:none}
/* grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell,150px),1fr));gap:3px}
.cell{position:relative;aspect-ratio:1;overflow:hidden;border-radius:3px;background:var(--bg2)}
.cell img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cell .bg{position:absolute;right:5px;bottom:5px;font-size:10.5px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);display:flex;align-items:center;gap:3px}
.cell .bg .i{width:11px;height:11px}
.cell .hr{position:absolute;left:5px;bottom:5px;width:13px;height:13px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.cell .ck{position:absolute;left:6px;top:6px;width:20px;height:20px;border-radius:50%;border:1.5px solid #fff;background:rgba(0,0,0,.2);display:none;place-items:center;color:#fff}
.cell .ck .i{width:12px;height:12px;stroke-width:2.6;opacity:0}
.sm .cell .ck{display:grid}.cell.sel .ck{background:var(--acc);border-color:var(--acc)}.cell.sel .ck .i{opacity:1}.cell.sel img{transform:scale(.9);border-radius:6px}
.cell img{transition:transform .12s}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--cell,150px)*1.4),1fr));gap:14px}
.acard{position:relative;aspect-ratio:1.35;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.18);background:var(--bg2);text-align:left;transition:transform .15s}
.acard:hover{transform:translateY(-2px)}
.acard img{width:100%;height:100%;object-fit:cover;display:block}
.acard::after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.acard .lbl{position:absolute;left:12px;bottom:10px;z-index:2;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.acard .lbl small{display:block;font-weight:500;opacity:.8;font-size:10.5px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:18px 10px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}
.pcard .av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.pcard small{color:var(--fg2);font-weight:500}
.empty{display:grid;place-items:center;text-align:center;color:var(--fg2);padding:60px 20px;gap:8px}
.empty .i{width:40px;height:40px;stroke-width:1.2;color:var(--fg3)}.empty b{color:var(--fg);font-size:15px}
.empty .cta{margin-top:6px;height:30px;padding:0 14px;border-radius:15px;background:var(--acc);color:#fff;font-weight:600}
.map{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(var(--bg2),var(--sel));aspect-ratio:2/1;min-height:200px;box-shadow:inset 0 0 0 .5px var(--line)}
.map svg.g{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px}
.pin img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.pin b{font-size:10.5px;background:var(--glass);padding:1px 7px;border-radius:9px;backdrop-filter:blur(10px);white-space:nowrap}
.tcard{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;background:var(--bg2);margin-bottom:8px;text-align:left}
.tcard:hover{background:var(--sel)}.tcard .i{color:var(--acc)}.tcard small{margin-left:auto;color:var(--fg2)}
/* stage */
.stage{position:absolute;left:14px;right:14px;top:44px;bottom:90px;display:none;z-index:2}
.app[data-mode=detail] .stage{display:block}.app[data-mode=detail] .scroll{visibility:hidden}
.app[data-info=on][data-mode=detail] .stage,.app[data-edit=on][data-mode=detail] .stage{right:290px}
.stage img{position:absolute;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.25);transform-origin:center;transition:transform .25s}
.badge{position:absolute;left:10px;top:10px;z-index:3;height:24px;padding:0 10px;border-radius:12px;background:var(--glass);backdrop-filter:blur(20px);font-size:11px;font-weight:700;letter-spacing:.04em;display:none;align-items:center;gap:5px}
.badge.on{display:flex}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;display:none;gap:8px;align-items:center;padding:6px 8px 6px 14px;border-radius:20px;background:var(--glass);backdrop-filter:blur(20px);box-shadow:var(--sh);white-space:nowrap}
.banner.on{display:flex}.banner button{height:26px;padding:0 12px;border-radius:13px;background:var(--sel);font-weight:600}
.banner .pr{background:var(--acc);color:#fff}
.vplay{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:none;place-items:center;z-index:3;backdrop-filter:blur(8px)}
.vplay.on{display:grid}.vplay .i{width:26px;height:26px}
/* dock: pill + film */
.dock{position:absolute;left:0;right:0;bottom:0;height:0;z-index:20;pointer-events:none}
.pill,.film{position:absolute;bottom:14px;left:0;right:0;margin:0 auto;width:min(100% - 28px,820px);border-radius:24px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);box-shadow:var(--sh);pointer-events:auto}
.pill{height:50px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:0 10px}
.pz{display:flex;align-items:center;gap:2px}.pz input{width:120px;accent-color:var(--acc)}
.pc{text-align:center;color:var(--fg2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;gap:4px}
.cbtn{height:30px;padding:0 12px;border-radius:15px;background:var(--hov);font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap}.cbtn:hover{background:var(--sel)}
.cbtn .i{width:12px;height:12px}
#selDone{display:none;background:var(--acc);color:#fff}.sm #selDone{display:flex}.sm #filt{display:none}
.app[data-mode=detail] .pill,.app[data-nopill=on] .pill{display:none}
.film{display:none;height:60px;padding:8px 12px;overflow-x:auto;align-items:center;gap:3px;scrollbar-width:none;border-radius:22px}
.app[data-mode=detail] .film{display:flex}
.ft{width:30px;height:42px;border-radius:5px;overflow:hidden;flex:none;transition:width .2s;opacity:.85}
.ft img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ft.on{width:56px;opacity:1;box-shadow:0 0 0 2px var(--fg)}
/* sheet */
.sheet{position:absolute;right:12px;top:48px;bottom:92px;width:262px;border-radius:16px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);box-shadow:var(--sh);z-index:18;padding:14px;overflow:auto;display:none;user-select:text}
.app[data-info=on][data-mode=detail] .sheet,.app[data-edit=on][data-mode=detail] .sheet{display:block}
.sheet h3{font-size:13px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:78px 1fr;gap:6px 8px;font-size:12px}.kv dt{color:var(--fg2)}.kv dd{margin:0;word-break:break-word}
.sl{margin-bottom:14px}.sl label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}.sl label output{color:var(--fg2);font-variant-numeric:tabular-nums}
.sl input{width:100%;accent-color:var(--acc)}
.row{display:flex;gap:6px;margin-top:6px}.row .cbtn{flex:1;justify-content:center}.row .pr{background:var(--acc);color:#fff}
/* menus */
.menu{position:fixed;z-index:1000;min-width:200px;padding:5px;border-radius:12px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.8);box-shadow:var(--sh);overflow:auto;font-size:13px;color:var(--fg);animation:mn .12s ease-out}
.menu.up{animation-name:mnu}
@keyframes mn{from{opacity:0;transform:translateY(-4px)}}@keyframes mnu{from{opacity:0;transform:translateY(6px)}}
.mi{display:flex;align-items:center;width:100%;height:28px;padding:0 8px 0 4px;border-radius:7px;text-align:left;gap:4px}
.mi:hover,.mi:focus-visible{background:var(--acc);color:#fff;outline:0}.mi.dis{opacity:.4;pointer-events:none}
.mi .ck{width:18px;flex:none}.mi .ck .i{width:13px;height:13px;stroke-width:2.4}.mi .ml{flex:1;white-space:nowrap}.mi .kb{opacity:.55;font-size:12px;margin-left:18px}.mi .sc{width:12px;height:12px}
.msep{height:1px;background:var(--line);margin:5px 6px}
.toast{position:absolute;left:50%;bottom:78px;transform:translate(-50%,10px);padding:8px 14px;border-radius:18px;background:rgba(30,30,32,.9);color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}.app[data-mode=detail] .toast{bottom:92px}
.dlg{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.25);display:grid;place-items:center}
.dlg form{width:min(300px,90%);padding:16px;border-radius:16px;background:var(--bg);box-shadow:var(--sh)}
.dlg h3{margin-bottom:10px}.dlg input{width:100%;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);padding:0 10px;outline:0;user-select:text}.dlg input:focus{border-color:var(--acc)}
.drop{position:absolute;inset:6px;border:2px dashed var(--acc);border-radius:14px;z-index:80;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 80%,transparent);font-weight:600;pointer-events:none}.drop.on{display:grid}
/* ---------- tiers (window width, never viewport) ---------- */
@container app (max-width:980px){.pc{display:none}.search input{width:100px}}
@container app (max-width:700px){
 .app[data-side=on] .main{left:0}
 .side{box-shadow:var(--sh),0 0 0 100vmax rgba(0,0,0,.0)}
 .app[data-side=on] .scrim{display:block;position:absolute;inset:0;z-index:22;background:rgba(0,0,0,.18)}
 .t-share,.t-rot,.t-enh{display:none}
 .ttl span{display:none}
 .search input{width:0;padding:0}.search.open input{width:110px}
 .app[data-info=on][data-mode=detail] .stage,.app[data-edit=on][data-mode=detail] .stage{right:14px}
 .sheet{left:12px;width:auto;top:auto;bottom:92px;max-height:46%}
 .pc{display:block}
}
@container app (max-width:560px){
 .menus{display:none}.ham{display:grid}
 .ttl{display:none}.ttl+*{margin-left:auto}
 .top{gap:0}
 .pz input{width:90px}
}
@container app (max-width:520px){
 .scroll{--pad:12px}
 .pc{display:none}.pz input{display:none}
 #filt span{display:none}
}
@container app (max-width:420px){
 .wc .mn{display:none}
 .t-info{display:none}
 .edbtn{padding:0 9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>(() => {'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

const ic=(n,c='')=>`<svg class="i ${c}"><use href="#i-${n}"/></svg>`;

const SKIN=['#f1c9a5','#d9a074','#a8734a','#7a4c2e','#e8b894'];
function person(x,y,s,skin,shirt,hair,r){

  return `<rect x="${f1(x-s*.9)}" y="${f1(y+s*.55)}" width="${f1(s*1.8)}" height="${f1(s*2.2)}" rx="${f1(s*.6)}" fill="${shirt}"/>${stripe}
  <circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(s*.55)}" fill="${skin}"/>
  <path d="M${f1(x-s*.58)} ${f1(y-s*.1)}A${f1(s*.6)} ${f1(s*.6)} 0 0 1 ${f1(x+s*.58)} ${f1(y-s*.1)}Q${f1(x)} ${f1(y-s*.5)} ${f1(x-s*.58)} ${f1(y-s*.1)}Z" fill="${hair}"/>
  <circle cx="${f1(x-s*.2)}" cy="${f1(y+s*.05)}" r="${f1(s*.05)}" fill="#2a1a10"/><circle cx="${f1(x+s*.2)}" cy="${f1(y+s*.05)}" r="${f1(s*.05)}" fill="#2a1a10"/>
  <path d="M${f1(x-s*.22)} ${f1(y+s*.2)}Q${f1(x)} ${f1(y+s*.42)} ${f1(x+s*.22)} ${f1(y+s*.2)}" stroke="#2a1a10" stroke-width="${f1(s*.06)}" fill="none" stroke-linecap="round"/>`;
}
function scene(p){
  const r=rng(p.seed*13+5),W=p.w,H=p.h,m=Math.min(W,H);let b='',d='';
  const k=p.kind;
  if(k==='coast'){
    const h=198+r()*24;
    d=`<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${h} 75% 42%)"/><stop offset="1" stop-color="hsl(${h-8} 60% 84%)"/></linearGradient><linearGradient id="d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0b45e"/><stop offset="1" stop-color="#b2682a"/></linearGradient>`;
    b=`<rect width="${W}" height="${H}" fill="url(#s)"/>`;
    for(let i=0;i<5;i++)b+=`<ellipse cx="${f1(r()*W)}" cy="${f1(r()*H*.35)}" rx="${f1(W*(.12+r()*.2))}" ry="${f1(H*(.008+r()*.02))}" fill="#fff" opacity=".35"/>`;
    b+=`<rect y="${f1(H*.6)}" width="${W}" height="${f1(H*.4)}" fill="hsl(${h+4} 38% 52%)"/><rect y="${f1(H*.6)}" width="${W}" height="3" fill="#fff" opacity=".5"/>`;
    b+=`<path d="M${f1(W*.25)} ${H}C${f1(W*.45)} ${f1(H*.7)} ${f1(W*.75)} ${f1(H*.25)} ${W} ${f1(H*.02)}L${W} ${H}Z" fill="url(#d)"/>`;
    for(let i=0,n=0;i<400&&n<55;i++){const x=W*(.02+r()*.98),y=H*(.5+r()*.5);if(y<H*(1.02-.55*x/W))continue;n++;const rx=W*(.02+r()*.045);b+=`<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(rx)}" ry="${f1(rx*.55)}" fill="hsl(${85+r()*50} 28% ${26+r()*16}%)"/>`}
  }else if(k==='mountain'){
    d=`<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(212 70% 52%)"/><stop offset="1" stop-color="hsl(200 55% 88%)"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aa05a"/><stop offset="1" stop-color="#3f7040"/></linearGradient>`;
    b=`<rect width="${W}" height="${H}" fill="url(#s)"/>`;
    [['#a9b8cc',.34,.2],['#7f98a0',.46,.14],['#4f7a52',.6,.1]].forEach(([c,base,amp],j)=>{let pts=`0,${H}`;const n=14;for(let i=0;i<=n;i++){const x=W*i/n,y=H*base-r()*H*amp*(j?1:1.1)*(i%3?.6:1);pts+=` ${f1(x)},${f1(y)}`}pts+=` ${W},${H}`;b+=`<polygon points="${pts}" fill="${c}"/>`;if(!j)b+=`<polygon points="${pts}" fill="#fff" opacity=".18"/>`});
    b+=`<rect y="${f1(H*.68)}" width="${W}" height="${f1(H*.32)}" fill="url(#g)"/>`;
    for(let i=0;i<46;i++){const x=r()*W,y=H*(.66+r()*.34),s=m*(.02+r()*.03);b+=`<path d="M${f1(x)} ${f1(y-s*2)}L${f1(x+s)} ${f1(y)}L${f1(x-s)} ${f1(y)}Z" fill="hsl(${130+r()*20} 40% ${18+r()*10}%)"/>`}
  }else if(k==='sunset'){
    const h=8+r()*30;
    d=`<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(265 40% 24%)"/><stop offset=".55" stop-color="hsl(${h} 85% 55%)"/><stop offset="1" stop-color="hsl(${h+20} 90% 75%)"/></linearGradient><radialGradient id="r"><stop offset="0" stop-color="#fff4c8"/><stop offset=".25" stop-color="#ffd58a"/><stop offset="1" stop-color="#ffd58a" stop-opacity="0"/></radialGradient>`;
    const sx=W*(.3+r()*.4),sy=H*.62;

    for(let i=0;i<4;i++){const x=W*(.1+r()*.8),y=H*(.15+r()*.25);b+=`<path d="M${f1(x)} ${f1(y)}q7 -7 14 0q7 -7 14 0" stroke="#1c1224" stroke-width="2.4" fill="none" stroke-linecap="round"/>`}
  }else if(k==='food'){

    const cx=W/2,cy=H/2,R=m*.44;
    b=`<rect width="${W}" height="${H}" fill="url(#s)"/><circle cx="${cx}" cy="${cy+8}" r="${f1(R)}" fill="#000" opacity=".4"/><circle cx="${cx}" cy="${cy}" r="${f1(R)}" fill="#ece6d8"/><circle cx="${cx}" cy="${cy}" r="${f1(R*.86)}" fill="#f6f1e4" stroke="#d8d0be" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${f1(R*.62)}" fill="hsl(${40+r()*10} 85% 62%)"/>`;
    for(let i=0;i<14;i++){const a=r()*6.28,rr=R*r()*.6,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr,s=R*(.07+r()*.1),c=['#3f8f3a','#8fc24a','#e8503a','#f2a63a','#2f6f3a'][i%5];b+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(s)}" fill="${c}"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(s*.55)}" fill="#fff" opacity=".22"/>`}
    for(let i=0;i<26;i++){const a=r()*6.28,rr=R*r()*.7,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;b+=`<path d="M${f1(x)} ${f1(y)}l${f1(r()*14-7)} ${f1(r()*14-7)}" stroke="#2f6f3a" stroke-width="3" stroke-linecap="round"/>`}
  }else if(k==='friends'){
    d=`<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ec4f0"/><stop offset="1" stop-color="#cfe9c8"/></linearGradient>`;
    b=`<rect width="${W}" height="${H}" fill="url(#s)"/>`;
    for(let i=0;i<14;i++)b+=`<circle cx="${f1(r()*W)}" cy="${f1(r()*H*.6)}" r="${f1(m*(.1+r()*.16))}" fill="hsl(${95+r()*45} 45% ${28+r()*18}%)"/>`;
    const n=p.people.length||3,s=m*(n>2?.15:.2),shirts=['#e8503a','#2f7fe0','#f2c230','#30a86a','#8a4fd0'];
    for(let i=0;i<n;i++){const x=W*(.2+.6*(n>1?i/(n-1):.5))+(r()-.5)*W*.05,y=H*(.42+(i%2)*.1+r()*.04);b+=person(x,y,s*(1+r()*.15),SKIN[(p.seed+i)%5],shirts[(p.seed+i*2)%5],['#1d1410','#3a2416','#0f0b08'][i%3],r)}
  }else if(k==='family'){
    d=`<radialGradient id="s"><stop offset="0" stop-color="hsl(32 60% 34%)"/><stop offset="1" stop-color="hsl(22 50% 10%)"/></radialGradient><radialGradient id="f"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb030" stop-opacity="0"/></radialGradient>`;
    b=`<rect width="${W}" height="${H}" fill="url(#s)"/>`;
    for(let i=0;i<16;i++)b+=`<circle cx="${f1(r()*W)}" cy="${f1(r()*H*.6)}" r="${f1(m*(.02+r()*.05))}" fill="#ffd27a" opacity="${f1(.15+r()*.3)}"/>`;
    b+=person(W*.34,H*.34,m*.2,SKIN[p.seed%5],'#c9473a','#1d1410',r)+person(W*.7,H*.42,m*.13,SKIN[(p.seed+1)%5],'#3a8fd0','#3a2416',r);
    const cx=W*.52,cy=H*.78;b+=`<ellipse cx="${f1(cx)}" cy="${f1(cy+m*.08)}" rx="${f1(m*.3)}" ry="${f1(m*.06)}" fill="#000" opacity=".3"/><rect x="${f1(cx-m*.26)}" y="${f1(cy-m*.05)}" width="${f1(m*.52)}" height="${f1(m*.13)}" rx="8" fill="#f4e2c8"/><rect x="${f1(cx-m*.26)}" y="${f1(cy-m*.05)}" width="${f1(m*.52)}" height="${f1(m*.04)}" rx="6" fill="#d9577a"/>`;
    for(let i=0;i<7;i++){const x=cx-m*.2+i*m*.067;b+=`<circle cx="${f1(x)}" cy="${f1(cy-m*.14)}" r="${f1(m*.07)}" fill="url(#f)"/><rect x="${f1(x-2)}" y="${f1(cy-m*.1)}" width="4" height="${f1(m*.06)}" fill="hsl(${i*50} 80% 65%)"/><ellipse cx="${f1(x)}" cy="${f1(cy-m*.12)}" rx="3" ry="6" fill="#ffd34d"/>`}
  }else if(k==='shot'){

    for(let i=0;i<7;i++){const y=H*(.13+i*.115);b+=`<rect x="${f1(W*.05)}" y="${f1(y)}" width="${f1(W*.9)}" height="${f1(H*.095)}" rx="${f1(W*.025)}" fill="#fff"/><circle cx="${f1(W*.115)}" cy="${f1(y+H*.0475)}" r="${f1(H*.028)}" fill="hsl(${(p.seed*37+i*47)%360} 70% 58%)"/><rect x="${f1(W*.19)}" y="${f1(y+H*.025)}" width="${f1(W*(.3+r()*.3))}" height="${f1(H*.014)}" rx="3" fill="#1d1d1f" opacity=".8"/><rect x="${f1(W*.19)}" y="${f1(y+H*.055)}" width="${f1(W*(.2+r()*.3))}" height="${f1(H*.011)}" rx="3" fill="#8e8e93"/>`}
  }

function applyFilt(ps){return ps.filter(p=>S.filt==='all'||(S.filt==='fav'&&U.fav[p.id])||(S.filt==='photo'&&!p.video)||(S.filt==='video'&&p.video))}
function vInfo(v){

  if(S.q){const q=S.q.toLowerCase();return g(`Results for “${S.q}”`,ps.filter(p=>[ptitle(p),p.place,p.kind,...p.people,...albumsOf(p).map(i=>(A.find(x=>x.id===i)||{}).name),new Date(p.date).toLocaleDateString('en-US',{month:'long',year:'numeric'})].join(' ').toLowerCase().includes(q)),{empty:['search','No Results',`Nothing matches “${S.q}”.`]})}
  switch(k){
   case 'library':return g('Library',ps);
   case 'favorites':return g('Favorites',ps.filter(p=>U.fav[p.id]),{empty:['heart','No Favorites','Tap the heart on any photo to pin it here.']});
   case 'saved':return g('Recently Saved',ps.filter(p=>Date.now()-p.date<1e12).sort((x,y)=>y.date-x.date).slice(0,18));
   case 'videos':return g('Videos',ps.filter(p=>p.video),{empty:['video','No Videos','']});
   case 'portrait':return g('Portrait',ps.filter(p=>p.portrait),{empty:['person','No Portraits','']});
   case 'screenshots':return g('Screenshots',ps.filter(p=>p.shot),{empty:['shot','No Screenshots','']});
   case 'imports':return g('Imports',ps.filter(p=>p.imp),{empty:['saved','Nothing Imported','Use File ▸ Import Photos, or drop files on this window.',1]});
   case 'pano':return g('Panoramas',[],{empty:['pano','No Panoramas','']});
   case 'dupes':return g('Duplicates',[],{empty:['photo','No Duplicates Found','Your library is tidy.']});
   case 'hidden':return g('Hidden',[],{empty:['lock','No Hidden Photos','']});
   case 'projects':return g('Projects',[],{empty:['folder','No Projects','Slideshows and books you create will appear here.']});
   case 'deleted':{const d=PH.concat(IMP).filter(p=>U.del[p.id]>0);return S.unlocked?g('Recently Deleted',d,{del:1,empty:['trash','No Deleted Items','Items stay here for 30 days.']}):{t:'Recently Deleted',type:'locked',ids:[]}}
   case 'album':{const al=A.find(x=>x.id===a)||{name:'Album'};return g(al.name,ps.filter(p=>albumsOf(p).includes(a)),{empty:['album','Empty Album','Add photos from the Edit ▸ Add to Album menu.']})}
   case 'sh':{const s=SHARED.find(x=>x.id===a);return g(s.name,ps.filter(p=>s.from.some(f=>albumsOf(p).includes(f))),{sub:'Shared with '+s.who})}
   case 'person':return g(a,ps.filter(p=>p.people.includes(a)));
   case 'place':return g(a,ps.filter(p=>p.place===a));
   case 'month':{const [y,m]=a.split('-');return g(new Date(y,m-1).toLocaleDateString('en-US',{month:'long',year:'numeric'}),ps.filter(p=>{const d=new Date(p.date);return d.getFullYear()==y&&d.getMonth()==m-1}))}
   case 'albums':return {t:'Albums',type:'albums',sub:`${A.length} Albums`,ids:[]};

   case 'map':return {t:'Map',type:'map',ids:[]};
   case 'people':return {t:'People & Pets',type:'people',ids:[]};
   case 'types':return {t:'Media Types',type:'types',ids:[]};
  }
  return g('Library',ps);
}

  const sw=st.clientWidth,sh=st.clientHeight,sc=Math.min(sw/(odd?p.h:p.w),sh/(odd?p.w:p.h)),ew=p.w*sc,eh=p.h*sc;

/* slideshow */
function toggleShow(){S.show?stopShow():startShow()}
function startShow(){const ids=S.curIds&&S.curIds.length?S.curIds:sortIds(all());if(!ids.length)return;openPhoto(S.sel||ids[0],S.sel?S.list:ids);S.show=setInterval(()=>{const i=S.list.indexOf(S.sel);S.sel=S.list[(i+1)%S.list.length];renderDetail()},2800);toast('Slideshow — Esc to stop')}
function stopShow(){clearInterval(S.show);S.show=null}
/* import */
function importFiles(files){let n=0;[...files].forEach(f=>{if(!/^(image|video)\//.test(f.type))return;const url=URL.createObjectURL(f),isV=f.type.startsWith('video/'),im=isV?document.createElement('video'):new Image();
  const add=(w,h)=>{IMP.push({id:'i'+Date.now()+n++,imp:1,name:f.name,url:isV?'':url,vurl:url,kind:'import',albums:[],place:'',ll:null,w:w||900,h:h||600,video:isV,dur:0,date:f.lastModified||Date.now(),people:[]});if(!--pend){S.view='imports';S.q='';closeDetail(true);renderMain();toast('Imported '+IMP.length+' item(s) — session only')}};
  pend=(typeof pend==='number'?pend:0)+1;if(isV){im.onloadedmetadata=()=>add(im.videoWidth,im.videoHeight);im.src=url}else{im.onload=()=>add(im.naturalWidth,im.naturalHeight);im.onerror=()=>pend--;im.src=url}})}
let pend=0;

/* ---------- menu engine ---------- */
let menus=[],barOpen=null,subT;
function closeMenu(d=0){while(menus.length>d){const m=menus.pop();m.el.remove();if(m.anchor&&m.anchor.setAttribute&&m.depth===0)m.anchor.setAttribute('aria-expanded','false')}if(!menus.length)barOpen=null}
function openMenu(anchor,items,o={}){
  const depth=o.depth||0;closeMenu(depth);
  const el=document.createElement('div');el.className='menu'+(o.up?' up':'');el.setAttribute('role','menu');
  items.forEach(it=>{
    if(it==='-'){const s=document.createElement('div');s.className='msep';el.append(s);return}
    const b=document.createElement('button');b.className='mi'+(it.disabled?' dis':'');b.setAttribute('role','menuitem');
    b.innerHTML=`<span class="ck">${it.checked?ic('check'):''}</span><span class="ml">${esc(it.label)}</span>${it.kbd?`<span class="kb">${it.kbd}</span>`:''}${it.sub?ic('chev','sc'):''}`;
    b.onclick=e=>{e.stopPropagation();if(it.disabled)return;if(it.sub){openMenu(b,typeof it.sub==='function'?it.sub():it.sub,{depth:depth+1});return}closeMenu(0);it.run&&it.run()};
    b.onmouseenter=()=>{clearTimeout(subT);subT=setTimeout(()=>{if(it.sub&&!it.disabled)openMenu(b,typeof it.sub==='function'?it.sub():it.sub,{depth:depth+1});else closeMenu(depth+1)},80)};
    el.append(b)});
  document.body.append(el);
  const vw=innerWidth,vh=innerHeight,r=anchor.getBoundingClientRect?anchor.getBoundingClientRect():{left:anchor.x,right:anchor.x,top:anchor.y,bottom:anchor.y,width:0},g=o.gap??6;
  el.style.maxHeight=(vh-16)+'px';const w=el.offsetWidth;let h=el.offsetHeight,x,y;
  if(depth){x=r.right-4;if(x+w>vw-8)x=r.left-w+4;y=r.top-6}
  else{x=o.center?r.left+r.width/2-w/2:o.right?r.right-w:r.left;y=o.up?r.top-g-h:r.bottom+g}
  const room=o.up&&!depth?r.top-g-8:vh-y-8;if(h>room&&!depth){el.style.maxHeight=Math.max(120,room)+'px';h=el.offsetHeight;if(o.up)y=r.top-g-h}
  x=Math.max(8,Math.min(x,vw-w-8));y=Math.max(8,Math.min(y,vh-h-8));el.style.left=x+'px';el.style.top=y+'px';
  menus.push({el,anchor,depth});if(anchor.setAttribute&&!depth)anchor.setAttribute('aria-expanded','true');return el}

const goItems=()=>[['library','Library'],['collections','Collections'],['albums','Albums'],['favorites','Favorites'],['map','Map'],['people','People & Pets'],['videos','Videos'],['screenshots','Screenshots'],['deleted','Recently Deleted']].map(([v,l])=>({label:l,checked:S.view===v&&!S.q,run:()=>go(v)}));
function albumItems(){const ps=targets();return [{label:'New Album…',run:newAlbum},'-',...albums().map(a=>({label:a.name,run:()=>addTo(a.id)}))].map(x=>x==='-'?x:Object.assign(x,{disabled:x.label!=='New Album…'&&!ps.length}))}
function menuDefs(){
  const D=!!S.sel,t=targets(),has=t.length>0,del=D&&U.del[S.sel],favOn=has&&t.every(i=>U.fav[i]);
  return {
   File:[{label:'New Album…',kbd:'Ctrl N',run:newAlbum},{label:'Import Photos…',kbd:'Ctrl I',run:()=>$('#file').click()},'-',{label:S.show?'Stop Slideshow':'Play Slideshow',run:toggleShow},{label:'Share… ',run:()=>pv('Share')},{label:'Print…',run:()=>pv('Print')},'-',{label:'Close Window',kbd:'Ctrl W',run:()=>winAct.hide()}],
   Edit:[{label:S.selMode?'Done Selecting':'Select Items',disabled:D,run:()=>{S.selMode=!S.selMode;S.picked.clear();renderMain();$('#grid')?.classList.toggle('sm',S.selMode)}},{label:'Select All',disabled:D||!(S.curIds||[]).length,run:()=>{S.selMode=true;S.picked=new Set(S.curIds);renderMain()}},'-',{label:favOn?'Unfavourite':'Favourite',kbd:'F',disabled:!has||del,run:()=>toggleFav()},{label:'Add to Album',sub:albumItems,disabled:!has},{label:'Hide (preview)',disabled:!has,run:()=>pv('Hide')},'-',{label:del?'Recover':'Delete',kbd:'Del',disabled:!has&&!(S.view==='deleted'),run:()=>del?restore():delPhotos()},{label:'Empty Deleted…',disabled:!PH.concat(IMP).some(p=>U.del[p.id]>0),run:()=>{purge(PH.concat(IMP).filter(p=>U.del[p.id]>0).map(p=>p.id));toast('Deleted permanently')}}],
   Image:[{label:'Edit',kbd:'E',disabled:!D||del,checked:S.edit,run:()=>S.edit?doneEdit():openEdit()},{label:'Auto Enhance',disabled:!D||del,run:autoEnh},{label:'Revert to Original',disabled:!D||del,run:revert},'-',{label:'Rotate Left',kbd:'Shift R',disabled:!D,run:()=>rotate(-1)},{label:'Rotate Right',kbd:'R',disabled:!D,run:()=>rotate(1)},'-',{label:'Show Info',kbd:'I',disabled:!D,checked:S.info,run:()=>{S.info=!S.info;S.edit=false;renderDetail()}},{label:'Previous Photo',kbd:'←',disabled:!D,run:()=>nav(-1)},{label:'Next Photo',kbd:'→',disabled:!D,run:()=>nav(1)},'-',{label:'Duplicate (preview)',disabled:!D,run:()=>pv('Duplicate')},{label:'Share… ',disabled:!D,run:()=>pv('Share')}],
   View:[{label:'Show Sidebar',kbd:'Ctrl S',checked:S.side,run:toggleSide},{label:'Go To',sub:goItems},'-',{label:'Zoom In',kbd:'+',disabled:D,run:()=>setZoom(S.zoom+30)},{label:'Zoom Out',kbd:'−',disabled:D,run:()=>setZoom(S.zoom-30)},'-',{label:'Newest First',checked:!S.asc,run:()=>{S.asc=false;refresh()}},{label:'Oldest First',checked:S.asc,run:()=>{S.asc=true;refresh()}},{label:'Filter',sub:filtItems},'-',{label:'Appearance',sub:()=>[['system','Match System'],['light','Light'],['dark','Dark']].map(([k,l])=>({label:l,checked:S.theme===k,run:()=>setTheme(k)}))},{label:'Full Screen',kbd:'F11',checked:winAct.isFs(),run:()=>winAct.fs()}]};
}
const filtItems=()=>[['all','All Items'],['fav','Favourites'],['photo','Photos'],['video','Videos']].map(([k,l])=>({label:l,checked:S.filt===k,run:()=>{S.filt=k;renderMain()}}));
function setZoom(v){S.zoom=Math.max(80,Math.min(260,v));ls.set('zoom',S.zoom);$('#zoom').value=S.zoom;$('#scroll').style.setProperty('--cell',S.zoom+'px')}
function toggleSide(){S.side=!S.side;if(app.clientWidth>700)ls.set('side',S.side);app.dataset.side=S.side?'on':'off';setTimeout(fit,260)}
function setTheme(k){S.theme=k;ls.set('theme',k);applyTheme()}
const mq=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){document.documentElement.dataset.theme=S.theme==='system'?(mq.matches?'dark':'light'):S.theme}
mq.addEventListener&&mq.addEventListener('change',applyTheme);

/* menubar wiring */
function openBar(btn){const n=btn.dataset.m;if(barOpen===n&&menus.length)return;closeMenu(0);barOpen=n;openMenu(btn,menuDefs()[n],{gap:4})}
$$('.mb').forEach(b=>{b.onclick=e=>{e.stopPropagation();if(barOpen===b.dataset.m){closeMenu(0)}else openBar(b)};b.onmouseenter=()=>{if(menus.length&&barOpen&&barOpen!==b.dataset.m)openBar(b)}});
$('#btnHam').onclick=e=>{e.stopPropagation();if(menus.length){closeMenu(0);return}const d=menuDefs();openMenu($('#btnHam'),Object.keys(d).map(k=>({label:k,sub:d[k].filter(x=>x!=='-')})),{gap:4})};
$('#filt').onclick=e=>{e.stopPropagation();if(menus.length){closeMenu(0);return}openMenu($('#filt'),filtItems(),{up:true,right:true,gap:14})};
document.addEventListener('mousedown',e=>{if(menus.length&&!e.target.closest('.menu,[aria-haspopup]'))closeMenu(0)});

/* ---------- events ---------- */
$('#side').addEventListener('click',e=>{const s=e.target.closest('[data-sec]');if(s){S.col[s.dataset.sec]=!S.col[s.dataset.sec];ls.set('col',S.col);renderSide();return}const v=e.target.closest('[data-v]');if(v)go(v.dataset.v)});
$('#scrim').onclick=()=>toggleSide();
$('#content').addEventListener('click',e=>{
  const v=e.target.closest('[data-v]');if(v){go(v.dataset.v);return}
  const a=e.target.closest('[data-act]');if(a){if(a.dataset.act==='unlock'){S.unlocked=true;renderMain();toast('Unlocked (preview)')}else if(a.dataset.act==='import')$('#file').click();return}
  const c=e.target.closest('.cell');if(!c)return;const id=c.dataset.id;
  if(S.selMode){S.picked.has(id)?S.picked.delete(id):S.picked.add(id);c.classList.toggle('sel',S.picked.has(id));$('#pcount').textContent=`${S.picked.size} selected`;return}
  openPhoto(id,S.curIds.slice())});
$('#film').addEventListener('click',e=>{const f=e.target.closest('.ft');if(f&&f.dataset.id!==S.sel){if(S.edit)cancelEdit();S.sel=f.dataset.id;renderDetail()}});
$('#banner').addEventListener('click',e=>{const a=e.target.dataset.act;if(a==='restore')restore([S.sel]);if(a==='purge')purge([S.sel])});
$('#sheet').addEventListener('input',e=>{if(e.target.dataset.k)setDraft(e.target.dataset.k,e.target.value)});
$('#sheet').addEventListener('click',e=>{const a=e.target.closest('[data-act]')?.dataset.act;if(a==='done')doneEdit();if(a==='cancel')cancelEdit();if(a==='auto')autoEnh();if(a==='revert')revert()});
$('#btnSide').onclick=toggleSide;
$('#btnBack').onclick=()=>closeDetail();
$('#tInfo').onclick=()=>{S.info=!S.info;S.edit=false;renderDetail();setTimeout(fit,0)};
$('#tShare').onclick=()=>pv('Share');$('#tFav').onclick=()=>toggleFav();$('#tRot').onclick=()=>rotate(1);$('#tEnh').onclick=autoEnh;
$('#tEdit').onclick=()=>S.edit?doneEdit():openEdit();
$('#vplay').onclick=()=>pv('Video playback');
$('#zoom').value=S.zoom;$('#zoom').oninput=e=>setZoom(+e.target.value);$('#zo').onclick=()=>setZoom(S.zoom+30);$('#zi').onclick=()=>setZoom(S.zoom-30);
$('#selDone').onclick=()=>{S.selMode=false;S.picked.clear();renderMain()};
$('#q').addEventListener('input',e=>{S.q=e.target.value.trim();closeDetail(true);renderMain()});
$('#search').addEventListener('click',()=>{if(app.clientWidth<=700)$('#search').classList.add('open');$('#q').focus()});
$('#q').addEventListener('blur',()=>{if(!$('#q').value)$('#search').classList.remove('open')});
$('#file').onchange=e=>{importFiles(e.target.files);e.target.value=''};
['dragenter','dragover'].forEach(t=>$('#win').addEventListener(t,e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();$('#drop').classList.add('on')}}));
['dragleave','drop'].forEach(t=>$('#win').addEventListener(t,e=>{if(t==='drop'||!$('#win').contains(e.relatedTarget)){$('#drop').classList.remove('on')}if(t==='drop'){e.preventDefault();importFiles(e.dataTransfer.files)}}));
$('#main').addEventListener('wheel',e=>{},{passive:true});
$('#top').addEventListener('wheel',e=>{if(!S.sel)$('#scroll').scrollTop+=e.deltaY},{passive:true});
new ResizeObserver(()=>fit()).observe($('#stage'));

/* keyboard */
document.addEventListener('keydown',e=>{
  const ae=document.activeElement,typing=ae&&(ae.tagName==='INPUT'&&ae.type!=='range');
  if(menus.length){
    const last=menus[menus.length-1],items=$$('.mi:not(.dis)',last.el),i=items.indexOf(ae);
    if(e.key==='Escape'){e.preventDefault();closeMenu(menus.length>1?menus.length-1:0);return}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=e.key==='ArrowDown'?(i+1)%items.length:(i<=0?items.length-1:i-1);items[n]&&items[n].focus();return}
    if(e.key==='ArrowRight'){e.preventDefault();if(ae&&ae.classList.contains('mi')&&ae.querySelector('.sc')){ae.click();const m=menus[menus.length-1];$('.mi:not(.dis)',m.el)?.focus()}else if(menus[0].depth===0&&barOpen){const bs=$$('.mb'),k=bs.findIndex(b=>b.dataset.m===barOpen);if(k>-1){openBar(bs[(k+1)%bs.length]);$('.mi:not(.dis)',menus[0].el)?.focus()}}return}
    if(e.key==='ArrowLeft'){e.preventDefault();if(menus.length>1)closeMenu(menus.length-1);else if(barOpen){const bs=$$('.mb'),k=bs.findIndex(b=>b.dataset.m===barOpen);if(k>-1){openBar(bs[(k+bs.length-1)%bs.length]);$('.mi:not(.dis)',menus[0].el)?.focus()}}return}
    return}
  if(e.key==='Escape'||e.key==='F11'){
    if(e.key==='F11'){e.preventDefault();winAct.fs();return}
    if(document.querySelector('.dlg'))return;
    if(S.show)return stopShow();
    if(S.edit)return cancelEdit();
    if(S.sel&&S.info){S.info=false;return renderDetail()}
    if(winAct.isFs())return winAct.fs();
    if(S.sel)return closeDetail();
    if(S.selMode){S.selMode=false;S.picked.clear();return renderMain()}
    return}
  if(typing||document.querySelector('.dlg'))return;
  if(e.ctrlKey||e.metaKey){const k=e.key.toLowerCase();if(k==='n'){e.preventDefault();newAlbum()}else if(k==='i'){e.preventDefault();$('#file').click()}else if(k==='s'){e.preventDefault();toggleSide()}else if(k==='w'){e.preventDefault();winAct.hide()}return}
  const k=e.key;
  if(S.sel){
    if(k==='ArrowLeft')nav(-1);else if(k==='ArrowRight')nav(1);else if(k==='i'){S.info=!S.info;S.edit=false;renderDetail()}else if(k==='e')S.edit?doneEdit():openEdit();else if(k==='r')rotate(e.shiftKey?-1:1);else if(k==='R')rotate(-1);else if(k==='f')toggleFav();else if(k==='Delete'||k==='Backspace')delPhotos();else if(k===' '){e.preventDefault();toggleShow()}
  }else{if(k==='+'||k==='=')setZoom(S.zoom+30);else if(k==='-')setZoom(S.zoom-30);else if(k==='f')toggleFav();else if(k==='Delete')delPhotos()}
});

/* ---------- window manager ---------- */
const desk=$('#desk'),win=$('#win'),hud=$('#hud');
let R=ls.get('rect',null),maxed=ls.get('max',false),fs=false,prevMax=false;
const area=()=>({w:desk.clientWidth,h:desk.clientHeight-(fs?0:44)});
const defRect=()=>{const a=area(),w=Math.min(1100,a.w-48),h=Math.min(700,a.h-48);return{w,h,x:(a.w-w)/2,y:(a.h-h)/2}};
function clamp(r){const a=area();r.w=Math.max(360,Math.min(r.w,a.w));r.h=Math.max(300,Math.min(r.h,a.h));r.x=Math.max(120-r.w,Math.min(r.x,a.w-120));r.y=Math.max(0,Math.min(r.y,a.h-40));return r}
function apply(){const a=area();win.classList.toggle('max',maxed);
  if(maxed)Object.assign(win.style,{left:'0px',top:'0px',width:a.w+'px',height:a.h+'px'});
  else{R=clamp(R||defRect());Object.assign(win.style,{left:R.x+'px',top:R.y+'px',width:R.w+'px',height:R.h+'px'})}
  const w=win.offsetWidth,h=win.offsetHeight;hud.textContent=`${w} × ${h}, ${Math.round(win.offsetLeft)}, ${Math.round(win.offsetTop)}`;
  if(!fs){ls.set('max',maxed);if(!maxed)ls.set('rect',R)}}
const setRect=r=>{R=r;maxed=false;apply()};
const winAct={
  hide(){win.classList.add('hid');$('#chip').classList.remove('on');closeMenu(0)},
  show(){win.classList.remove('hid');$('#chip').classList.add('on')},
  max(){maxed=!maxed;apply()},
  fs(){if(!fs){prevMax=maxed;fs=true;document.body.classList.add('fs');maxed=true;apply();toast('Full screen — Esc to exit')}else{fs=false;document.body.classList.remove('fs');maxed=prevMax;apply()}},
  isFs:()=>fs};
$('#chip').onclick=()=>win.classList.contains('hid')?winAct.show():winAct.hide();
$('#wMin').onclick=winAct.hide;$('#wClose').onclick=winAct.hide;$('#wMax').onclick=winAct.max;
$$('.pre').forEach(b=>b.onclick=()=>{winAct.show();const a=area(),p=b.dataset.p;if(fs)winAct.fs();
  const c=(w,h)=>setRect({w,h,x:(a.w-w)/2,y:(a.h-h)/2});
  if(p==='min')c(360,300);else if(p==='compact')c(640,440);else if(p==='def')setRect(defRect());else{maxed=true;apply()}});
/* drag */
let drag=null;
$('#top').addEventListener('pointerdown',e=>{if(e.button||e.target.closest('button,input,label,.menus,.tools'))return;drag={x:e.clientX,y:e.clientY,on:false,id:e.pointerId};$('#top').setPointerCapture(e.pointerId)});
$('#top').addEventListener('pointermove',e=>{if(!drag)return;if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<4)return;drag.on=true;
    if(maxed&&!fs){const a=area(),rr=R||defRect(),fx=e.clientX/a.w;maxed=false;R={w:rr.w,h:rr.h,x:e.clientX-rr.w*fx,y:e.clientY-16}}
    else if(maxed){drag=null;return}
    drag.o={x:R.x,y:R.y};drag.sx=e.clientX;drag.sy=e.clientY}
  R.x=drag.o.x+e.clientX-drag.sx;R.y=drag.o.y+e.clientY-drag.sy;apply()});
$('#top').addEventListener('pointerup',()=>{drag=null});
$('#top').addEventListener('dblclick',e=>{if(!e.target.closest('button,input,label,.menus,.tools')&&!fs)winAct.max()});
/* resize */
$$('.rz').forEach(h=>h.addEventListener('pointerdown',e=>{if(e.button)return;e.preventDefault();h.setPointerCapture(e.pointerId);const d=h.dataset.d,s={x:e.clientX,y:e.clientY,r:{...(R||defRect())}};
  const mv=ev=>{const dx=ev.clientX-s.x,dy=ev.clientY-s.y,r={...s.r};
    if(d.includes('e'))r.w=s.r.w+dx;if(d.includes('s'))r.h=s.r.h+dy;
    if(d.includes('w')){r.w=Math.max(360,s.r.w-dx);r.x=s.r.x+s.r.w-r.w}if(d.includes('n')){r.h=Math.max(300,s.r.h-dy);r.y=s.r.y+s.r.h-r.h}
    setRect(r)};
  const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up)};h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up)}));
addEventListener('resize',()=>{apply();fit()});
let narrow=null;
new ResizeObserver(()=>{closeMenu(0);const n=app.clientWidth<=700;if(n!==narrow){narrow=n;S.side=n?false:ls.get('side',true);app.dataset.side=S.side?'on':'off'}fit()}).observe(win);

/* ---------- init ---------- */
applyTheme();apply();renderMain();

})();</script>
