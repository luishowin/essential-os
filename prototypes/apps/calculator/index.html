<style>

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>(()=>{'use strict';
const $=s=>document.querySelector(s),h=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};

/* ---------- engine ---------- */
let q='',fresh=false,err=null,lastRes=0,lastGood=0,lastExpr='';
const FN=['sin','cos','tan','ln','log','√'],OPS='+−×÷^';
let radOnly=false;const rd=a=>st.deg&&!radOnly?a*Math.PI/180:a;
const F={sin:a=>Math.sin(rd(a)),cos:a=>Math.cos(rd(a)),tan:a=>Math.tan(rd(a)),ln:Math.log,log:Math.log10,'√':Math.sqrt,abs:Math.abs};
function ev(src,vx){
 let s=src.replace(/[+−×÷^]+$/,'');if(!s)return null;
 s=s.replace(/−/g,'-').replace(/×/g,'*').replace(/÷/g,'/');
 const o=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length;if(o>0)s+=')'.repeat(o);
 const t=s.match(/(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?|[a-zπ√]+|[-+*/^%()]/gi);
 if(!t||t.join('')!==s)throw 0;
 let i=0;
 const expr=()=>{let v=term();while(t[i]==='+'||t[i]==='-'){const p=t[i++],r=term();v=p==='+'?v+r:v-r}return v};
 const term=()=>{let v=un();while(t[i]==='*'||t[i]==='/'){const p=t[i++],r=un();v=p==='*'?v*r:v/r}return v};
 const un=()=>{if(t[i]==='-'){i++;return -un()}if(t[i]==='+'){i++;return un()}return pow()};
 const pow=()=>{const b=post();if(t[i]==='^'){i++;return Math.pow(b,un())}return b};
 const post=()=>{let v=prim();while(t[i]==='%'){i++;v/=100}return v};
 const prim=()=>{const x=t[i++];if(x==null)throw 0;
  if(/^[\d.]/.test(x))return parseFloat(x);

function render(){
 if(err){exEl.textContent=short(q)+' =';setRs(err)}
 else if(fresh){exEl.textContent=short(lastExpr)+' =';setRs(fmt(lastRes))}
 else{exEl.textContent=short(q);
  if(!q){lastGood=0;setRs('0')}
  else{try{const p=ev(q);if(p!=null&&isFinite(p))lastGood=p}catch{}

 else if(/^\d$/.test(k)){if(fresh){q='';fresh=false}else if(/[)πe%]/.test(last))q+='×';q+=k}
 else if(k==='.'){if(fresh){q='';fresh=false}
  if((q.match(/[\d.]*$/)[0]).includes('.'))return;

 else if(OPS.includes(k)){if(fresh){q=raw(lastRes);fresh=false}
  if(!q){if(k==='−')q='−'}
