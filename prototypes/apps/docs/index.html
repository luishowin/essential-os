<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untitled document</title>
<style>
/* ---------- Design tokens (swap these to re-skin the whole UI) ---------- */
:root{
  --bg:#f9fbfd; --page:#fff; --page-line:#c7c7c7; --line:#c7c7c7;
  --toolbar:#edf2fa; --surface:#fff; --text:#1f1f1f; --muted:#444746; --doc-text:#000;
  --hover:rgba(68,71,70,.08); --hover2:rgba(68,71,70,.12); --on:#d3e3fd; --sep:#c4c7c5;
  --accent:#0b57d0; --share:#c2e7ff; --share-t:#001d35; --upg:#d3e3fd; --upg-t:#0842a0;
  --icon:#444746; --margin:#e1e5ea; --send:#c4c7c5;
  --r-pill:999px; --r-sm:4px;
  --ui:"Google Sans","Product Sans",Roboto,"Segoe UI",system-ui,sans-serif;
}
:root[data-theme=dark]{
  --bg:#131314; --page:#1f1f1f; --page-line:#444746; --line:#444746;
  --toolbar:#1e2530; --surface:#282a2c; --text:#e3e3e3; --muted:#c4c7c5; --doc-text:#e3e3e3;
  --hover:rgba(227,227,227,.08); --hover2:rgba(227,227,227,.14); --on:#2f4a73; --sep:#5f6368;
  --accent:#a8c7fa; --share:#004a77; --share-t:#c2e7ff; --upg:#0842a0; --upg-t:#d3e3fd;
  --icon:#c4c7c5; --margin:#2b2d30; --send:#444746;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.2 var(--ui);overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg.i{width:20px;height:20px;fill:var(--icon);display:block;flex:none}

/* ---------- Top bar ---------- */
.top{display:flex;align-items:flex-start;height:66px;padding:8px 16px 0 20px;flex:none}
.logo{margin:2px 16px 0 0}
.tw{flex:1;min-width:0}
.tr{display:flex;align-items:center;height:28px;font-size:18px}
#title{padding:0 6px;margin-left:-6px;border-radius:var(--r-sm);outline:0;min-width:40px;white-space:nowrap;cursor:text;user-select:text}
#title:focus{outline:2px solid var(--accent)}
.star{width:32px;height:28px;display:grid;place-items:center;margin-left:4px;border-radius:50%}
.star svg{width:18px;height:18px}
.star.on svg.i{fill:#f9ab00}
.mb{display:flex}
.mb button{padding:3px 8px;border-radius:var(--r-sm)}
.mb button:hover,.mb button.open{background:var(--hover)}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.ib:hover{background:var(--hover)}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:2px;height:40px;margin:0 16px;padding:0 10px;border-radius:20px;background:var(--toolbar);flex:none;white-space:nowrap}
.tb{position:relative;width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none}
.tb:hover,.dd:hover{background:var(--hover2)}
.tb.on{background:var(--on)}
.dd{display:flex;align-items:center;gap:2px;height:32px;padding:0 2px 0 8px;border-radius:var(--r-sm)}
.dd svg.i{width:18px;height:18px}
.sep{width:1px;height:20px;margin:0 6px;background:var(--sep);flex:none}
.menus{display:flex;align-items:center;gap:8px;height:32px;width:100px;padding:0 0 0 10px;margin-right:8px;border-radius:var(--r-pill);background:var(--surface)}
.menus svg.i{width:18px;height:18px}
.fs{display:flex;align-items:center}
.fs input{width:34px;height:24px;margin:0 2px;border:1px solid var(--muted);border-radius:var(--r-sm);background:transparent;color:inherit;text-align:center;font:inherit;outline:0;user-select:text}
.fs input:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bar{position:absolute;left:7px;right:7px;bottom:4px;height:3px;background:var(--text)}
.sp{flex:1}
.hide-tb .toolbar{display:none}
.hide-tb #collapse svg{transform:rotate(180deg)}
#collapse{margin-left:6px}

/* ---------- Rulers ---------- */
.rw{display:flex;justify-content:center;height:22px;padding-top:4px;overflow:hidden;flex:none}
.ruler{position:relative;width:794px;height:18px;flex:none;zoom:var(--z,1)}
.ruler .m{position:absolute;top:0;bottom:0;background:var(--margin)}
.ruler .t,.vr .t{position:absolute;background:var(--muted)}
.ruler .t{bottom:5px;width:1px;height:var(--l)}
.ruler .n,.vr .n{position:absolute;font-size:10px;line-height:10px;color:var(--muted)}
.ruler .n{top:2px;transform:translateX(-50%)}
.mk{position:absolute;width:0;height:0;border:5px solid transparent;border-top:8px solid var(--accent)}
.vr{position:absolute;left:0;top:16px;width:16px;height:1123px}
.vr .t{right:0;height:1px;width:var(--l)}
.vr .n{left:3px;transform:translate(0,-50%) rotate(-90deg)}

/* ---------- Canvas + page ---------- */
.main{flex:1;position:relative;min-height:0;border-top:1px solid var(--line)}
.scroller{position:absolute;inset:0;overflow:auto;background:var(--bg)}
.canvas{position:relative;min-height:100%;padding:16px 0 60px}
.sheet{width:794px;margin:0 auto;zoom:var(--z,1)}
.page{min-height:1123px;padding:76px;background:var(--page);color:var(--doc-text);border:1px solid var(--page-line);outline:0;font:11pt/1.38 Arial,Helvetica,sans-serif;user-select:text;cursor:text;overflow-wrap:anywhere}
.page p{margin:0}
.page h1{font:400 26pt/1.2 inherit;margin:0 0 6pt}
.page h2{font:400 20pt/1.2 inherit;margin:12pt 0 4pt}
.page h3{font:400 16pt/1.2 inherit;margin:10pt 0 4pt}
.page img{max-width:100%}
.page table{border-collapse:collapse;width:100%}
.page td{border:1px solid var(--page-line);padding:6px;height:28px}
.page a{color:var(--accent)}
.outline{position:absolute;left:32px;top:16px;width:36px;height:36px;border-radius:50%;background:var(--toolbar);display:grid;place-items:center;z-index:4}
.outline:hover{background:var(--hover2)}

/* ---------- Floating AI prompt ---------- */
.ai{position:absolute;left:50%;bottom:26px;translate:-50% 0;width:674px;max-width:calc(100% - 32px);z-index:5}
.chips{display:flex;justify-content:center;gap:8px;margin-bottom:22px}
.chip{display:flex;align-items:center;gap:8px;height:32px;padding:0 14px 0 10px;border-radius:var(--r-pill);background:var(--toolbar)}
.chip:hover{background:var(--hover2)}
.chip svg.i{width:18px;height:18px}
.box{display:flex;align-items:center;gap:10px;height:62px;padding:0 14px;border-radius:31px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.18),0 6px 16px rgba(0,0,0,.08)}
.box input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--text);font:16px var(--ui);user-select:text}
.box input::placeholder{color:var(--muted)}
.box .ib{width:32px;height:32px}
.send svg.i{fill:currentColor}
.send{width:32px;height:32px;border-radius:50%;background:var(--send);color:#fff;display:grid;place-items:center;flex:none}
.send.ready{background:var(--accent);color:var(--page)}

/* ---------- Popup menu + toast ---------- */
.pop{position:fixed;z-index:50;display:none;min-width:200px;max-height:80vh;overflow:auto;padding:8px 0;border-radius:var(--r-sm);background:var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.15)}
.pop.wide{min-width:322px}
.pop button{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 16px;text-align:left;white-space:nowrap}
.pop button:hover:not(:disabled),.pop button.hl{background:var(--hover)}
.pop button:disabled{opacity:.4;cursor:default}
.pop svg.i{width:18px;height:18px}
.pop .l{flex:1}
.pop kbd{margin-left:28px;font:inherit;color:var(--muted)}
.pop hr{border:0;border-top:1px solid var(--sep);margin:7px 0}
.pop i{font-style:normal}
.pop .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:8px}
.pop .bd{padding:3px 8px;border-radius:var(--r-pill);background:var(--accent);color:var(--page);font-size:11px;font-weight:700}
.pop .ar{border:4px solid transparent;border-left:5px solid var(--muted);border-right:0;margin-left:8px}
.toast{position:fixed;left:20px;bottom:20px;z-index:60;padding:12px 18px;border-radius:var(--r-sm);background:#303030;color:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.show{opacity:1}
@media print{.top,.toolbar,.rw,.ai,.outline,.vr{display:none}.scroller{position:static;overflow:visible}.sheet{zoom:1}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const doc=$('#doc'),pop=$('#pop'),root=document.documentElement;
doc.innerHTML='<p><br></p>';
document.execCommand('defaultParagraphSeparator',false,'p');
document.execCommand('styleWithCSS',false,true);

/* ---- helpers ---- */
let saved=null,tt;
const toast=t=>{const e=$('#toast');e.innerHTML=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1800)};
const ex=(c,v=null)=>{if(document.activeElement!==doc){doc.focus();if(saved){const s=getSelection();s.removeAllRanges();s.addRange(saved)}}document.execCommand(c,false,v);sync()};
const sync=()=>{const empty=!doc.textContent.trim()&&!doc.querySelector('img,table,hr');$('#ai').style.display=empty?'':'none'};
document.addEventListener('selectionchange',()=>{
  const s=getSelection();if(s.rangeCount&&doc.contains(s.anchorNode))saved=s.getRangeAt(0).cloneRange();
  ['bold','italic','underline'].forEach(c=>$(`[data-cmd=${c}]`).classList.toggle('on',document.queryCommandState(c)));
});
doc.addEventListener('input',sync);
// keep editor focus/selection when clicking chrome
$$('.top,.toolbar,.pop,.ai .chip').forEach(e=>e.addEventListener('mousedown',ev=>{if(!ev.target.closest('input,[contenteditable]'))ev.preventDefault()}));
document.addEventListener('click',e=>{const t=e.target.closest('[data-toast]');if(t)toast(t.dataset.toast)});

/* ---- toolbar commands ---- */
$$('[data-cmd]').forEach(b=>b.addEventListener('click',()=>{const[c,v]=b.dataset.cmd.split(':');ex(c,v)}));
$('#prn').onclick=()=>print();

/* ---- font size ---- */
const fsz=$('#fsz');
function setSize(n){
  n=Math.max(1,Math.min(400,+n||11));fsz.value=n;
  if(saved&&!saved.collapsed){
    ex('fontSize',7);
    doc.querySelectorAll('font[size="7"],span[style*="xxx-large"]').forEach(f=>{const s=document.createElement('span');s.style.fontSize=n+'pt';s.append(...f.childNodes);f.replaceWith(s)});
  }else doc.style.fontSize=n+'pt';
}
$('#fm').onclick=()=>setSize(+fsz.value-1);
$('#fp').onclick=()=>setSize(+fsz.value+1);
fsz.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();setSize(fsz.value);doc.focus()}};

  font:['Arial','Georgia','Times New Roman','Courier New','Verdana','Trebuchet MS'].map(f=>[f,null,()=>{ex('fontName',f);set('#fl',f)}]),
  align:[['Left','Ctrl+Shift+L','justifyLeft'],['Center','Ctrl+Shift+E','justifyCenter'],['Right','Ctrl+Shift+R','justifyRight'],['Justified','Ctrl+Shift+J','justifyFull']].map(([l,k,c])=>[l,k,()=>ex(c)]),
  mode:['Editing','Suggesting','Viewing'].map(m=>[m,null,()=>{set('#ml',m);doc.contentEditable=m!=='Viewing'}])

const pop2=$('#pop2');
const T=t=>()=>toast(t),PH=(i,l,k)=>({i,l,k,fn:T(l)}),L=(l,fn,k)=>({l,fn,k});

const wc=()=>{const w=(doc.innerText.match(/\S+/g)||[]).length;toast(w+' word'+(w==1?'':'s'))};
const paste=()=>{try{navigator.clipboard.readText().then(t=>ex('insertText',t),T('Press Ctrl+V to paste'))}catch(e){toast('Press Ctrl+V to paste')}};
function findRep(){const f=prompt('Find');if(!f)return;const r=prompt('Replace with','');if(r===null)return;let n=0;const w=document.createTreeWalker(doc,NodeFilter.SHOW_TEXT);for(let x;x=w.nextNode();)if(x.data.includes(f)){n+=x.data.split(f).length-1;x.data=x.data.split(f).join(r)}toast(n+' replaced');sync()}

    {i:'rec',l:'Record video',badge:'New',fn:T('Record video')},'-',
    {i:'pen',l:'Rename',fn:()=>{const t=$('#title');t.focus();getSelection().selectAllChildren(t)}},

    PH('doc','Page setup'),{i:'print',l:'Print',k:'Ctrl+P',fn:()=>print()}],
  Edit:[

    {i:'cut',l:'Cut',k:'Ctrl+X',dis:nosel,fn:()=>ex('cut')},{i:'copy',l:'Copy',k:'Ctrl+C',dis:nosel,fn:()=>ex('copy')},

  Format:[
    {i:'bold',l:'Text',sub:[L('Bold',()=>ex('bold'),'Ctrl+B'),L('Italic',()=>ex('italic'),'Ctrl+I'),L('Underline',()=>ex('underline'),'Ctrl+U'),L('Strikethrough',()=>ex('strikeThrough'),'Alt+Shift+5'),L('Superscript',()=>ex('superscript'),'Ctrl+.'),L('Subscript',()=>ex('subscript'),'Ctrl+,')]},
    {i:'para',l:'Paragraph styles',sub:blocks},
    {i:'ind',l:'Align & indent',sub:[...DD.align,L('Increase indent',()=>ex('indent')),L('Decrease indent',()=>ex('outdent'))]},
    {i:'lh',l:'Line & paragraph spacing',sub:[['Single',1],['1.15',1.15],['1.5',1.5],['Double',2]].map(([l,v])=>L(l,()=>doc.style.lineHeight=v))},
    {i:'cols',l:'Columns',sub:[['One column',1],['Two columns',2],['Three columns',3]].map(([l,n])=>L(l,()=>doc.style.columnCount=n))},
    {i:'ul',l:'Bullets & numbering',sub:[L('Bulleted list',()=>ex('insertUnorderedList')),L('Numbered list',()=>ex('insertOrderedList'))]},'-',
    PH('hf','Headers & footers'),PH('hash','Page numbers'),PH('orient','Page orientation'),PH('pgl','Switch to Pageless format'),'-',
    {i:'table',l:'Table',dis:1},{i:'img',l:'Image',dis:1},{i:'brd',l:'Borders & lines',dis:1},'-',

  Tools:[
    {i:'spell',l:'Spelling and grammar',sub:[L('Toggle spell check',()=>{doc.spellcheck=!doc.spellcheck;toast('Spell check '+(doc.spellcheck?'on':'off'))})]},
    {i:'wc',l:'Word count',k:'Ctrl+Shift+C',fn:wc},PH('rev','Review suggested edits','Ctrl+Alt+O Ctrl+Alt+U'),{i:'cmp',l:'Compare documents',dis:1},
    PH('quote','Citations'),PH('edit','eSignature'),PH('ol','Line numbers'),PH('lobj','Linked objects'),PH('dict','Dictionary','Ctrl+Shift+Y'),'-',
    PH('tr','Translate document'),PH('mic','Voice typing','Ctrl+Shift+S'),'-',
    PH('bell','Notification settings'),PH('pref','Preferences'),PH('acc','Accessibility')],
  Extensions:[L('No extensions installed',()=>{})],
  Help:[L('Keyboard shortcuts',()=>toast('Standard browser editing shortcuts apply'),'Ctrl+/')]
};
const mb=$('#mb');
Object.keys(MB).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>open(b,MB[k],1);b.onmouseenter=()=>{if(mb.querySelector('.open')&&!b.classList.contains('open'))open(b,MB[k],1)};mb.append(b)});
$$('[data-dd]').forEach(b=>b.addEventListener('click',()=>open(b,DD[b.dataset.dd])));

/* item shape: {i:icon, l:label, k:shortcut, fn, dis:bool|fn, sub:[...], badge, dot}; arrays [label,kbd,fn] and '-' also work */
const N=x=>Array.isArray(x)?{l:x[0],k:x[1],fn:x[2]}:x;
function render(el,items,wide){
  el.innerHTML='';el.classList.toggle('wide',!!wide);
  items.forEach(raw=>{
    if(raw==='-')return el.append(document.createElement('hr'));
    const it=N(raw),dis=typeof it.dis==='function'?it.dis():it.dis,b=document.createElement('button');
    b.disabled=!!dis;
    b.innerHTML=(it.i?`<svg class="i"><use href="#i-${it.i}"/></svg>`:'')+`<span class="l">${it.l}</span>`+(it.k?`<kbd>${it.k}</kbd>`:'')+(it.badge?`<i class="bd">${it.badge}</i>`:'')+(it.dot?'<i class="dot"></i>':'')+(it.sub?'<i class="ar"></i>':'');
    if(it.sub&&!dis){
      const show=()=>{el.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));b.classList.add('hl');render(pop2,it.sub);pop2.style.display='block';
        const r=b.getBoundingClientRect(),w=pop2.offsetWidth,h=pop2.offsetHeight;
        pop2.style.left=(r.right+w+8>innerWidth?r.left-w+4:r.right-4)+'px';pop2.style.top=Math.max(8,Math.min(r.top-8,innerHeight-h-8))+'px'};
      b.onmouseenter=show;b.onclick=show;
    }else if(!dis){
      b.onmouseenter=()=>{if(el===pop){pop2.style.display='none';el.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'))}};
      b.onclick=()=>{close();it.fn&&it.fn()};
    }
    el.append(b);
  });
}
function open(a,items,wide){
  const was=a.classList.contains('open');close();if(was)return;
  a.classList.add('open');render(pop,items,wide);pop.style.display='block';
  const r=a.getBoundingClientRect();
  pop.style.left=Math.max(8,Math.min(r.left,innerWidth-pop.offsetWidth-8))+'px';pop.style.top=r.bottom+2+'px';
}
function close(){pop.style.display=pop2.style.display='none';$$('.open').forEach(e=>e.classList.remove('open'))}
document.addEventListener('mousedown',e=>{if(!e.target.closest('.pop,.open'))close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});

/* ---- rulers (cm scale, 2 cm margins like the original) ---- */
function ruler(el,len,vert){
  const O=76,u=37.795/4;
  for(let j=Math.ceil(-O/u);O+j*u<len;j++){
    const p=O+j*u,q=j%4===0;if(q&&!j||p<0)continue;
    const e=document.createElement('i');
    if(q){e.className='n';e.textContent=Math.abs(j)/4}
    else{e.className='t';e.style.setProperty('--l',(j%2===0?6:3)+'px')}
    e.style[vert?'top':'left']=p+'px';el.append(e);
  }
}
const R=$('#ruler');
['left:0;width:76px','right:0;width:77px'].forEach(s=>{const m=document.createElement('i');m.className='m';m.style.cssText=s;R.append(m)});
ruler(R,794,false);ruler($('#vr'),1123,true);
[71,713].forEach(x=>{const m=document.createElement('b');m.className='mk';m.style.cssText=`left:${x}px;top:${x>100?7:0}px;${x>100?'transform:rotate(0)':''}`;R.append(m)});

sync();
