<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Editor – UI study</title>
<style>
/* ==========================================================
   DESIGN TOKENS — tweak these, everything else follows
   ========================================================== */
:root {
  --font-ui: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --font-doc: var(--font-ui);

  --bg: #ffffff;
  --fg: #121214;
  --muted: #8a8a90;
  --subtle: #cfcfd4;
  --tab-active: #ebebed;
  --tab-hover: #f4f4f6;
  --pill: #f2f2f4;
  --pill-hover: #e7e7ea;
  --accent: #2f6df6;
  --accent-hover: #2560e6;
  --accent-fg: #ffffff;
  --link: #7ba6cb;
  --caret: #b3b3b9;
  --selection: rgba(47, 109, 246, .22);
  --menu-bg: #ffffff;
  --menu-border: rgba(0, 0, 0, .08);
  --shadow: 0 10px 30px rgba(0, 0, 0, .14), 0 1px 3px rgba(0, 0, 0, .08);
  --toast-bg: #1b1b1e;
  --toast-fg: #f4f4f5;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;

  --fs: 15px;      /* document font size   */
  --lh: 1.6;       /* document line height */
  --titlebar-h: 46px;
}
html[data-theme="dark"] {
  --bg: #161618;
  --fg: #ececee;
  --muted: #8e8e96;
  --subtle: #3a3a40;
  --tab-active: #2a2a2e;
  --tab-hover: #202023;
  --pill: #232327;
  --pill-hover: #2f2f34;
  --accent: #4b83ff;
  --accent-hover: #6293ff;
  --link: #8fb8de;
  --caret: #6d6d75;
  --selection: rgba(75, 131, 255, .32);
  --menu-bg: #1f1f23;
  --menu-border: rgba(255, 255, 255, .08);
  --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
  --toast-bg: #ececee;
  --toast-fg: #161618;
}

/* ---------- base ---------- */
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.4 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
button:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg { display: block; flex: none; }
::selection { background: var(--selection); }

.app { display: flex; flex-direction: column; height: 100vh; }

/* ---------- title bar: tabs + menus + window controls ---------- */
.titlebar {
  display: flex; align-items: center; flex: none;
  height: var(--titlebar-h);
  padding: 0 10px 0 8px;
  user-select: none;
}
.tabs { display: flex; align-items: center; min-width: 0; overflow: hidden; }
.tab {
  position: relative; flex: none;
  display: flex; align-items: center; gap: 8px;
  height: 27px; max-width: 240px;
  padding: 0 35px 0 14px;
  border-radius: var(--radius-md);
  font-size: 15px; white-space: nowrap;
  transition: background .12s;
}
.tab .title { overflow: hidden; text-overflow: ellipsis; }
.tab:not(.active):hover { background: var(--tab-hover); }
.tab:not(.active)::after {              /* hairline separator */
  content: ""; position: absolute; right: 0; top: 50%;
  width: 1.5px; height: 12px; margin-top: -6px;
  background: var(--subtle); border-radius: 1px;
}
.tab:has(+ .tab.active)::after, .tab:hover::after { opacity: 0; }
.tab.active {
  background: var(--tab-active);
  min-width: 190px; padding: 0 9px 0 11px;
}
.tab.active .title { flex: 1; }
.tab .title[contenteditable="true"] { outline: 0; text-overflow: clip; cursor: text; min-width: 3ch; }
.tab .x {
  display: grid; place-items: center; width: 18px; height: 18px;
  border-radius: 5px; color: var(--muted);
}
.tab .x:hover { background: var(--pill-hover); color: var(--fg); }

.icon-btn {
  display: grid; place-items: center;
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  color: var(--muted);
}
.icon-btn:hover { background: var(--pill); color: var(--fg); }
.newtab { margin-left: 6px; width: 26px; height: 26px; }

.menubar { display: flex; margin-left: auto; }
.menubar button {
  padding: 6px 19px; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 450; color: var(--fg);
}
.menubar button:hover, .menubar button[aria-expanded="true"] { background: var(--pill); }
.winctl { display: flex; gap: 5px; margin-left: 10px; }
.winctl .icon-btn { color: #55555b; }
html[data-theme="dark"] .winctl .icon-btn { color: #a8a8b0; }

/* ---------- editor ---------- */
.stage { flex: 1; min-height: 0; overflow: auto; padding: 8px 18px 28px; cursor: text; }
.app.shaded .stage, .app.shaded .statusbar { display: none; }
#editor {
  min-height: 100%;
  outline: 0;
  font-family: var(--font-doc);
  font-size: var(--fs);
  line-height: var(--lh);
  caret-color: var(--caret);
  word-wrap: break-word;
}
#editor p { margin: 0 0 .75em; }
#editor p:last-child { margin-bottom: 0; }
#editor h1 { font-size: 1.75em; line-height: 1.25; font-weight: 700; letter-spacing: -.015em; margin: .2em 0 .45em; }
#editor h2 { font-size: 1.4em;  line-height: 1.3;  font-weight: 650; letter-spacing: -.01em; margin: .2em 0 .4em; }
#editor h3 { font-size: 1.15em; line-height: 1.35; font-weight: 650; margin: .2em 0 .35em; }
#editor ul, #editor ol { padding-left: 1.4em; margin: 0 0 .75em; }
#editor a { color: var(--link); text-decoration: none; }
#editor a:hover { text-decoration: underline; }
#editor.plain { white-space: pre-wrap; }

/* ---------- status bar ---------- */
.statusbar {
  display: flex; align-items: center; flex: none;
  padding: 0 12px 14px 14px; gap: 23px;
}
.statusinfo { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); user-select: none; }
.statusinfo > * { padding: 4px 8px; border-radius: var(--radius-sm); white-space: nowrap; }
.statusinfo button:hover { background: var(--pill); color: var(--fg); }
.aa { display: inline-flex; align-items: baseline; gap: 1px; }
.aa small { font-size: .78em; margin-right: 1px; }
.statusbar .spacer { flex: 1; }

.update {
  display: inline-flex; align-items: center; gap: 12px;
  height: 27px; padding: 0 22px 0 16px;
  background: var(--accent); color: var(--accent-fg);
  border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 450; white-space: nowrap;
  transition: background .12s, opacity .4s, transform .4s;
}
.update:hover { background: var(--accent-hover); }
.update.done { background: var(--pill); color: var(--muted); }
.update.gone { opacity: 0; transform: translateY(4px); pointer-events: none; }

.fmtbar {
  display: flex; align-items: center; justify-content: space-between;
  width: 345px; height: 28px; padding: 0 4px;
  background: var(--pill); border-radius: var(--radius-md);
  color: var(--muted); user-select: none;
}
.fmtbar button {
  display: grid; place-items: center; height: 22px; min-width: 40px;
  border-radius: 5px; font-size: 15px; color: var(--muted);
}
.fmtbar button:hover { background: var(--pill-hover); color: var(--fg); }
.fmtbar button.on { color: var(--fg); background: var(--pill-hover); }
.fmtbar .h { display: inline-flex; align-items: center; gap: 2px; padding: 0 6px; min-width: 58px; font-size: 16px; }
.fmtbar .b { font-weight: 800; font-size: 17px; }
.fmtbar .i { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 600; font-size: 17px; }
.fmtbar .abx { font-size: 16px; }
.fmtbar .abx i { font-family: Georgia, serif; font-size: .7em; vertical-align: baseline; position: relative; top: .25em; }
body.is-plain .fmtbar button:not(.keep) { opacity: .4; pointer-events: none; }
.is-hidden { display: none !important; }

/* ---------- menus + toast ---------- */
.menu {
  position: fixed; z-index: 50; min-width: 224px; padding: 6px;
  background: var(--menu-bg); border: 1px solid var(--menu-border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow);
  animation: pop .1s ease-out;
}
@keyframes pop { from { opacity: 0; transform: translateY(-3px) scale(.99); } }
.mi {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 7px 10px 7px 6px; border-radius: var(--radius-sm);
  font-size: 13px; text-align: left; white-space: nowrap;
}
.mi:hover:not(:disabled) { background: var(--pill-hover); }
.mi:disabled { color: var(--muted); }
.mi .ck { width: 14px; display: grid; place-items: center; color: var(--accent); }
.mi kbd { margin-left: auto; padding-left: 24px; font: 11px var(--font-ui); color: var(--muted); }
.msep { height: 1px; margin: 5px 6px; background: var(--menu-border); }
.mlabel { padding: 6px 10px 4px 28px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

.toast {
  position: fixed; left: 50%; bottom: 64px; z-index: 60;
  transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
  padding: 9px 16px; border-radius: 999px;
  background: var(--toast-bg); color: var(--toast-fg);
  font-size: 13px; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 760px) {
  .fmtbar { width: auto; gap: 2px; }
  .fmtbar button { min-width: 30px; }
  .statusinfo .optional { display: none; }
  .menubar button { padding: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">

  <header class="titlebar">
    <div class="tabs" id="tabs" role="tablist" aria-label="Open documents"></div>
    <button class="icon-btn newtab" id="newTab" aria-label="New tab" title="New tab (Alt+T)">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 2v10M2 7h10"/></svg>
    </button>

    <nav class="menubar" id="menubar" aria-label="Main menu">
      <button data-menu="File"     aria-haspopup="menu" aria-expanded="false">File</button>
      <button data-menu="Edit"     aria-haspopup="menu" aria-expanded="false">Edit</button>
      <button data-menu="View"     aria-haspopup="menu" aria-expanded="false">View</button>
      <button data-menu="Settings" aria-haspopup="menu" aria-expanded="false">Settings</button>
    </nav>

    <div class="winctl">
      <button class="icon-btn" id="winShade"   aria-label="Collapse window" title="Collapse">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5l4.5 4.5L11.5 5"/></svg>
      </button>
      <button class="icon-btn" id="winUnshade" aria-label="Expand window" title="Expand">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9l4.5-4.5L11.5 9"/></svg>
      </button>
      <button class="icon-btn" id="winClose"   aria-label="Close window" title="Close">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Document" spellcheck="false"></div>
  </main>

  <footer class="statusbar" id="statusbar">
    <div class="statusinfo" id="statusinfo">
      <span id="pos">Ln 1, Col 1</span>
      <span id="count">0 characters</span>
      <button id="modeBtn" title="Toggle formatted / plain text"><span class="aa"><small>A</small>A</span> <span id="modeLabel">Formatted</span></button>
      <button id="extBtn" class="optional" title="Switch file type"><span id="extLabel">txt file</span></button>
      <span class="optional">UTF-8</span>
    </div>
    <div class="spacer"></div>

    <button class="update" id="update">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5l8.5 4.7v9.6L12 21.5l-8.5-4.7V7.2L12 2.5z"/><path d="M3.8 7.4L12 12l8.2-4.6M12 12v9"/></svg>
      <span id="updateLabel">Update Available: 1.4.1</span>
    </button>

    <div class="fmtbar" id="fmtbar" role="toolbar" aria-label="Formatting">
      <button class="h keep" id="blockBtn" title="Text style" aria-haspopup="menu" aria-expanded="false">
        <span id="blockLabel">H1</span>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:.55"><path d="M3 4.5l3 3 3-3"/></svg>
      </button>
      <button data-cmd="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><circle cx="3.5" cy="5" r="1.5"/><circle cx="3.5" cy="10" r="1.5"/><circle cx="3.5" cy="15" r="1.5"/><rect x="7.5" y="4" width="10" height="2" rx="1"/><rect x="7.5" y="9" width="10" height="2" rx="1"/><rect x="7.5" y="14" width="10" height="2" rx="1"/></svg>
      </button>
      <button class="b" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold">B</button>
      <button class="i" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic">I</button>
      <button data-cmd="link" title="Link" aria-label="Link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>
      <button class="abx" data-cmd="clear" title="Clear formatting" aria-label="Clear formatting">Ab<i>x</i></button>
    </div>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ==========================================================
   helpers
   ========================================================== */
const $  = (s, r = document) => r.querySelector(s);
const editor = $('#editor'), tabsEl = $('#tabs'), app = $('#app');
const KEY = 'ui-lab.quiet-editor.v1';
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const textToHtml = t => t.split('\n').map(l => `<p>${l ? esc(l) : '<br>'}</p>`).join('');
const rid = () => 't' + Math.random().toString(36).slice(2, 8);
const FONTS = {
  sans:  'Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif',
  serif: 'Charter, "Iowan Old Style", "Palatino Linotype", Georgia, serif',
  mono:  'ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace'
};

/* ==========================================================
   state (persisted to localStorage when available)
   ========================================================== */
const seed = () => {
  const first = rid();
  return {
    active: first, theme: 'light', font: 'sans', size: 15, lh: 1.6, bar: true, info: true, spell: false,
    tabs: [
      { id: first, title: 'Top of mind - Oct 30', mode: 'rich', ext: 'txt', html:
        '<p>Contrary to popular belief, Lorem Ipsum is not simply random text. It has roots in a piece of classical Latin literature from 45 BC, making it over 2000 years old. <b><i>Richard McClintock</i></b>, a Latin professor at Hampden-Sydney College in Virginia, looked up one of the more obscure Latin words, consectetur, from a Lorem Ipsum passage, and going through the cites of the word in classical literature, discovered the undoubtable source. Lorem Ipsum comes from sections 1.10.32 and 1.10.33 of "de Finibus Bonorum et Malorum" (The Extremes of Good and Evil) by Cicero, written in 45 BC. This book is a treatise on the theory of ethics, very popular during the Renaissance. The first line of Lorem Ipsum, "Lorem ipsum dolor sit amet..", comes from a line in section <a href="#">1.10.32</a>.</p>' },
      { id: rid(), title: 'Yard shopping list', mode: 'rich', ext: 'txt', html:
        '<h2>Yard</h2><ul><li>Mulch, 3 m³</li><li>Garden gloves</li><li>Hose nozzle</li><li>Tomato stakes</li><li>Weed barrier fabric</li></ul>' },
      { id: rid(), title: 'Christmas dinner planning', mode: 'rich', ext: 'txt', html:
        '<h2>Christmas dinner</h2><p>Guests: 8, one vegetarian.</p><ul><li>Main: roast chicken, 2.5 kg</li><li>Sides: potatoes, greens, something with cranberries</li><li>Dessert: decide before the 20th</li></ul>' }
    ]
  };
};
const load = () => {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.tabs && s.tabs.length) return Object.assign(seed(), s); } catch (e) {}
  return seed();
};
let state = load();
const cur = () => state.tabs.find(t => t.id === state.active) || state.tabs[0];
const commit = () => { const t = cur(); if (t) t.html = editor.innerHTML; };
let saveTimer;
const save = () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { commit(); try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }, 300);
};

/* ==========================================================
   toast
   ========================================================== */
const toastEl = $('#toast'); let toastT;
const toast = msg => {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 1800);
};

/* ==========================================================
   preferences
   ========================================================== */
const mq = matchMedia('(prefers-color-scheme: dark)');
const applyTheme = () => {
  const t = state.theme === 'system' ? (mq.matches ? 'dark' : 'light') : state.theme;
  document.documentElement.dataset.theme = t;
};
mq.addEventListener && mq.addEventListener('change', applyTheme);
const applyPrefs = () => {
  const r = document.documentElement.style;
  r.setProperty('--fs', state.size + 'px');
  r.setProperty('--lh', state.lh);
  r.setProperty('--font-doc', FONTS[state.font]);
  $('#fmtbar').classList.toggle('is-hidden', !state.bar);
  $('#statusinfo').classList.toggle('is-hidden', !state.info);
  editor.spellcheck = !!state.spell;
  applyTheme();
};

/* ==========================================================
   tabs
   ========================================================== */
const renderTabs = () => {
  tabsEl.textContent = '';
  state.tabs.forEach(t => {
    const el = document.createElement('div');
    const on = t.id === state.active;
    el.className = 'tab' + (on ? ' active' : '');
    el.dataset.id = t.id; el.tabIndex = 0;
    el.setAttribute('role', 'tab'); el.setAttribute('aria-selected', on);
    const title = document.createElement('span');
    title.className = 'title'; title.textContent = t.title;
    el.append(title);
    if (on) {
      const x = document.createElement('button');
      x.className = 'x'; x.setAttribute('aria-label', 'Close tab');
      x.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>';
      x.addEventListener('click', e => { e.stopPropagation(); closeTab(t.id); });
      el.append(x);
    }
    tabsEl.append(el);
  });
  const a = $('.tab.active', tabsEl); a && a.scrollIntoView({ block: 'nearest', inline: 'nearest' });
};

const loadActive = (focus = true) => {
  const t = cur();
  if (t.mode === 'plain') editor.textContent = t.text != null ? t.text : t.html; else editor.innerHTML = t.html;
  applyMode(); renderTabs();
  if (focus) { editor.focus(); caretToEnd(); }
  scheduleStatus();
};
const switchTab = id => {
  if (id === state.active) return;
  persistPlain(); commit(); state.active = id; loadActive(); save();
};
const newTab = (title, html, mode) => {
  persistPlain(); commit();
  const n = state.tabs.filter(t => /^Untitled/.test(t.title)).length + 1;
  const t = { id: rid(), title: title || 'Untitled ' + n, html: html || '<p><br></p>', mode: mode || 'rich', ext: 'txt' };
  state.tabs.push(t); state.active = t.id; loadActive(); save();
};
const closeTab = id => {
  const i = state.tabs.findIndex(t => t.id === id); if (i < 0) return;
  const wasActive = id === state.active;
  state.tabs.splice(i, 1);
  if (!state.tabs.length) state.tabs.push({ id: rid(), title: 'Untitled 1', html: '<p><br></p>', mode: 'rich', ext: 'txt' });
  if (wasActive) state.active = state.tabs[Math.min(i, state.tabs.length - 1)].id;
  loadActive(wasActive); save();
};
const renameTab = id => {
  const node = $(`.tab[data-id="${id}"] .title`, tabsEl); if (!node) return;
  const t = state.tabs.find(x => x.id === id); let done = false;
  node.contentEditable = 'true'; node.focus();
  const r = document.createRange(); r.selectNodeContents(node);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  const finish = ok => {
    if (done) return; done = true;
    if (ok) t.title = node.textContent.trim() || t.title;
    renderTabs(); save(); editor.focus();
  };
  node.addEventListener('blur', () => finish(true), { once: true });
  node.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
};
tabsEl.addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) switchTab(t.dataset.id); });
tabsEl.addEventListener('auxclick', e => { if (e.button === 1) { const t = e.target.closest('.tab'); if (t) { e.preventDefault(); closeTab(t.dataset.id); } } });
tabsEl.addEventListener('dblclick', e => { const t = e.target.closest('.tab'); if (t) renameTab(t.dataset.id); });
tabsEl.addEventListener('keydown', e => {
  const t = e.target.closest('.tab'); if (!t || e.target.isContentEditable) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); switchTab(t.dataset.id); }
});
$('#newTab').addEventListener('click', () => newTab());

/* ==========================================================
   formatted / plain mode + file type
   ========================================================== */
const persistPlain = () => { const t = cur(); if (t && t.mode === 'plain') t.text = editor.textContent; };
const applyMode = () => {
  const t = cur(), plain = t.mode === 'plain';
  editor.classList.toggle('plain', plain);
  try { editor.contentEditable = plain ? 'plaintext-only' : 'true'; } catch (e) { editor.contentEditable = 'true'; }
  document.body.classList.toggle('is-plain', plain);
  $('#modeLabel').textContent = plain ? 'Plain' : 'Formatted';
  $('#extLabel').textContent = t.ext + ' file';
};
const toggleMode = () => {
  const t = cur();
  if (t.mode === 'rich') {
    t.richBackup = editor.innerHTML;
    t.plainOrigin = editor.innerText.replace(/\n+$/, '');
    t.mode = 'plain'; t.text = t.plainOrigin; editor.textContent = t.plainOrigin;
  } else {
    const txt = editor.textContent;
    editor.innerHTML = (t.richBackup && txt === t.plainOrigin) ? t.richBackup : textToHtml(txt);
    t.mode = 'rich'; delete t.text;
  }
  commit(); applyMode(); editor.focus(); scheduleStatus(); save();
  toast(t.mode === 'plain' ? 'Plain text mode' : 'Formatted mode');
};
$('#modeBtn').addEventListener('click', toggleMode);
$('#extBtn').addEventListener('click', () => {
  const t = cur(); t.ext = t.ext === 'txt' ? 'html' : 'txt'; applyMode(); save();
});

/* ==========================================================
   file actions
   ========================================================== */
const download = () => {
  persistPlain(); commit();
  const t = cur(), plain = t.mode === 'plain';
  const body = plain ? editor.textContent : editor.innerHTML;
  let data, type;
  if (t.ext === 'html') {
    data = `<!doctype html>\n<meta charset="utf-8">\n<title>${esc(t.title)}</title>\n${plain ? textToHtml(body) : body}`; type = 'text/html';
  } else { data = plain ? body : editor.innerText; type = 'text/plain'; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: type + ';charset=utf-8' }));
  a.download = (t.title.replace(/[\\/:*?"<>|]+/g, '-').trim() || 'document') + '.' + t.ext;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Saved ' + a.download);
};
const openFile = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.txt,.md,.html,text/plain';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const text = await f.text();
    newTab(f.name.replace(/\.[^.]+$/, ''), textToHtml(text));
  };
  inp.click();
};
const resetDemo = () => { try { localStorage.removeItem(KEY); } catch (e) {} state = seed(); applyPrefs(); loadActive(); toast('Demo content restored'); };

/* ==========================================================
   caret position (Ln / Col) + counts
   ========================================================== */
const textNodes = () => {
  const w = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT), arr = []; let n, c = 0;
  while ((n = w.nextNode())) { arr.push({ n, start: c, len: n.nodeValue.length }); c += n.nodeValue.length; }
  return arr;
};
const charRect = (arr, i) => {
  const a = arr.find(x => i >= x.start && i < x.start + x.len); if (!a) return null;
  const r = document.createRange(); r.setStart(a.n, i - a.start); r.setEnd(a.n, i - a.start + 1);
  return r.getClientRects()[0] || r.getBoundingClientRect();
};
const caretInfo = () => {
  const sel = getSelection();
  if (!sel.rangeCount || !sel.focusNode || !editor.contains(sel.focusNode)) return null;
  const lh = parseFloat(getComputedStyle(editor).lineHeight) || 24;
  const pre = document.createRange(); pre.selectNodeContents(editor); pre.setEnd(sel.focusNode, sel.focusOffset);
  const idx = pre.toString().length;
  const arr = textNodes();

  const cr = document.createRange(); cr.setStart(sel.focusNode, sel.focusOffset); cr.collapse(true);
  let rect = cr.getClientRects()[0];
  if (!rect || !rect.height) {
    rect = idx > 0 ? charRect(arr, idx - 1) : null;
    if (!rect) { const el = sel.focusNode.nodeType === 1 ? sel.focusNode : sel.focusNode.parentElement; rect = el.getBoundingClientRect(); }
  }
  const top = rect.top;

  // line number = distinct visual line groups from document start up to the caret
  const tops = [...pre.getClientRects()].filter(r => r.height).map(r => r.top);
  tops.push(top); tops.sort((a, b) => a - b);
  let ln = 0, groupStart = -1e9;
  tops.forEach(t => { if (t > groupStart + lh * 0.5) { ln++; groupStart = t; } });

  // column = characters back to the start of this visual line
  let j = idx;
  while (j > 0 && idx - j < 3000) {
    const r = charRect(arr, j - 1);
    if (!r || Math.abs(r.top - top) > lh * 0.5) break;
    j--;
  }
  return { ln, col: idx - j + 1 };
};

let raf = 0;
const scheduleStatus = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(updateStatus); };
const updateStatus = () => {
  const n = editor.innerText.replace(/\n+$/, '').length;
  $('#count').textContent = n.toLocaleString('en') + ' character' + (n === 1 ? '' : 's');
  const c = caretInfo(); if (c) $('#pos').textContent = `Ln ${c.ln}, Col ${c.col}`;
  updateToolbarState();
};
const caretToEnd = () => {
  const arr = textNodes(), s = getSelection(), r = document.createRange();
  if (arr.length) { const l = arr[arr.length - 1]; r.setStart(l.n, l.len); } else r.setStart(editor, 0);
  r.collapse(true); s.removeAllRanges(); s.addRange(r);
};

/* ==========================================================
   formatting toolbar
   ========================================================== */
try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
const fmtbar = $('#fmtbar');
const exec = (cmd, val) => { editor.focus(); document.execCommand(cmd, false, val); scheduleStatus(); save(); };
const setLink = () => {
  const sel = getSelection(); if (!sel.rangeCount) return;
  const saved = sel.getRangeAt(0).cloneRange();
  const url = prompt('Link URL', 'https://'); if (!url) return;
  editor.focus(); sel.removeAllRanges(); sel.addRange(saved);
  if (sel.isCollapsed) document.execCommand('insertHTML', false, `<a href="${esc(url)}">${esc(url)}</a>`);
  else document.execCommand('createLink', false, url);
  save();
};
fmtbar.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
fmtbar.addEventListener('click', e => {
  const b = e.target.closest('button[data-cmd]'); if (!b) return;
  const c = b.dataset.cmd;
  if (c === 'link') setLink();
  else if (c === 'clear') { exec('removeFormat'); exec('formatBlock', '<p>'); }
  else exec(c);
});
const blockNow = () => {
  try { return (document.queryCommandValue('formatBlock') || '').toLowerCase().replace(/[<>]/g, ''); } catch (e) { return ''; }
};
const updateToolbarState = () => {
  if (cur().mode === 'plain') return;
  fmtbar.querySelectorAll('[data-cmd]').forEach(b => {
    if (['bold', 'italic', 'insertUnorderedList'].includes(b.dataset.cmd)) {
      let on = false; try { on = document.queryCommandState(b.dataset.cmd); } catch (e) {}
      b.classList.toggle('on', on);
    }
  });
  const blk = blockNow();
  $('#blockLabel').textContent = /^h[1-3]$/.test(blk) ? blk.toUpperCase() : 'H1';
  $('#blockLabel').style.opacity = /^h[1-3]$/.test(blk) ? 1 : .75;
};

/* ==========================================================
   menus
   ========================================================== */
let openMenuEl = null, openAnchor = null;
const closeMenu = () => {
  if (openMenuEl) openMenuEl.remove();
  if (openAnchor) openAnchor.setAttribute('aria-expanded', 'false');
  openMenuEl = openAnchor = null;
};
const CHECK = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.5 2.5 4.5-5.5"/></svg>';
const openMenu = (anchor, items, opts = {}) => {
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  items.forEach(it => {
    if (it === '-') { const s = document.createElement('div'); s.className = 'msep'; m.append(s); return; }
    if (it.label && it.header) { const h = document.createElement('div'); h.className = 'mlabel'; h.textContent = it.label; m.append(h); return; }
    const b = document.createElement('button'); b.className = 'mi'; b.setAttribute('role', 'menuitem');
    if (it.disabled) b.disabled = true;
    const ck = document.createElement('span'); ck.className = 'ck'; if (it.checked) ck.innerHTML = CHECK;
    const lb = document.createElement('span'); lb.textContent = it.label;
    b.append(ck, lb);
    if (it.kbd) { const k = document.createElement('kbd'); k.textContent = it.kbd; b.append(k); }
    b.addEventListener('click', () => { closeMenu(); it.run && it.run(); });
    m.append(b);
  });
  m.addEventListener('mousedown', e => e.preventDefault());
  document.body.append(m);
  const r = anchor.getBoundingClientRect();
  let left = opts.right ? r.right - m.offsetWidth : r.left;
  left = Math.max(8, Math.min(left, innerWidth - m.offsetWidth - 8));
  const top = opts.up ? r.top - m.offsetHeight - 8 : r.bottom + 6;
  m.style.left = left + 'px'; m.style.top = Math.max(8, top) + 'px';
  anchor.setAttribute('aria-expanded', 'true');
  openMenuEl = m; openAnchor = anchor;
};
document.addEventListener('mousedown', e => { if (openMenuEl && !openMenuEl.contains(e.target) && !e.target.closest('[aria-haspopup]')) closeMenu(); });
addEventListener('blur', closeMenu);
addEventListener('resize', closeMenu);

const setPref = (k, v) => { state[k] = v; applyPrefs(); save(); };
const zoom = d => { state.size = Math.max(11, Math.min(28, d === 0 ? 15 : state.size + d)); applyPrefs(); save(); toast(state.size + ' px'); };

const menuDefs = () => ({
  File: [
    { label: 'New tab', kbd: 'Alt+T', run: () => newTab() },
    { label: 'Open…', run: openFile },
    { label: 'Rename tab', kbd: 'F2', run: () => renameTab(state.active) },
    { label: 'Save as ' + cur().ext + '…', kbd: 'Ctrl+S', run: download },
    '-',
    { label: 'Restore demo content', run: resetDemo },
    '-',
    { label: 'Close tab', kbd: 'Alt+W', run: () => closeTab(state.active) }
  ],
  Edit: [
    { label: 'Undo', kbd: 'Ctrl+Z', run: () => exec('undo') },
    { label: 'Redo', kbd: 'Ctrl+Shift+Z', run: () => exec('redo') },
    '-',
    { label: 'Select all', kbd: 'Ctrl+A', run: () => { editor.focus(); getSelection().selectAllChildren(editor); scheduleStatus(); } },
    { label: 'Clear formatting', disabled: cur().mode === 'plain', run: () => { exec('removeFormat'); exec('formatBlock', '<p>'); } }
  ],
  View: [
    { label: 'Theme', header: true },
    { label: 'Light',  checked: state.theme === 'light',  run: () => setPref('theme', 'light') },
    { label: 'Dark',   checked: state.theme === 'dark',   run: () => setPref('theme', 'dark') },
    { label: 'System', checked: state.theme === 'system', run: () => setPref('theme', 'system') },
    '-',
    { label: 'Zoom in',    kbd: 'Ctrl +', run: () => zoom(1) },
    { label: 'Zoom out',   kbd: 'Ctrl -', run: () => zoom(-1) },
    { label: 'Reset zoom', kbd: 'Ctrl 0', run: () => zoom(0) },
    '-',
    { label: 'Formatting bar', checked: state.bar,  run: () => setPref('bar', !state.bar) },
    { label: 'Status info',    checked: state.info, run: () => setPref('info', !state.info) }
  ],
  Settings: [
    { label: 'Font', header: true },
    { label: 'Sans',  checked: state.font === 'sans',  run: () => setPref('font', 'sans') },
    { label: 'Serif', checked: state.font === 'serif', run: () => setPref('font', 'serif') },
    { label: 'Mono',  checked: state.font === 'mono',  run: () => setPref('font', 'mono') },
    '-',
    { label: 'Line spacing', header: true },
    { label: 'Compact',     checked: state.lh === 1.4,  run: () => setPref('lh', 1.4) },
    { label: 'Comfortable', checked: state.lh === 1.6,  run: () => setPref('lh', 1.6) },
    { label: 'Relaxed',     checked: state.lh === 1.85, run: () => setPref('lh', 1.85) },
    '-',
    { label: 'Spellcheck', checked: state.spell, run: () => setPref('spell', !state.spell) }
  ]
});

const menubar = $('#menubar');
menubar.addEventListener('click', e => {
  const b = e.target.closest('button[data-menu]'); if (!b) return;
  if (openAnchor === b) { closeMenu(); return; }
  openMenu(b, menuDefs()[b.dataset.menu]);
});
menubar.addEventListener('mouseover', e => {         // hover-switch once a menu is open
  const b = e.target.closest('button[data-menu]');
  if (b && openAnchor && openAnchor !== b && openAnchor.dataset.menu) openMenu(b, menuDefs()[b.dataset.menu]);
});
$('#blockBtn').addEventListener('mousedown', e => e.preventDefault());
$('#blockBtn').addEventListener('click', e => {
  const b = e.currentTarget;
  if (openAnchor === b) { closeMenu(); return; }
  const blk = blockNow();
  const set = tag => () => exec('formatBlock', tag);
  openMenu(b, [
    { label: 'Body',      checked: blk === 'p' || blk === 'div' || blk === '', run: set('<p>') },
    { label: 'Heading 1', checked: blk === 'h1', run: set('<h1>') },
    { label: 'Heading 2', checked: blk === 'h2', run: set('<h2>') },
    { label: 'Heading 3', checked: blk === 'h3', run: set('<h3>') }
  ], { up: true });
});

/* ==========================================================
   update pill, window controls
   ========================================================== */
const upd = $('#update');
upd.addEventListener('click', () => {
  if (upd.classList.contains('done')) return;
  $('#updateLabel').textContent = 'Updating…';
  setTimeout(() => { upd.classList.add('done'); $('#updateLabel').textContent = 'Up to date'; setTimeout(() => upd.classList.add('gone'), 1500); }, 1100);
});
$('#winShade').addEventListener('click',   () => app.classList.add('shaded'));
$('#winUnshade').addEventListener('click', () => app.classList.remove('shaded'));
$('#winClose').addEventListener('click',   () => toast('Close requested (demo: a real shell would handle this)'));

/* ==========================================================
   editor behaviour
   ========================================================== */
editor.addEventListener('input', () => { scheduleStatus(); save(); });
editor.addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return;
  e.preventDefault(); if (e.ctrlKey || e.metaKey) window.open(a.href, '_blank', 'noopener');
});
editor.addEventListener('paste', e => {                // keep pasted content clean
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, t);
});
$('#stage').addEventListener('mousedown', e => {       // click empty space → focus at end
  if (e.target === $('#stage')) { e.preventDefault(); editor.focus(); caretToEnd(); scheduleStatus(); }
});
document.addEventListener('selectionchange', scheduleStatus);

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape') { closeMenu(); return; }
  if (e.altKey && !mod) {
    if (e.key.toLowerCase() === 't') { e.preventDefault(); newTab(); }
    else if (e.key.toLowerCase() === 'w') { e.preventDefault(); closeTab(state.active); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const i = state.tabs.findIndex(t => t.id === state.active), d = e.key === 'ArrowRight' ? 1 : -1;
      switchTab(state.tabs[(i + d + state.tabs.length) % state.tabs.length].id);
    }
  }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); download(); }
  if (mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoom(1); }
  if (mod && e.key === '-') { e.preventDefault(); zoom(-1); }
  if (mod && e.key === '0') { e.preventDefault(); zoom(0); }
  if (e.key === 'F2') { e.preventDefault(); renameTab(state.active); }
});
addEventListener('beforeunload', () => { persistPlain(); commit(); try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} });

/* ==========================================================
   boot
   ========================================================== */
applyPrefs();
loadActive(true);
})();
</script>
</body>
</html>
