<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f7f7f8;--fg:#1d1d1f;--mut:#86868b;--ln:rgba(0,0,0,.09);--glass:rgba(255,255,255,.74);--card:rgba(0,0,0,.05);--sel:rgba(0,0,0,.09);--acc:#ffc20d;--desk:#c9ced8;--grid:rgba(0,0,0,.06);--sh:0 20px 60px rgba(0,0,0,.28);--tb:calc(44px + env(safe-area-inset-bottom,0px));color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--sel:rgba(255,255,255,.13);--bg:#1c1c1e;--fg:#f2f2f4;--mut:#8e8e93;--ln:rgba(255,255,255,.1);--glass:rgba(44,44,46,.74);--card:rgba(255,255,255,.07);--desk:#0e0f13;--grid:rgba(255,255,255,.05);color-scheme:dark}}
:root[data-theme=dark]{--sel:rgba(255,255,255,.13);--bg:#1c1c1e;--fg:#f2f2f4;--mut:#8e8e93;--ln:rgba(255,255,255,.1);--glass:rgba(44,44,46,.74);--card:rgba(255,255,255,.07);--desk:#0e0f13;--grid:rgba(255,255,255,.05);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--desk)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:8px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.desktop{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:var(--tb);overflow:hidden;background-color:var(--desk);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
body.fs .desktop{bottom:0}body.fs .taskbar{display:none}
.window{position:absolute;border-radius:12px;box-shadow:var(--sh)}
.window.max,body.fs .window{border-radius:0}.window.hide{display:none}
.app{position:absolute;inset:0;border-radius:inherit;overflow:hidden;container:app/inline-size;background:var(--bg)}
.rz{position:absolute;z-index:5}.window.max .rz{display:none}
.rz[data-d=n]{top:-4px;left:12px;right:12px;height:8px;cursor:ns-resize}
.rz[data-d=s]{bottom:-4px;left:12px;right:12px;height:8px;cursor:ns-resize}
.rz[data-d=e]{right:-4px;top:12px;bottom:12px;width:8px;cursor:ew-resize}
.rz[data-d=w]{left:-4px;top:12px;bottom:12px;width:8px;cursor:ew-resize}
.rz[data-d=nw]{top:-5px;left:-5px;width:14px;height:14px;cursor:nwse-resize}
.rz[data-d=se]{bottom:-5px;right:-5px;width:14px;height:14px;cursor:nwse-resize}
.rz[data-d=ne]{top:-5px;right:-5px;width:14px;height:14px;cursor:nesw-resize}
.rz[data-d=sw]{bottom:-5px;left:-5px;width:14px;height:14px;cursor:nesw-resize}
.top{position:absolute;top:0;left:0;right:0;height:40px;display:flex;align-items:center;gap:2px;padding:0 8px;z-index:4;user-select:none}
.top button{height:28px;padding:0 10px}.top button:hover,.top button[aria-expanded=true]{background:var(--card)}
.top .sq{width:30px;padding:0;display:grid;place-items:center}
.top nav{display:flex}.sp{flex:1;height:100%}
#hb,#back{display:none}
.topfade,.botfade{position:absolute;left:0;right:0;z-index:3;pointer-events:none}
.topfade{top:0;height:56px;background:linear-gradient(var(--bg) 35%,transparent)}
.botfade{bottom:0;height:92px;background:linear-gradient(to top,var(--bg) 30%,transparent)}
.main{position:absolute;inset:0;display:grid;grid-template-columns:200px 300px minmax(0,1fr)}
.list{overflow:auto;padding:52px 10px 104px;border-right:1px solid var(--ln)}
.ni{display:block;width:100%;text-align:left;padding:9px 12px;margin-bottom:2px;border-radius:10px}
.ni:hover{background:var(--card)}.ni.on{background:var(--sel)}
.ni b,.ni span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni b{font-weight:600}.ni span{color:var(--mut);font-size:12px}.ni i{color:var(--acc);font-style:normal;font-size:10px}
.none{color:var(--mut);text-align:center;margin-top:24px}
.ed{--pad:36px;position:relative;min-width:0;display:flex;flex-direction:column}
#ta{flex:1;width:100%;resize:none;border:0;outline:0;background:transparent;color:inherit;font:16px/1.65 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:56px var(--pad) 104px}
.app.mono #ta{font:14px/1.7 ui-monospace,Menlo,Consolas,monospace}
.empty{margin:auto;text-align:center;color:var(--mut)}
.empty button{margin-top:8px;padding:7px 14px;background:var(--acc);color:#1d1d1f;border-radius:18px}
.pill{position:absolute;bottom:14px;left:0;right:0;margin:0 auto;width:min(100% - 28px,820px);height:50px;border-radius:24px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:0 8px;z-index:4;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);box-shadow:0 8px 30px rgba(0,0,0,.18),0 0 0 1px var(--ln)}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:50%!important}.ib:hover{background:var(--card)}
#add,#add:hover{background:var(--acc);color:#1d1d1f}
.sbox{position:relative}.sbox svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--mut)}
.sbox input{width:100%;height:34px;border:0;outline:0;border-radius:17px;background:var(--card);color:inherit;font:inherit;padding:0 12px 0 32px;-webkit-appearance:none;appearance:none}
.rt{display:flex;align-items:center;gap:4px}.stat{color:var(--mut);font-size:12px;white-space:nowrap;padding:0 6px}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:6;padding:8px 14px;border-radius:14px;background:var(--fg);color:var(--bg);opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.on{opacity:1;pointer-events:auto}.toast button{color:inherit;text-decoration:underline;padding:0 4px}
.menu{position:fixed;z-index:100;min-width:210px;overflow:auto;padding:5px;border-radius:12px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);box-shadow:0 10px 40px rgba(0,0,0,.25),0 0 0 1px var(--ln);animation:sd .12s}
.menu.up{animation-name:su}@keyframes sd{from{transform:translateY(-6px);opacity:0}}@keyframes su{from{transform:translateY(6px);opacity:0}}
.mi{display:grid;grid-template-columns:16px 1fr auto;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:7px!important}
.mi kbd{font:inherit;opacity:.55}.mi:hover:not(:disabled),.mi:focus-visible{background:var(--acc);color:#1d1d1f;outline:0}
.mi:disabled{opacity:.45;cursor:default}.mi.hd{font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.menu hr{border:0;border-top:1px solid var(--ln);margin:4px 6px}
.taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);padding:0 10px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:8px;z-index:50;container:tb/inline-size;background:var(--glass);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-top:1px solid var(--ln)}
.chip{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px}.chip.on{background:var(--card);box-shadow:inset 0 -2px var(--acc)}
.presets button{height:28px;padding:0 9px;color:var(--mut)}.presets button:hover{background:var(--card);color:var(--fg)}
.hud{margin-left:auto;color:var(--mut);font:12px ui-monospace,Menlo,monospace}
@container tb (max-width:560px){.presets,.hud{display:none}}
@container app (max-width:980px){.main{grid-template-columns:140px 220px minmax(0,1fr)}}@container app (max-width:800px){.fold{display:none}.main{grid-template-columns:230px minmax(0,1fr)}.lh{cursor:pointer}.lh::after{content:" ▾";color:var(--mut)}}@container app (max-width:700px){.main{grid-template-columns:200px minmax(0,1fr)}.ib.sec{display:none}}
@container app (max-width:560px){.main{grid-template-columns:1fr}#menubar{display:none}#hb{display:grid}.app:not([data-pane=folders]) #back{display:grid}.app[data-pane=folders] .list,.app[data-pane=folders] .ed,.app[data-pane=list] .fold,.app[data-pane=list] .ed,.app[data-pane=ed] .fold,.app[data-pane=ed] .list{display:none}.list,.fold{border-right:0}}
@container app (max-width:520px){.ed{--pad:18px}.rt{display:none}.pill{grid-template-columns:auto minmax(0,1fr)}}
.fold{overflow:auto;padding:52px 8px 104px;border-right:1px solid var(--ln)}
.fi{display:flex;justify-content:space-between;gap:6px;width:100%;text-align:left;padding:7px 10px;margin-bottom:2px;border-radius:9px}
.fi:hover{background:var(--card)}.fi.on{background:var(--sel)}.fi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fi em{font-style:normal;color:var(--mut);font-size:12px}.fnew{color:var(--mut)}
.fin{display:block;width:100%;height:32px;margin-bottom:6px;border:0;outline:2px solid var(--acc);border-radius:8px;background:var(--bg);color:inherit;font:inherit;padding:0 8px}
.lh{display:block;width:100%;text-align:left;font-weight:700;font-size:20px;padding:0 12px 8px;cursor:default}
.dn{height:34px;padding:0 14px;border-radius:17px!important;background:var(--acc);color:#1d1d1f;font-weight:600}
.tools{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}.tl{flex:none;min-width:36px;height:36px;padding:0 8px;border-radius:10px;font-size:15px}.tl:hover{background:var(--card)}
.app:not([data-mode=edit]) #pille,.app[data-mode=edit] #pillb{display:none}
.ser{font:italic 600 18px/1 Georgia,"Times New Roman",serif}.h1t{font-size:14px}.tl svg.i{width:20px;height:20px}.tools{scroll-snap-type:x proximity}.tl{scroll-snap-align:start}
@container app (max-width:520px){.pill{gap:6px}.dn{padding:0 10px}.tl{min-width:32px;padding:0 4px}.tl[data-t=un],.tl[data-t=re]{display:none}}
.zoom{display:flex;align-items:center;gap:2px}.zoom button{width:28px;height:28px}.zoom #zv{width:auto;min-width:46px;font:12px ui-monospace,Menlo,monospace;color:var(--mut)}
@media(prefers-reduced-motion:reduce){.menu,.toast{animation:none;transition:none}}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>

<div class="desktop" id="desk">
 <div class="window" id="win">
  <div class="app" id="app" data-pane="folders" data-mode="browse">

   </div>
   <div class="topfade"></div><div class="botfade"></div>
   <div class="top" id="top">
    <button class="sq" id="back" aria-label="Notes list"><svg class="i"><use href="#i-back"/></svg></button>

    <span class="sp"></span>
    <button class="sq" id="wmin" aria-label="Minimize"><svg class="i"><use href="#i-min"/></svg></button>

   </div>
   <div class="pill" id="pillb">

    <div class="sbox"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search notes" aria-label="Search notes"></div>
    <span class="rt"><span class="stat" id="stat"></span><button class="ib sec" id="sortb" aria-haspopup="true" aria-expanded="false" aria-label="Sort"><svg class="i"><use href="#i-sort"/></svg></button></span>
   </div>
   <div class="pill" id="pille"><button class="dn" id="done">Done</button><div class="tools" id="tools"><button class="tl" data-t="b" title="Bold" aria-label="Bold"><b>B</b></button><button class="tl" data-t="i" title="Italic" aria-label="Italic"><span class="ser">I</span></button><button class="tl" data-t="h" title="Heading" aria-label="Heading 1"><b class="h1t">H1</b></button><button class="tl" data-t="ul" title="Bulleted list" aria-label="Bulleted list"><svg class="i"><path d="M3 6h5M3 12h5M3 18h5"/><circle cx="14" cy="6" r="1.3" fill="currentColor"/><circle cx="14" cy="12" r="1.3" fill="currentColor"/><circle cx="14" cy="18" r="1.3" fill="currentColor"/></svg></button><button class="tl" data-t="ck" title="Checklist" aria-label="Checklist"><svg class="i"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><button class="tl" data-t="q" title="Quote" aria-label="Quote">❝</button><button class="tl" data-t="tb" title="Table" aria-label="Table"><svg class="i"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 10h17M3.5 14.5h17M10 5v14"/></svg></button><button class="tl" data-t="un" title="Undo" aria-label="Undo">↶</button><button class="tl" data-t="re" title="Redo" aria-label="Redo">↷</button></div><span class="rt"><span class="stat" id="stat2"></span></span></div>

  </div>
  <i class="rz" data-d="n"></i><i class="rz" data-d="s"></i><i class="rz" data-d="e"></i><i class="rz" data-d="w"></i>

 </div>
</div>
<div class="taskbar" id="tb">
 <button class="chip on" id="chip"><svg class="i"><use href="#i-note"/></svg>Notes</button>
 <span class="presets"><button data-p="min">Min</button><button data-p="compact">Compact</button><button data-p="def">Default</button><button data-p="fill">Fill</button></span>
 <span class="sp"></span><span class="hud" id="hud"></span><span class="zoom"><button id="zout" aria-label="Zoom out">−</button><button id="zv" aria-label="Reset zoom">100%</button><button id="zin" aria-label="Zoom in">+</button></span>
</div>
<script>(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={get(k,d){try{const v=localStorage.getItem('notes.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('notes.'+k,JSON.stringify(v))}catch(e){}}};
const win=$('#win'),desk=$('#desk'),app=$('#app'),L=$('#list'),ta=$('#ta'),root=document.documentElement;

/* ---------- data ---------- */
const H=36e5,seed=()=>{const n=Date.now();return[
{id:n+1,f:'inbox',pin:1,ts:n-H,t:'Welcome to Notes\nA calm, local notes app. Everything saves as you type, in this browser only.\n\nTry Alt+N for a new note, / to search, F11 for full screen.'},
{id:n+2,f:'inbox',pin:0,ts:n-5*H,t:'Groceries\nOat milk\nLimes\nCoffee beans (1 kg)\nBatteries AA'},
{id:n+3,f:'ideas',pin:0,ts:n-30*H,t:'Window manager ideas\nSnap to halves, tile on edge drag, remember geometry per app.'}]};
let notes=S.get('data',null);if(!Array.isArray(notes))notes=seed();
let folders=S.get('folders',null),cf=S.get('cf','all'),fedit=null,cur=S.get('cur',null),q='',sort=S.get('sort','ts'),mono=S.get('mono',false),wc=S.get('wc',true),spell=S.get('spell',true),theme=S.get('theme','system'),md=S.get('md',false),tm,tt;if(!Array.isArray(folders)||!folders.length)folders=[{id:'inbox',name:'Notes'},{id:'work',name:'Work'},{id:'ideas',name:'Ideas'}];if(cf!=='all'&&!folders.some(f=>f.id===cf))cf='all';const fo=n=>n.f||'inbox';
const save=()=>S.set('data',notes),get=id=>notes.find(n=>n.id===id);
const title=n=>(n.t.split('\n').find(l=>l.trim())||'New note').trim();
const bodyOf=n=>{const l=n.t.split('\n'),i=l.findIndex(x=>x.trim());return(i<0?'':l.slice(i+1).join(' ').trim())||'No additional text'};
const fmt=ts=>{const d=new Date(ts);return d.toDateString()===new Date().toDateString()?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})};
const visible=()=>{const k=q.toLowerCase();return notes.filter(n=>(q||cf==='all'||fo(n)===cf)&&(!k||n.t.toLowerCase().includes(k))).sort((a,b)=>b.pin-a.pin||(sort==='title'?title(a).localeCompare(title(b)):b.ts-a.ts))};

/* ---------- views ---------- */
function renderList(){const v=visible();L.innerHTML=head()+(v.length?v.map(n=>`<button class="ni${n.id===cur?' on':''}" data-id="${n.id}"><b>${n.pin?'<i>●</i> ':''}${esc(title(n))}</b><span>${fmt(n.ts)} · ${esc(bodyOf(n))}</span></button>`).join(''):'<p class="none">No notes here</p>');bindFin()}
const fname=id=>id==='all'?'All notes':(folders.find(f=>f.id===id)||{name:'Notes'}).name,fcount=id=>notes.filter(n=>id==='all'||fo(n)===id).length,fh=()=>$('#fold').offsetParent===null;
const head=()=>fedit&&fedit===cf&&fh()?'<input class="fin" id="fin" aria-label="Folder name" value="'+esc(fname(cf))+'">':'<button class="lh" id="lh">'+esc(q?'Search':fname(cf))+'</button>';
function renderFold(){$('#fold').innerHTML=[{id:'all',name:'All notes'},...folders].map(f=>f.id===fedit&&!fh()?'<input class="fin" id="fin" aria-label="Folder name" value="'+esc(f.name)+'">':`<button class="fi${f.id===cf?' on':''}" data-f="${f.id}"><span>${esc(f.name)}</span><em>${fcount(f.id)}</em></button>`).join('')+'<button class="fi fnew" id="fnew"><span>+ New folder</span></button>';bindFin()}
function bindFin(){const i=$('#fin');if(!i||i.dataset.b)return;i.dataset.b=1;i.focus();i.select();const ok=()=>{if(fedit===null)return;const v=i.value.trim(),f=folders.find(x=>x.id===fedit);if(f&&v)f.name=v;fedit=null;S.set('folders',folders);renderAll()};i.onblur=ok;i.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')ok();if(e.key==='Escape'){fedit=null;renderAll()}}}
function renderAll(){renderFold();renderList();renderEd()}
function setFold(id){cf=id;S.set('cf',id);q='';$('#q').value='';cur=null;S.set('cur',null);app.dataset.pane='list';app.dataset.mode='browse';renderAll()}
function newFolder(){const f={id:'f'+Date.now(),name:'New folder'};folders.push(f);S.set('folders',folders);cf=f.id;S.set('cf',cf);q='';$('#q').value='';cur=null;fedit=f.id;app.dataset.mode='browse';app.dataset.pane=fh()?'list':'folders';renderAll()}
function delFolder(id){notes.forEach(n=>{if(fo(n)===id)n.f='inbox'});folders=folders.filter(f=>f.id!==id);if(cf===id)cf='all';S.set('folders',folders);S.set('cf',cf);save();renderAll()}
function move(id){const n=get(cur);if(!n)return;n.f=id;save();if(cf!=='all'&&cf!==id){cur=null;app.dataset.mode='browse'}renderAll();toast('Moved to '+fname(id))}
const foldItems=()=>[{label:'All notes',checked:cf==='all',run:()=>setFold('all')},...folders.map(f=>({label:f.name,checked:cf===f.id,run:()=>setFold(f.id)})),'-',{label:'New folder',run:newFolder}];
const folderCtx=id=>[{label:'Rename folder',run:()=>{cf=id;fedit=id;renderAll()}},{label:'Delete folder',disabled:id==='inbox',run:()=>delFolder(id)}];
$('#fold').addEventListener('click',e=>{if(e.target.closest('#fnew'))return newFolder();const b=e.target.closest('[data-f]');if(b)setFold(b.dataset.f)});
$('#fold').addEventListener('contextmenu',e=>{const b=e.target.closest('[data-f]');if(!b||b.dataset.f==='all')return;e.preventDefault();openMenu({x:e.clientX,y:e.clientY},folderCtx(b.dataset.f))});

/* editing tools */

  if(it.sub){let t;b.onmouseenter=()=>{clearTimeout(t);t=setTimeout(()=>openMenu(b,it.sub,{side:1},d+1),80)};b.onmouseleave=()=>clearTimeout(t);b.onclick=()=>openMenu(b,it.sub,{side:1},d+1)}

/* ---------- window manager ---------- */
let R=S.get('rect',null),maxed=S.get('max',null),hidden=false,fsPrev=false;
const dsz=()=>({w:desk.clientWidth,h:desk.clientHeight});
const cen=(w,h)=>{const d=dsz();return{x:Math.round((d.w-w)/2),y:Math.round((d.h-h)/2),w,h}};
const def=()=>{const d=dsz();return cen(Math.min(1100,d.w-48),Math.min(700,d.h-48))};
function apply(){const d=dsz();if(!R)R=def();
 if(maxed){Object.assign(win.style,{left:'0px',top:'0px',width:d.w+'px',height:d.h+'px'})}
 else{R.w=Math.max(360,Math.min(R.w,d.w));R.h=Math.max(300,Math.min(R.h,d.h));R.x=Math.max(120-R.w,Math.min(R.x,d.w-120));R.y=Math.max(0,Math.min(R.y,d.h-40));Object.assign(win.style,{left:R.x+'px',top:R.y+'px',width:R.w+'px',height:R.h+'px'})}
 win.classList.toggle('max',maxed);const r=maxed?{x:0,y:0,w:d.w,h:d.h}:R;$('#hud').textContent=`${Math.round(r.w)}×${Math.round(r.h)}, ${Math.round(r.x)}, ${Math.round(r.y)}`}
const persist=()=>{S.set('rect',R);S.set('max',maxed)};

function fs(on){const b=document.body;if(on===b.classList.contains('fs'))return;if(on){fsPrev=maxed;maxed=true;b.classList.add('fs')}else{maxed=fsPrev;b.classList.remove('fs')}apply()}
function preset(p){fs(false);if(p==='fill')maxed=true;else{maxed=false;R=p==='min'?cen(360,300):p==='compact'?cen(640,440):def()}apply();persist()}
const toggleMax=()=>{if(document.body.classList.contains('fs'))return;maxed=!maxed;apply();persist()};
function track(mv,up){const u=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',u);removeEventListener('pointercancel',u);up&&up(ev)};addEventListener('pointermove',mv);addEventListener('pointerup',u);addEventListener('pointercancel',u)}
$('#top').addEventListener('pointerdown',e=>{if(e.button||e.target.closest('button,input')||document.body.classList.contains('fs'))return;
 const sx=e.clientX,sy=e.clientY;let go=false,ox=0,oy=0;
 track(ev=>{if(!go){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<4)return;go=true;
   if(maxed){const f=sx/dsz().w;maxed=false;R=R||def();R.x=sx-R.w*f;R.y=Math.max(0,sy-20)}
   ox=sx-R.x;oy=sy-R.y}
  R.x=ev.clientX-ox;R.y=ev.clientY-oy;apply()},()=>{if(go)persist()})});

$$('.rz').forEach(el=>el.addEventListener('pointerdown',e=>{if(maxed)return;e.preventDefault();
 const k=el.dataset.d,s={...R},sx=e.clientX,sy=e.clientY;
 track(ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;let x=s.x,y=s.y,w=s.w,hh=s.h;
  if(k.includes('e'))w=s.w+dx;if(k.includes('s'))hh=s.h+dy;
  if(k.includes('w')){w=Math.max(360,s.w-dx);x=s.x+s.w-w}
  if(k.includes('n')){hh=Math.max(300,s.h-dy);y=s.y+s.h-hh}
  R={x,y,w:Math.max(360,w),h:Math.max(300,hh)};apply()},persist)}));
