<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fonts</title>
<style>
:root{
  --bg:#fff;--bg2:#f4f4f6;--fg:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.09);
  --glass:rgba(250,250,252,.74);--accent:#5FC3F2;--accent-fg:#06222f;--card:#fff;--hover:rgba(0,0,0,.055);
  --desk:#e6e7eb;--grid:rgba(0,0,0,.05);--shadow:0 18px 60px rgba(0,0,0,.2);
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --top-h:40px;--pill-h:50px;
}
html[data-theme=dark]{
  --bg:#161618;--bg2:#222225;--fg:#f5f5f7;--muted:#99999f;--line:rgba(255,255,255,.1);
  --glass:rgba(36,36,40,.72);--card:#1d1d20;--hover:rgba(255,255,255,.08);
  --desk:#0c0c0e;--grid:rgba(255,255,255,.04);--shadow:0 18px 60px rgba(0,0,0,.65);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--desk);color:var(--fg);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}

/* scrollbars: transparent track, thumb is a simple rounded vertical rectangle.
   (Chromium ignores ::-webkit-scrollbar once scrollbar-width/color are set, so those are Firefox-only.) */
::-webkit-scrollbar{width:10px;height:10px;background:transparent}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;border:2px solid transparent;background-clip:content-box;min-height:40px;min-width:40px}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}}

/* range sliders: filled track + vertical rounded-rectangle thumb */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:22px;cursor:pointer;outline:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:8px;height:20px;margin-top:-8px;border:0;border-radius:3px;background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:8px;height:20px;border:0;border-radius:3px;background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--fg);outline-offset:2px}

/* desktop + window */
.desktop{position:fixed;inset:0 0 44px 0;overflow:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px}
body.fs .desktop{bottom:0}
body.fs .taskbar{display:none}
.window{position:absolute;display:flex;border-radius:12px;background:var(--bg);overflow:hidden;
  box-shadow:var(--shadow),0 0 0 1px var(--line)}
.window.max,body.fs .window{border-radius:0}
.window.gone{display:none}
.app{container:app/inline-size;position:relative;flex:1;min-width:0;height:100%;overflow:hidden}
.rz{position:absolute;z-index:60}
.rz.n{top:0;left:12px;right:12px;height:5px;cursor:ns-resize}
.rz.s{bottom:0;left:12px;right:12px;height:5px;cursor:ns-resize}
.rz.e{right:0;top:12px;bottom:12px;width:5px;cursor:ew-resize}
.rz.w{left:0;top:12px;bottom:12px;width:5px;cursor:ew-resize}
.rz.ne{top:0;right:0;width:12px;height:12px;cursor:nesw-resize}
.rz.nw{top:0;left:0;width:12px;height:12px;cursor:nwse-resize}
.rz.se{bottom:0;right:0;width:12px;height:12px;cursor:nwse-resize}
.rz.sw{bottom:0;left:0;width:12px;height:12px;cursor:nesw-resize}
.window.max .rz{display:none}

/* taskbar */
.taskbar{position:fixed;left:0;right:0;bottom:0;height:44px;z-index:100;display:flex;align-items:center;gap:10px;padding:0 10px;
  background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);border-top:1px solid var(--line)}
.tchip{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:8px;background:var(--hover);font-weight:500;font-size:13px}
.tchip b{font:700 14px Georgia,serif;color:var(--accent)}
.tchip.on{box-shadow:inset 0 -2px 0 var(--accent)}
.presets{display:flex;gap:2px;margin-left:auto}
.presets button{height:26px;padding:0 10px;border-radius:7px;font-size:12px;color:var(--muted)}
.presets button:hover{background:var(--hover);color:var(--fg)}
.hud{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);min-width:150px;text-align:right}

/* chrome: one continuous canvas */
.topfade,.botfade{position:absolute;left:0;right:0;z-index:20;pointer-events:none}
.topfade{top:0;height:calc(var(--top-h) + 28px);background:linear-gradient(var(--bg) 30%,transparent)}
.botfade{bottom:0;height:calc(var(--pill-h) + 52px);background:linear-gradient(transparent,var(--bg) 72%)}
.top{position:absolute;top:0;left:0;right:0;height:var(--top-h);z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 8px;user-select:none}
.menubar{display:flex;gap:2px}
.mb{height:28px;padding:0 11px;border-radius:7px;font-size:13px;font-weight:500;display:flex;align-items:center}
.mb:hover,.mb[aria-expanded=true]{background:var(--hover)}
.mb.ham{display:none;padding:0 8px}
.wctl{display:flex;gap:6px;padding-right:6px}
.wc{width:36px;height:28px;display:grid;place-items:center;color:var(--muted);opacity:.85;transition:color .15s,opacity .15s}
.wc svg.i{width:20px;height:20px;stroke-width:1.5}
.wc:hover,.wc:focus-visible{color:var(--fg);opacity:1;outline:0}
.wc.x:hover{color:var(--accent)}

/* bottom pill */
.pill{position:absolute;bottom:14px;left:0;right:0;margin:0 auto;width:min(100% - 28px,820px);height:var(--pill-h);z-index:40;
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:0 8px;border-radius:24px;
  background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);
  box-shadow:0 8px 30px rgba(0,0,0,.14),0 0 0 1px var(--line)}
.catbtn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;font-weight:500;font-size:13px;background:var(--hover);white-space:nowrap}
.catbtn:hover{background:var(--line)}
.pvwrap{position:relative;min-width:0}
.pv{width:100%;height:34px;padding:0 34px 0 14px;border:0;border-radius:17px;background:var(--hover);outline:none}
.pv:focus{box-shadow:0 0 0 2px var(--accent)}
.pv::placeholder{color:var(--muted)}
.pvx{position:absolute;right:4px;top:3px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.pr{display:flex;align-items:center;gap:8px;padding-right:4px}
.pr input[type=range]{width:120px;accent-color:var(--accent)}
.szv{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);width:42px;text-align:right}

/* toast */
.toast{position:absolute;left:50%;bottom:calc(var(--pill-h) + 30px);transform:translate(-50%,8px);z-index:70;max-width:calc(100% - 32px);
  padding:9px 16px;border-radius:20px;background:var(--fg);color:var(--bg);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* menus */
.menu{position:fixed;z-index:300;min-width:210px;max-width:310px;overflow:auto;padding:5px;border-radius:12px;
  background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);
  box-shadow:0 14px 44px rgba(0,0,0,.28),0 0 0 1px var(--line);animation:mIn .12s ease-out;color:var(--fg)}
.menu.up{animation-name:mUp}
@keyframes mIn{from{opacity:0;transform:translateY(-4px)}}
@keyframes mUp{from{opacity:0;transform:translateY(6px)}}
.mi{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:7px;font-size:13px;cursor:default;white-space:nowrap}
.mi:hover,.mi.act{background:var(--accent);color:var(--accent-fg)}
.mi .ck{width:14px;text-align:center;font-size:12px}
.mi .lb{flex:1}
.mi .kbd{color:var(--muted);font-size:11.5px}
.mi .arr{opacity:.6;font-size:15px;line-height:1}
.mi:hover .kbd,.mi.act .kbd{color:rgba(6,34,47,.7)}
.mi.dis{opacity:.38;pointer-events:none}
.mh{padding:6px 10px 3px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ms{height:1px;margin:5px 6px;background:var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* content */
.scroll{--pad:28px;position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;
  padding:calc(var(--top-h) + 14px) var(--pad) calc(var(--pill-h) + 64px)}
.hero h1{font-size:40px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.hero .sub{margin-top:6px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:600;background:var(--hover);color:var(--muted)}
.badge.live{background:rgba(95,195,242,.16);color:var(--accent)}
.search{display:flex;align-items:center;gap:10px;height:48px;margin-top:18px;padding:0 8px 0 16px;border-radius:24px;background:var(--bg2);border:1px solid transparent;color:var(--muted)}
.search:focus-within{border-color:var(--accent);background:var(--bg);color:var(--fg)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px;color:var(--fg)}
.search input::placeholder{color:var(--muted)}
.btn{height:32px;padding:0 14px;border-radius:16px;background:var(--hover);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.ib{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--hover);color:var(--fg)}
.notice{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 8px 10px 14px;border-radius:14px;background:var(--bg2);font-size:13px;color:var(--muted)}
.notice span{flex:1;min-width:0}
.toolbar{display:flex;align-items:center;gap:12px;margin:18px 0 14px}
.cats{display:flex;gap:8px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.cats::-webkit-scrollbar{display:none}
.cf{display:flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap;flex:none}
.cf span{font-size:11px;color:var(--muted)}
.cf:hover{background:var(--hover)}
.cf.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cf.on span{color:inherit;opacity:.7}
.tools{display:flex;gap:4px;flex:none}
.tools .btn{display:flex;align-items:center;gap:6px;padding:0 12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"info side" "spec spec";gap:12px 8px;
  padding:14px 10px 18px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;
  content-visibility:auto;contain-intrinsic-size:auto 190px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 6px 24px rgba(0,0,0,.08)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.c-info{grid-area:info;min-width:0}
.c-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-side{grid-area:side}
.c-spec{grid-area:spec;font-size:var(--sz,36px);line-height:1.18;padding-right:6px;overflow:hidden;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.heart.on{color:var(--accent)}
.heart.on svg{fill:var(--accent)}
.grid.list{grid-template-columns:1fr;gap:8px}
.grid.list .card{grid-template-columns:200px minmax(0,1fr) auto;grid-template-areas:"info spec side";align-items:center;gap:16px;padding:10px 10px 10px 18px;contain-intrinsic-size:auto 72px}
.grid.list .c-spec{-webkit-line-clamp:1;line-height:1.3}
.empty{padding:70px 10px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}

/* side sheet */
.sheet{position:absolute;top:var(--top-h);right:12px;bottom:calc(var(--pill-h) + 30px);width:min(450px,calc(100% - 24px));z-index:35;
  border-radius:20px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);
  box-shadow:0 14px 50px rgba(0,0,0,.22),0 0 0 1px var(--line);
  transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none;transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .2s}
.sheet.open{transform:none;opacity:1;pointer-events:auto}
.sh{height:100%;overflow:auto;padding:14px 20px 24px;overscroll-behavior:contain}
.sh-bar{display:flex;align-items:center;justify-content:space-between;margin:0 -8px}
.sh-cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sh-name{font-size:34px;line-height:1.1;margin-top:6px;word-break:break-word;font-weight:400}
.sh-meta{margin-top:6px;color:var(--muted);font-size:12.5px}
.sh-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sh-act .btn{display:flex;align-items:center;gap:6px}
.sh-act .btn.on{background:rgba(95,195,242,.16);color:var(--accent)}
.sh-act .btn.on svg{fill:var(--accent)}
.sh h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:600}
.tester{min-height:96px;padding:12px 14px;border-radius:14px;background:var(--bg2);outline:none;font-size:var(--tsz,40px);line-height:1.25;word-break:break-word}
.tester:focus{box-shadow:0 0 0 2px var(--accent)}
.tctl{display:flex;align-items:center;gap:10px;margin-top:10px}
.tctl select{height:30px;border-radius:15px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 10px;font:inherit;font-size:12.5px;max-width:160px}
.tctl input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.tctl .szv{width:38px}
.st{padding:10px 0;border-top:1px solid var(--line)}
.st-p{font-size:26px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-m{margin-top:2px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glyphs{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.gl{aspect-ratio:1;border-radius:9px;background:var(--bg2);font-size:20px;display:grid;place-items:center;overflow:hidden}
.gl:hover{background:var(--accent);color:var(--accent-fg)}
.wf{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 10px;align-items:baseline}
.wf small{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.wf div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{padding:12px 14px;border-radius:14px;background:var(--bg2);font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.note{margin-top:8px;font-size:12px;color:var(--muted)}

/* responsive tiers: key off WINDOW width */
@container app (max-width:980px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .tools .lbl{display:none}
  .tools .btn{padding:0 10px}
  .grid.list .c-meta{display:none}
  .grid.list .card{grid-template-columns:170px minmax(0,1fr) auto}
}
@container app (max-width:700px){
  .pr .sec{display:none}
  .hero h1{font-size:32px}
  .sheet{width:min(420px,calc(100% - 24px))}
}
@container app (max-width:560px){
  .mb.full{display:none}
  .mb.ham{display:flex}
  .catbtn .lb2{max-width:96px;overflow:hidden;text-overflow:ellipsis}
}
@container app (max-width:520px){
  .scroll{--pad:16px}
  .pr{display:none}
  .pill{grid-template-columns:auto minmax(0,1fr)}
  .sheet{right:8px;width:calc(100% - 16px)}
  .sh{padding:12px 16px 22px}
  .grid{grid-template-columns:1fr}
  .grid.list .card{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"info side" "spec spec"}
  .grid.list .c-spec{-webkit-line-clamp:2}
  .hero h1{font-size:28px}
  .search{height:44px}
  .notice{flex-wrap:wrap;padding:12px 10px 12px 14px}
  .notice span{flex:1 1 calc(100% - 44px)}
  .notice .btn.pri{order:3}
}
@container app (max-width:420px){
  .catbtn .lb2{display:none}
  .catbtn{padding:0 10px}
  .wc.mn{display:none}
  .sh-name{font-size:28px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9.3-9.4A5 5 0 0 1 12 7.5a5 5 0 0 1 9.3 3.1C19.5 15.4 12 20 12 20z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-max" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24"><rect x="5" y="9" width="10" height="10" rx="2"/><path d="M9 9V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-chevup" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m9 8-4 4 4 4M15 8l4 4-4 4"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 5v14M7 19l-3-3M7 19l3-3M17 19V5M17 5l-3 3M17 5l3 3"/></symbol>
  <symbol id="i-type" viewBox="0 0 24 24"><path d="M3 19 8.5 5 14 19M5.3 14h6.4M15 19l3-7.5L21 19M16.2 17h3.6"/></symbol>
</defs></svg>

<div class="desktop" id="desk">
  <div class="window" id="win">
    <div class="app" id="app">

      <div class="scroll" id="scroll">
        <header class="hero">
          <h1>Fonts</h1>
          <div class="sub"><span id="count">Scanning…</span><span class="badge" id="src"></span></div>
          <label class="search">
            <svg class="i"><use href="#i-search"/></svg>

<script>(() => {'use strict';

  serif: 'Times New Roman|Times|Georgia|Garamond|EB Garamond|Palatino|Palatino Linotype|Book Antiqua|Bookman Old Style|Bookman|Cambria|Constantia|Baskerville|Didot|Hoefler Text|Big Caslon|Caslon|Century Schoolbook|Century|Minion Pro|Noto Serif|DejaVu Serif|Liberation Serif|Droid Serif|Merriweather|Playfair Display|Lora|PT Serif|Source Serif Pro|Source Serif 4|IBM Plex Serif|Charter|Iowan Old Style|New York|Perpetua|Rockwell|Sitka|Cormorant|Cormorant Garamond|Crimson Text|Libre Baskerville|Spectral|Bodoni MT|Bodoni 72|Goudy Old Style|MS Mincho|SimSun|Songti SC|Hiragino Mincho ProN|Cochin|Athelas|Plantin|Sabon|Utopia|Georgia Pro|Gentium|Vollkorn|Cardo',
  mono: 'Courier New|Courier|Consolas|Menlo|Monaco|Lucida Console|Andale Mono|SF Mono|DejaVu Sans Mono|Liberation Mono|Ubuntu Mono|Noto Sans Mono|Fira Code|Fira Mono|JetBrains Mono|Source Code Pro|Cascadia Code|Cascadia Mono|IBM Plex Mono|Roboto Mono|Hack|Inconsolata|Anonymous Pro|Space Mono|Droid Sans Mono|OCR A Extended|Iosevka|Victor Mono|Input Mono|Berkeley Mono|Operator Mono|PT Mono|Courier Prime|Overpass Mono|Cousine|Meslo LG S|MesloLGS NF',
  display: 'Impact|Haettenschweiler|Arial Black|Bebas Neue|Anton|Oswald|Stencil|Showcard Gothic|Broadway|Algerian|Jokerman|Copperplate|Papyrus|Rockwell Extra Bold|Bauhaus 93|Chiller|Curlz MT|Cooper Black|Futura Condensed ExtraBold|Gill Sans Ultra Bold|Playbill|Old English Text MT|Blackadder ITC|Trattatello|Herculanum|Luminari|Abril Fatface|Alfa Slab One|Bungee|Righteous|Fredoka One|Lobster Two|Press Start 2P|Orbitron|Silkscreen',
  hand: 'Comic Sans MS|Segoe Script|Segoe Print|Brush Script MT|Lucida Handwriting|Bradley Hand|Snell Roundhand|Zapfino|Noteworthy|Chalkboard|Chalkboard SE|Chalkduster|Apple Chancery|Marker Felt|Ink Free|Mistral|Kristen ITC|Freestyle Script|French Script MT|Monotype Corsiva|Pacifico|Caveat|Dancing Script|Satisfy|Lobster|Indie Flower|Shadows Into Light|Permanent Marker|Amatic SC|Kalam|Patrick Hand',

};

const SAMPLES = [
  { id: 'sentence', label: 'Sentence', text: 'Sphinx of black quartz, judge my vow' },
  { id: 'alphabet', label: 'Alphabet', text: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz' },
  { id: 'numerals', label: 'Numerals', text: '0123456789 $€£¥ %&@#!? (){}[]' },
  { id: 'paragraph', label: 'Paragraph', text: 'Typography is the craft of arranging type so that written language is legible, readable and a pleasure to look at.' }

const S = {
  src: 'probe', fams: [],
  cat: store.get('cat', 'all'), q: '', sort: store.get('sort', 'az'),
  view: store.get('view', 'grid'), size: store.get('size', 36),

const STD_STYLES = ['Regular', 'Italic', 'Bold', 'Bold Italic'];

function parseStyle(label) {
  const l = label.toLowerCase();
  let w = 400;
  if (/thin|hairline/.test(l)) w = 100;
  else if (/extra\s*-?light|ultra\s*-?light/.test(l)) w = 200;
  else if (/semi\s*-?bold|demi/.test(l)) w = 600;
  else if (/extra\s*-?bold|ultra\s*-?bold|heavy/.test(l)) w = 800;
  else if (/black/.test(l)) w = 900;
  else if (/light/.test(l)) w = 300;
  else if (/medium/.test(l)) w = 500;
  else if (/bold/.test(l)) w = 700;

}
function mkStyle(label, full, ps) {
  const p = parseStyle(label);
  return { label, weight: p.weight, italic: p.italic, full: full || '', ps: ps || '' };

const sortStyles = a => a.sort((x, y) => x.weight - y.weight || (x.italic - y.italic));

function classify(name, mono) {
  const n = name.toLowerCase();

  if (mono || /mono|code|courier|console|consolas|menlo|monaco|terminal|typewriter|\bhack\b/.test(n)) return 'mono';
  if (/script|hand|brush|marker|chalk|comic|calligra|cursive|chancery|noteworthy|zapfino|snell|ink free|pacifico|caveat|dancing|satisfy|lobster|mistral|kristen|freestyle|corsiva|handwrit/.test(n)) return 'hand';
  if (/impact|black|display|poster|stencil|showcard|jokerman|broadway|algerian|bauhaus|chiller|curlz|cooper|playbill|blackletter|old english|blackadder|copperplate|herculanum|luminari|trattatello|papyrus|bebas|anton|oswald|haettenschweiler/.test(n)) return 'display';

  for (const cat of Object.keys(CAND)) {

function toggleFav(name) {

    $$('.card', grid).forEach(c => {

/* ----- detail sheet ----- */

/* ---------- menu engine + events ---------- */
const menus = [];
function closeMenu(depth) {
  depth = depth || 0;
  while (menus.length > depth) {
    const m = menus.pop();
    m.el.remove();
    if (m.depth === 0 && m.anchor && m.anchor.setAttribute) m.anchor.setAttribute('aria-expanded', 'false');
  }
}
function openMenu(anchor, items, o) {
  o = o || {};
  const depth = o.depth || 0;
  closeMenu(depth);
  const el = document.createElement('div');
  el.className = 'menu' + (o.up ? ' up' : '');
  el.setAttribute('role', 'menu');
  let timer;
  items.forEach(it => {
    if (it === '-') { const s = document.createElement('div'); s.className = 'ms'; el.appendChild(s); return; }
    if (it.header) { const h = document.createElement('div'); h.className = 'mh'; h.textContent = it.header; el.appendChild(h); return; }
    const r = document.createElement('div');
    r.className = 'mi' + (it.disabled ? ' dis' : '');
    r.setAttribute('role', 'menuitem');
    r.innerHTML = '<span class="ck">' + (it.checked ? '✓' : '') + '</span><span class="lb">' + esc(it.label) + '</span>' +
      (it.kbd ? '<span class="kbd">' + esc(it.kbd) + '</span>' : '') + (it.sub ? '<span class="arr">›</span>' : '');
    r._it = it;
    r.addEventListener('mouseenter', () => {
      $$('.act', el).forEach(x => x.classList.remove('act'));
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (it.sub) openMenu(r, it.sub, { depth: depth + 1, side: true });
        else closeMenu(depth + 1);
      }, 80);
    });
    r.addEventListener('mouseleave', () => clearTimeout(timer));
    r.addEventListener('click', e => {
      e.stopPropagation();
      if (it.sub) { openMenu(r, it.sub, { depth: depth + 1, side: true }); return; }
      closeMenu(0);
      it.run && it.run();
    });
    el.appendChild(r);
  });
  document.body.appendChild(el);
  menus.push({ el, anchor, depth });
  if (depth === 0 && anchor.setAttribute) anchor.setAttribute('aria-expanded', 'true');

  const vw = innerWidth, vh = innerHeight, g = o.gap == null ? 6 : o.gap;
  const r = anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : { left: anchor.x, right: anchor.x, top: anchor.y, bottom: anchor.y, width: 0, height: 0 };
  const avail = o.side ? vh - 16 : (o.up ? r.top - g - 8 : vh - r.bottom - g - 8);
  el.style.maxHeight = Math.max(120, avail) + 'px';
  const w = el.offsetWidth, h = el.offsetHeight;
  let left, top;
  if (o.side) {
    left = r.right + 2; if (left + w > vw - 8) left = r.left - w - 2;
    top = r.top - 6;
  } else {
    left = o.center ? r.left + r.width / 2 - w / 2 : (o.right ? r.right - w : r.left);
    top = o.up ? r.top - g - h : r.bottom + g;
  }
  el.style.left = Math.max(8, Math.min(left, vw - w - 8)) + 'px';
  el.style.top = Math.max(8, Math.min(top, vh - h - 8)) + 'px';
  return el;
}

/* keyboard */
function menuKeys(e) {
  const top = menus[menus.length - 1], rows = $$('.mi:not(.dis)', top.el);
  const cur = rows.findIndex(r => r.classList.contains('act'));
  const setAct = i => { rows.forEach(r => r.classList.remove('act')); if (rows[i]) { rows[i].classList.add('act'); rows[i].scrollIntoView({ block: 'nearest' }); } };
  if (e.key === 'ArrowDown') { e.preventDefault(); setAct(cur < 0 ? 0 : (cur + 1) % rows.length); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setAct(cur < 0 ? rows.length - 1 : (cur - 1 + rows.length) % rows.length); }
  else if (e.key === 'ArrowRight') {
    e.preventDefault();
    const r = rows[cur];
    if (r && r._it.sub) { openMenu(r, r._it.sub, { depth: top.depth + 1, side: true }); const t = menus[menus.length - 1]; const f = $('.mi:not(.dis)', t.el); f && f.classList.add('act'); }
    else if (menus[0].anchor.classList && menus[0].anchor.classList.contains('mb')) stepBar(1);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (top.depth > 0) closeMenu(top.depth);
    else if (menus[0].anchor.classList && menus[0].anchor.classList.contains('mb')) stepBar(-1);
  } else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault(); const r = rows[cur]; if (r) r.click();
  }
}
function stepBar(d) {
  const bs = $$('.mb', mbar).filter(b => b.offsetParent !== null);
  const i = bs.indexOf(menus[0].anchor); if (i < 0) return;
  openBarMenu(bs[(i + d + bs.length) % bs.length]);
}
document.addEventListener('keydown', e => {
  if (menus.length && ['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'Enter', ' '].includes(e.key)) { menuKeys(e); return; }
  if (e.key === 'Escape') {
    if (menus.length) { const a = menus[0].anchor; closeMenu(0); a.focus && a.focus(); }
    else if (document.activeElement && document.activeElement.matches('input,[contenteditable]') && document.activeElement.value) { /* let the field handle it */ }
    else if (S.open) closeSheet();
    else if (WM.isFs()) WM.toggleFs();
    return;
  }
  if (e.key === 'F11') { e.preventDefault(); WM.toggleFs(); return; }
  const typing = e.target.matches && e.target.matches('input,textarea,select,[contenteditable]');
  if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  if (e.key === 'ArrowDown' && !typing && !menus.length && e.altKey) { e.preventDefault(); }
});

/* ---------- window manager ---------- */
const WM = (() => {
  const win = $('#win'), desk = $('#desk'), top = $('#top'), hud = $('#hud'), chip = $('#tchip');
  const MINW = 360, MINH = 300;
  let rect = store.get('rect', null), maxed = !!store.get('max', false), prev = null, fsPrevMax = false, fs = false, gone = false;

  const dsz = () => ({ w: desk.clientWidth, h: desk.clientHeight });
  function defRect() {
    const d = dsz(), w = Math.min(1100, d.w - 48), h = Math.min(700, d.h - 48);
    return { x: Math.round((d.w - w) / 2), y: Math.round((d.h - h) / 2), w, h };
  }
  function clamp(r) {
    const d = dsz();
    r.w = Math.round(Math.max(Math.min(MINW, d.w), Math.min(r.w, d.w)));
    r.h = Math.round(Math.max(Math.min(MINH, d.h), Math.min(r.h, d.h)));
    r.x = Math.round(Math.max(0, Math.min(r.x, d.w - r.w)));
    r.y = Math.round(Math.max(0, Math.min(r.y, d.h - r.h)));
    return r;
  }
  function apply() {
    const d = dsz();
    if (!rect) rect = defRect();
    clamp(rect);
    const r = maxed ? { x: 0, y: 0, w: d.w, h: d.h } : rect;
    win.style.left = r.x + 'px'; win.style.top = r.y + 'px';
    win.style.width = r.w + 'px'; win.style.height = r.h + 'px';
    win.classList.toggle('max', maxed);
    win.classList.toggle('gone', gone);
    chip.classList.toggle('on', !gone);
    $('#wMax').innerHTML = icon(maxed ? 'i-restore' : 'i-chevup');
    $('#wMax').setAttribute('aria-label', maxed ? 'Restore' : 'Maximize');
    hud.textContent = r.w + ' × ' + r.h + '  ·  ' + r.x + ', ' + r.y;
  }
  function save() { store.set('rect', rect); store.set('max', maxed); }

  function toggleMax() { maxed = !maxed; apply(); save(); }
  function setSize(w, h) {
    const d = dsz(); maxed = false;
    rect = clamp({ w, h, x: Math.round((d.w - w) / 2), y: Math.round((d.h - h) / 2) });
    apply(); save();
  }
  function preset(p) {
    if (p === 'min') setSize(MINW, MINH);
    else if (p === 'compact') setSize(640, 440);
    else if (p === 'default') { const r = defRect(); setSize(r.w, r.h); }
    else if (p === 'fill') { maxed = true; apply(); save(); }
  }
  function hide() { gone = true; apply(); }
  function show() { gone = false; apply(); }

  /* drag by the empty top bar, 4px threshold; dragging a maximized window restores it under the pointer */
  let drag = null;
  top.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button,input,a')) return;
    drag = { sx: e.clientX, sy: e.clientY, started: false, r0: maxed ? null : { ...rect } };
    top.setPointerCapture(e.pointerId);
  });
  top.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.started) {
      if (Math.hypot(dx, dy) < 4) return;
      drag.started = true;
      if (maxed) {
        const d = dsz(), base = rect || defRect(), ratio = e.clientX / d.w;
        rect = clamp({ w: base.w, h: base.h, x: Math.round(e.clientX - base.w * ratio), y: 0 });
        maxed = false; apply();
        drag.r0 = { ...rect }; drag.sx = e.clientX; drag.sy = e.clientY;
        return;
      }
    }
    const r = clamp({ ...drag.r0, x: drag.r0.x + (e.clientX - drag.sx), y: drag.r0.y + (e.clientY - drag.sy) });
    rect = r; apply();
  });
  const endDrag = () => { if (drag && drag.started) save(); drag = null; };
  top.addEventListener('pointerup', endDrag);
  top.addEventListener('pointercancel', endDrag);
  top.addEventListener('dblclick', e => { if (!e.target.closest('button,input')) toggleMax(); });

  /* eight resize handles */
  $$('.rz', win).forEach(h => {
    let s = null;
    h.addEventListener('pointerdown', e => {
      if (maxed || e.button !== 0) return;
      s = { x: e.clientX, y: e.clientY, r: { ...rect }, d: h.dataset.d };
      h.setPointerCapture(e.pointerId); e.preventDefault();
    });
    h.addEventListener('pointermove', e => {
      if (!s) return;
      const dx = e.clientX - s.x, dy = e.clientY - s.y, d = s.d, o = s.r, dz = dsz();
      let { x, y, w, hh } = { x: o.x, y: o.y, w: o.w, hh: o.h };
      if (d.includes('e')) w = Math.min(o.w + dx, dz.w - o.x);
      if (d.includes('s')) hh = Math.min(o.h + dy, dz.h - o.y);
      if (d.includes('w')) { const nw = Math.max(MINW, Math.min(o.w - dx, o.x + o.w)); x = o.x + o.w - nw; w = nw; }
      if (d.includes('n')) { const nh = Math.max(MINH, Math.min(o.h - dy, o.y + o.h)); y = o.y + o.h - nh; hh = nh; }
      rect = { x, y, w: Math.max(MINW, w), h: Math.max(MINH, hh) };
      apply();
    });
    const end = () => { if (s) { s = null; save(); } };
    h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
  });

  /* controls */
  $('#wMax').addEventListener('click', toggleMax);
  $('#wMin').addEventListener('click', hide);   /* minimize: hides the window, all state stays alive */
  $('#wClose').addEventListener('click', hide);
  chip.addEventListener('click', () => (gone ? show() : hide()));
  $('#presets').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) { if (gone) show(); preset(b.dataset.p); } });

  /* full screen = maximize + hide taskbar; leaving restores the previous maximized state */
  function toggleFs() {
    if (!fs) { fsPrevMax = maxed; fs = true; maxed = true; document.body.classList.add('fs'); }
    else { fs = false; maxed = fsPrevMax; document.body.classList.remove('fs'); }
    gone = false; apply();
  }
  addEventListener('resize', () => apply());

  return { apply, hide, show, toggleFs, isFs: () => fs, toggleMax };
})();

/* ---------- boot ---------- */
(async function boot() {
  applyTheme();
  probeFonts();
  $('#sz').value = S.size;
  WM.apply();
  renderAll();
  /* if the person already granted access earlier, upgrade to the full list silently */
  try {
    if ('queryLocalFonts' in window && navigator.permissions) {
      const p = await navigator.permissions.query({ name: 'local-fonts' });
      if (p.state === 'granted') await doScan(true);
    }
  } catch (e) {}
})();

})();</script>
