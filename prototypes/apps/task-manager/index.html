<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Manager — Essential OS</title>
<style>
:root{
  --bg:#f5f5f7;--panel:#fff;--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#a1a1a6;
  --line:rgba(0,0,0,.08);--hover:rgba(0,0,0,.05);--accent:#fa2d48;
  --glass:rgba(255,255,255,.72);--shadow:0 10px 36px rgba(0,0,0,.16);
  --wall:#dcdce2;--grid:rgba(0,0,0,.05);--task:rgba(250,250,252,.85);
  --c-cpu:#fa2d48;--c-mem:#7c5cff;--c-disk:#1fb26b;--c-net:#0a84ff;--c-gpu:#ff9f0a;--c-dgpu:#14b8c4;--c-npu:#d946ef;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bar:40px;--pillh:50px;
}
html[data-theme=dark]{
  --bg:#1c1c1e;--panel:#2c2c2e;--fg:#f5f5f7;--fg2:#a1a1a6;--fg3:#636366;
  --line:rgba(255,255,255,.09);--hover:rgba(255,255,255,.07);
  --glass:rgba(44,44,46,.72);--shadow:0 10px 36px rgba(0,0,0,.5);
  --wall:#0d0d10;--grid:rgba(255,255,255,.04);--task:rgba(30,30,33,.85);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wall);color:var(--fg);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* desktop + window */
.desktop{position:fixed;inset:0 0 44px 0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
body.fs .desktop{bottom:0}
body.fs .taskbar{display:none}
.window{position:absolute;border-radius:12px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow),0 0 0 1px var(--line);min-width:360px}
.window.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.window.hid{display:none}
.app{position:absolute;inset:0;container:app/inline-size;overflow:hidden}
.rz{position:absolute;z-index:30}
.rz.n{top:0;left:10px;right:10px;height:5px;cursor:ns-resize}
.rz.s{bottom:0;left:10px;right:10px;height:5px;cursor:ns-resize}
.rz.e{right:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}
.rz.w{left:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}
.rz.ne{top:0;right:0;width:16px;height:16px;cursor:nesw-resize}
.rz.nw{top:0;left:0;width:16px;height:16px;cursor:nwse-resize}
.rz.se{bottom:0;right:0;width:16px;height:16px;cursor:nwse-resize}
.rz.sw{bottom:0;left:0;width:16px;height:16px;cursor:nesw-resize}
.window.max .rz,body.mini .rz.n,body.mini .rz.s,body.mini .rz.ne,body.mini .rz.nw,body.mini .rz.se,body.mini .rz.sw{display:none}

/* taskbar */
.taskbar{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--task);backdrop-filter:blur(24px) saturate(1.6);border-top:1px solid var(--line);z-index:50}
.chip{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:8px;background:var(--hover);font-weight:600}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.chip.off{opacity:.55}
.tb-sp{flex:1}
.hud{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg2);white-space:nowrap}
.presets{display:flex;gap:4px}
.presets button{height:26px;padding:0 10px;border-radius:7px;color:var(--fg2);font-weight:600;font-size:12px}
.presets button:hover{background:var(--hover);color:var(--fg)}

/* top bar */
.top{position:absolute;top:0;left:0;right:0;height:var(--bar);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 8px;user-select:none}
.topfade{position:absolute;top:0;left:0;right:0;height:calc(var(--bar) + 18px);z-index:10;pointer-events:none;background:linear-gradient(var(--bg) 55%,transparent)}
.botfade{position:absolute;bottom:0;left:0;right:0;height:calc(var(--pillh) + 44px);z-index:10;pointer-events:none;background:linear-gradient(transparent,var(--bg) 70%)}
.menus{display:flex;align-items:center;gap:2px}
.menus>button,.burger{height:28px;padding:0 10px;border-radius:7px;font-weight:500;color:var(--fg)}
.menus>button:hover,.menus>button[aria-expanded=true],.burger:hover,.burger[aria-expanded=true]{background:var(--hover)}
.menus .appname{font-weight:700;padding:0 10px 0 6px;display:flex;align-items:center;gap:7px;cursor:default}
.appname i{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.burger{display:none;align-items:center;justify-content:center;width:34px;padding:0}
.wc{display:flex;gap:6px;padding-right:4px}
.wc button{width:30px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--fg2)}
.wc button svg{stroke-width:2;width:20px;height:20px}
.wc button:hover{color:var(--fg)}
.wc button.close:hover{color:var(--accent)}

/* pill */
.pill{position:absolute;bottom:14px;left:0;right:0;margin:0 auto;width:min(100% - 28px,820px);height:var(--pillh);z-index:25;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:0 8px;border-radius:24px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);box-shadow:0 6px 24px rgba(0,0,0,.14),0 0 0 1px var(--line)}
.seg{display:flex;gap:2px;padding:3px;border-radius:18px;background:var(--hover)}
.seg button{height:32px;padding:0 12px;border-radius:15px;display:flex;align-items:center;gap:6px;color:var(--fg2);font-weight:600}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.psearch{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:17px;background:var(--hover);color:var(--fg2);min-width:0}
.psearch input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--fg)}
.psearch:focus-within{box-shadow:0 0 0 2px var(--accent)}
.endbtn{grid-column:3;height:36px;padding:0 16px;border-radius:18px;background:var(--ab,var(--accent));color:#fff;font-weight:700;display:flex;align-items:center;gap:7px}
.endbtn:disabled{opacity:.35;cursor:default}
.endbtn:not(:disabled):hover{filter:brightness(1.08)}

/* menus */
.menu{position:fixed;z-index:200;min-width:210px;max-width:320px;padding:6px;border-radius:12px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);box-shadow:var(--shadow),0 0 0 1px var(--line);overflow-y:auto;animation:mnu .12s ease-out}
.menu.up{animation-name:mnuup}
@keyframes mnu{from{opacity:0;transform:translateY(-4px)}}
@keyframes mnuup{from{opacity:0;transform:translateY(6px)}}
.mi{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 10px 0 6px;border-radius:7px;text-align:left}
.mi:hover,.mi:focus-visible{background:var(--accent);color:#fff;outline:0}
.mi[disabled]{opacity:.4;pointer-events:none}
.mi .ck{width:16px;display:grid;place-items:center}
.mi .ck svg{width:14px;height:14px;stroke-width:2.4}
.mi .lb{flex:1;white-space:nowrap}
.mi .kb{color:var(--fg2);font-size:12px}
.mi:hover .kb{color:rgba(255,255,255,.8)}
.mh{padding:6px 10px 3px 28px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--fg2)}
.msep{height:1px;margin:5px 6px;background:var(--line)}

/* toast */
.toast{position:absolute;left:50%;bottom:calc(var(--pillh) + 30px);transform:translate(-50%,8px);z-index:40;padding:8px 14px;border-radius:14px;background:var(--fg);color:var(--bg);font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 28px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* content */
.scroll{--pad:22px;position:absolute;inset:0;overflow-y:auto;padding:calc(var(--bar) + 10px) var(--pad) calc(var(--pillh) + 14px + 34px);scrollbar-width:thin}
.view{display:none}
.view.on{display:block}
h2.vt{margin:6px 0 14px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.card{padding:12px 14px;border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--line);min-width:0;position:relative;overflow:hidden}
.card .k{display:flex;align-items:center;gap:6px;color:var(--fg2);font-weight:600;font-size:12px}
.card .k i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.card .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.card .s{color:var(--fg2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{padding-bottom:40px}
.card svg.spark{position:absolute;left:0;bottom:0;width:100%;height:32px;opacity:.9}

/* table */
.tbl{border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--line);overflow:clip}
.tr{display:flex;align-items:center;height:34px;padding:0 6px 0 14px;border-top:1px solid var(--line);cursor:default;user-select:none}
.tr.th{height:32px;border-top:0;color:var(--fg2);font-weight:700;font-size:12px;position:sticky;top:var(--bar);z-index:2;background:var(--panel)}
.th .td{cursor:pointer}
.th .td:hover{color:var(--fg)}
.th .td.sorted{color:var(--fg)}
.tr.grp{height:28px;background:var(--hover);font-weight:700;color:var(--fg2);font-size:12px}
.tr.row:hover{background:var(--hover)}
.tr.row.sel{background:var(--accent);color:#fff}
.tr.row.sel .td{background:none!important;color:#fff}
.td{flex:none;width:84px;text-align:right;padding:0 8px;font-variant-numeric:tabular-nums;height:100%;display:flex;align-items:center;justify-content:flex-end;white-space:nowrap}
.td.name{flex:1;width:auto;min-width:0;justify-content:flex-start;gap:9px;font-weight:600}
.td.name span{overflow:hidden;text-overflow:ellipsis}
.td.name i{width:8px;height:8px;border-radius:3px;background:var(--fg3);flex:none}
.td.name i.dot-app{background:var(--accent)}
.td.c-pid{width:70px;color:var(--fg2)}
.td.heat{background:color-mix(in srgb,var(--c) calc(var(--h) * 38%),transparent)}
.no-pid .c-pid,.no-cpu .c-cpu,.no-mem .c-mem,.no-disk .c-disk,.no-net .c-net{display:none}
.empty{padding:30px;text-align:center;color:var(--fg2)}

/* performance */
.perf{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;align-items:start}
.tiles{display:flex;flex-direction:column;gap:6px}
.tile{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:12px;text-align:left;background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.tile{transition:background .15s}
.tile:hover{background:var(--hover)}
.tile[aria-pressed=true]{background:var(--hover);box-shadow:0 0 0 2px var(--c)}
.tile[aria-pressed=true] b,.tile[aria-pressed=true] span{color:var(--c)}
.tile b{font-size:13px}
.tile span{color:var(--fg2);font-size:12px;font-variant-numeric:tabular-nums}
.pdetail h3{margin:0 0 2px;font-size:20px;font-weight:800;display:flex;justify-content:space-between;gap:10px}
.pdetail h3 small{font-size:12px;color:var(--fg2);font-weight:500;align-self:end}
.chart{margin:10px 0 14px;border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--line);overflow:hidden;position:relative}
.chart svg{display:block;width:100%;height:210px}
.chart .cl{position:absolute;left:10px;top:6px;font-size:11px;color:var(--fg2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 18px;margin-bottom:16px}
.stats div{min-width:0}
.stats small{display:block;color:var(--fg2);font-size:12px}
.stats b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.capbar{display:flex;height:12px;border-radius:6px;background:var(--hover);overflow:hidden;margin:-4px 0 8px}
.capbar i{display:block;height:100%}
.capleg{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--fg2);font-size:12px;margin-bottom:16px}
.capleg b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--hover);box-shadow:0 0 0 1px var(--line)}
.cores{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.core{border-radius:10px;background:var(--panel);box-shadow:0 0 0 1px var(--line);overflow:hidden;position:relative;height:56px}
.core svg{position:absolute;inset:0;width:100%;height:100%}
.core span{position:absolute;left:8px;top:4px;font-size:11px;color:var(--fg2);font-variant-numeric:tabular-nums}
.real{padding:14px;border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.real h4{margin:0 0 10px;font-size:13px}
.real h4 em{font-style:normal;font-weight:500;color:var(--fg2)}
.real .stats{margin:0}

/* startup */
.srow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .nm{flex:1;min-width:0}
.srow .nm b{display:block}
.srow .nm small{color:var(--fg2)}
.imp{font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;background:var(--hover);color:var(--fg2)}
.imp.High{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.imp.Medium{background:color-mix(in srgb,var(--c-gpu) 20%,transparent);color:#b36b00}
html[data-theme=dark] .imp.Medium{color:var(--c-gpu)}
.tg{position:relative;width:38px;height:22px;border-radius:11px;background:var(--fg3);flex:none;transition:.15s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg[aria-checked=true]{background:var(--accent)}
.tg[aria-checked=true]::after{left:18px}

/* desktop overlay (HUD) */
.hudov{display:none;position:fixed;left:14px;top:14px;z-index:150;min-width:200px;padding:10px 12px 8px;border-radius:14px;pointer-events:none;background:color-mix(in srgb,var(--panel) 52%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 6px 24px rgba(0,0,0,.18),0 0 0 1px var(--line);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.hudov.on{display:block}
.hudov h5{margin:0 0 4px;font:700 10px/1.4 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
.hudov div.hr{display:flex;align-items:center;gap:8px;height:19px}
.hudov .hr i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.hudov .hr span{flex:1;color:var(--fg2)}
.hudov .hr b{font-weight:600;font-variant-numeric:tabular-nums}

/* sheet */
.sheet{position:absolute;right:14px;top:calc(var(--bar) + 8px);bottom:calc(var(--pillh) + 14px + 14px);width:min(330px,100% - 28px);z-index:22;padding:16px;border-radius:18px;overflow-y:auto;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);box-shadow:var(--shadow),0 0 0 1px var(--line);transform:translateX(calc(100% + 30px));transition:transform .22s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet h3{margin:0 0 2px;font-size:18px;padding-right:30px}
.sheet .x{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--fg2)}
.sheet .x:hover{background:var(--hover);color:var(--fg)}
.sheet dl{margin:14px 0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px}
.sheet dt{color:var(--fg2)}
.sheet dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.sheet .btn{width:100%;height:36px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}
.sheet .btn.alt{background:var(--hover);color:var(--fg);margin-top:8px}

/* mini */
.ministrip{display:none;position:absolute;left:0;right:0;top:var(--bar);bottom:0;z-index:15;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 14px 12px}
body.mini .ministrip{display:grid}
body.mini .scroll,body.mini .pill,body.mini .botfade,body.mini .sheet,body.mini .toast{display:none}
.mcell{position:relative;border-radius:12px;background:var(--panel);box-shadow:0 0 0 1px var(--line);padding:8px 10px;overflow:hidden;min-width:0}
.mcell small{color:var(--fg2);font-weight:600;font-size:11px;display:block}
.mcell b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.mcell svg{position:absolute;left:0;bottom:0;width:100%;height:34%}
.mcell{padding-bottom:18px}

/* tiers: window width, not viewport */
@container app (max-width:980px){.c-disk{display:none}.perf{grid-template-columns:160px minmax(0,1fr)}}
@container app (max-width:700px){
  .c-net{display:none}
  .endbtn span,.psearch kbd{display:none}.endbtn{padding:0 11px}
  .perf{grid-template-columns:1fr}
  .tiles{flex-direction:row;overflow-x:auto;padding-bottom:4px}.tile{min-width:120px;flex:1}
}
@container app (max-width:560px){
  .menus>button:not(.appname):not(.burger){display:none}.menus .appname span{display:none}
  .burger{display:flex}
  .c-pid{display:none}
}
@container app (max-width:520px){
  .scroll{--pad:12px}
  h2.vt{font-size:20px}
  .seg button span{display:none}.seg button{padding:0 11px}
  .card .v{font-size:20px}
}
@container app (max-width:420px){
  .psearch{display:none}
  .pill{grid-template-columns:auto 1fr auto}
  .sopen .psearch{display:flex;position:absolute;left:0;right:0;bottom:calc(100% + 10px);background:var(--glass);backdrop-filter:blur(28px);box-shadow:var(--shadow)}
  .tiles .tile{min-width:100px}
  .ministrip{gap:6px;padding:0 8px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="desktop" id="desk">
 <div class="window" id="win">

 </div>

<script>(() => {'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const NS = 'taskmgr.';
const store = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} }
};
let toastT;
function toast(msg) {

}
const fmtMem = mb => mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : Math.round(mb) + ' MB';
const fmtPct = v => v.toFixed(1) + '%';
const fmtDisk = v => v < 0.05 ? '0 MB/s' : v.toFixed(1) + ' MB/s';
const fmtNet = v => v < 0.05 ? '0 Mbps' : v.toFixed(1) + ' Mbps';
const fmtUp = s => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h + ':' + String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const icon = id => '<svg class="i"><use href="#i-' + id + '"/></svg>';

/* ---------- state ---------- */
const S = Object.assign({
  view: 'proc', sort: { k: 'cpu', d: -1 }, group: true,
  cols: { pid: true, cpu: true, mem: true, disk: true, net: true },
  speed: 1000, paused: false, overlay: false, theme: 'system', perfSel: 'cpu',
  startup: { 'Cloud sync': true, 'Essential Music': true, 'Print spooler UI': false, 'Update notifier': true, 'Screenshot helper': false, 'VPN tray': true }
}, store.get('state', {}));
S.cols = Object.assign({ pid: true, cpu: true, mem: true, disk: true, net: true }, S.cols);
S.sel = null; S.q = ''; S.mini = false;
const saveState = () => store.set('state', { view: S.view, sort: S.sort, group: S.group, cols: S.cols, speed: S.speed, overlay: S.overlay, theme: S.theme, perfSel: S.perfSel, startup: S.startup });

/* ---------- simulated processes ---------- */
const CORES = 24; // simulated: Ryzen AI 9 HX 375, 12 cores / 24 threads
const MEM_TOTAL = 64 * 1024; // simulated 64 GB
const DISK_TB = 2, DISK_USED_GB = 640;
const SEED = [
  // name, type, cpu, mem MB, disk MB/s, net Mbps, threads, user, protected
  ['Essential Editor', 'Apps', 3, 410, .2, 0, 24, 'luis'],
  ['Essential Music', 'Apps', 4, 280, .4, 1.2, 31, 'luis'],
  ['Files', 'Apps', 1, 120, .6, 0, 14, 'luis'],
  ['Terminal', 'Apps', 1.5, 85, .1, 0, 8, 'luis'],
  ['Web Browser', 'Apps', 9, 1450, .8, 6, 78, 'luis'],
  ['Settings', 'Apps', .3, 95, 0, 0, 12, 'luis'],
  ['pipewire', 'Background', 1.2, 38, 0, 0, 6, 'luis'],
  ['NetworkManager', 'Background', .4, 24, 0, .3, 5, 'root'],
  ['bluetoothd', 'Background', .1, 9, 0, 0, 3, 'root'],
  ['cupsd', 'Background', 0, 14, 0, 0, 4, 'root'],
  ['tracker-miner', 'Background', 2.5, 210, 2.5, 0, 9, 'luis'],
  ['cloud-sync', 'Background', 1.8, 160, .5, 2.4, 11, 'luis'],
  ['update-notifier', 'Background', .1, 52, 0, 0, 4, 'luis'],
  ['ssh-agent', 'Background', 0, 4, 0, 0, 1, 'luis'],
  ['cron', 'Background', 0, 3, 0, 0, 1, 'root'],
  ['polkitd', 'Background', .1, 18, 0, 0, 4, 'root'],
  ['essential-wm', 'System', 4, 340, 0, 0, 16, 'luis', 1],
  ['systemd', 'System', .2, 24, 0, 0, 1, 'root', 1],
  ['systemd-journald', 'System', .3, 48, .3, 0, 1, 'root', 1],
  ['systemd-udevd', 'System', 0, 11, 0, 0, 1, 'root', 1],
  ['dbus-daemon', 'System', .2, 8, 0, 0, 2, 'root', 1],
  ['kworker/u16:2', 'System', .6, 0, .1, 0, 1, 'root', 1],
  ['ksoftirqd/0', 'System', .2, 0, 0, 0, 1, 'root', 1],
  ['kthreadd', 'System', 0, 0, 0, 0, 1, 'root', 1]

let procs = [], nextPid = 1200;
function seedProcs() {
  procs = SEED.map((r, i) => ({
    pid: i === 17 ? 1 : i === 23 ? 2 : (nextPid += 7 + (i * 13) % 31),
    name: r[0], type: r[1], base: r[2], bmem: r[3], bdisk: r[4], bnet: r[5], threads: r[6], user: r[7], prot: !!r[8],
    cpu: r[2], mem: r[3], disk: r[4], net: r[5], prio: 'Normal', started: Date.now() - Math.random() * 3.6e6
  }));
}
seedProcs();

/* ---------- history + tick ---------- */
const HN = 60;
const cpuGHz = () => 2.0 + T.cpu / 100 * 3.1;
const H = { cpu: [], mem: [], disk: [], net: [], gpu: [], dgpu: [], npu: [] };
const coreH = Array.from({ length: CORES }, () => []);
const T = { cpu: 0, mem: 0, memMB: 0, disk: 0, net: 0, gpu: 0, dgpu: 0, npu: 0, cores: [], threads: 0 };
let dBurst = 0, nBurst = 0;
const push = (a, v) => { a.push(v); if (a.length > HN) a.shift(); };
const jit = (b, amt) => Math.max(0, b * (1 + (Math.random() - .5) * amt));
function tick() {
  for (const p of procs) {
    const spike = Math.random() < .03 ? 2 + Math.random() * 3 : 1;
    p.cpu = clamp(p.cpu * .55 + jit(p.base, 1.2) * spike * .45, 0, 60);
    p.mem = clamp(p.mem + (Math.random() - .48) * p.bmem * .006, p.bmem * .8, p.bmem * 1.3);
    p.disk = p.bdisk ? clamp(p.disk * .5 + jit(p.bdisk, 2.2) * .5, 0, 80) : 0;
    p.net = p.bnet ? clamp(p.net * .5 + jit(p.bnet, 2) * .5, 0, 200) : 0;
  }
  T.cpu = clamp(procs.reduce((a, p) => a + p.cpu, 0) + 2 + Math.random() * 2, 1, 100);
  T.memMB = 9200 + procs.reduce((a, p) => a + p.mem, 0);
  T.mem = T.memMB / MEM_TOTAL * 100;
  T.disk = procs.reduce((a, p) => a + p.disk, 0);
  T.net = procs.reduce((a, p) => a + p.net, 0);
  T.gpu = clamp(T.gpu * .7 + (4 + T.cpu * .35 + Math.random() * 6) * .3, 0, 100);
  if (dBurst <= 0 && Math.random() < .04) dBurst = 4 + Math.random() * 8;
  T.dgpu = clamp(T.dgpu * .6 + (dBurst > 0 ? 45 + Math.random() * 45 : 1 + Math.random() * 4) * .4, 0, 100); dBurst--;
  if (nBurst <= 0 && Math.random() < .05) nBurst = 3 + Math.random() * 7;
  T.npu = clamp(T.npu * .5 + (nBurst > 0 ? 30 + Math.random() * 55 : Math.random() * 2) * .5, 0, 100); nBurst--;
  T.threads = procs.reduce((a, p) => a + p.threads, 0);
  T.cores = coreH.map((h, i) => clamp(T.cpu * (.6 + Math.random() * .8) + (i === 0 ? 4 : 0), 0, 100));
  T.cores.forEach((v, i) => push(coreH[i], v));
  push(H.cpu, T.cpu); push(H.mem, T.mem); push(H.disk, T.disk); push(H.net, T.net); push(H.gpu, T.gpu); push(H.dgpu, T.dgpu); push(H.npu, T.npu);
}
for (let i = 0; i < HN; i++) tick();

/* ---------- real, browser-side stats ---------- */
const R = { fps: 0, heap: null, heapMax: null, batt: null, net: null };
(function fpsLoop() {
  let n = 0, t0 = performance.now();
  const f = t => { n++; if (t - t0 >= 1000) { R.fps = Math.round(n * 1000 / (t - t0)); n = 0; t0 = t; } requestAnimationFrame(f); };
  requestAnimationFrame(f);
})();
function readReal() {
  if (performance.memory) { R.heap = performance.memory.usedJSHeapSize / 1048576; R.heapMax = performance.memory.jsHeapSizeLimit / 1048576; }
  const c = navigator.connection; R.net = c ? (c.effectiveType || '—') + (c.downlink ? ' · ' + c.downlink + ' Mbps' : '') : null;
}
try { navigator.getBattery && navigator.getBattery().then(b => { const u = () => R.batt = Math.round(b.level * 100) + '%' + (b.charging ? ' ⚡' : ''); u(); b.addEventListener('levelchange', u); b.addEventListener('chargingchange', u); }).catch(() => {}); } catch (e) {}
const BOOT = Date.now();

/* ---------- colours / metrics meta ---------- */
const METRICS = {
  cpu: { name: 'CPU', c: 'var(--c-cpu)', max: 100, val: () => fmtPct(T.cpu), sub: () => 'AMD Ryzen AI 9 HX 375 · ' + cpuGHz().toFixed(2) + ' GHz' },
  mem: { name: 'Memory', c: 'var(--c-mem)', max: 100, val: () => fmtPct(T.mem), sub: () => fmtMem(T.memMB) + ' of 64 GB' },
  disk: { name: 'Storage', c: 'var(--c-disk)', max: 0, val: () => fmtDisk(T.disk), sub: () => 'Samsung 9100 PRO · 2 TB (simulated)' },
  net: { name: 'Network', c: 'var(--c-net)', max: 0, val: () => fmtNet(T.net), sub: () => 'wlan0 (simulated)' },
  gpu: { name: 'GPU 0', c: 'var(--c-gpu)', max: 100, val: () => fmtPct(T.gpu), sub: () => 'AMD Radeon 890M · integrated (simulated)' },
  dgpu: { name: 'GPU 1', c: 'var(--c-dgpu)', max: 100, val: () => fmtPct(T.dgpu), sub: () => 'NVIDIA RTX PRO 6000 Blackwell · 96 GB (simulated)' },
  npu: { name: 'NPU', c: 'var(--c-npu)', max: 100, val: () => fmtPct(T.npu), sub: () => 'AMD XDNA 2 NPU · 50 TOPS (simulated)' }
};
function histMax(k) { const m = METRICS[k]; return m.max || Math.max(10, Math.ceil(Math.max(...H[k]) * 1.25 / 10) * 10); }
function sparkPath(arr, max, w, h, close) {
  const n = arr.length, st = w / (HN - 1), off = (HN - n) * st;
  let d = arr.map((v, i) => (i ? 'L' : 'M') + (off + i * st).toFixed(1) + ' ' + (h - clamp(v / max, 0, 1) * (h - 2) - 1).toFixed(1)).join('');
  if (close) d += 'L' + w + ' ' + h + 'L' + off.toFixed(1) + ' ' + h + 'Z';
  return d;
}
function sparkSVG(arr, max, color, cls) {
  return '<svg class="' + (cls || 'spark') + '" viewBox="0 0 120 40" preserveAspectRatio="none"><path d="' + sparkPath(arr, max, 120, 40, true) + '" fill="' + color + '" opacity=".18"/><path d="' + sparkPath(arr, max, 120, 40) + '" fill="none" stroke="' + color + '" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
}

/* ---------- views ---------- */
const COLS = [['name', 'Name'], ['pid', 'PID'], ['cpu', 'CPU'], ['mem', 'Memory'], ['disk', 'Disk'], ['net', 'Network']];
const GROUPS = [['Apps', 'Apps'], ['Background', 'Background processes'], ['System', 'System processes']];
function visibleProcs() {
  const q = S.q.trim().toLowerCase();
  let l = procs.filter(p => !q || p.name.toLowerCase().includes(q) || String(p.pid) === q || p.user.includes(q));
  const { k, d } = S.sort;
  return l.sort((a, b) => (k === 'name' ? a.name.localeCompare(b.name) : a[k] - b[k]) * d);
}
const getProc = pid => procs.find(p => p.pid === pid);
function cell(p, k) {
  switch (k) {
    case 'pid': return '<div class="td c-pid">' + p.pid + '</div>';
    case 'cpu': return '<div class="td c-cpu heat" style="--c:var(--c-cpu);--h:' + clamp(p.cpu / 25, 0, 1).toFixed(2) + '">' + fmtPct(p.cpu) + '</div>';
    case 'mem': return '<div class="td c-mem heat" style="--c:var(--c-mem);--h:' + clamp(p.mem / 1500, 0, 1).toFixed(2) + '">' + fmtMem(p.mem) + '</div>';
    case 'disk': return '<div class="td c-disk heat" style="--c:var(--c-disk);--h:' + clamp(p.disk / 5, 0, 1).toFixed(2) + '">' + fmtDisk(p.disk) + '</div>';
    case 'net': return '<div class="td c-net heat" style="--c:var(--c-net);--h:' + clamp(p.net / 8, 0, 1).toFixed(2) + '">' + fmtNet(p.net) + '</div>';
  }
}
function rowHTML(p) {
  return '<div class="tr row' + (p.pid === S.sel ? ' sel' : '') + '" data-pid="' + p.pid + '" role="row"><div class="td name"><i class="' + (p.type === 'Apps' ? 'dot-app' : '') + '"></i><span>' + esc(p.name) + '</span></div>' +
    ['pid', 'cpu', 'mem', 'disk', 'net'].map(k => cell(p, k)).join('') + '</div>';
}
function ensureSel() {
  const l = visibleProcs();
  if (!l.some(p => p.pid === S.sel)) S.sel = null; // never auto-select: End task needs a deliberate pick
}
function renderTable() {
  ensureSel();
  const l = visibleProcs();
  let h = '<div class="tr th" role="row">' + COLS.map(([k, n]) => '<div class="td' + (k === 'name' ? ' name' : ' c-' + k) + (S.sort.k === k ? ' sorted' : '') + '" data-sort="' + k + '">' + n + (S.sort.k === k ? (S.sort.d < 0 ? ' ▾' : ' ▴') : '') + '</div>').join('') + '</div>';
  if (!l.length) h += '<div class="empty">No process matches “' + esc(S.q) + '”.</div>';
  else if (S.group) GROUPS.forEach(([t, n]) => { const g = l.filter(p => p.type === t); if (g.length) h += '<div class="tr grp"><div class="td name">' + n + ' (' + g.length + ')</div></div>' + g.map(rowHTML).join(''); });

  $('#tbl').innerHTML = h;
  updateAction();
}
function renderCards() {
  $('#cards').innerHTML = ['cpu', 'mem', 'disk', 'net'].map(k => {
    const m = METRICS[k];
    return '<div class="card" style="--c:' + m.c + '"><div class="k"><i></i>' + m.name + '</div><div class="v">' + m.val() + '</div><div class="s">' + m.sub() + '</div>' + sparkSVG(H[k], histMax(k), m.c) + '</div>';
  }).join('');
}
function renderPerf() {
  $('#tiles').innerHTML = Object.keys(METRICS).map(k => {
    const m = METRICS[k];
    return '<button class="tile" data-m="' + k + '" style="--c:' + m.c + '" aria-pressed="' + (S.perfSel === k) + '"><b>' + m.name + '</b><span>' + m.val() + '</span></button>';
  }).join('');
  const k = S.perfSel, m = METRICS[k], max = histMax(k);
  let grid = ''; for (let i = 1; i < 4; i++) grid += '<line x1="0" x2="600" y1="' + (i * 52.5) + '" y2="' + (i * 52.5) + '" stroke="var(--line)"/>';
  const stat = (a, b) => '<div><small>' + a + '</small><b>' + b + '</b></div>';
  let st = '';

  if (k === 'mem') st = stat('In use', fmtMem(T.memMB)) + stat('Available', fmtMem(MEM_TOTAL - T.memMB)) + stat('Total', '64.0 GB') + stat('Cached', fmtMem(T.memMB * .31)) + stat('Type', 'LPDDR5X-7500') + stat('Swap', '0 GB');
  if (k === 'disk') st = stat('Read', fmtDisk(T.disk * .6)) + stat('Write', fmtDisk(T.disk * .4)) + stat('Active time', fmtPct(clamp(T.disk * 2, 0, 100))) + stat('Capacity', '2 TB') + stat('Used', DISK_USED_GB + ' GB') + stat('Interface', 'PCIe 5.0 x4 NVMe') + stat('Temperature', Math.round(34 + T.disk * .6) + ' °C') + stat('Health', '99%');
  if (k === 'net') st = stat('Send', fmtNet(T.net * .3)) + stat('Receive', fmtNet(T.net * .7)) + stat('Adapter', 'wlan0') + stat('Link speed', '866 Mbps');
  if (k === 'gpu') st = stat('Utilization', fmtPct(T.gpu)) + stat('Shared memory', fmtMem(512 + T.gpu * 24)) + stat('Temperature', Math.round(38 + T.gpu * .3) + ' °C') + stat('Driver', 'amdgpu (sim.)');
  if (k === 'dgpu') st = stat('Utilization', fmtPct(T.dgpu)) + stat('Dedicated memory', (1.2 + T.dgpu * .6).toFixed(1) + ' / 96 GB') + stat('Temperature', Math.round(34 + T.dgpu * .45) + ' °C') + stat('Power draw', Math.round(22 + T.dgpu * 5.6) + ' / 600 W') + stat('Memory type', 'GDDR7 ECC') + stat('Driver', 'nvidia (sim.)');
  if (k === 'npu') st = stat('Utilization', fmtPct(T.npu)) + stat('Throughput', (T.npu * .5).toFixed(1) + ' / 50 TOPS') + stat('Shared memory', fmtMem(120 + T.npu * 14)) + stat('Power draw', (0.4 + T.npu * .08).toFixed(1) + ' W') + stat('Driver', 'amdxdna (sim.)');
  const cap = k === 'disk' ? '<div class="capbar" aria-label="Capacity"><i style="width:' + (180 / 20.48).toFixed(1) + '%;background:var(--c-disk)"></i><i style="width:' + (460 / 20.48).toFixed(1) + '%;background:var(--c-net)"></i></div><div class="capleg"><span><b style="background:var(--c-disk)"></b>System 180 GB</span><span><b style="background:var(--c-net)"></b>Home 460 GB</span><span><b></b>Free ' + (2048 - DISK_USED_GB) + ' GB</span></div>' : '';
  let cores = '';
  if (k === 'cpu') cores = '<div class="cores">' + coreH.map((h, i) => '<div class="core"><span>Core ' + i + ' · ' + Math.round(T.cores[i]) + '%</span>' + sparkSVG(h, 100, 'var(--c-cpu)', '') + '</div>').join('') + '</div>';
  readReal();
  const real = '<div class="real"><h4>This page <em>· real values from your browser</em></h4><div class="stats">' +
    stat('Logical cores', navigator.hardwareConcurrency || 'n/a') + stat('Device memory', navigator.deviceMemory ? '≥ ' + navigator.deviceMemory + ' GB' : 'n/a') +
    stat('JS heap', R.heap == null ? 'n/a' : R.heap.toFixed(1) + ' MB') + stat('Frame rate', R.fps + ' fps') + stat('Battery', R.batt || 'n/a') + stat('Connection', R.net || 'n/a') + '</div></div>';
  setTimeout(updateAction, 0);
  $('#pdetail').innerHTML = '<h3>' + m.name + '<small>' + m.sub() + '</small></h3><div class="chart"><span class="cl">60 seconds · max ' + (k === 'disk' ? max + ' MB/s' : k === 'net' ? max + ' Mbps' : '100%') + '</span><svg viewBox="0 0 600 210" preserveAspectRatio="none">' + grid +
    '<path d="' + sparkPath(H[k], max, 600, 210, true) + '" fill="' + m.c + '" opacity=".16"/><path d="' + sparkPath(H[k], max, 600, 210) + '" fill="none" stroke="' + m.c + '" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>' + cap + '<div class="stats">' + st + '</div>' + cores + real;
}

    const on = document.body.classList.contains('fs'); v = v == null ? !on : v; if (v === on) return;
    if (v) { if (S.mini) mini(false); prevMax = max; max = true; document.body.classList.add('fs'); }
    else { document.body.classList.remove('fs'); max = prevMax; }
    closeMenu(0); apply();
  }
  function toggleHide() { hid = !hid; apply(); }
  /* drag */
  let drag = null;
  $('#top').addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button,input,.appname')) return;
    drag = { sx: e.clientX, sy: e.clientY, on: false, id: e.pointerId }; $('#top').setPointerCapture(e.pointerId);
  });
  $('#top').addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.on) {
      if (Math.hypot(dx, dy) < 4) return; drag.on = true;
      if (max && !document.body.classList.contains('fs')) { const W = desk.clientWidth, f = e.clientX / W; max = false; r.x = Math.round(e.clientX - r.w * f); r.y = 4; drag.ox = r.x; drag.oy = r.y; drag.sx = e.clientX; drag.sy = e.clientY; apply(); return; }
      if (max) { drag = null; return; }
      drag.ox = r.x; drag.oy = r.y;
    }
    r.x = drag.ox + (e.clientX - drag.sx); r.y = drag.oy + (e.clientY - drag.sy); apply();
  });
  const endDrag = () => { if (drag && drag.on) save(); drag = null; };
  $('#top').addEventListener('pointerup', endDrag); $('#top').addEventListener('pointercancel', endDrag);
  $('#top').addEventListener('dblclick', e => { if (e.target.closest('button,input,.appname') || S.mini) return; if (!document.body.classList.contains('fs')) setMax(!max); });
  /* resize */
  $$('.rz').forEach(h => h.addEventListener('pointerdown', e => {
    if (e.button !== 0 || max) return; e.preventDefault(); h.setPointerCapture(e.pointerId);
    const d = h.dataset.d, s = { ...r, px: e.clientX, py: e.clientY };
    const mv = ev => {
      const dx = ev.clientX - s.px, dy = ev.clientY - s.py, nr = { x: s.x, y: s.y, w: s.w, h: s.h };
      if (d.includes('e')) nr.w = Math.max(MINW, s.w + dx);
      if (d.includes('s')) nr.h = Math.max(MINH, s.h + dy);
      if (d.includes('w')) { nr.w = Math.max(MINW, s.w - dx); nr.x = s.x + s.w - nr.w; }
      if (d.includes('n')) { nr.h = Math.max(MINH, s.h - dy); nr.y = s.y + s.h - nr.h; }
      r = nr; apply();
    };
    const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); save(); };
    h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  }));
  /* buttons */
  $('#wc-min').addEventListener('click', toggleHide);
  $('#wc-max').addEventListener('click', () => { if (document.body.classList.contains('fs')) fs(false); else setMax(!max); });
  $('#wc-close').addEventListener('click', () => closeWin());
  $('#chip').addEventListener('click', toggleHide);
  $('#presets').addEventListener('click', e => { const b = e.target.closest('button'); if (b) preset(b.dataset.p); });
  addEventListener('resize', apply);
  return { apply, mini, fs, preset, hide: () => { hid = true; apply(); }, get rect() { return r; } };
})();
function closeWin() { WM.hide(); toast('Window hidden — use the taskbar to bring it back'); }
/* ---------- boot ---------- */
applyTheme(); WM.apply(); render(); schedule();

})();</script>
