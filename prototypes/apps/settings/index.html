<!DOCTYPE html>
<html lang="en" data-theme="light">

<title>Settings – Essential OS</title>
<style>
:root{--bg:#f5f5f7;--fg:#1d1d1f;--mut:#6e6e73;--card:#fff;--line:rgba(0,0,0,.08);--glass:rgba(255,255,255,.72);--acc:#fa2d48;--wp:#cfd3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1e;--fg:#f5f5f7;--mut:#98989d;--card:#2c2c2e;--line:rgba(255,255,255,.1);--glass:rgba(44,44,46,.72);--wp:#101216;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1c1e;--fg:#f5f5f7;--mut:#98989d;--card:#2c2c2e;--line:rgba(255,255,255,.1);--glass:rgba(44,44,46,.72);--wp:#101216;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--wp);overflow:hidden}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit}
.rm *{transition:none!important;animation:none!important}
.desktop{position:fixed;inset:0 0 44px 0;overflow:hidden;background-color:var(--wp);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
body.fs .desktop{bottom:0}body.fs .taskbar{display:none}
.window{position:absolute;border-radius:12px;overflow:hidden;background:var(--bg);box-shadow:0 24px 70px rgba(0,0,0,.35),0 0 0 1px var(--line)}
.window[hidden]{display:none}
.window.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}
.window.max .rz{display:none}
.rz{position:absolute;z-index:30}
.rz[data-d=n]{top:0;left:12px;right:12px;height:5px;cursor:ns-resize}
.rz[data-d=s]{bottom:0;left:12px;right:12px;height:5px;cursor:ns-resize}
.rz[data-d=e]{right:0;top:12px;bottom:12px;width:5px;cursor:ew-resize}
.rz[data-d=w]{left:0;top:12px;bottom:12px;width:5px;cursor:ew-resize}
.rz[data-d=ne],.rz[data-d=nw],.rz[data-d=se],.rz[data-d=sw]{width:12px;height:12px}
.rz[data-d=ne]{top:0;right:0;cursor:nesw-resize}.rz[data-d=sw]{bottom:0;left:0;cursor:nesw-resize}
.rz[data-d=nw]{top:0;left:0;cursor:nwse-resize}.rz[data-d=se]{bottom:0;right:0;cursor:nwse-resize}
.app{position:absolute;inset:0;container:app/inline-size;background:var(--bg);font-size:var(--fs,14px)}
.top{position:absolute;top:0;left:0;right:0;height:40px;z-index:20;display:flex;align-items:center;padding:0 8px;gap:2px;user-select:none}
.topfade{position:absolute;top:0;left:0;right:0;height:64px;z-index:10;pointer-events:none;background:linear-gradient(var(--bg) 45%,transparent)}
.botfade{position:absolute;bottom:0;left:0;right:0;height:120px;z-index:10;pointer-events:none;background:linear-gradient(to top,var(--bg) 20%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(to top,#000 35%,transparent);mask-image:linear-gradient(to top,#000 35%,transparent)}
.sp{flex:1;align-self:stretch}
.nv,.acct{flex:0 0 auto}
.acct{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border:0;background:none;border-radius:12px;color:var(--fg);cursor:pointer;text-align:left}
.acct:hover{background:var(--line)}
.acct[aria-current=page]{background:var(--acc);color:#fff}
.acct[aria-current=page] small{color:rgba(255,255,255,.8)}
.acct b{display:block;font-weight:600;line-height:1.2}
.acct small{display:block;color:var(--mut);font-size:.82em}
.av{width:40px;height:40px;border-radius:50%;flex:0 0 auto;background:var(--line) center/cover;box-shadow:0 0 0 1px var(--line)}
.av.lg{width:34px;height:34px}
.sdiv{height:1px;background:var(--line);margin:6px 8px;flex:0 0 auto}
html.hc[data-theme]{--line:rgba(128,128,128,.7);--mut:var(--fg)}
.hc .card{box-shadow:0 0 0 2px var(--fg)}
.wc{display:flex;gap:8px;padding-right:6px}
.wc button{width:32px;height:30px;border:0;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center;transition:color .15s}
.wc button:hover{color:var(--fg)}
.wc svg{width:18px;height:18px;stroke-width:1.5}
.scroll{position:absolute;inset:0;overflow:auto;scrollbar-width:none;--pad:22px;padding:54px var(--pad) 110px}
.scroll::-webkit-scrollbar,.side::-webkit-scrollbar{display:none}
.wrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:24px;max-width:860px;margin:0 auto}
main{grid-column:2}
.side{position:absolute;z-index:5;top:0;bottom:0;left:max(22px,calc((100cqw - 860px) / 2));width:190px;padding:54px 0 110px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;scrollbar-width:none}
.nv{display:flex;align-items:center;gap:10px;padding:6px 10px;border:0;background:none;border-radius:9px;color:var(--fg);cursor:pointer;text-align:left}
.nv:hover{background:var(--line)}
.nv[aria-current=page]{background:var(--acc);color:#fff}
.pg{font-size:1.7em;font-weight:650;margin:0 0 6px}
.gt{font-size:.78em;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:18px 6px 6px}
.card{background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 14px;min-height:50px}
.row+.row{border-top:1px solid var(--line)}
.row b{font-weight:500;display:block}
.row small{color:var(--mut);display:block}
.ct{flex:0 0 auto;display:flex;align-items:center;gap:10px}
.tg{width:42px;height:25px;border-radius:99px;border:0;background:rgba(120,120,128,.35);position:relative;cursor:pointer;transition:background .2s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.tg[aria-checked=true]{background:var(--acc)}.tg[aria-checked=true]::after{left:19px}
input[type=range]{accent-color:var(--acc);width:200px}
select,.txt{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;max-width:190px}
.seg{display:flex;background:var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;color:var(--fg);padding:4px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.asw{width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.asw[aria-pressed=true]{outline:2px solid var(--fg);outline-offset:2px}
.bar{width:160px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.val{color:var(--mut);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
.pill{position:absolute;bottom:14px;left:0;right:0;margin:0 auto;width:min(100% - 28px,820px);height:50px;border-radius:24px;z-index:20;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:0 8px 0 16px;background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(1.8);backdrop-filter:blur(28px) saturate(1.8);box-shadow:0 8px 30px rgba(0,0,0,.18),0 0 0 1px var(--line)}
.pill input{border:0;background:none;outline:0;color:var(--fg);font:inherit;min-width:0}
.pb{display:flex;align-items:center;gap:6px;border:0;background:var(--line);color:var(--fg);height:34px;padding:0 14px;border-radius:17px;cursor:pointer}
.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:7px 14px;border-radius:99px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.on{opacity:1}
.menu{position:fixed;z-index:9999;min-width:210px;padding:5px;border-radius:10px;overflow:auto;background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(1.8);backdrop-filter:blur(28px) saturate(1.8);box-shadow:0 12px 40px rgba(0,0,0,.28),0 0 0 1px var(--line);animation:pop .12s ease-out}
.menu.up{animation-name:popup}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
@keyframes popup{from{opacity:0;transform:translateY(6px)}}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.mi{display:grid;grid-template-columns:18px 1fr auto;gap:4px;width:100%;border:0;background:none;color:var(--fg);padding:6px 8px;border-radius:6px;text-align:left;cursor:pointer}
.mi:hover:not(:disabled){background:var(--acc);color:#fff}
.mi kbd{font:inherit;color:var(--mut);margin-left:20px}.mi:hover kbd{color:#fff}
.taskbar{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:50}
.chip{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;border:0;background:var(--line);color:var(--fg);cursor:pointer}
.chip[aria-pressed=true]{box-shadow:inset 0 -2px 0 var(--acc)}
.hud{font:12px ui-monospace,Menlo,monospace;color:var(--mut);margin-left:auto}
.tb{border:0;background:none;color:var(--fg);padding:5px 9px;border-radius:7px;cursor:pointer}.tb:hover{background:var(--line)}
#dim,#nl{position:fixed;inset:0;pointer-events:none;z-index:9998}
#dim{background:#000;opacity:0}#nl{background:#ff9a2e;mix-blend-mode:multiply;opacity:0}
@container app (max-width:700px){.wrap{grid-template-columns:150px minmax(0,1fr);gap:16px}.side{width:150px}input[type=range]{width:140px}}
@container app (max-width:560px){.wrap{grid-template-columns:minmax(0,1fr);gap:10px}main{grid-column:1}.side{display:none}}
@container app (max-width:520px){.scroll{--pad:12px}input[type=range]{width:110px}.row{gap:10px;padding:10px}.bar{width:90px}}
@container app (max-width:420px){.pbl{display:none}.pb{padding:0 10px}select,.txt{max-width:120px}}
@media (max-width:700px){.hud,.tb.opt{display:none}}
</style>
</head>

{id:'about',n:'About',i:'info',g:[{t:'Device',r:[

];
let S=st.get('s',{}),cur=st.get('page','network'),tt;
const val=r=>S[r.k]===undefined?r.d:S[r.k];
const mq=matchMedia('(prefers-color-scheme: dark)');
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)};
function apply(){
 const R=document.documentElement,t=S.theme||'Auto';
 R.dataset.theme=t==='Auto'?(mq.matches?'dark':'light'):t.toLowerCase();
 R.style.setProperty('--acc',S.acc||ACC[0]);
 $('#dim').style.opacity=(100-(S.bright===undefined?100:S.bright))/100*.7;
 $('#nl').style.opacity=S.night?.22:0;
 R.classList.toggle('hc',!!S.hc);$('#win').style.filter=S.gray?'grayscale(1)':'';$('#acn').textContent=S.uname||'Luis';
 R.classList.toggle('rm',!!S.motion);
 $('#app').style.setProperty('--fs',({S:'13px',M:'14px',L:'16px'})[S.txt||'M']);
}
mq.addEventListener('change',apply);
function set(r,v,quiet){S[r.k]=v;st.set('s',S);apply();if(r.f&&!quiet)toast(r.l+' (preview only)')}
function row(r,pg){
 const e=h('div','row');
 e.innerHTML='<div><b>'+r.l+'</b>'+(r.s?'<small>'+r.s+'</small>':'')+(pg?'<small>'+pg+'</small>':'')+'</div><div class="ct"></div>';
 const c=$('.ct',e),v=val(r);let x;
 if(r.c==='tg'){x=h('button','tg');x.setAttribute('role','switch');x.setAttribute('aria-label',r.l);x.setAttribute('aria-checked',String(!!v));x.onclick=()=>{const n=x.getAttribute('aria-checked')!=='true';x.setAttribute('aria-checked',String(n));set(r,n?1:0)}}
 else if(r.c==='rg'){x=h('input');x.type='range';x.min=r.min;x.max=r.max;x.value=v;x.setAttribute('aria-label',r.l);const o=h('span','val');o.textContent=v;x.oninput=()=>{o.textContent=x.value;set(r,+x.value,1)};x.onchange=()=>r.f&&toast(r.l+' (preview only)');c.append(o)}
 else if(r.c==='sel'){x=h('select');x.setAttribute('aria-label',r.l);r.o.forEach(o=>{const p=h('option');p.textContent=o;p.selected=o===v;x.append(p)});x.onchange=()=>set(r,x.value)}
 else if(r.c==='seg'){x=h('div','seg');r.o.forEach(o=>{const b=h('button');b.textContent=o;b.setAttribute('aria-pressed',String(o===v));b.onclick=()=>{set(r,o);$$('button',x).forEach(y=>y.setAttribute('aria-pressed',String(y===b)))};x.append(b)})}
 else if(r.c==='acc'){x=h('div');x.style.cssText='display:flex;gap:8px';ACC.forEach(a=>{const b=h('button','asw');b.style.background=a;b.setAttribute('aria-label','Accent '+a);b.setAttribute('aria-pressed',String(a===v));b.onclick=()=>{set(r,a);$$('.asw',x).forEach(y=>y.setAttribute('aria-pressed',String(y===b)))};x.append(b)})}
 else if(r.c==='txt'){x=h('input','txt');x.type='text';x.maxLength=24;x.value=v;x.setAttribute('aria-label',r.l);x.onchange=()=>set(r,x.value||r.d)}
 else if(r.c==='photo'){x=h('div');x.style.cssText='display:flex;align-items:center;gap:12px';const a=h('div','av lg');a.style.backgroundImage=AVURL;const b=h('button','pb');b.textContent='Change';b.onclick=()=>toast('Change photo (preview only)');x.append(a,b)}
 else if(r.c==='btn'){x=h('button','pb');x.textContent=r.b;x.onclick=()=>toast(r.l+' (preview only)')}
 else if(r.c==='bar'){x=h('div','bar');x.innerHTML='<i style="width:'+r.v+'%"></i>'}
 else{x=h('span','val');x.style.minWidth='0';x.textContent=r.v}
 c.append(x);return e;
}
function render(){
 const q=$('#q').value.trim().toLowerCase(),m=$('#main');m.replaceChildren();
 $$('.nv,.acct').forEach(b=>{if(!q&&b.dataset.id===cur)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 const t=h('h1','pg');m.append(t);
 if(q){t.textContent='Search';const c=h('div','card'),hits=[];
  P.forEach(p=>p.g.forEach(g=>g.r.forEach(r=>{if((r.l+' '+(r.s||'')+' '+p.n).toLowerCase().includes(q))hits.push([r,p.n])})));
  if(hits.length)hits.forEach(a=>c.append(row(a[0],a[1])));else c.innerHTML='<div class="row"><small>No settings match.</small></div>';
  m.append(c);return}
 const p=P.find(p=>p.id===cur);t.textContent=p.n;
 p.g.forEach(g=>{const l=h('div','gt');l.textContent=g.t;const c=h('div','card');g.r.forEach(r=>c.append(row(r)));m.append(l,c)});
}
function go(id){cur=id;st.set('page',id);$('#q').value='';render();$('#scroll').scrollTop=0}
P.forEach(p=>{
 const b=h('button',p.a?'acct':'nv');b.dataset.id=p.id;
 b.innerHTML=p.a?'<span class="av"></span><span><b id="acn"></b><small>Local account</small></span>':'<svg><use href="#i-'+p.i+'"/></svg><span>'+p.n+'</span>';
 if(p.a)$('.av',b).style.backgroundImage=AVURL;
 b.onclick=()=>go(p.id);$('#side').append(b);if(p.a)$('#side').append(h('div','sdiv'));
});
$('#q').oninput=render;

/* menu engine */
let menus=[],mt;
function closeMenu(d=0){while(menus.length>d)menus.pop().remove();if(!d)$$('[aria-haspopup]').forEach(b=>b.setAttribute('aria-expanded','false'))}
function openMenu(a,items,o={},d=0){
 closeMenu(d);const m=h('div','menu'+(o.up?' up':''));
 items.forEach(it=>{
  if(it==='-'){m.append(h('hr'));return}
  const b=h('button','mi');b.disabled=!!it.disabled;
  b.innerHTML='<i>'+(it.checked?'✓':'')+'</i><span>'+it.label+'</span><kbd>'+(it.kbd||(it.sub?'›':''))+'</kbd>';
  if(it.sub){const go=()=>openMenu(b,it.sub,{side:1},d+1);b.onclick=go;b.onmouseenter=()=>{clearTimeout(mt);mt=setTimeout(go,80)}}
  else{b.onmouseenter=()=>{clearTimeout(mt);closeMenu(d+1)};b.onclick=()=>{closeMenu();it.run&&it.run()}}
  m.append(b)});
 document.body.append(m);
 const r=a.getBoundingClientRect();m.style.maxHeight=(innerHeight-16)+'px';
 const w=m.offsetWidth,ht=m.offsetHeight;let x,y;
 if(o.side){x=r.right+2;if(x+w>innerWidth-8)x=r.left-w-2;y=r.top-5}
 else{x=o.center?r.left+r.width/2-w/2:r.left;y=o.up?r.top-ht-14:r.bottom+4}
 m.style.left=Math.max(8,Math.min(x,innerWidth-w-8))+'px';
 m.style.top=Math.max(8,Math.min(y,innerHeight-ht-8))+'px';
 menus.push(m);
}
function resetPage(){P.find(p=>p.id===cur).g.forEach(g=>g.r.forEach(r=>{delete S[r.k]}));st.set('s',S);apply();render();toast('Page reset')}
function resetAll(){S={};st.set('s',S);apply();render();toast('All settings reset')}
function copyJson(){const t=JSON.stringify(S,null,2);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied to clipboard'),()=>toast('Clipboard blocked here'))}
const M={
 File:()=>[{label:'Reset this page',run:resetPage},{label:'Reset all settings',run:resetAll},'-',{label:'Export settings…',run:()=>toast('Export (preview only)')},'-',{label:'Close window',kbd:'Alt+F4',run:()=>setHidden(true)}],
 Edit:()=>[{label:'Find setting',kbd:'/',run:()=>$('#q').focus()},{label:'Copy settings as JSON',run:copyJson}],
 View:()=>[
  {label:'Go to',sub:P.map(p=>({label:p.n,checked:p.id===cur&&!$('#q').value,run:()=>go(p.id)}))},
  {label:'Appearance',sub:['Light','Dark','Auto'].map(t=>({label:t==='Auto'?'Match system':t,checked:(S.theme||'Auto')===t,run:()=>{S.theme=t;st.set('s',S);apply();render()}}))},'-',
  {label:'Maximize',checked:mx,run:()=>toggleMax()},
  {label:'Full screen',kbd:'F11',checked:document.body.classList.contains('fs'),run:()=>toggleFs()}]
};
$('#more').onclick=e=>{const b=e.currentTarget;if(b.getAttribute('aria-expanded')==='true')return closeMenu();
 const bar=[{label:'File',sub:M.File()},{label:'Edit',sub:M.Edit()},{label:'View',sub:M.View()}];
 const pages=P.map(p=>({label:p.a?(S.uname||'Luis'):p.n,checked:p.id===cur&&!$('#q').value,run:()=>go(p.id)}));
 openMenu(b,$('#app').clientWidth<=560?[...pages,'-',...bar]:bar,{up:1,center:1});b.setAttribute('aria-expanded','true')};
document.addEventListener('mousedown',e=>{if(menus.length&&!e.target.closest('.menu,[aria-haspopup]'))closeMenu()});

/* window manager */
const desk=$('#desk'),win=$('#win'),MIN={w:360,h:300};
let rect=st.get('rect'),mx=st.get('max',false),prevMax=false;
const D=()=>({w:desk.clientWidth,h:desk.clientHeight});
function defRect(){const d=D(),w=Math.min(1100,d.w-48),hh=Math.min(700,d.h-48);return{x:Math.round((d.w-w)/2),y:Math.round((d.h-hh)/2),w,h:hh}}
function fit(r){const d=D();r.w=Math.round(Math.max(MIN.w,Math.min(r.w,d.w)));r.h=Math.round(Math.max(MIN.h,Math.min(r.h,d.h)));r.x=Math.round(Math.max(80-r.w,Math.min(r.x,d.w-80)));r.y=Math.round(Math.max(0,Math.min(r.y,d.h-40)));return r}
function paint(){
 win.classList.toggle('max',mx);
 Object.assign(win.style,{left:rect.x+'px',top:rect.y+'px',width:rect.w+'px',height:rect.h+'px'});
 const d=D();$('#hud').textContent=mx?d.w+' × '+d.h+'  x 0  y 0':rect.w+' × '+rect.h+'  x '+rect.x+'  y '+rect.y;
}
const save=()=>{st.set('rect',rect);st.set('max',mx)};
function toggleMax(){mx=!mx;paint();save()}
function toggleFs(){const f=document.body.classList.toggle('fs');if(f){prevMax=mx;mx=true}else mx=prevMax;paint()}
function setHidden(v){win.hidden=v;$('#chip').setAttribute('aria-pressed',String(!v));closeMenu()}
rect=fit(rect||defRect());
$('.top').addEventListener('pointerdown',e=>{
 if(e.button||e.target.closest('button,input,[aria-haspopup]'))return;
 const sx=e.clientX,sy=e.clientY;let on=0,ox=0,oy=0;
 const mv=ev=>{
  if(!on){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<4)return;on=1;
   if(mx){mx=false;rect.x=Math.round(sx-rect.w*(sx/D().w));rect.y=Math.max(0,sy-20)}
   ox=sx-rect.x;oy=sy-rect.y}
  rect.x=ev.clientX-ox;rect.y=ev.clientY-oy;fit(rect);paint()};
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);if(on)save()};
 addEventListener('pointermove',mv);addEventListener('pointerup',up)});
$('.top').addEventListener('dblclick',e=>{if(!e.target.closest('button,input,[aria-haspopup]'))toggleMax()});
$$('.rz').forEach(z=>z.addEventListener('pointerdown',e=>{
 if(mx)return;e.preventDefault();const d=z.dataset.d,s={...rect},sx=e.clientX,sy=e.clientY;
 const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;let x=s.x,y=s.y,w=s.w,hh=s.h;
  if(d.includes('e'))w=s.w+dx;if(d.includes('s'))hh=s.h+dy;
  if(d.includes('w')){w=Math.max(MIN.w,s.w-dx);x=s.x+s.w-w}
  if(d.includes('n')){hh=Math.max(MIN.h,s.h-dy);y=s.y+s.h-hh}
  rect={x,y,w:Math.max(MIN.w,w),h:Math.max(MIN.h,hh)};paint()};
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);save()};
 addEventListener('pointermove',mv);addEventListener('pointerup',up)}));
$('#wmax').onclick=toggleMax;$('#wmin').onclick=()=>setHidden(true);$('#wx').onclick=()=>setHidden(true);
$('#chip').onclick=()=>setHidden(!win.hidden);
$$('.tb').forEach(b=>b.onclick=()=>{const p=b.dataset.p;
 if(p==='fill')mx=true;else{mx=false;const c=p==='min'?{w:360,h:300}:p==='compact'?{w:640,h:440}:defRect();rect=fit({x:rect.x,y:rect.y,w:c.w,h:c.h});if(p==='def')rect=fit(defRect())}
 setHidden(false);paint();save()});
addEventListener('resize',()=>{fit(rect);paint()});
addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(menus.length)closeMenu();else if(document.body.classList.contains('fs'))toggleFs()}
 else if(e.key==='F11'){e.preventDefault();toggleFs()}
 else if(e.key==='/'&&!e.target.closest('input,select')){e.preventDefault();$('#q').focus()}
 else if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&menus.length&&!e.target.closest('input')){
  const bs=$$('.mbtn[data-m]'),i=bs.findIndex(b=>b.getAttribute('aria-expanded')==='true');
  if(i>=0){const n=bs[(i+(e.key==='ArrowRight'?1:bs.length-1))%bs.length];n.click();n.focus()}}
});
new ResizeObserver(()=>$('#app').style.setProperty('--ch',$('#app').clientHeight+'px')).observe($('#app'));
apply();render();paint();
})();
</script>
