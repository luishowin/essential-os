<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Essential Software</title>
<style>
:root{
  --bg:#f5f5f7;--panel:#fff;--panel2:#f0f0f3;--ink:#131316;--ink2:#5d6068;--ink3:#8b8e96;
  --line:rgba(20,20,30,.09);--line2:rgba(20,20,30,.16);--accent:#257bf5;--accent-ink:#fff;--accent-soft:rgba(37,123,245,.11);
  --glass:rgba(255,255,255,.72);--shadow:0 10px 34px rgba(10,10,30,.16),0 1px 0 rgba(255,255,255,.6) inset;
  --ok:#1a9a52;--warn:#c27c00;--bad:#d92d20;--info:#2f6fed;
  --ok-soft:rgba(26,154,82,.12);--warn-soft:rgba(194,124,0,.13);--bad-soft:rgba(217,45,32,.11);--info-soft:rgba(47,111,237,.11);
  --wall:#dfe0e5;--wall-line:rgba(0,0,0,.05);--task:rgba(250,250,252,.85);
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#0f0f12;--panel:#1a1a1f;--panel2:#232329;--ink:#f3f3f5;--ink2:#a6a9b2;--ink3:#767983;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--accent-soft:rgba(37,123,245,.20);
  --glass:rgba(34,34,40,.70);--shadow:0 12px 38px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.07) inset;
  --ok:#3ccf7b;--warn:#f0b13a;--bad:#ff6a5e;--info:#6c9bff;
  --ok-soft:rgba(60,207,123,.14);--warn-soft:rgba(240,177,58,.15);--bad-soft:rgba(255,106,94,.14);--info-soft:rgba(108,155,255,.15);
  --wall:#07070a;--wall-line:rgba(255,255,255,.045);--task:rgba(24,24,28,.85);color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--wall);color:var(--ink);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:14px;height:14px}.ic.lg{width:24px;height:24px}

/* ---------- fake desktop ---------- */
.desktop{position:fixed;inset:0 0 44px 0;background:
  linear-gradient(var(--wall-line) 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(90deg,var(--wall-line) 1px,transparent 1px) 0 0/32px 32px,var(--wall);overflow:hidden}
body.fs .desktop{inset:0}body.fs .taskbar{display:none}
.window{position:absolute;border-radius:12px;background:var(--bg);box-shadow:0 0 0 1px var(--line2),0 24px 70px rgba(0,0,0,.28);overflow:hidden}
.window.max{border-radius:0;left:0!important;top:0!important;width:100%!important;height:100%!important}
body.fs .window{border-radius:0}
.window.hidden{display:none}
.rz{position:absolute;z-index:50}
.rz.n{top:0;left:12px;right:12px;height:6px;cursor:ns-resize}.rz.s{bottom:0;left:12px;right:12px;height:6px;cursor:ns-resize}
.rz.e{right:0;top:12px;bottom:12px;width:6px;cursor:ew-resize}.rz.w{left:0;top:12px;bottom:12px;width:6px;cursor:ew-resize}
.rz.ne{top:0;right:0;width:12px;height:12px;cursor:nesw-resize}.rz.nw{top:0;left:0;width:12px;height:12px;cursor:nwse-resize}
.rz.se{bottom:0;right:0;width:12px;height:12px;cursor:nwse-resize}.rz.sw{bottom:0;left:0;width:12px;height:12px;cursor:nesw-resize}
.window.max .rz{display:none}
.taskbar{position:fixed;left:0;right:0;bottom:0;height:44px;background:var(--task);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 10px;z-index:200}
.tchip{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:8px;background:var(--panel);box-shadow:0 0 0 1px var(--line);font-weight:600;font-size:12.5px}
.tchip.on{box-shadow:0 0 0 1.5px var(--accent)}
.tchip .mk{width:16px;height:16px;border-radius:5px;background:var(--accent);display:grid;place-items:center;color:#fff}
.tchip .mk .ic{width:11px;height:11px;stroke-width:2.4}
.thud{margin-left:auto;font:11.5px var(--mono);color:var(--ink2);white-space:nowrap}
.tpre{display:flex;gap:2px;background:var(--panel2);border-radius:8px;padding:2px}
.tpre button{padding:4px 9px;border-radius:6px;font-size:11.5px;color:var(--ink2)}
.tpre button:hover{background:var(--panel);color:var(--ink)}

/* ---------- app ---------- */
.app{position:absolute;inset:0;container:app/inline-size;background:var(--bg);overflow:hidden}
.scroll{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;--pad:22px;--top:40px;--bot:92px;padding:calc(var(--top) + 14px) var(--pad) calc(var(--bot) + 14px);scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.view{max-width:1120px;margin:0 auto}
.sbar{position:absolute;right:3px;top:50px;bottom:50px;width:10px;z-index:25;pointer-events:none}
.sbar i{position:absolute;right:2px;width:6px;border-radius:3px;background:var(--ink3);opacity:0;transition:opacity .25s,width .12s;pointer-events:auto;cursor:default;min-height:28px}
.sbar.on i,.sbar i:hover,.sbar i.drag{opacity:.55}.sbar i:hover,.sbar i.drag{width:8px;opacity:.8}
.topfade,.botfade{position:absolute;left:0;right:0;pointer-events:none;z-index:5}
.topfade{top:0;height:64px;background:linear-gradient(var(--bg) 0,var(--bg) 40px,transparent)}
.botfade{bottom:0;height:104px;background:linear-gradient(transparent,var(--bg) 75%)}
.top{position:absolute;top:0;left:0;right:0;height:40px;display:flex;align-items:center;padding:0 6px 0 8px;z-index:20;user-select:none}
.menubar{display:flex;gap:2px;align-items:center}
.mb{height:28px;padding:0 10px;border-radius:7px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px}
.mb:hover,.mb[aria-expanded=true]{background:var(--panel2)}
.mb.brand{font-weight:700;gap:7px}
.mb.brand .mk{width:18px;height:18px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff}
.mb.brand .mk .ic{width:12px;height:12px;stroke-width:2.4}
.hamb{display:none}
.topgrow{flex:1;align-self:stretch}
.wctl{display:flex;gap:6px;padding-right:6px}
.wb{width:34px;height:28px;display:grid;place-items:center;color:var(--ink3);border-radius:6px}
.wb .ic{width:20px;height:20px;stroke-width:1.4}
.wb:hover{color:var(--ink);background:none}.wb.x:hover{background:none;color:var(--bad)}

/* ---------- pill ---------- */
.pill{position:absolute;bottom:14px;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100% - 28px);height:50px;border-radius:24px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px;padding:0 8px;z-index:30}
.pbrand{display:flex;align-items:center;gap:8px;padding:0 8px 0 6px;font-weight:700;font-size:12.5px;white-space:nowrap}
.pbrand .mk{width:26px;height:26px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff}
.pbrand .mk .ic{width:15px;height:15px;stroke-width:2.2}
.pnav{display:flex;justify-content:center;gap:2px;min-width:0}
.pn{position:relative;display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:18px;color:var(--ink2);font-weight:600;font-size:12.5px;white-space:nowrap}
.pn:hover{background:var(--panel2);color:var(--ink)}
.pn[aria-current=page]{background:var(--accent);color:var(--accent-ink)}
.pn .bd{position:absolute;top:1px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:10px;line-height:16px;text-align:center;padding:0 4px}
.pn[aria-current=page] .bd{background:#fff;color:var(--accent)}
.pn .bd:empty{display:none}
.pact{position:relative;width:38px;height:38px;border-radius:19px;display:grid;place-items:center;color:var(--ink2)}
.pact:hover,.pact[aria-expanded=true]{background:var(--panel2);color:var(--ink)}
.pact .bd{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;line-height:15px;text-align:center;padding:0 3px}
.pact .bd:empty{display:none}
.pact.busy .ic{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{position:absolute;bottom:calc(100% + 14px);right:0;width:min(340px,calc(100cqw - 28px));background:var(--panel);border-radius:16px;box-shadow:0 0 0 1px var(--line),var(--shadow);padding:12px;animation:popup .16s ease-out;max-height:min(380px,calc(100cqh - 140px));overflow:auto}
@keyframes popup{from{opacity:0;transform:translateY(8px)}}
.pop h4{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}

/* ---------- menus ---------- */
.menu{position:fixed;z-index:1000;min-width:208px;background:var(--panel);border-radius:10px;box-shadow:0 0 0 1px var(--line2),0 14px 40px rgba(0,0,0,.25);padding:5px;overflow:auto;animation:menuin .1s ease-out;user-select:none}
.menu.up{animation-name:menuup}
@keyframes menuin{from{opacity:0;transform:translateY(-4px)}}@keyframes menuup{from{opacity:0;transform:translateY(4px)}}
.mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px 6px 8px;border-radius:6px;font-size:13px}
.mi .ck{width:14px;flex:none;color:var(--accent)}
.mi .kbd{margin-left:auto;color:var(--ink3);font-size:11.5px;padding-left:18px}
.mi .sub{margin-left:auto;color:var(--ink3)}
.mi:hover:not([disabled]),.mi.hot{background:var(--accent);color:#fff}
.mi:hover:not([disabled]) .kbd,.mi.hot .kbd,.mi:hover .ck,.mi.hot .ck,.mi:hover .sub,.mi.hot .sub{color:#fff}
.mi[disabled]{color:var(--ink3);cursor:default}
.mh{padding:6px 10px 3px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.msep{height:1px;background:var(--line);margin:5px 4px}

/* ---------- toast ---------- */
.toast{position:absolute;left:50%;bottom:calc(14px + 50px + 30px);transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:500;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 28px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- sheet + modal ---------- */
.sheet{position:absolute;top:44px;right:14px;bottom:78px;width:min(430px,calc(100% - 28px));background:var(--panel);border-radius:18px;box-shadow:0 0 0 1px var(--line),0 18px 50px rgba(0,0,0,.22);z-index:40;display:flex;flex-direction:column;overflow:hidden;animation:sheetin .2s ease-out}
@keyframes sheetin{from{opacity:0;transform:translateX(16px)}}
.sheet[hidden],.modal[hidden]{display:none}
.sh-head{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 16px;font-weight:600}
.sh-head .grow{flex:1}
.sh-body{overflow:auto;padding:4px 18px 18px;flex:1;scrollbar-width:thin}
.modal{position:absolute;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.35);padding:14px}
.dlg{width:min(420px,100%);background:var(--panel);border-radius:16px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.35);max-height:100%;overflow:auto}
.dlg h3{font-size:16px;margin-bottom:6px}
.dlg .drow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
</style>
<style>
/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 14px;border-radius:15px;background:var(--panel2);font-weight:600;font-size:12.5px;white-space:nowrap;box-shadow:0 0 0 1px var(--line) inset}
.btn:hover{background:var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:none}.btn.pri:hover{filter:brightness(1.08)}
.btn.get{background:var(--accent-soft);color:var(--accent);box-shadow:none}.btn.get:hover{background:var(--accent);color:#fff}
.btn.dng{color:var(--bad)}.btn.dng:hover{background:var(--bad);color:#fff}
.btn.sm{height:26px;padding:0 11px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ico{width:30px;padding:0}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:12px;background:var(--panel2);font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.fchips::-webkit-scrollbar{display:none}
.fc{flex:none;height:30px;padding:0 13px;border-radius:15px;background:var(--panel);box-shadow:0 0 0 1px var(--line);font-weight:600;font-size:12.5px;color:var(--ink2)}
.fc:hover{color:var(--ink)}.fc[aria-pressed=true]{background:var(--ink);color:var(--bg);box-shadow:none}
.seg{display:inline-flex;background:var(--panel2);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:28px;padding:0 13px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.field{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;background:var(--panel);box-shadow:0 0 0 1px var(--line);flex:1;min-width:0}
.field:focus-within{box-shadow:0 0 0 2px var(--accent)}
.field input{flex:1;min-width:0;border:0;background:none;outline:0}
.field .ic{color:var(--ink3)}
.sel{height:30px;padding:0 28px 0 12px;border-radius:15px;background:var(--panel);border:0;box-shadow:0 0 0 1px var(--line);font-weight:600;font-size:12.5px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 15px) 12px,calc(100% - 10px) 12px;background-size:5px 5px;background-repeat:no-repeat}
.sel.lg{height:40px;border-radius:20px;padding:0 34px 0 16px;background-position:calc(100% - 19px) 17px,calc(100% - 14px) 17px}
.card{background:var(--panel);border-radius:16px;box-shadow:0 0 0 1px var(--line);padding:16px}
.h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--ink2)}.mut{color:var(--ink3)}
.mono{font-family:var(--mono)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
.sec-h:first-child{margin-top:0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pagehead>div{min-width:0}.pagehead .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:100%}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .2s}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.empty{text-align:center;padding:48px 16px;color:var(--ink2)}
.empty .ic{width:34px;height:34px;color:var(--ink3);margin-bottom:8px}

/* app icon */
.aic{width:var(--s,48px);height:var(--s,48px);border-radius:calc(var(--s,48px)*.23);display:grid;place-items:center;color:#fff;font-weight:700;font-size:calc(var(--s,48px)*.42);flex:none;background:linear-gradient(145deg,hsl(var(--h) 78% 60%),hsl(calc(var(--h) + 36) 72% 42%));box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 2px 6px rgba(0,0,0,.18)}
.aic.sys{background:linear-gradient(145deg,#2a2a30,#0c0c0f)}
.aic.sys .ic{width:55%;height:55%}

/* ---------- discover ---------- */
.dhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.dstick{position:sticky;top:-14px;z-index:22;height:80px;pointer-events:none;margin-bottom:12px}
.dwrap{pointer-events:auto;display:flex;flex-direction:column;gap:10px}
.dwrap .dhead{margin:0;flex-wrap:nowrap}
.dstick.stuck .dwrap{flex-direction:row;align-items:center;gap:14px;height:46px;background:var(--bg);margin:0 calc(var(--pad) * -1);padding:0 var(--pad);position:relative;animation:stk .18s ease-out}
.dstick.stuck .dwrap::after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
.dstick.stuck .h1{font-size:20px;flex:none}
.dstick.stuck .dhead{flex:1;min-width:0}
.dstick.stuck .field,.dstick.stuck .sel.lg{height:34px;border-radius:17px}
.dstick.stuck .sel.lg{background-position:calc(100% - 17px) 14px,calc(100% - 12px) 14px}
@keyframes stk{from{opacity:.4;transform:translateY(-4px)}}
#dcats{margin-top:0}
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.feat{position:relative;border-radius:20px;padding:18px;min-height:176px;color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-align:left;background:linear-gradient(150deg,hsl(var(--h) 70% 46%),hsl(calc(var(--h) + 50) 70% 24%))}
.feat::before{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%)}
.feat.fl{color:#17171c;box-shadow:0 0 0 1px rgba(20,20,30,.09);background:linear-gradient(150deg,#fff 38%,var(--t2) 78%,var(--t1) 150%)}
.feat.fl::before{background:radial-gradient(circle,var(--t2),transparent 70%);opacity:.7}
.feat.fl .aic{background:linear-gradient(145deg,var(--t1),var(--t1));box-shadow:0 3px 10px rgba(0,0,0,.18)}
.feat .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.8;font-weight:600}
.feat .t{font-size:20px;font-weight:700;letter-spacing:-.01em}
.feat .d{font-size:12.5px;opacity:.88;max-width:34ch}
.feat .aic{position:absolute;top:16px;right:16px;--s:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.acard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--panel);box-shadow:0 0 0 1px var(--line);text-align:left;width:100%;min-width:0}
.acard:hover{box-shadow:0 0 0 1px var(--line2),0 6px 18px rgba(0,0,0,.07)}
.acard .tx{flex:1;min-width:0}
.acard .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .sm{font-size:12px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acard .mt{display:flex;gap:6px;margin-top:3px;font-size:11.5px;color:var(--ink3);align-items:center;flex-wrap:wrap}
.stars{color:var(--warn);letter-spacing:-1px}

/* sheet content */
.sh-top{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.sh-top .aic{--s:64px}
.sh-top h2{font-size:20px;letter-spacing:-.01em;line-height:1.2}
.sh-act{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);border-radius:12px;background:var(--panel2);margin-bottom:14px}
.meta div{padding:10px 8px;text-align:center;border-right:1px solid var(--line)}.meta div:last-child{border:0}
.meta b{display:block;font-size:14px}.meta span{font-size:11px;color:var(--ink3)}
.shots{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.shot{flex:none;width:230px;height:144px;border-radius:10px;overflow:hidden;position:relative;scroll-snap-align:start;background:linear-gradient(135deg,hsl(var(--h) 60% 92%),hsl(calc(var(--h) + 40) 60% 84%));box-shadow:0 0 0 1px var(--line)}
html[data-theme=dark] .shot{background:linear-gradient(135deg,hsl(var(--h) 35% 20%),hsl(calc(var(--h) + 40) 40% 12%))}
.shot .tb{height:16px;background:rgba(0,0,0,.08);display:flex;gap:4px;align-items:center;padding:0 7px}
.shot .tb i{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.25)}
.shot .sb{position:absolute;left:0;top:16px;bottom:0;width:54px;background:rgba(255,255,255,.4)}
.shot .ct{position:absolute;left:62px;right:8px;top:24px;bottom:8px;display:grid;gap:6px;align-content:start}
.shot .ct i{display:block;height:11px;border-radius:4px;background:hsl(var(--h) 70% 55% / .55)}
.shot .ct i:nth-child(2){width:70%;background:rgba(0,0,0,.14)}.shot .ct i:nth-child(3){width:85%;height:44px;background:rgba(0,0,0,.09)}.shot .ct i:nth-child(4){width:45%}
.shot.v2 .sb{width:0}.shot.v2 .ct{left:10px}
.shot.v3 .ct{grid-template-columns:1fr 1fr}.shot.v3 .ct i{height:44px!important;width:auto!important}
.shot em{position:absolute;right:6px;bottom:5px;font-size:9.5px;font-style:normal;color:var(--ink3)}
.src{display:grid;gap:6px;margin-bottom:14px}
.src label{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:10px;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.src label:has(input:checked){box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.src input{accent-color:var(--accent)}
.src .t{flex:1;min-width:0}.src b{display:block;font-size:13px}.src span{font-size:11.5px;color:var(--ink2)}
.perm{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.perm:last-child{border:0}.perm .t{flex:1}.perm small{display:block;color:var(--ink3);font-size:11.5px}
.tg{position:relative;width:34px;height:20px;border-radius:10px;background:var(--line2);flex:none;transition:.15s}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.15s}
.tg[aria-checked=true]{background:var(--ok)}.tg[aria-checked=true]::after{left:16px}
.tg[disabled]{opacity:.5;pointer-events:none}
.h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700;margin:16px 0 8px}
.desc{color:var(--ink2);line-height:1.55}

/* ---------- installed ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{padding:12px 14px;border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.stat b{font-size:20px;letter-spacing:-.02em;display:block}.stat span{font-size:12px;color:var(--ink2)}
.list{background:var(--panel);border-radius:16px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 92px 130px auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .who{display:flex;gap:12px;align-items:center;min-width:0}
.row .who .tx{min-width:0}.row .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{color:var(--ink3);font-size:12px}
.row .ra{display:flex;gap:6px;justify-content:flex-end}
.xp{grid-column:1/-1;padding:4px 0 8px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.xp .h3:first-child{margin-top:4px}
.rowwrap{border-bottom:1px solid var(--line)}.rowwrap:last-child{border:0}.rowwrap>.row{border:0}
.rowwrap .xp{padding:0 14px 14px}

/* progress */
.prog{display:flex;align-items:center;gap:10px;min-width:0}
.prog .bar{flex:1;min-width:60px}.prog span{font:12px var(--mono);color:var(--ink2);width:38px;text-align:right}

/* ---------- updates ---------- */
.ubanner{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;background:var(--panel);box-shadow:0 0 0 1px var(--line);margin-bottom:12px;flex-wrap:wrap}
.ubanner .ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ubanner .tx{flex:1;min-width:200px}.ubanner .tx b{font-size:16px}
.urow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,190px) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.urow:last-child{border:0}
.urow .nm{font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.urow small{display:block;color:var(--ink2);font-size:12px}
.urow .vv{font:12px var(--mono);color:var(--ink2)}
.notice{display:flex;gap:10px;padding:11px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-weight:500;margin-bottom:12px;align-items:center}

/* ---------- toolbox ---------- */
.kits{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.kit{padding:16px;border-radius:18px;background:var(--panel);box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px;text-align:left}
.kit:hover{box-shadow:0 0 0 1px var(--line2),0 8px 22px rgba(0,0,0,.08)}
.kit .kh{display:flex;gap:12px;align-items:center}
.kit .ki{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,hsl(var(--h) 75% 58%),hsl(calc(var(--h) + 30) 70% 40%))}
.kit .ki .ic{width:22px;height:22px}
.kit .kn{font-weight:700;font-size:15px}
.kit p{color:var(--ink2);font-size:12.5px}
.kit .tl{display:flex;flex-wrap:wrap;gap:5px}
.kit .tl span{font-size:11.5px;padding:2px 8px;border-radius:9px;background:var(--panel2);color:var(--ink2)}
.kit .tl span.on{background:var(--ok-soft);color:var(--ok)}
.kit .kf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;color:var(--ink3);font-size:12px}
.tool{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.tool:last-child{border:0}.tool .t{flex:1;min-width:0}.tool b{display:block;font-size:13px}.tool small{color:var(--ink2);font-size:12px}
.tool input{accent-color:var(--accent);width:16px;height:16px}

/* ---------- emulation ---------- */
.ready{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:16px}
.rd{padding:10px 12px;border-radius:12px;background:var(--panel);box-shadow:0 0 0 1px var(--line);display:flex;gap:9px;align-items:flex-start}
.rd .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.rd .dot.ok{background:var(--ok)}.rd .dot.warn{background:var(--warn)}.rd .dot.bad{background:var(--bad)}
.rd b{display:block;font-size:12.5px}.rd small{color:var(--ink2);font-size:11.5px;display:block;line-height:1.35}
.legal{font-size:12px;color:var(--ink2);padding:10px 12px;border-radius:12px;background:var(--panel2);margin-top:14px}

/* ---------- diagnostics ---------- */
.health{display:flex;gap:16px;align-items:center;padding:18px;border-radius:20px;background:var(--panel);box-shadow:0 0 0 1px var(--line);margin-bottom:12px;flex-wrap:wrap}
.score{position:relative;width:78px;height:78px;flex:none}
.score svg{width:100%;height:100%;transform:rotate(-90deg)}
.score b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;letter-spacing:-.02em}
.health .tx{flex:1;min-width:220px}
.adv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.adv button{display:inline-flex;gap:6px;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:600;background:var(--warn-soft);color:var(--warn)}
.adv button:hover{filter:brightness(.95)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tile{padding:16px;border-radius:18px;background:var(--panel);box-shadow:0 0 0 1px var(--line)}
button.tile{display:flex;flex-direction:column;justify-content:flex-start;width:100%;font:inherit;color:inherit}
.tile .th{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:10px}
.tile .th .ic{color:var(--accent)}.tile .th .chip{margin-left:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv dt{color:var(--ink2)}.kv dd{text-align:right;font-weight:550;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:12px;color:var(--ink2);font-weight:500;letter-spacing:0}
.spark{width:100%;height:42px;display:block;margin:8px 0}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.spark path{fill:var(--accent-soft);stroke:none}
.vol{margin:8px 0}.vol .vh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.svc{display:grid;grid-template-columns:minmax(0,1fr) 100px 104px auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.svc:last-child{border:0}.svc b{display:block;font:600 12.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.svc small{color:var(--ink2);font-size:12px}
.lt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.logs{background:var(--panel);border-radius:16px;box-shadow:0 0 0 1px var(--line);padding:6px 0;font:12px/1.5 var(--mono);overflow:hidden}
.lg{display:grid;grid-template-columns:70px 54px 150px minmax(0,1fr);gap:10px;padding:2px 14px}
.lg:hover{background:var(--panel2)}.lg .tm{color:var(--ink3)}.lg .un{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .lv{font-weight:700}.lv.INFO{color:var(--info)}.lv.WARN{color:var(--warn)}.lv.ERR{color:var(--bad)}.lv.DBG{color:var(--ink3)}
.lg .ms{overflow-wrap:anywhere}
.flows{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.flow{padding:16px;border-radius:18px;background:var(--panel);box-shadow:0 0 0 1px var(--line);text-align:left;display:flex;flex-direction:column;gap:6px}
.flow:hover{box-shadow:0 0 0 1px var(--line2),0 8px 22px rgba(0,0,0,.08)}
.flow .fi{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:4px}
.flow b{font-size:15px}.flow span{color:var(--ink2);font-size:12.5px}
.wiz{max-width:640px;margin:0 auto}
.wiz .steps{display:flex;gap:5px;margin:10px 0 18px}
.wiz .steps i{flex:1;height:4px;border-radius:2px;background:var(--line2)}.wiz .steps i.on{background:var(--accent)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--line);text-align:left;font-weight:600}
.opt:hover{box-shadow:0 0 0 2px var(--accent)}.opt .ic{margin-left:auto;color:var(--ink3)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--line);margin-bottom:8px;animation:popup .2s}
.chk .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.chk .st .ic{width:13px;height:13px;stroke-width:2.6}
.chk .st.ok{background:var(--ok-soft);color:var(--ok)}.chk .st.warn{background:var(--warn-soft);color:var(--warn)}.chk .st.bad{background:var(--bad-soft);color:var(--bad)}
.chk .st.run{border:2px solid var(--line2);border-top-color:var(--accent);animation:spin .8s linear infinite}
.chk b{display:block}.chk small{color:var(--ink2);font-size:12.5px}

/* ---------- container tiers ---------- */
@container app (max-width:980px){
  .row{grid-template-columns:minmax(0,1fr) auto}.row .col-sz,.row .col-src{display:none}
  .hero{grid-template-columns:1fr 1fr}.hero .feat:nth-child(3){display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@container app (max-width:700px){
  .pn span.lb{display:none}.pn{padding:0 11px}
  .pn[aria-current=page] span.lb{display:inline}
  .sheet{left:14px;width:auto}
  .xp{grid-template-columns:1fr}
  .svc{grid-template-columns:minmax(0,1fr) auto}.svc .c-up,.svc .c-st{display:none}
  .lg{grid-template-columns:62px 48px minmax(0,1fr)}.lg .un{display:none}
  .urow{grid-template-columns:minmax(0,1fr) auto}.urow .prog{grid-column:1/-1;order:3}
}
@container app (max-width:560px){
  .menubar .mb:not(.brand):not(.hamb){display:none}.menubar .hamb{display:flex}
  .hero{grid-template-columns:1fr}.hero .feat:nth-child(2){display:none}
  .pn[aria-current=page] span.lb{display:none}.pn{padding:0 10px}
}
@container app (max-width:520px){
  .scroll{--pad:14px}.h1{font-size:22px}.dstick.stuck .h1{font-size:17px}.dstick.stuck .dwrap{gap:10px}.dstick.stuck .sel.lg{max-width:112px;padding-left:12px}
  .grid,.kits,.tiles,.flows{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}.meta b{font-size:13px}
}
@container app (max-width:420px){
  .seg button{padding:0 9px}.pn{padding:0 8px}.pact{width:34px}.row .ra .btn.sm span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="desktop" id="desk">
 <div class="window" id="win" aria-label="Essential Software window">
  <i class="rz n" data-d="n"></i><i class="rz s" data-d="s"></i><i class="rz e" data-d="e"></i><i class="rz w" data-d="w"></i>
  <i class="rz ne" data-d="ne"></i><i class="rz nw" data-d="nw"></i><i class="rz se" data-d="se"></i><i class="rz sw" data-d="sw"></i>
  <div class="app" id="app">
   <main class="scroll" id="scroll"><div class="view" id="view"></div></main>
   <div class="sbar" id="sbar"><i id="sthumb"></i></div><div class="topfade"></div><div class="botfade"></div>
   <header class="top" id="top">
    <nav class="menubar" id="menubar" aria-label="Menus">
     <button class="mb brand" data-menu="store" aria-haspopup="menu" aria-expanded="false"><span class="nm2">Software</span></button>
     <button class="mb" data-menu="manage" aria-haspopup="menu" aria-expanded="false">Manage</button>
     <button class="mb" data-menu="go" aria-haspopup="menu" aria-expanded="false">Go</button>
     <button class="mb" data-menu="view" aria-haspopup="menu" aria-expanded="false">View</button>
     <button class="mb hamb" data-menu="all" aria-haspopup="menu" aria-expanded="false" aria-label="Menu"><svg class="ic"><use href="#i-menu"/></svg></button>
    </nav>
    <div class="topgrow" id="drag"></div>
    <div class="wctl">
     <button class="wb" id="bMin" aria-label="Minimise"><svg class="ic"><use href="#i-min"/></svg></button>

/* ================= actions ================= */
function install(id,sk,quiet){
  if(isInst(id)||taskFor(id))return;const r=REG[id];sk=sk||r.src.find(k=>S.srcOn[k])||r.src[0];
  if(r.unsupported){toast(r.unsupported);return}
  const need=r.dep.filter(d=>REG[d]&&!isInst(d));
  need.forEach(d=>install(d,'er',true));
  addTask({ref:id,label:'Installing '+r.name+(sk?' · '+SRC[sk].n:''),size:r.size*SRC[sk].m,done:r.name+' installed'+(need.length?' (+'+need.length+' components)':''),
    onDone(){S.inst[id]={ver:r.ver,src:sk,at:Date.now()};r.dep.forEach(d=>{if(!REG[d]&&!S.rt.includes(d))S.rt.push(d)})}});
}
function uninstall(id,wipe){
  const r=REG[id];if(r.sys||taskFor(id))return;
  addTask({ref:id,label:'Removing '+r.name,size:10,ms:1500,done:r.name+' removed'+(wipe?' with its data':''),onDone(){delete S.inst[id];delete S.perms[id]}});

function updateOne(uid){
  const u=UPD.find(x=>x.id===uid);if(!u||taskFor(uid)||S.done.includes(uid))return;
  addTask({ref:uid,label:'Updating '+u.name,size:u.size,done:u.name+' updated',onDone(){S.done.push(uid);S.held=S.held.filter(x=>x!==uid);
    if(u.type==='app')S.inst[u.ref].ver=u.to;if(u.reboot&&!S.reboot.includes(u.name))S.reboot.push(u.name)}});
}
function updateAll(type){pendingUpd().filter(u=>(!type||u.type===type)&&!S.held.includes(u.id)).forEach(u=>updateOne(u.id))}
function checkNow(){if(S.checking)return;S.checking=true;onChange();setTimeout(()=>{S.checking=false;toast('Sources refreshed. '+pendingUpd().length+' updates available');onChange()},1500)}
function installKit(kid){const ids=(S.kitSel[kid]||[]).filter(id=>!isInst(id)&&!taskFor(id));if(!ids.length){toast('Nothing selected to install');return}ids.forEach(id=>install(id));toast('Queued '+ids.length+' tools')}

/* ================= menu engine ================= */
let menus=[];
function closeMenu(d=0){while(menus.length>d){const m=menus.pop();m.el.remove();if(m.anchor&&m.anchor.setAttribute)m.anchor.setAttribute('aria-expanded','false')}}
function openMenu(anchor,items,o={},depth=0){
  closeMenu(depth);const el=document.createElement('div');el.className='menu'+(o.up?' up':'');el.setAttribute('role','menu');
  let ti;
  items.forEach(it=>{
    if(it==='-'){el.insertAdjacentHTML('beforeend','<div class="msep"></div>');return}
    if(it.header){el.insertAdjacentHTML('beforeend',`<div class="mh">${esc(it.header)}</div>`);return}
    const b=document.createElement('button');b.className='mi';b.setAttribute('role','menuitem');if(it.disabled)b.disabled=true;
    b.innerHTML=`<span class="ck">${it.checked?ic('check','sm'):''}</span><span>${esc(it.label)}</span>${it.sub?`<span class="sub">${ic('chev','sm')}</span>`:it.kbd?`<span class="kbd">${esc(it.kbd)}</span>`:''}`;
    const openSub=()=>{if(!it.sub)return;const r=b.getBoundingClientRect();openMenu(b,it.sub,{x:r.right-4,y:r.top-5,flipX:r.left+4},depth+1);b.classList.add('hot')};
    b.addEventListener('click',e=>{e.stopPropagation();if(it.sub){openSub();return}closeMenu();it.run&&it.run()});
    b.addEventListener('mouseenter',()=>{clearTimeout(ti);ti=setTimeout(()=>{if(it.sub)openSub();else closeMenu(depth+1);$$('.mi.hot',el).forEach(x=>{if(x!==b||!it.sub)x.classList.remove('hot')})},80)});
    el.appendChild(b);
  });
  document.body.appendChild(el);menus[depth]={el,anchor};
  let x,y,w=el.offsetWidth,h=el.offsetHeight;const vw=innerWidth,vh=innerHeight;
  if(anchor&&anchor.getBoundingClientRect&&!o.x){const r=anchor.getBoundingClientRect();anchor.setAttribute&&anchor.setAttribute('aria-expanded','true');
    x=o.center?r.left+r.width/2-w/2:o.right?r.right-w:r.left;y=o.up?r.top-(o.gap??14)-h:r.bottom+(o.gap??4)}
  else{x=o.x;y=o.y}
  if(o.flipX!==undefined&&x+w>vw-6)x=o.flipX-w;
  const maxH=o.up?(anchor.getBoundingClientRect().top-(o.gap??14)-8):vh-y-8;
  if(h>maxH){el.style.maxHeight=Math.max(120,maxH)+'px';h=el.offsetHeight;if(o.up)y=anchor.getBoundingClientRect().top-(o.gap??14)-h}
  x=clamp(x,6,vw-w-6);y=clamp(y,6,vh-h-6);el.style.left=x+'px';el.style.top=y+'px';
  return el;
}

let ftimer=null;const clearFlowTimer=()=>{clearInterval(ftimer);ftimer=null};
function drawFlows(){
  if(!S.flow){$('#dbody').innerHTML=`<div class="flows">${Object.entries(FL).map(([id,f])=>`<button class="flow" data-act="flow" data-id="${id}"><div class="fi">${ic(f.i)}</div><b>${f.t}</b><span>${f.d}</span></button>`).join('')}</div>`;return}
  const f=FL[S.flow.id],n=f.n[S.flow.node],steps=S.flow.hist.length+1;
  let h=`<div class="wiz"><button class="btn sm" data-act="fexit">${ic('back','sm')}All flows</button><h2 class="h2" style="margin-top:14px">${f.t}</h2><div class="steps">${[0,1,2].map(i=>`<i class="${i<steps?'on':''}"></i>`).join('')}</div>`;
  if(n.k==='ask')h+=`<div class="h2">${n.q}</div><div class="opts">${n.o.map(([l,to])=>`<button class="opt" data-act="fnext" data-to="${to}">${l}${ic('chev','sm')}</button>`).join('')}</div>`;
  if(n.k==='scan'){const sh=S.flow.shown;h+=`<div class="h2" style="margin-bottom:10px">${n.title}</div>`+n.it.slice(0,sh+1).map(([l,s,d],i)=>{const run=i===sh&&sh<n.it.length;return `<div class="chk"><span class="st ${run?'run':s}">${run?'':ic(s==='ok'?'check':'warn')}</span><div><b>${l}</b><small>${run?'Checking…':typeof d==='function'?d():d}</small></div></div>`}).join('')+(sh>=n.it.length?`<div style="margin-top:14px"><button class="btn pri" data-act="fnext" data-to="${n.next}">See result</button></div>`:'');}
  if(n.k==='end')h+=`<div class="card"><span class="chip ok" style="margin-bottom:8px">Diagnosis</span><div class="h2" style="margin-bottom:6px">${n.title}</div><p class="sub">${n.s}</p><div class="chips" style="margin-top:14px">${n.a.map(([l,act])=>`<button class="btn" data-act="fact" data-v="${esc(act)}">${l}</button>`).join('')}<button class="btn" data-act="fexit">Done</button></div></div>`;
  $('#dbody').innerHTML=h+'</div>';

function startNode(){
  const n=FL[S.flow.id].n[S.flow.node];S.flow.shown=0;clearFlowTimer();
  if(n.k==='scan'){ftimer=setInterval(()=>{if(!S.flow||S.sec!=='diagnostics'||S.dtab!=='troubleshoot'){clearFlowTimer();return}S.flow.shown++;drawFlows();if(S.flow.shown>=n.it.length)clearFlowTimer()},650)}

function startFlow(id){S.dtab='troubleshoot';save();S.flow={id,node:FL[id].start,hist:[],shown:0};if(S.sec!=='diagnostics')S.sec='diagnostics';go('diagnostics',true);startNode()}
function act(el,e){
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case 'app':e&&e.preventDefault&&e.preventDefault();openSheet('app',id);break;
    case 'inst':e&&e.stopPropagation&&e.stopPropagation();install(id,S.srcSel&&S.srcSel[id]);onChange();break;
    case 'upd':updateOne(id);onChange();break;
    case 'uninst':confirmUninstall(id);break;
    case 'open':toast('Opening '+REG[id].name+' (preview only)');break;
    case 'perm':{const p=S.perms[id]=S.perms[id]||{};p[el.dataset.k]=!permOn(id,el.dataset.k);save();onChange();break}
    case 'cat':S.cat=v;drawD();break;
    case 'clear':S.q='';S.cat='All';S.srcF='any';vDiscover();break;
    case 'ifil':S.filt=v;drawI();break;
    case 'itoggle':S.open[id]=!S.open[id];drawI();break;
    case 'clean':cleanOrphans();break;
    case 'updall':updateAll();onChange();break;
    case 'updtype':updateAll(v);onChange();break;
    case 'check':checkNow();break;
    case 'skip':S.held=S.held.includes(id)?S.held.filter(x=>x!==id):[...S.held,id];save();onChange();break;
    case 'restart':S.reboot=[];toast('Restart skipped. This is a preview, nothing was restarted');onChange();break;
    case 'kit':openSheet('kit',id);break;
    case 'kitinst':installKit(id);onChange();break;
    case 'kitall':S.kitSel[id]=KITS.find(k=>k.id===id).tools.slice();drawSheet();break;
    case 'etab':S.emu=v;vEmulation();break;
    case 'dtab':S.dtab=v;save();if(S.sec!=='diagnostics')go('diagnostics',true);else vDiag();break;
    case 'adv':if(el.dataset.go)go(el.dataset.go);else if(el.dataset.flow)startFlow(el.dataset.flow);else{S.dtab=el.dataset.tab;save();vDiag()}break;
    case 'svc':svcAct(+el.dataset.i,v);break;
    case 'follow':S.follow=!S.follow;el.setAttribute('aria-pressed',S.follow);el.textContent=S.follow?'Following':'Follow';drawLogRows();break;
    case 'prev':prev(el.dataset.l||'Action');break;
    case 'go':go(v);break;
    case 'flow':startFlow(id);break;
    case 'fexit':S.flow=null;clearFlowTimer();drawFlows();break;
    case 'fnext':S.flow.hist.push(S.flow.node);S.flow.node=el.dataset.to;startNode();break;
    case 'fact':{const [k,...r]=v.split(':'),x=r.join(':');if(k==='toast')prev(x);else if(k==='go'){S.flow=null;go(x)}else if(k==='tab'){S.flow=null;S.dtab=x;save();vDiag()}else if(k==='flow')startFlow(x);break}
    case 'shclose':closeSheet();break;
    case 'mcancel':closeModal();break;
    case 'mdo':{const w=$('#wipe');uninstall(id,w&&w.checked);closeModal();onChange();break}
  }
}

/* ================= overlay scrollbar (inset 50px top and bottom, no track) ================= */
(()=>{const sc=$('#scroll'),bar=$('#sbar'),th=$('#sthumb');let hide,dr=null;
  const upd=()=>{const r=bar.clientHeight,vis=sc.clientHeight,tot=sc.scrollHeight;if(tot<=vis+1){th.style.display='none';return}th.style.display='';
    const h=Math.max(28,r*vis/tot),y=(r-h)*sc.scrollTop/(tot-vis);th.style.height=h+'px';th.style.top=y+'px'};
  const flash=()=>{bar.classList.add('on');clearTimeout(hide);hide=setTimeout(()=>bar.classList.remove('on'),1100)};
  sc.addEventListener('scroll',()=>{upd();flash();syncStick()},{passive:true});
  new ResizeObserver(upd).observe(sc);new MutationObserver(upd).observe($('#view'),{childList:true,subtree:true});
  addEventListener('resize',upd);
  th.addEventListener('pointerdown',e=>{dr={y:e.clientY,s:sc.scrollTop};th.classList.add('drag');th.setPointerCapture(e.pointerId);e.preventDefault()});
  th.addEventListener('pointermove',e=>{if(!dr)return;const r=bar.clientHeight,vis=sc.clientHeight,tot=sc.scrollHeight,h=th.offsetHeight;sc.scrollTop=dr.s+(e.clientY-dr.y)*(tot-vis)/Math.max(1,r-h)});
  const end=()=>{dr=null;th.classList.remove('drag');flash()};th.addEventListener('pointerup',end);th.addEventListener('pointercancel',end);
  upd();
})();

/* ================= window manager ================= */
const desk=$('#desk'),win=$('#win'),MINW=360,MINH=300;
let rect=ls.get('rect',null),maxed=ls.get('max',false),prevMax=false;
const deskSize=()=>({w:desk.clientWidth,h:desk.clientHeight});
function defRect(){const d=deskSize(),w=Math.min(1100,d.w-48),h=Math.min(700,d.h-48);return{x:Math.round((d.w-w)/2),y:Math.round((d.h-h)/2),w,h}}
function fit(r){const d=deskSize();r.w=clamp(r.w,MINW,Math.max(MINW,d.w));r.h=clamp(r.h,MINH,Math.max(MINH,d.h));r.x=clamp(r.x,-r.w+80,d.w-80);r.y=clamp(r.y,0,d.h-40);return r}
function apply(){
  if(!rect)rect=defRect();fit(rect);
  Object.assign(win.style,{left:rect.x+'px',top:rect.y+'px',width:rect.w+'px',height:rect.h+'px'});
  win.classList.toggle('max',maxed);$('#maxIc').innerHTML=`<use href="#i-${maxed?'restore':'max'}"/>`;$('#bMax').setAttribute('aria-label',maxed?'Restore':'Maximise');
  const r=win.getBoundingClientRect();$('#hud').textContent=`${Math.round(r.width)} x ${Math.round(r.height)}, x ${Math.round(r.left)}, y ${Math.round(r.top)}${maxed?' · maximised':''}`;
}
function persist(){ls.set('rect',rect);ls.set('max',maxed)}
function toggleMax(){maxed=!maxed;apply();persist()}
function hideWin(){win.classList.add('hidden');$('#tChip').classList.remove('on')}
function showWin(){win.classList.remove('hidden');$('#tChip').classList.add('on')}
function toggleFs(){
  const on=!document.body.classList.contains('fs');
  if(on){prevMax=maxed;maxed=true;document.body.classList.add('fs')}else{document.body.classList.remove('fs');maxed=prevMax}
  apply();
}
$('#bMax').addEventListener('click',toggleMax);$('#bMin').addEventListener('click',hideWin);$('#bClose').addEventListener('click',hideWin);
$('#tChip').addEventListener('click',()=>win.classList.contains('hidden')?showWin():hideWin());
$('#drag').addEventListener('dblclick',toggleMax);
document.addEventListener('keydown',e=>{if(e.key==='F11'){e.preventDefault();toggleFs()}else if(e.key==='Escape'&&document.body.classList.contains('fs')&&!menus.length&&$('#modal').hidden&&!S.sheet)toggleFs()});
/* presets */
$('#tPre').addEventListener('click',e=>{const p=e.target.dataset.p;if(!p)return;const d=deskSize();maxed=false;
  if(p==='min')rect={...rect,w:MINW,h:MINH};else if(p==='compact')rect={...rect,w:640,h:440};else if(p==='def')rect=defRect();else{rect={x:0,y:0,w:d.w,h:d.h}}
  if(p!=='fill'){const dd=deskSize();rect.x=Math.round((dd.w-rect.w)/2);rect.y=Math.round((dd.h-rect.h)/2)}
  apply();persist()});
/* drag + resize */
let drag=null;
function startDrag(e,mode,dir){
  if(e.button!==0)return;drag={mode,dir,sx:e.clientX,sy:e.clientY,r:{...rect},moved:false,wasMax:maxed,pid:e.pointerId};
}
$('#top').addEventListener('pointerdown',e=>{if(e.target.closest('button,input,select'))return;if(!e.target.closest('#top'))return;startDrag(e,'move')});
$$('.rz').forEach(h=>h.addEventListener('pointerdown',e=>{e.stopPropagation();startDrag(e,'size',h.dataset.d)}));
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  /* a move with no button held means the release was missed (outside the window, lost capture): stop dragging */
  if(e.buttons===0||(e.pointerId!==drag.pid&&e.pointerType==='mouse')){endDrag();return}const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved){if(Math.hypot(dx,dy)<4)return;drag.moved=true;try{win.setPointerCapture(drag.pid)}catch(_){}
    if(drag.mode==='move'&&drag.wasMax){/* un-maximise under the pointer */
      const d=deskSize(),w=Math.min(rect.w,d.w),fx=e.clientX/d.w;maxed=false;if(document.body.classList.contains('fs')){document.body.classList.remove('fs')}
      rect={...rect,w,x:Math.round(e.clientX-w*fx),y:Math.max(0,e.clientY-20)};drag.r={...rect};drag.sx=e.clientX;drag.sy=e.clientY;apply();return}}
  const d=deskSize(),r={...drag.r};
  if(drag.mode==='move'){r.x=drag.r.x+(e.clientX-drag.sx);r.y=drag.r.y+(e.clientY-drag.sy)}
  else{const q=drag.dir;
    if(q.includes('e'))r.w=Math.max(MINW,drag.r.w+dx);
    if(q.includes('s'))r.h=Math.max(MINH,drag.r.h+dy);
    if(q.includes('w')){const w=Math.max(MINW,drag.r.w-dx);r.x=drag.r.x+(drag.r.w-w);r.w=w}
    if(q.includes('n')){const h=Math.max(MINH,drag.r.h-dy);r.y=drag.r.y+(drag.r.h-h);r.h=h}}
  rect=fit(r);apply();
});
function endDrag(){if(drag){try{win.releasePointerCapture(drag.pid)}catch(_){}if(drag.moved)persist();drag=null}}
['pointerup','pointercancel','mouseup','touchend','touchcancel'].forEach(t=>document.addEventListener(t,endDrag,true));
addEventListener('blur',endDrag);win.addEventListener('lostpointercapture',endDrag);document.addEventListener('visibilitychange',endDrag);
addEventListener('resize',()=>apply());
apply();
