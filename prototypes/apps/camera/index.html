<script>(()=>{'use strict';

['n','s','e','w','ne','nw','se','sw'].forEach(d=>{const h=document.createElement('div');h.className='rzh';h.dataset.d=d;win.append(h)});

 const s=win.style;if(maxed){s.left=s.top='0';s.width=s.height='100%'}else{s.left=R.x+'px';s.top=R.y+'px';s.width=R.w+'px';s.height=R.h+'px'}
